---
openapi: 3.1.0
info:
  title: Nexus Projects API
  version: 1.0.0
  description: |
    Project management and project-scoped resource access for the Nexus platform.

    Projects provide multi-tenant isolation for workflows, approvals, and other
    resources. Each project has its own role assignments for users and groups.

    ## Key Features
    - Project CRUD with soft deletion
    - Project-scoped workflow and approval listing
    - User role assignments (project-admin, project-user, project-auditor)
    - Group role assignments with inherited membership

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Projects
    description: Project CRUD operations
  - name: Project Workflows
    description: Project-scoped workflow listing
  - name: Project Approvals
    description: Project-scoped approval listing
  - name: Project Role Assignments
    description: User role assignments within a project
  - name: Project Group Role Assignments
    description: Group role assignments within a project

paths:
  # ── Project CRUD ─────────────────────────────────────────────────────
  /projects:
    post:
      summary: Create Project
      description: |
        Create a new project. The creator is automatically assigned
        the project-admin role. Requires: project:create permission.
      operationId: create_project
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "409":
          description: Project name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    get:
      summary: List Projects
      description: |-
        List projects the current user has read access to.
      operationId: list_projects
      tags:
        - Projects
      responses:
        "200":
          description: List of accessible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRead"

      security:
        - bearerAuth: []
  /projects/{project_id}:
    get:
      summary: Get Project
      description: Get a project by ID.
      operationId: get_project
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "404":
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    patch:
      summary: Update Project
      description: |-
        Patch a project. Requires: project:update permission scoped to this project.
      operationId: update_project
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "404":
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    put:
      summary: Replace Project
      description: |-
        Replace a project. Requires: project:update permission scoped to this project.
      operationId: replace_project
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "404":
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    delete:
      summary: Delete Project
      description: |-
        Delete a project (soft-delete). Requires: project:delete permission scoped to this project.
      operationId: delete_project
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      # ── Project Workflows ────────────────────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/workflows:
    get:
      summary: List Project Workflows
      description: |-
        List workflows belonging to a specific project.

        Returns only workflows with project_id matching the given project.
        Requires: workflow:read permission scoped to this project.
      operationId: list_project_workflows
      tags:
        - Project Workflows
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
      responses:
        "200":
          description: Paginated list of workflows in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "404":
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      # ── Project Approvals ────────────────────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/approvals:
    get:
      summary: List Project Approvals
      description: |-
        List approval requests belonging to a specific project.

        Returns only approvals with project_id matching the given project.
        Requires: approval:read permission scoped to this project.
      operationId: list_project_approvals
      tags:
        - Project Approvals
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
              - expired
              - cancelled
          description: Filter by approval status
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by parent workflow execution ID
      responses:
        "200":
          description: Paginated list of approvals in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "404":
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      # ── Project User Role Assignments ────────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/roles:
    post:
      summary: Assign Project Role
      description: |-
        Assign a role to a user within a project.

        Valid roles: project-admin, project-user, project-auditor.
        Requires: project-role:assign permission scoped to this project.
      operationId: assign_project_role
      tags:
        - Project Role Assignments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleAssignmentRead"
        "404":
          description: Project, user, or role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Assignment already exists
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    get:
      summary: List Project Roles
      description: List all role assignments for a project.
      operationId: list_project_roles
      tags:
        - Project Role Assignments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        "200":
          description: List of role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRoleAssignmentRead"

      security:
        - bearerAuth: []
  /projects/{project_id}/roles/{assignment_id}:
    delete:
      summary: Revoke Project Role
      description: |-
        Remove a role assignment from a project. Requires: project-role:revoke permission.
      operationId: revoke_project_role
      tags:
        - Project Role Assignments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assignment UUID
      responses:
        "204":
          description: Assignment removed
        "404":
          description: Assignment not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      # ── Project Group Role Assignments ───────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/group-roles:
    post:
      summary: Assign Project Group Role
      description: |-
        Assign a role to a group within a project.

        All members of the group inherit the role for this project.
        Valid roles: project-admin, project-user, project-auditor.
        Requires: project-role:assign permission scoped to this project.
      operationId: assign_project_group_role
      tags:
        - Project Group Role Assignments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGroupRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned to group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGroupRoleAssignmentRead"
        "404":
          description: Project, group, or role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Assignment already exists
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    get:
      summary: List Project Group Roles
      description: List all group role assignments for a project.
      operationId: list_project_group_roles
      tags:
        - Project Group Role Assignments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        "200":
          description: List of group role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectGroupRoleAssignmentRead"

      security:
        - bearerAuth: []
  /projects/{project_id}/group-roles/{assignment_id}:
    delete:
      summary: Revoke Project Group Role
      description: |-
        Remove a group role assignment from a project. Requires: project-role:revoke permission.
      operationId: revoke_project_group_role
      tags:
        - Project Group Role Assignments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assignment UUID
      responses:
        "204":
          description: Assignment removed
        "404":
          description: Assignment not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
components:
  schemas:
    ProjectCreate:
      type: object
      title: ProjectCreate
      description: Request body for creating a project.
      required:
        - name
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels

    ProjectUpdate:
      type: object
      title: ProjectUpdate
      description: Request body for updating a project.
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Labels

    ProjectRead:
      type: object
      title: ProjectRead
      description: Response body for a project.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels
        is_default:
          type: boolean
          default: false
          title: Is Default
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updated At

    ProjectRoleAssignmentCreate:
      type: object
      title: ProjectRoleAssignmentCreate
      description: Request body for assigning a role to a user within a project.
      required:
        - user_id
        - role_name
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role_name:
          type: string
          title: Role Name

    ProjectRoleAssignmentRead:
      type: object
      title: ProjectRoleAssignmentRead
      description: Response body for a project role assignment.
      required:
        - id
        - user_id
        - project_id
        - role_id
        - role_name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        username:
          type: string
          default: ""
          title: Username
        project_id:
          type: string
          format: uuid
          title: Project Id
        role_id:
          type: string
          format: uuid
          title: Role Id
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At

    ProjectGroupRoleAssignmentCreate:
      type: object
      title: ProjectGroupRoleAssignmentCreate
      description: Request body for assigning a role to a group within a project.
      required:
        - group_id
        - role_name
      properties:
        group_id:
          type: string
          format: uuid
          title: Group Id
        role_name:
          type: string
          title: Role Name

    ProjectGroupRoleAssignmentRead:
      type: object
      title: ProjectGroupRoleAssignmentRead
      description: Response body for a project group role assignment.
      required:
        - id
        - group_id
        - project_id
        - role_id
        - role_name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        group_id:
          type: string
          format: uuid
          title: Group Id
        group_name:
          type: string
          default: ""
          title: Group Name
        project_id:
          type: string
          format: uuid
          title: Project Id
        role_id:
          type: string
          format: uuid
          title: Role Id
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At

    # Re-used response schemas from other domains (minimal definitions
    # for the bundled spec to avoid cross-domain $ref issues)
    WorkflowListResponse:
      type: object
      title: WorkflowListResponse
      description: Paginated list response for workflows.
      required:
        - resources
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for next page of results
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for previous page of results
          title: Prev
        resources:
          type: array
          items: {}
          description: Array of resources in current page
          title: Resources
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          description: Total count of resources (only when include_total=true)
          title: Total

    ApprovalListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          properties:
            resources:
              type: array
              items:
                type: object
                description: Approval request resource (see approvals domain spec for full schema)
          required:
            - resources

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
