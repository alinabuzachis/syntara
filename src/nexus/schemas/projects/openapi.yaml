---
openapi: 3.1.0
info:
  title: Nexus Projects API
  version: 1.0.0
  description: |
    Project management and project-scoped resource access for the Nexus platform.

    Projects provide multi-tenant isolation for workflows, approvals, and other
    resources. Each project has its own role assignments for users and groups,
    and supports project-scoped roles and policies.

    ## Key Features
    - Project CRUD with soft deletion
    - Project-scoped workflow and approval listing
    - User role assignments (project-admin, project-user, project-auditor)
    - Group role assignments with inherited membership
    - Project-scoped role and policy CRUD

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Projects
    description: Project CRUD and project-scoped resource operations

paths:
  # ── Project CRUD ─────────────────────────────────────────────────────
  /projects:
    post:
      summary: Create Project
      description: |
        Create a new project. The creator is automatically assigned
        the project-admin role. Requires: project:create permission.
      operationId: create_project
      x-app-permission:
        resource: project
        action: create
        scope: any
        default_roles: [admin, user, default]
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Projects
      description: |-
        List projects the current user has read access to.
      operationId: list_projects
      x-app-permission:
        resource: project
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      responses:
        "200":
          description: List of accessible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /projects/{project_id}:
    get:
      summary: Get Project
      description: Get a project by ID.
      operationId: get_project
      x-app-permission:
        resource: project
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    patch:
      summary: Update Project
      description: |-
        Patch a project. Requires: project:update permission scoped to this project.
      operationId: update_project
      x-app-permission:
        resource: project
        action: update
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    put:
      summary: Replace Project
      description: |-
        Replace a project. Requires: project:update permission scoped to this project.
      operationId: replace_project
      x-app-permission:
        resource: project
        action: update
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete Project
      description: |-
        Delete a project (soft-delete). Requires: project:delete permission scoped to this project.
      operationId: delete_project
      x-app-permission:
        resource: project
        action: delete
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      responses:
        "204":
          description: Project deleted
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

  # ── Project Workflows ────────────────────────────────────────────────
  /projects/{project_id}/workflows:
    get:
      summary: List Project Workflows
      description: |-
        List workflows belonging to a specific project.

        Returns only workflows with project_id matching the given project.
        Requires: workflow:read permission scoped to this project.
      operationId: list_project_workflows
      x-app-permission:
        resource: workflow
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        "200":
          description: Paginated list of workflows in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

  # ── Project Approvals ────────────────────────────────────────────────
  /projects/{project_id}/approvals:
    get:
      summary: List Project Approvals
      description: |-
        List approval requests belonging to a specific project.

        Returns only approvals with project_id matching the given project.
        Requires: approval:read permission scoped to this project.
      operationId: list_project_approvals
      x-app-permission:
        resource: approval
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/ApprovalRequestStatus"
              - type: 'null'
            title: Status
          description: Filter by approval status
        - name: execution_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
          description: Filter by parent workflow execution ID
      responses:
        "200":
          description: Paginated list of approvals in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

  # ── Project User Role Assignments ────────────────────────────────────
  /projects/{project_id}/role-assignments:
    post:
      summary: Assign Project Role
      description: |-
        Assign a role to a user within a project.

        Valid roles: project-admin, project-user, project-auditor.
        Requires: project-role:assign permission scoped to this project.
      operationId: assign_project_role
      x-app-permission:
        resource: project-role
        action: assign
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Project Role Assignments
      description: |-
        List role assignments for a project.

        Admin/auditor/project-admin see all assignments; other users see only their own.
      operationId: list_project_role_assignments
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      responses:
        "200":
          description: List of role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /projects/{project_id}/role-assignments/{assignment_id}:
    delete:
      summary: Revoke Project Role
      description: |-
        Remove a role assignment from a project. Requires: project-role:revoke permission.
      operationId: revoke_project_role
      x-app-permission:
        resource: project-role
        action: revoke
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assignment UUID
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

  # ── Project Group Role Assignments ───────────────────────────────────
  /projects/{project_id}/group-role-assignments:
    post:
      summary: Assign Project Group Role
      description: |-
        Assign a role to a group within a project.

        All members of the group inherit the role for this project.
        Valid roles: project-admin, project-user, project-auditor.
        Requires: project-role:assign permission scoped to this project.
      operationId: assign_project_group_role
      x-app-permission:
        resource: project-role
        action: assign
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGroupRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned to group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGroupRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Project Group Role Assignments
      description: |-
        List group role assignments for a project.

        Admin/auditor/project-admin see all assignments; other users see only
        assignments for groups they belong to.
      operationId: list_project_group_role_assignments
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      responses:
        "200":
          description: List of group role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectGroupRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /projects/{project_id}/group-role-assignments/{assignment_id}:
    delete:
      summary: Revoke Project Group Role
      description: |-
        Remove a group role assignment from a project. Requires: project-role:revoke permission.
      operationId: revoke_project_group_role
      x-app-permission:
        resource: project-role
        action: revoke
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assignment UUID
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

  # ── Project All Role Assignments (unified view) ─────────────────────
  /projects/{project_id}/all-role-assignments:
    get:
      summary: List Project All Role Assignments
      description: |-
        List all role assignments (user + group) scoped to a project.
      operationId: list_project_all_role_assignments
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: principal_type
          in: query
          required: false
          description: Filter by principal type (user or group)
          schema:
            anyOf:
              - type: string
              - type: 'null'
        - name: principal_name
          in: query
          required: false
          description: Filter by principal name (username or group name)
          schema:
            anyOf:
              - type: string
              - type: 'null'
        - name: role_name
          in: query
          required: false
          description: Filter by role name
          schema:
            anyOf:
              - type: string
              - type: 'null'
      responses:
        "200":
          description: Paginated list of role assignments for this project
          content:
            application/json:
              schema:
                $ref: "../authz/all_role_assignment.openapi.yaml#/components/schemas/AllRoleAssignmentListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

  # ── Project Roles (CRUD) ────────────────────────────────────────────
  /projects/{project_id}/roles:
    post:
      summary: Create Project Role
      description: |-
        Create a role scoped to this project. Requires: role:create permission.
      operationId: create_project_role
      x-app-permission:
        resource: role
        action: create
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
