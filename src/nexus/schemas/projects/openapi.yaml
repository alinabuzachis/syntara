---
openapi: 3.1.0
info:
  title: Nexus Projects API
  version: 1.0.0
  description: |
    Project management and project-scoped resource access for the Nexus platform.

    Projects provide multi-tenant isolation for workflows, approvals, and other
    resources. Each project has its own role assignments for users and groups.

    ## Key Features
    - Project CRUD with soft deletion
    - Project-scoped workflow and approval listing
    - User role assignments (project-admin, project-user, project-auditor)
    - Group role assignments with inherited membership

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Projects
    description: Project CRUD and project-scoped resource operations

paths:
  # ── Project CRUD ─────────────────────────────────────────────────────
  /projects:
    post:
      summary: Create Project
      description: |-
        Create a new project.

        The creator is automatically assigned the project-admin role.
        Requires: project:create permission.
      operationId: create_project
      x-app-permission:
        resource: project
        action: create
        scope: any
        default_roles: [admin, user, default]
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Projects
      description: |-
        List projects the current user has read access to.
      operationId: list_projects
      x-app-permission:
        resource: project
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      responses:
        "200":
          description: List of accessible projects
          content:
            application/json:
              schema:
                type: array
                title: Response List Projects
                items:
                  $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /projects/{project_id}:
    get:
      summary: Get Project
      description: Get a project by ID.
      operationId: get_project
      x-app-permission:
        resource: project
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    patch:
      summary: Update Project
      description: |-
        Patch a project. Requires: project:update permission scoped to this project.
      operationId: update_project
      x-app-permission:
        resource: project
        action: update
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    put:
      summary: Replace Project
      description: |-
        Replace a project. Requires: project:update permission scoped to this project.
      operationId: replace_project
      x-app-permission:
        resource: project
        action: update
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete Project
      description: |-
        Delete a project (soft-delete). Requires: project:delete permission scoped to this project.
      operationId: delete_project
      x-app-permission:
        resource: project
        action: delete
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        "204":
          description: Project deleted
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      # ── Project Workflows ────────────────────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/workflows:
    get:
      summary: List Project Workflows
      description: |-
        List workflows belonging to a specific project.

        Returns only workflows with project_id matching the given project.
        Requires: workflow:read permission scoped to this project.
      operationId: list_project_workflows
      x-app-permission:
        resource: workflow
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        "200":
          description: Paginated list of workflows in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      # ── Project Approvals ────────────────────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/approvals:
    get:
      summary: List Project Approvals
      description: |-
        List approval requests belonging to a specific project.

        Returns only approvals with project_id matching the given project.
        Requires: approval:read permission scoped to this project.
      operationId: list_project_approvals
      x-app-permission:
        resource: approval
        action: read
        scope: project
        default_roles: [admin, auditor, user, project-admin, project-user, project-auditor]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/ApprovalRequestStatus"
              - type: 'null'
            title: Status
        - name: execution_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
      responses:
        "200":
          description: Paginated list of approvals in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      # ── Project User Role Assignments ────────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/roles:
    post:
      summary: Assign Project Role
      description: |-
        Assign a role to a user within a project.

        Valid roles: project-admin, project-user, project-auditor.
        Requires: project-role:assign permission scoped to this project.
      operationId: assign_project_role
      x-app-permission:
        resource: project-role
        action: assign
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Project Roles
      description: List all role assignments for a project.
      operationId: list_project_roles
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        "200":
          description: List of role assignments
          content:
            application/json:
              schema:
                type: array
                title: Response List Project Roles
                items:
                  $ref: "#/components/schemas/ProjectRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /projects/{project_id}/roles/{assignment_id}:
    delete:
      summary: Revoke Project Role
      description: |-
        Remove a role assignment from a project. Requires: project-role:revoke permission.
      operationId: revoke_project_role
      x-app-permission:
        resource: project-role
        action: revoke
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      # ── Project Group Role Assignments ───────────────────────────────────
      security:
        - bearerAuth: []
  /projects/{project_id}/group-roles:
    post:
      summary: Assign Project Group Role
      description: |-
        Assign a role to a group within a project.

        All members of the group inherit the role for this project.
        Valid roles: project-admin, project-user, project-auditor.
        Requires: project-role:assign permission scoped to this project.
      operationId: assign_project_group_role
      x-app-permission:
        resource: project-role
        action: assign
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGroupRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned to group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGroupRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Project Group Roles
      description: List all group role assignments for a project.
      operationId: list_project_group_roles
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        "200":
          description: List of group role assignments
          content:
            application/json:
              schema:
                type: array
                title: Response List Project Group Roles
                items:
                  $ref: "#/components/schemas/ProjectGroupRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /projects/{project_id}/group-roles/{assignment_id}:
    delete:
      summary: Revoke Project Group Role
      description: |-
        Remove a group role assignment from a project. Requires: project-role:revoke permission.
      operationId: revoke_project_group_role
      x-app-permission:
        resource: project-role
        action: revoke
        scope: project
        default_roles: [admin, project-admin]
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
components:
  schemas:
    ProjectCreate:
      type: object
      title: ProjectCreate
      description: Request body for creating a project.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels

    ProjectUpdate:
      type: object
      title: ProjectUpdate
      description: Request body for updating a project.
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
              pattern: ^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Labels

    ProjectRead:
      title: ProjectRead
      description: Response body for a project.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: ProjectRead
          required:
            - name
          properties:
            name:
              type: string
              title: Name
            description:
              anyOf:
                - type: string
                - type: "null"
              title: Description
            is_default:
              type: boolean
              default: false
              title: Is Default

    ProjectRoleAssignmentCreate:
      type: object
      title: ProjectRoleAssignmentCreate
      description: Request body for assigning a role to a user within a project.
      required:
        - user_id
        - role_name
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role_name:
          type: string
          title: Role Name

