components:
  parameters:
    projectIdParam:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID
    roleIdParam:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Role UUID
    policyIdParam:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Policy UUID

  schemas:
    ProjectCreate:
      type: object
      title: ProjectCreate
      description: Request body for creating a project.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels

    ProjectUpdate:
      type: object
      title: ProjectUpdate
      description: Request body for updating a project.
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
              pattern: "^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$"
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Labels

    ProjectRead:
      title: ProjectRead
      description: Response body for a project.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: ProjectRead
          required:
            - name
          properties:
            name:
              type: string
              title: Name
            description:
              anyOf:
                - type: string
                - type: "null"
              title: Description
            is_default:
              type: boolean
              default: false
              title: Is Default

    ProjectRoleAssignmentCreate:
      type: object
      title: ProjectRoleAssignmentCreate
      description: Request body for assigning a role to a user within a project.
      required:
        - user_id
        - role_name
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role_name:
          type: string
          title: Role Name

    ProjectRoleAssignmentRead:
      type: object
      title: ProjectRoleAssignmentRead
      description: Response body for a project role assignment.
      required:
        - id
        - user_id
        - project_id
        - role_name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        username:
          type: string
          default: ""
          title: Username
        project_id:
          type: string
          format: uuid
          title: Project Id
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At

    ProjectGroupRoleAssignmentCreate:
      type: object
      title: ProjectGroupRoleAssignmentCreate
      description: Request body for assigning a role to a group within a project.
      required:
        - group_id
        - role_name
      properties:
        group_id:
          type: string
          format: uuid
          title: Group Id
        role_name:
          type: string
          title: Role Name

    ProjectGroupRoleAssignmentRead:
      type: object
      title: ProjectGroupRoleAssignmentRead
      description: Response body for a project group role assignment.
      required:
        - id
        - group_id
        - project_id
        - role_name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        group_id:
          type: string
          format: uuid
          title: Group Id
        group_name:
          type: string
          default: ""
          title: Group Name
        project_id:
          type: string
          format: uuid
          title: Project Id
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At

    ProjectRoleCreate:
      type: object
      title: ProjectRoleCreate
      description: Request body for creating a project-scoped role (project_id comes from URL path).
      required:
        - name
        - policies
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        policies:
          type: array
          minItems: 1
          items:
            type: string
          title: Policies
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          title: Labels

    ProjectPolicyCreate:
      type: object
      title: ProjectPolicyCreate
      description: Request body for creating a project-scoped policy (project_id comes from URL path).
      required:
        - name
        - statements
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        statements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PolicyStatementSchema"
          title: Statements
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          title: Labels

    PolicyStatementSchema:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyStatementSchema"

    PolicyRead:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyRead"
    PolicyUpdate:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyUpdate"
    PolicyListResponse:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyListResponse"
    RoleRead:
      $ref: "../authz/role.openapi.yaml#/components/schemas/RoleRead"
    RoleUpdate:
