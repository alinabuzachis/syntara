---
openapi: "3.1.0"
info:
  title: Nexus Portal - Example API
  description: Example API endpoint for demonstration purposes
  version: 1.0.0
  contact:
    name: Nexus Portal
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.nexus.example.com/api/v1
    description: Production server
tags:
  - name: example
    description: Example operations
paths:
  /example:
    get:
      tags: [example]
      summary: Get example data
      description: Returns example data for demonstration purposes
      operationId: get_example
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return
          required: false
          schema:
            type: integer
            title: Limit
            description: Maximum number of items to return
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
    post:
      tags: [example]
      summary: Create example item
      description: Creates a new example item
      operationId: create_example
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleRequest"
      responses:
        "201":
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleItem"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
  /example/{item_id}:
    get:
      tags: [example]
      summary: Get example item by ID
      description: Returns a single example item by its ID
      operationId: get_example_by_id
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      parameters:
        - name: item_id
          in: path
          description: Example item ID
          required: true
          schema:
            type: integer
            title: Item Id
            description: Example item ID
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleItem"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
    put:
      tags: [example]
      summary: Update example item
      description: Updates an existing example item
      operationId: update_example
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      parameters:
        - name: item_id
          in: path
          description: Example item ID
          required: true
          schema:
            type: integer
            title: Item Id
            description: Example item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExampleRequest"
      responses:
        "200":
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleItem"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
    delete:
      tags: [example]
      summary: Delete example item
      description: Deletes an example item
      operationId: delete_example
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      parameters:
        - name: item_id
          in: path
          description: Example item ID
          required: true
          schema:
            type: integer
            title: Item Id
            description: Example item ID
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
components:
  schemas:
    ExampleStatus:
      type: string
      title: ExampleStatus
      enum: [active, inactive]
      description: Status enumeration for example items.
    ExampleItem:
      type: object
      title: ExampleItem
      description: Schema for example item response.
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
          description: Name of the example item
          minLength: 1
          maxLength: 100
        description:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
          title: Description
          description: Description of the example item
        status:
          $ref: "#/components/schemas/ExampleStatus"
          default: active
          description: Status of the example item
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      required: [name, id, created_at, updated_at]
    ExampleListResponse:
      type: object
      title: ExampleListResponse
      description: Schema for GET /example response.
      properties:
        data:
          type: array
          title: Data
          items:
            $ref: "#/components/schemas/ExampleItem"
        total:
          type: integer
          title: Total
      required: [data, total]
    CreateExampleRequest:
      type: object
      title: CreateExampleRequest
      description: Schema for creating a new example item (POST /example).
      properties:
        name:
          type: string
          title: Name
          description: Name of the example item
          minLength: 1
          maxLength: 100
        description:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
          title: Description
          description: Description of the example item
        status:
          $ref: "#/components/schemas/ExampleStatus"
          default: active
          description: Status of the example item
      required: [name]
    UpdateExampleRequest:
      type: object
      title: UpdateExampleRequest
      description: Schema for updating an example item (PUT /example/{item_id}).
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
          title: Description
        status:
          anyOf:
            - $ref: "#/components/schemas/ExampleStatus"
            - type: "null"
    DeleteResponse:
      type: object
      title: DeleteResponse
      description: Schema for DELETE response.
      properties:
        message:
          type: string
          title: Message
      required: [message]
