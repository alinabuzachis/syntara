---
openapi: 3.1.0
info:
  title: Nexus Users & Groups API
  version: 1.0.0
  description: |
    User and group management endpoints for the Nexus platform.

    ## Key Features
    - User CRUD (local user account management)
    - Group CRUD and membership management

servers:
  - url: /api/v1
    description: API server (relative path)

tags:
  - name: Users
    description: Local user account management
  - name: Groups
    description: Group CRUD and membership management

paths:
  # ── Users ───────────────────────────────────────────────────────────
  /users:
    get:
      summary: List Users
      description: |-
        List users with filtering, sorting, and pagination.

        Uses cursor-based pagination for scalability and consistency.
      operationId: list_users
      tags:
        - Users
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'username', '-created_at')
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

      security:
        - bearerAuth: []
    post:
      summary: Create User
      description: Create a new local user.
      operationId: create_user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '409':
          description: Username or email conflict
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /users/{user_id}:
    get:
      summary: Get User
      description: Get a user by ID.
      operationId: get_user
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    patch:
      summary: Update User
      description: |-
        Update a user.

        Supports partial updates - only provided fields are updated.
      operationId: update_user
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '403':
          description: Forbidden (e.g., non-admin disabling built-in admin)
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '409':
          description: Email conflict
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    delete:
      summary: Delete User
      description: Soft delete a user.
      operationId: delete_user
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /users/{user_id}/groups:
    get:
      summary: List User Groups
      description: List groups that a user belongs to.
      operationId: list_user_groups
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    put:
      summary: Set User Groups
      description: |-
        Set a user's group memberships declaratively.

        Replace all current memberships with the provided list of group IDs.
        An empty list removes the user from all groups.
      operationId: set_user_groups
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupsSet'
      responses:
        '200':
          description: Updated group memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '404':
          description: User or group not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      # ── Groups ──────────────────────────────────────────────────────────
      security:
        - bearerAuth: []
  /groups:
    get:
      summary: List Groups
      description: Retrieve list of groups with filtering and pagination.
      operationId: list_groups
      tags:
        - Groups
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'

      security:
        - bearerAuth: []
    post:
      summary: Create Group
      description: Create a new group for organizing users.
      operationId: create_group
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRead'
        '409':
          description: Group name conflict
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /groups/{group_id}:
    get:
      summary: Get Group
      description: Retrieve a group by its UUID.
      operationId: get_group
      tags:
        - Groups
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group UUID
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRead'
        '404':
          description: Group not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    patch:
      summary: Update Group
      description: Partially update a group. Only provided fields are updated.
      operationId: update_group
      tags:
        - Groups
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRead'
        '404':
          description: Group not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '409':
          description: Group name conflict
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    delete:
      summary: Delete Group
      description: Soft delete a group.
      operationId: delete_group
      tags:
        - Groups
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group UUID
      responses:
        '204':
          description: Group deleted
        '404':
          description: Group not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /groups/{group_id}/members:
    get:
      summary: List Members
      description: List members of a group with pagination.
      operationId: list_members
      tags:
        - Groups
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group UUID
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      responses:
        '200':
          description: List of group members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '404':
          description: Group not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    post:
      summary: Add Member
      description: Add a local user to a group.
      operationId: add_member
      tags:
        - Groups
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberAdd'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberAddResponse'
        '403':
          description: User is not a local user
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Group or user not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '409':
          description: User already a member
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /groups/{group_id}/members/{user_id}:
    delete:
      summary: Remove Member
      description: Remove a user from a group.
      operationId: remove_member
      tags:
        - Groups
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group UUID
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      responses:
        '204':
          description: Member removed
        '403':
          description: User is not a local user
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Group not found or user not a member
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
components:
  schemas:
    # ── User schemas ────────────────────────────────────────────────
    UserCreate:
      type: object
      title: UserCreate
      description: |-
        Schema for creating a new local user (POST /users).

        Excludes auto-generated fields: id, created_at, updated_at, last_login, preferences.
      required:
        - username
        - email
        - full_name
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique username
          title: Username
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique email address
          title: Email
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: User's display name
          title: Full Name
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Plaintext password (will be hashed)
          title: Password
        is_active:
          type: boolean
          default: true
          description: Account activation status
          title: Is Active

    UserUpdate:
      type: object
      title: UserUpdate
      description: |-
        Schema for updating a user (PATCH /users/{id}).

        All fields are optional for partial updates.
      properties:
        full_name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: 'null'
          description: Update display name
          title: Full Name
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 255
            - type: 'null'
          description: Update email address
          title: Email
        password:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          description: New password (will be hashed). Omit to keep current password.
          title: Password
        is_active:
          anyOf:
            - type: boolean
            - type: 'null'
          description: Enable or disable user account
          title: Is Active

    UserRead:
      type: object
      title: UserRead
      description: |-
        Schema for user response (GET /users/{id}).

        Includes all user fields except sensitive data (password_hash, preferences).
      required:
        - id
        - username
        - email
        - full_name
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        username:
          type: string
          title: Username
        email:
          type: string
          title: Email
        full_name:
          type: string
          title: Full Name
        is_active:
          type: boolean
          title: Is Active
        last_login:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Login
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At

    UserListResponse:
      allOf:
        - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/UserRead'
              maxItems: 100

    UserGroupsSet:
      type: object
      title: UserGroupsSet
      description: |-
        Schema for declaratively setting a user's group memberships (PUT /users/{id}/groups).

        The provided list replaces all current memberships. An empty list removes
        the user from all groups.
      properties:
        group_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Complete list of group IDs the user should belong to
          title: Group Ids

    # ── Group schemas ───────────────────────────────────────────────
    GroupCreate:
      type: object
      title: GroupCreate
      description: |-
        Schema for creating a new group (POST /groups).
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Group name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Group description
          title: Description

    GroupUpdate:
      type: object
      title: GroupUpdate
      description: |-
        Schema for updating a group (PATCH /groups/{id}).

        All fields are optional for partial updates.
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: 'null'
          description: Update group name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Update group description
          title: Description

    GroupRead:
      type: object
      title: GroupRead
      description: |-
        Schema for group response (GET /groups/{id}).

        Includes all fields from the database table model.
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        is_builtin:
          type: boolean
          default: false
          title: Is Builtin
        created_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        source:
          type: string
          default: local
          title: Source
        member_count:
          type: integer
          default: 0
          title: Member Count

    GroupListResponse:
      allOf:
        - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/GroupRead'
              maxItems: 100

    GroupMemberAdd:
      type: object
      title: GroupMemberAdd
      description: Schema for adding a member to a group (POST /groups/{id}/members).
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the user to add to the group
          title: User Id

    GroupMemberAddResponse:
      type: object
      title: GroupMemberAddResponse
      description: Response schema for adding a member to a group.
      properties:
        message:
          type: string
          default: Member added successfully
          description: Confirmation message
          title: Message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
