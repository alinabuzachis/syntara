---
openapi: 3.1.0
info:
  title: Tool Metrics API
  description: API for monitoring tool usage metrics and rate limiting
  version: 1.0.0

servers:
  - url: /api/v1
    description: API server (relative path)

# Reference shared resource schemas
x-shared-contracts:
  - path: ../base/shared-resources.openapi.yaml
    namespace: shared

paths:
  /tool_manager/metrics/tools:
    get:
      operationId: get_tool_metrics
      summary: Get Tool Metrics Summary
      description: |-
        Return aggregated per-tool metrics summary.

        Supports filtering by namespaced_name and time range.
        Uses UsageCounter for unfiltered queries (fast path) and SQL aggregation
        for time-filtered queries (flexible path).
      parameters:
        - name: field[operator]
          in: query
          description: |
            Generic field filtering with operators. Syntax: field[operator]=value

            Supported operators:
            - eq: equals
            - contains: string contains
            - starts_with: string starts with
            - gt: greater than
            - gte: greater than or equal
            - lt: less than
            - lte: less than or equal

            Examples:
            - ?time_window[eq]=day
            - ?start_date[gte]=2025-01-01
            - ?provider_id[eq]=uuid1
            - ?user_id[contains]=agent
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: limit
          in: query
          description: Maximum number of metric records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Cursor for keyset pagination (metric ID to start after)
          schema:
            type: string
            format: uuid
        - name: include_total
          in: query
          description: Include total count in response (may impact performance)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tool usage metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolMetricsToolSummaryListResponse'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/metrics/executions:
    get:
      operationId: get_tool_executions
      summary: List Tool Executions
      description: |-
        Return paginated tool execution history.

        Supports filtering by namespaced_name, status, and time range.
        Uses cursor-based pagination consistent with other Nexus list endpoints.
      parameters:
        - name: field[operator]
          in: query
          description: |
            Generic field filtering with operators. Syntax: field[operator]=value

            Supported operators:
            - eq: equals
            - contains: string contains
            - starts_with: string starts with
            - gt: greater than
            - gte: greater than or equal
            - lt: less than
            - lte: less than or equal

            Examples:
            - ?status[eq]=success
            - ?execution_start[gte]=2025-01-01T00:00:00Z
            - ?duration_ms[gt]=100
            - ?user_id[contains]=agent
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: limit
          in: query
          description: Maximum number of executions to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Cursor for keyset pagination (execution ID to start after)
          schema:
            type: string
            format: uuid
        - name: include_total
          in: query
          description: Include total count in response (may impact performance)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Execution logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolExecution'
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type: [string, "null"]
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                  - executions
                  - limit
                  - has_more
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
components:
  schemas:
    ToolExecutionStatus:
      type: string
      title: ToolExecutionStatus
      description: Status of a tool execution.
      enum:
        - running
        - success
        - error
        - timeout

    ToolExecutionListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolExecution'
      title: ToolExecutionListResponse
      description: Paginated list response for tool executions.

    ToolMetricsToolSummary:
      type: object
      title: ToolMetricsToolSummary
      additionalProperties: false
      description: Per-tool aggregated metrics summary for the metrics/tools endpoint.
      required:
        - namespaced_name
        - total_executions
        - success_count
        - error_count
        - timeout_count
        - success_rate
        - avg_duration_ms
      properties:
        namespaced_name:
          type: string
          title: Namespaced Name
          description: Tool identifier (e.g., 'provider::tool')
        total_executions:
          type: integer
          title: Total Executions
          description: Total execution count
        success_count:
          type: integer
          title: Success Count
          description: Successful executions
        error_count:
          type: integer
          title: Error Count
          description: Error executions
        timeout_count:
          type: integer
          title: Timeout Count
          description: Timeout executions
        success_rate:
          type: number
          title: Success Rate
          description: Success rate (0.0 to 1.0)
        avg_duration_ms:
          type: number
          title: Avg Duration Ms
          description: Average execution duration in milliseconds
        last_execution_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Execution At
          description: Timestamp of most recent execution

    ToolMetricsToolSummaryListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolMetricsToolSummary'
              description: Array of resources in current page
              title: Resources
      title: ToolMetricsToolSummaryListResponse
      description: Paginated list response for tool metrics summaries.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    ToolExecution:
      allOf:
        - $ref: '../base/shared-resources.openapi.yaml#/components/schemas/UserOwnedResource'
        - type: object
          required:
            - tool_id
            - provider_id
            - user_id
            - execution_start
            - status
            - input_parameters
          properties:
            tool_id:
              type: string
              format: uuid
              title: Tool Id
              description: Foreign key to Tool
            provider_id:
              type: string
              format: uuid
              title: Provider Id
              description: Foreign key to Tool Provider
            user_id:
              type: string
              format: uuid
              title: User Id
              description: Identifier of executing user/agent
            execution_start:
              type: string
              format: date-time
              title: Execution Start
              description: Execution start timestamp
            execution_end:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              title: Execution End
              description: Execution completion timestamp
            duration_ms:
              anyOf:
                - type: integer
                  minimum: 0
                - type: 'null'
              title: Duration Ms
              description: Execution duration in milliseconds
            status:
              $ref: '#/components/schemas/ToolExecutionStatus'
              description: Execution status
            input_parameters:
              type: object
              additionalProperties: true
              title: Input Parameters
              description: Tool input parameters
            output_data:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
              title: Output Data
              description: Tool output data
            error_message:
              anyOf:
                - type: string
                - type: 'null'
              title: Error Message
              description: Error description for failed executions
            error_code:
              anyOf:
                - type: string
                  maxLength: 100
                - type: 'null'
              title: Error Code
              description: Structured error code
      additionalProperties: false
      title: ToolExecution
      description: |-
        Tool execution records stored in database.

        Records individual Tool executions for performance monitoring and analysis.
        This model matches the ToolExecution schema from the metrics contract.

        Inherits from UserOwnedResource:
            id: UUID primary key
            created_at: Creation timestamp
            updated_at: Last update timestamp
            created_by: UUID of user who created the resource
            updated_by: Optional UUID of user who last updated the resource
            deleted_at: Optional timestamp when resource was soft deleted
            deleted_by: Optional UUID of user who performed the soft delete
            labels: Optional key-value metadata
