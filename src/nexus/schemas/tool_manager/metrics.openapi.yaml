---
openapi: 3.1.0
info:
  title: Tool Metrics API
  description: API for monitoring tool usage metrics and rate limiting
  version: 1.0.0

servers:
  - url: /api/v1
    description: API server (relative path)

# Reference shared resource schemas
x-shared-contracts:
  - path: ../base/shared-resources.openapi.yaml
    namespace: shared

paths:
  /tool_manager/metrics/tools:
    get:
      operationId: get_tool_metrics
      summary: Get Tool Metrics Summary
      description: |-
        Return aggregated per-tool metrics summary.

        Supports filtering by namespaced_name and time range.
        Uses UsageCounter for unfiltered queries (fast path) and SQL aggregation
        for time-filtered queries (flexible path).
      parameters:
        - name: field[operator]
          in: query
          description: |
            Generic field filtering with operators. Syntax: field[operator]=value

            Supported operators:
            - eq: equals
            - contains: string contains
            - starts_with: string starts with
            - gt: greater than
            - gte: greater than or equal
            - lt: less than
            - lte: less than or equal

            Examples:
            - ?time_window[eq]=day
            - ?start_date[gte]=2025-01-01
            - ?provider_id[eq]=uuid1
            - ?user_id[contains]=agent
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: limit
          in: query
          description: Maximum number of metric records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Cursor for keyset pagination (metric ID to start after)
          schema:
            type: string
            format: uuid
        - name: include_total
          in: query
          description: Include total count in response (may impact performance)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tool usage metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolMetricsToolSummaryListResponse'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/metrics/executions:
    get:
      operationId: get_tool_executions
      summary: List Tool Executions
      description: |-
        Return paginated tool execution history.

        Supports filtering by namespaced_name, status, and time range.
        Uses cursor-based pagination consistent with other Nexus list endpoints.
      parameters:
        - name: field[operator]
          in: query
          description: |
            Generic field filtering with operators. Syntax: field[operator]=value

            Supported operators:
            - eq: equals
            - contains: string contains
            - starts_with: string starts with
            - gt: greater than
            - gte: greater than or equal
            - lt: less than
            - lte: less than or equal

            Examples:
            - ?status[eq]=success
            - ?execution_start[gte]=2025-01-01T00:00:00Z
            - ?duration_ms[gt]=100
            - ?user_id[contains]=agent
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: limit
          in: query
          description: Maximum number of executions to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Cursor for keyset pagination (execution ID to start after)
          schema:
            type: string
            format: uuid
        - name: include_total
          in: query
          description: Include total count in response (may impact performance)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Execution logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolExecution'
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type: [string, "null"]
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                  - executions
                  - limit
                  - has_more
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
components:
  schemas:
    ToolExecutionStatus:
      type: string
      title: ToolExecutionStatus
      description: Status of a tool execution.
      enum:
        - running
        - success
        - error
        - timeout

    ToolExecutionListResponse:
      type: object
      title: ToolExecutionListResponse
      description: Paginated list response for tool executions.
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ToolExecution'
          description: Array of resources in current page
        next:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: Total count of resources (only when include_total=true)
      required:
        - resources

    ToolMetricsToolSummaryListResponse:
      type: object
      title: ToolMetricsToolSummaryListResponse
      description: Paginated list response for tool metrics summaries.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for next page of results
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for previous page of results
          title: Prev
        resources:
          type: array
          items: {}
          description: Array of resources in current page
          title: Resources
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          description: Total count of resources (only when include_total=true)
          title: Total

    ToolExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tool_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        execution_start:
          type: string
          format: date-time
        execution_end:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: [integer, "null"]
        status:
          $ref: '#/components/schemas/ToolExecutionStatus'
        input_parameters:
          type: object
          description: Tool input parameters as JSON
        output_data:
          type: [object, "null"]
          description: Tool output data as JSON
        error_message:
          type: [string, "null"]
        error_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_at:
          type: [string, "null"]
          format: date-time
        updated_by:
          type: [string, "null"]
          format: uuid
        deleted_at:
          type: [string, "null"]
          format: date-time
        deleted_by:
          type: [string, "null"]
          format: uuid
      required:
        - id
        - tool_id
        - provider_id
        - user_id
        - execution_start
        - status
        - input_parameters
        - created_at
        - created_by
