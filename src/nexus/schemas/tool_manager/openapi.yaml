---
openapi: 3.1.0
info:
  title: Tool Provider Management API
  description: API for registering and managing external Tool Providers
  version: 1.0.0

servers:
  - url: /api/v1
    description: API server (relative path)

# Reference shared resource schemas
x-shared-contracts:
  - path: ../base/shared-resources.openapi.yaml
    namespace: shared

paths:
  /tool_manager/tools:
    get:
      summary: Get Tools
      description: |-
        List tools with filtering, sorting, and pagination.

        Supports filtering using query parameters with standard operators:
        - name: Filter by tool name (name=tool_name, name[contains]=text)
        - enabled: Filter by enabled status (enabled=true|false)
        - status: Filter by tool status (status=available|missing|error)
        - provider_id: Filter by provider ID (provider_id=uuid)
        - namespaced_name: Filter by namespaced name (namespaced_name[contains]=text)
        - labels: Filter by labels using bracket notation (labels[environment]=production)

        Uses cursor-based pagination for scalability and consistency.

        Args:
            request: FastAPI request object containing query parameters
            service: Tool service
            params: Query parameters for pagination and filtering

        Returns:
            ToolListResponse with tools, pagination metadata, and optional total
      operationId: get_tools
      parameters:
        - name: status
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                description: Exact match of the status. ?status=<status>
              - type: object
                properties:
                  eq:
                    type: string
                    description: Exact match of the status. ?status[eq]=<status>
          description: |
            Filter tools by status.
            - Exact match: `status=available`
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter tools by enabled status
        - name: provider_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter tools by provider ID
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
        - name: namespaced_name
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: string
            description: Filter by namespaced name (namespaced_name[contains]=text)
          description: Filter tools by namespaced name with text matching
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tools/{tool_id}:
    get:
      summary: Get Tool
      description: |-
        Get tool details by ID.

        Returns detailed information about a specific tool including
        parameters, status, and metadata.

        Args:
            tool_id: UUID of the tool to retrieve
            service: Tool service

        Returns:
            ToolWithParameters instance with full details

        Raises:
            HTTPException: 404 if tool not found, 403 for auth, 400 for invalid UUID
      operationId: get_tool
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWithParameters'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Tool not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    patch:
      summary: Patch Tool
      description: |-
        Update tool status (enable/disable).

        Updates the tool's status to enable or disable it for use.
        Only admin-controllable status changes are allowed (available/disabled).

        Args:
            tool_id: UUID of the tool to update
            tool_update: Tool update data with status
            service: Tool service

        Returns:
            Updated Tool instance

        Raises:
            HTTPException: 400 for validation errors, 404 if not found, 403 for auth
      operationId: patch_tool
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ToolUpdate'
      responses:
        '200':
          description: Tool updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWithParameters'
        '400':
          description: Invalid tool configuration
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Tool not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tools/bulk_update:
    patch:
      summary: Bulk Update Tools
      description: |-
        Bulk update tool status (enable/disable multiple tools).

        Updates the status of multiple tools in a single operation.
        Only admin-controllable status changes are allowed (available/disabled).

        Args:
            bulk_update: Bulk update request with tool IDs and status
            service: Tool service

        Returns:
            Dictionary with update statistics and timestamp

        Raises:
            HTTPException: 400 for validation errors, 403 for auth
      operationId: bulk_update_tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolBulkUpdate'
      responses:
        '200':
          description: Tools updated successfully
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tool_providers:
    get:
      summary: Get Tool Providers
      description: |-
        List tool providers with filtering, sorting, and pagination.

        Supports filtering using query parameters with standard operators:
        - name: Filter by provider name (name=provider_name, name[contains]=text)
        - status: Filter by provider status (status=validating|available|error)
        - enabled: Filter by enabled status (enabled=true|false)
        - provider_type: Filter by provider type (provider_type=openapi)
        - labels: Filter by labels using bracket notation (labels[environment]=production)

        Uses cursor-based pagination for scalability and consistency.

        Args:
            request: FastAPI request object containing query parameters
            service: Tool provider service
            params: Query parameters for pagination and filtering

        Returns:
            ToolProviderListResponse with providers, pagination metadata, and optional total
      operationId: get_tool_providers
      parameters:
        - name: status
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                description: Exact match of the status. ?status=<status>
              - type: object
                properties:
                  eq:
                    type: string
                    description: Exact match of the status. ?status[eq]=<status>
          description: |
            Filter providers by status.
            - Exact match: `status=available`
        - name: provider_type
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                description: Exact match of the provider type. ?provider_type=<type>
              - type: object
                properties:
                  eq:
                    type: string
                    description: Exact match of the provider type. ?provider_type[eq]=<type>
          description: |
            Filter providers by provider type.
            - Exact match: `provider_type=mcp`
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of Tool Providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ToolProviderWithConfiguration'
                        maxItems: 100
                    required:
                      - resources
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    post:
      summary: Register Tool Provider
      description: |-
        Register a new Tool Provider.

        Creates a new tool provider with the specified configuration.
        The provider starts in 'validating' status.

        Args:
            provider_create: Provider configuration and metadata
            service: Tool provider service

        Returns:
            Created ToolProvider instance

        Raises:
            HTTPException: 400 for validation errors, 409 for name conflicts, 403 for auth
      operationId: register_tool_provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderCreate'
      responses:
        '201':
          description: Provider registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderWithConfiguration'
        '400':
          description: Invalid provider configuration
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '409':
          description: Provider name already exists
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tool_providers/{provider_id}:
    get:
      summary: Get Tool Provider
      description: |-
        Get Tool Provider details by ID.

        Returns detailed information about a specific Tool Provider including
        configuration, status, and metadata.

        Args:
            provider_id: UUID of the provider to retrieve
            service: Tool provider service

        Returns:
            ToolProvider instance with full details

        Raises:
            HTTPException: 404 if provider not found, 403 for auth, 400 for invalid UUID
      operationId: get_tool_provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderWithConfiguration'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    put:
      summary: Update Tool Provider
      description: |-
        Update Tool Provider configuration (complete replacement).

        Performs a complete replacement of the provider configuration.
        All fields in the request body will replace existing values.

        Args:
            provider_id: UUID of the provider to update
            provider_update: New provider configuration
            service: Tool provider service

        Returns:
            Updated ToolProvider instance

        Raises:
            HTTPException: 400 for validation errors, 404 if not found, 409 for conflicts, 403 for auth
      operationId: update_tool_provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderCreate'
      responses:
        '200':
          description: Provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderWithConfiguration'
        '400':
          description: Invalid provider configuration
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    patch:
      summary: Patch Tool Provider
      description: |-
        Patch Tool Provider.

        Performs a partial update of the provider configuration.
        Only provided fields are updated, configuration objects are replaced.

        Args:
            provider_id: UUID of the provider to patch
            provider_patch: Partial update data
            service: Tool provider service

        Returns:
            Updated ToolProvider instance

        Raises:
            HTTPException: 400 for validation errors, 404 if not found, 409 for conflicts, 403 for auth
      operationId: patch_tool_provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ToolProviderPatch'
      responses:
        '200':
          description: Provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderWithConfiguration'
        '400':
          description: Invalid provider configuration
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
    delete:
      summary: Delete Tool Provider
      description: |-
        Remove Tool Provider and all associated tools.

        Performs a soft delete of the provider and cascades to associated tools.
        The provider will no longer be accessible but remains in the database.

        Args:
            provider_id: UUID of the provider to delete
            service: Tool provider service

        Raises:
            HTTPException: 404 if provider not found, 403 for auth
      operationId: delete_tool_provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Provider removed successfully
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tool_providers/{provider_id}/validate:
    post:
      summary: Validate Tool Provider
      description: |-
        Validate Tool Provider connection and capabilities.

        Tests the connection to the tool provider and validates compatibility.
        Updates the provider status based on validation results.

        Args:
            provider_id: UUID of the provider to validate
            service: Tool provider service

        Returns:
            Validation result with status and capability details (always 200)

        Raises:
            HTTPException: 404 if not found, 403 for auth, 500 for unexpected errors
      operationId: validate_tool_provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider validation completed (check 'valid' field for success/failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderValidationResult'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tool_providers/{provider_id}/refresh_tools:
    post:
      summary: Refresh Tool Provider
      description: |-
        Refresh tools from Tool Provider.

        Connects to the tool provider and refreshes the list of available tools.
        Creates new tools, updates existing ones, and disables missing tools.

        Args:
            provider_id: UUID of the provider to refresh
            service: Tool provider service

        Returns:
            Refresh statistics including counts and timestamp

        Raises:
            HTTPException: 400 for refresh failure, 404 if not found, 403 for auth
      operationId: refresh_tool_provider
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tool refresh completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderRefreshResult'
        '400':
          description: Tool refresh failed
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
  /tool_manager/tool_providers/test:
    post:
      summary: Test Tool Provider
      description: |-
        Test Tool Provider definition without saving to database.

        Validates the provider configuration and tests connectivity using the appropriate adapter.
        This endpoint allows testing provider definitions before registering them.

        Args:
            provider_create: Provider configuration to test
            service: Tool provider service

        Returns:
            ToolProviderValidationResult with test results (always 200)

        Raises:
            HTTPException: 403 for auth, 500 for unexpected errors
      operationId: test_tool_provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderCreate'
      responses:
        '200':
          description: Provider definition test completed (check 'valid' field for success/failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderValidationResult'
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

      security:
        - bearerAuth: []
components:
  schemas:
    ToolListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolWithParameters'
              description: Array of resources in current page
              title: Resources
      title: ToolListResponse
      description: Paginated list response for tools.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    ProviderStatus:
      type: string
      title: ProviderStatus
      description: Status of a tool provider.
      enum:
        - available
        - error
        - validating

    ToolStatus:
      type: string
      title: ToolStatus
      description: Status of a tool.
      enum:
        - available
        - missing
        - error

    ToolParameterType:
      type: string
      title: ToolParameterType
      description: Parameter types for tools.
      enum:
        - string
        - number
        - boolean
        - object
        - array

    ToolProviderListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolProviderWithConfiguration'
      title: ToolProviderListResponse
      description: Paginated list response for tool providers.

    ToolWithParameters:
      allOf:
        - $ref: '../base/shared-resources.openapi.yaml#/components/schemas/Resource'
        - type: object
          title: ToolWithParameters
          additionalProperties: false
          description: Schema for Tool response with ToolParameter details.
          required:
            - provider_id
            - namespaced_name
            - parameters
          properties:
            provider_id:
              type: string
              format: uuid
              title: Provider Id
              description: UUID of the associated tool provider
            namespaced_name:
              type: string
              minLength: 1
              maxLength: 200
              title: Namespaced Name
              description: Unique namespaced name for the tool
            enabled:
              type: boolean
              default: true
              title: Enabled
              description: Whether the tool is enabled
            status:
              $ref: '#/components/schemas/ToolStatus'
              default: available
              description: Current status of the tool
            last_executed_at:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              title: Last Executed At
              description: Timestamp of last execution
            last_refreshed_at:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              title: Last Refreshed At
              description: Timestamp of last refresh from provider
            refresh_error:
              anyOf:
                - type: string
                - type: 'null'
              title: Refresh Error
              description: Error message from last refresh attempt
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/ToolParameter'
              title: Parameters
              description: Tool parameters

    ToolParameter:
      allOf:
        - $ref: '../base/shared-resources.openapi.yaml#/components/schemas/BaseResource'
        - type: object
          title: ToolParameter
          additionalProperties: false
          description: |-
            Tool parameter definition stored in database.

            Represents a parameter that a tool accepts, with its type, validation rules,
            and example values.

            Inherits from BaseResource:
                id: UUID primary key
                created_at: Creation timestamp
                updated_at: Last update timestamp
                labels: Optional key-value metadata
          required:
            - tool_id
            - name
            - type
            - description
            - required
          properties:
            tool_id:
              type: string
              format: uuid
              title: Tool Id
            name:
              type: string
              minLength: 1
              maxLength: 100
              title: Name
              description: Parameter name
            type:
              $ref: '#/components/schemas/ToolParameterType'
              description: Parameter type
            description:
              type: string
              title: Description
              description: Parameter description
            required:
              type: boolean
              title: Required
              description: Whether this parameter is required
            default_value:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
              title: Default Value
              description: Default value for the parameter
            example_value:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
              title: Example Value
              description: Example value for the parameter

    ToolUpdate:
      type: object
      title: ToolUpdate
      additionalProperties: false
      description: Model for updating tool configuration.
      properties:
        enabled:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Enabled
          description: Whether the tool is enabled
        status:
          anyOf:
            - $ref: '#/components/schemas/ToolStatus'
            - type: 'null'
          description: Current status of the tool
        refresh_error:
          anyOf:
            - type: string
            - type: 'null'
          title: Refresh Error
          description: Error message from last refresh attempt

    ToolBulkUpdate:
      type: object
      title: ToolBulkUpdate
      additionalProperties: false
      description: |-
        Request model for bulk updating tool status.

        Attributes:
            tool_ids: List of tool UUIDs to update (max 50)
