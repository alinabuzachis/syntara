            region: us-east-1
            team: platform
        project_id:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          description: Project this approval belongs to (denormalized from execution)
          title: Project Id
        execution_id:
          type: string
          format: uuid
          description: Parent execution ID
          title: Execution Id
        approval_node_id:
          type: string
          maxLength: 255
          minLength: 1
          description: Activity ID from workflow definition
          title: Approval Node Id
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Human-readable name for the approval request
          title: Name
        status:
          $ref: '#/components/schemas/ApprovalRequestStatus'
          default: pending
          description: Current approval status
        timeout_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          description: When this request expires
          title: Timeout At
        next_step_approved:
          additionalProperties: true
          description: First activity that executes if approved
          title: Next Step Approved
          type: object
        next_step_rejected:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          description: First activity that executes if rejected
          title: Next Step Rejected
        workflow_context:
          additionalProperties: true
          description: Workflow inputs and previous step output
          title: Workflow Context
          type: object
        decided_by:
          anyOf:
            - $ref: '#/components/schemas/UserReference'
            - type: 'null'
          description: User who made the decision
        decided_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          description: When decision was made
          title: Decided At
        decision_notes:
          anyOf:
            - maxLength: 2000
              type: string
            - type: 'null'
          description: Notes provided with decision
          title: Decision Notes
      required:
        - name
        - execution_id
        - approval_node_id
        - next_step_approved
      type: object
      title: ApprovalRequestRead
      description: |-
        ApprovalRequest API response model with UserReference for decided_by.


          Extends BaseApprovalRequest with the API-specific decided_by field

          that contains a UserReference object for API responses.
    ApprovalRequestStatus:
      type: string
      title: ApprovalRequestStatus
      description: Approval request status enumeration.
      enum:
        - pending
        - approved
        - rejected
        - expired
        - cancelled
    ActivitySummary:
      type: object
      title: ActivitySummary
      description: |-
        Activity Summary for workflow context.

        Summary of a workflow activity for display in approval context.
        Provides enough information for UI rendering without exposing
        full activity configuration details.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          title: Id
          description: Activity ID from workflow definition
        name:
          type: string
          title: Name
          description: Human-readable activity name
        type:
          type: string
          title: Type
          description: Activity type (task, approval, parallel, etc.)
    ApprovalCreateRequest:
      type: object
      title: ApprovalCreateRequest
      description: |-
        Request payload for creating an approval request.

        This is an internal schema used by the Workflows component.
      required:
        - execution_id
        - approval_node_id
        - name
        - workflow_context
      properties:
        execution_id:
          type: string
          format: uuid
          title: Execution Id
          description: Parent workflow execution ID
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id
          description: Project ID (denormalized from execution)
        approval_node_id:
          type: string
          title: Approval Node Id
          description: Activity ID from workflow definition
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Display name for the approval request
        timeout_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Timeout At
          description: When this request expires (null = no timeout)
        next_step_approved:
          anyOf:
            - $ref: '#/components/schemas/ActivitySummary'
            - type: 'null'
          description: First activity that executes if approved
        next_step_rejected:
          anyOf:
            - $ref: '#/components/schemas/ActivitySummary'
            - type: 'null'
          description: First activity that executes if rejected
        workflow_context:
          $ref: '#/components/schemas/WorkflowContext'
          description: Workflow execution context
    WorkflowContext:
      type: object
      title: WorkflowContext
      description: |-
        Workflow Context for approvers.

        Essential context for approvers to make a decision.
        Contains workflow identification, inputs, and the output from the immediately
        preceding activity.
      required:
        - workflow_version_id
        - workflow_name
        - inputs
      properties:
        workflow_version_id:
          type: string
          format: uuid
          description: ID of the workflow version being executed
          title: Workflow Version Id
        workflow_name:
          type: string
          description: Name of the workflow
          title: Workflow Name
        inputs:
          type: object
          description: Original workflow input parameters (structure varies per workflow)
          additionalProperties: true
          title: Inputs
        previous_step:
          anyOf:
            - $ref: '#/components/schemas/PreviousStepContext'
            - type: 'null'
          description: Previous step context and output
    PreviousStepContext:
      type: object
      title: PreviousStepContext
      description: |-
        Previous Step Context for workflow execution.

        The activity that immediately preceded this approval node, including its output.
        Null if the approval node is the first activity in the workflow.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          title: Id
          description: Activity ID from workflow definition
        name:
          type: string
          title: Name
          description: Human-readable activity name
        type:
          type: string
          title: Type
          description: Activity type (task, approval, parallel, etc.)
        output:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          title: Output
          description: Output from the activity (structure varies per activity type)
    ApprovalDecisionStatus:
      type: string
      title: ApprovalDecisionStatus
      description: |-
        Status values for approval decisions.

        This is a subset of ApprovalRequestStatus representing only the
        values that can be submitted in decision requests.
      enum:
        - approved
        - rejected
    ApprovalDecisionRequest:
      type: object
      title: ApprovalDecisionRequest
      description: |-
        Request payload for submitting an approval decision.

        Status values:
        - approved: Approver grants the request, workflow continues on approval path
        - rejected: Approver denies the request, workflow continues on rejection path
        - cancelled: Internal use only - set by workflow engine when parent workflow is cancelled
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ApprovalDecisionStatus'
          description: Decision status
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Notes
          description: Optional notes explaining the decision
    BatchApprovalDecisionStatus:
      type: string
      title: BatchApprovalDecisionStatus
      description: |-
        Status values that can be submitted in batch approval decisions.

        This is a subset of ApprovalRequestStatus containing only system-actionable values.
      enum:
        - approved
        - rejected
        - expired
        - cancelled
    BatchApprovalDecision:
      type: object
      title: BatchApprovalDecision
      description: Single decision within a batch approval request.
      required:
        - approval_id
        - status
      properties:
        approval_id:
          type: string
          format: uuid
          title: Approval Id
          description: ID of the approval request
        status:
          $ref: '#/components/schemas/BatchApprovalDecisionStatus'
          description: Decision status
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Notes
          description: Optional notes explaining the decision
    BatchApprovalRequest:
      type: object
      title: BatchApprovalRequest
      description: Request payload for submitting multiple approval decisions at once.
      required:
        - decisions
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 100
          title: Decisions
          items:
            $ref: '#/components/schemas/BatchApprovalDecision'
          description: List of approval decisions to submit
    BatchApprovalResult:
      type: object
      title: BatchApprovalResult
      description: Confirmation for a single approval within a batch response.
      required:
        - approval_id
        - success
      properties:
        approval_id:
          type: string
          format: uuid
          title: Approval Id
          description: ID of the approval request
        success:
          type: boolean
          title: Success
          description: Whether the decision was successfully recorded
        status:
          anyOf:
            - $ref: '#/components/schemas/ApprovalRequestStatus'
            - type: 'null'
          description: New status after the decision (if successful)
        decided_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Decided At
          description: When decision was recorded (if successful)
        decided_by:
          anyOf:
            - $ref: '#/components/schemas/UserReference'
            - type: 'null'
          description: User who made the decision (if successful)
        decision_notes:
          anyOf:
            - type: string
            - type: 'null'
          title: Decision Notes
          description: Notes provided with the decision (echoed back from request)
        error:
          anyOf:
            - type: string
            - type: 'null'
          title: Error
          description: Error message if the decision failed
    BatchApprovalResponse:
      type: object
      title: BatchApprovalResponse
      description: Response for batch approval submission.
      required:
        - results
        - total_success
        - total_failed
      properties:
        results:
          type: array
          title: Results
          items:
            $ref: '#/components/schemas/BatchApprovalResult'
          description: Individual results for each decision
        total_success:
          type: integer
          minimum: 0.0
          title: Total Success
          description: Number of successfully processed decisions
        total_failed:
          type: integer
          minimum: 0.0
          title: Total Failed
          description: Number of failed decisions
    UserReference:
      type: object
      title: UserReference
      description: |-
        Minimal user identification for embedding in other resources.

        Matches the UserReference schema from the OpenAPI specification.
        This model captures user identity at the time of an action, providing
        a snapshot that doesn't change even if the user's details are updated later.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: User's unique identifier
          title: Id
        name:
          type: string
          description: User's display name at time of action
          title: Name
    AuditEventListResponse:
