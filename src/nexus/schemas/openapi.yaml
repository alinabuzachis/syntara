    post:
      summary: Cancel Invocation
      description: |
        Cancel a running or pending invocation. Only the invocation owner can cancel it.
        Cancellation is irreversible - invocation cannot be resumed after cancellation.
        Agent performs cleanup and transitions to cancelled state with optional reason tracking.
      operationId: cancel_invocation
      tags:
        - Control
      parameters:
        - name: invocation_id
          in: path
          required: true
          description: UUID of the invocation to cancel
          schema:
