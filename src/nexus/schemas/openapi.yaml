  /approvals:
    get:
      summary: List approval requests
      description: |-
        List approval requests with filtering, sorting, and pagination.

        Supports filtering using query parameters with standard operators:
        - status: Filter by approval status (status=pending)
        - execution_id: Filter by parent execution ID (execution_id=uuid)

        Uses cursor-based pagination for scalability and consistency.
      operationId: list_approvals
      tags:
        - approvals
      x-app-permission:
        resource: approval
        action: read
        scope: project
        default_roles:
          - admin
          - auditor
          - user
          - project-admin
          - project-user
          - project-auditor
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            default: 20
            exclusiveMinimum: 0
            maximum: 100
            title: Limit
            type: integer
        - in: query
          name: cursor
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Cursor
        - in: query
          name: sort
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Sort
        - in: query
          name: include_total
          required: false
          schema:
            default: false
            title: Include Total
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/ApprovalRequestStatus'
              - type: 'null'
            title: Status
        - name: execution_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearerAuth: []
    post:
      summary: Create approval request
      description: |-
        Create a new approval request.

        This is an internal endpoint called by the Workflows component when
        a workflow execution reaches an approval node. It should not be called
        directly by end users.
      operationId: create_approval
      tags:
        - approvals
      x-app-permission:
        resource: approval
        action: create
        scope: any
        default_roles:
          - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearerAuth: []
