  /metrics/tools:
    get:
      operationId: get_tool_metrics
      summary: Get tool usage metrics
      description: Retrieve usage statistics for tools and providers
      parameters:
        - name: field[operator]
          in: query
          description: |
            Generic field filtering with operators. Syntax: field[operator]=value
            Supported operators:
            - eq: equals
            - contains: string contains
            - starts_with: string starts with
            - gt: greater than
            - gte: greater than or equal
            - lt: less than
            - lte: less than or equal
            Examples:
            - ?time_window[eq]=day
            - ?start_date[gte]=2025-01-01
            - ?provider_id[eq]=uuid1
            - ?user_id[contains]=agent
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: limit
          in: query
          description: Maximum number of metric records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Cursor for keyset pagination (metric ID to start after)
          schema:
            type: string
            format: uuid
        - name: include_total
          in: query
          description: Include total count in response (may impact performance)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tool usage metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolMetrics'
                  summary:
                    $ref: '#/components/schemas/MetricsSummary'
                  time_window:
                    type: string
                  start_date:
                    type: string
                    format: date
                  end_date:
                    type: string
                    format: date
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type:
                      - string
                      - 'null'
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                  - metrics
                  - summary
                  - limit
                  - has_more
        '403':
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /metrics/executions:
