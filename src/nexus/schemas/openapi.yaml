        resource: credential
        action: read
        scope: project
        default_roles:
          - admin
          - auditor
          - user
          - project-admin
          - project-user
          - project-auditor
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of resources to return per page
          example: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor for pagination (from previous response)
          example: eyJpZCI6InV1aWQifQ
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Sort order for resources.
            - Ascending: `field` (e.g., `name`)
            - Descending: `-field` (e.g., `-created_at`)
          example: -created_at
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to include total count in response (may impact performance)
          example: true
        - name: name
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            properties:
              contains:
                title: Contains
                description: Substring to match within the name (case-insensitive). ?name[contains]=<substring>
                type: string
              starts_with:
                title: Starts With
                description: Prefix to match at the start of the name (case-insensitive). ?name[starts_with]=<prefix>
                type: string
              eq:
                title: Equals
                description: Exact match of the name (case-insensitive). ?name[eq]=<name>
                type: string
              gt:
                title: Greater Than
                description: Greater than comparison (lexicographical). ?name[gt]=<name>
                type: string
              gte:
                title: Greater Than Or Equal
                description: Greater than or equal comparison (lexicographical). ?name[gte]=<name>
                type: string
              lt:
                title: Less Than
                description: Less than comparison (lexicographical). ?name[lt]=<name>
                type: string
              lte:
                title: Less Than Or Equal
                description: Less than or equal comparison (lexicographical). ?name[lte]=<name>
                type: string
            type: string
            description: Exact match of the name (case-insensitive). ?name=<name>
          description: |
            Filter resources by name.
            - Exact match: `name=value`
            - Contains: `name[contains]=value`
          example: auth
        - name: created_at
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            properties:
              eq:
                title: Equals
                description: Exact match of creation timestamp. ?created_at[eq]=<timestamp>
                type: string
                format: date-time
              gt:
                title: Greater Than
                description: Greater than comparison. ?created_at[gt]=<timestamp>
                type: string
                format: date-time
              gte:
                title: Greater Than Or Equal
                description: Greater than or equal comparison. ?created_at[gte]=<timestamp>
                type: string
                format: date-time
              lt:
                title: Less Than
                description: Less than comparison. ?created_at[lt]=<timestamp>
                type: string
                format: date-time
              lte:
                title: Less Than Or Equal
                description: Less than or equal comparison. ?created_at[lte]=<timestamp>
                type: string
                format: date-time
            type: string
            format: date-time
            description: Exact match of creation timestamp. ?created_at=<timestamp>
        - name: updated_at
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            properties:
              eq:
                title: Equals
                description: Exact match of last update timestamp. ?updated_at[eq]=<timestamp>
                type: string
                format: date-time
              gt:
                title: Greater Than
                description: Greater than comparison. ?updated_at[gt]=<timestamp>
                type: string
                format: date-time
              gte:
                title: Greater Than Or Equal
                description: Greater than or equal comparison. ?updated_at[gte]=<timestamp>
                type: string
                format: date-time
              lt:
                title: Less Than
                description: Less than comparison. ?updated_at[lt]=<timestamp>
                type: string
                format: date-time
              lte:
                title: Less Than Or Equal
                description: Less than or equal comparison. ?updated_at[lte]=<timestamp>
                type: string
                format: date-time
            type: string
            format: date-time
            description: Exact match of last update timestamp. ?updated_at=<timestamp>
        - name: labels
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
          description: |
            Filter resources by label key-value pairs.
            - Single label: `labels[environment]=production`
            - Multiple labels: `labels[environment]=production&labels[region]=us-east-1`
            All specified labels must match (AND logic).
          example:
            environment: production
            region: us-east-1
        - name: credential_type_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by Credential type ID
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
      responses:
        '200':
          description: Paginated list of Credentials (metadata only, no secret values)
          content:
            application/json:
              schema:
                properties:
                  next:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: Next
                    description: Cursor for next page of results
                  prev:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: Prev
                    description: Cursor for previous page of results
                  total:
                    anyOf:
                      - minimum: 0.0
                        type: integer
                      - type: 'null'
                    title: Total
                    description: Total count of resources (only when include_total=true)
                  resources:
                    type: array
