              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRoleAssignmentRead'
  /group-role-assignments/{assignment_id}:
    delete:
      summary: Remove a group-role assignment
      description: |
        Remove a group-to-role assignment.
        Requires: admin permission.
      operationId: revoke_group_role_assignment
      tags:
        - Group Role Assignments
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assignment UUID
      responses:
        '204':
          description: Assignment removed
        '404':
          description: Assignment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /authz/can-i:
    post:
      summary: Check if the current user can perform an action
      description: |
        Evaluates the current user's effective policies against OPA to determine
        if a specific action is allowed on a resource.
      operationId: can_i
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanIRequest'
      responses:
        '200':
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanIResponse'
  /authz/who-can:
    post:
      summary: List users who can perform an action
      description: |
        Iterates all active users, resolves their policies, and checks each
        against OPA. This is a debugging endpoint.
      operationId: who_can
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhoCanRequest'
      responses:
        '200':
          description: List of authorized users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoCanResponse'
  /authz/what-can-i:
    post:
      summary: List all permissions for the current user
      description: |
        Resolves the current user's effective policies and returns them as a
        flat list of permission entries. No OPA call needed.
      operationId: what_can_i
      tags:
        - Authorization
      responses:
        '200':
          description: List of permission entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatCanIResponse'
