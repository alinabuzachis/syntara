      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationCancelRequest'
            examples:
              default_reason:
                summary: Default cancellation reason
                value:
                  reason: User cancelled
              custom_reason:
                summary: Custom cancellation reason
                value:
                  reason: Request taking too long
      responses:
