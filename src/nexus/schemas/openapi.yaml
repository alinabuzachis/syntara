components:
  schemas:
    ErrorData:
      type: object
      title: RFC 9457 Problem Details
      description: |
        RFC 9457 Problem Details format for error responses.
        This format provides machine-readable and human-readable error information
        with consistent structure for all API error responses.
      required:
        - type
        - title
        - detail
        - code
        - retryable
      properties:
        type:
          type: string
          maxLength: 500
          title: Problem Type URI
          description: URI reference identifying the problem type
          example: https://api.nexus.com/errors/validation-error
        title:
          type: string
          maxLength: 200
          title: Problem Title
          description: Short, human-readable summary of the problem
          example: Validation Error
        detail:
          type: string
          maxLength: 2000
          title: Problem Detail
          description: Human-readable explanation specific to this occurrence
          example: Field 'name' must be between 1 and 255 characters
        code:
          type: string
          maxLength: 100
          title: Error Code
          description: Machine-readable error code for programmatic handling
          example: VALIDATION_ERROR
        retryable:
          type: boolean
          title: Retryable Flag
          description: Whether this error can be retried
          example: false
        instance:
          type:
            - string
            - 'null'
          maxLength: 500
          title: Problem Instance
          description: URI reference identifying the specific occurrence
          example: /api/v1/workflows
    AAPOrganization:
      type: object
      title: AAPOrganization
      description: AAP organization resource.
      required:
        - id
        - name
      properties:
