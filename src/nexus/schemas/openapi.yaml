      description: |
        Schema for partially updating a Tool Provider.
        All fields are optional - only include fields you want to update.
        If updating the configuration a provider_type must still be provided.
    MCPConfiguration:
      allOf:
        - type: object
          properties:
            provider_type:
              const: mcp
            base_url:
              type: string
              format: uri
            api_key:
              type:
                - string
                - 'null'
          required:
            - provider_type
            - base_url
    ToolProviderValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        provider_type:
          type: string
        validated_at:
          type: string
          format: date-time
        error:
          type:
            - string
            - 'null'
      required:
        - valid
        - provider_type
        - validated_at
    ToolProviderRefreshResult:
      type: object
      properties:
        refreshed_count:
          type: integer
        updated_count:
          type: integer
        disabled_count:
          type: integer
        refreshed_at:
          type: string
          format: date-time
      required:
        - refreshed_count
        - updated_count
        - disabled_count
        - refreshed_at
    UserCreate:
      type: object
      required:
        - username
        - email
        - full_name
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique username
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique email address
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: User's display name
        password:
          type: string
          format: password
          description: Plaintext password (will be hashed)
        is_active:
          type: boolean
          default: true
          description: Account activation status
    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Update display name
        email:
          type: string
          format: email
          maxLength: 255
          description: Update email address
        password:
          type: string
          format: password
          description: New password (will be hashed). Omit to keep current password.
        is_active:
          type: boolean
          description: Enable or disable user account
    UserRead:
      type: object
      required:
        - id
        - username
        - email
        - full_name
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: User UUID
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        full_name:
          type: string
          description: Display name
        is_active:
          type: boolean
          description: Account active status
        last_login:
          type: string
          format: date-time
          nullable: true
          description: Last login timestamp
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
    UserListResponse:
      allOf:
        - $ref: '#/components/schemas/ResourcesResponseBase'
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/UserRead'
              maxItems: 100
    UserGroupsSet:
      type: object
      properties:
        group_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: Complete list of group IDs the user should belong to
    GroupCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique group name
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Group description
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Update group name
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Update group description
    GroupRead:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Group UUID
        name:
          type: string
          description: Group name
        description:
          type: string
          nullable: true
          description: Group description
        is_builtin:
          type: boolean
          default: false
          description: Whether this is a seeded builtin group (e.g. admins, authenticated)
        created_by:
          type: string
          format: uuid
          nullable: true
          description: User who created the group
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        source:
          type: string
          default: local
          description: Source of group creation (local or idp)
        member_count:
          type: integer
          default: 0
          description: Number of members in the group
    GroupListResponse:
      allOf:
        - $ref: '#/components/schemas/ResourcesResponseBase'
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/GroupRead'
              maxItems: 100
    GroupMemberAdd:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the user to add to the group
    GroupMemberAddResponse:
      type: object
      properties:
        message:
          type: string
          default: Member added successfully
          description: Confirmation message
    ActivityType:
      type: object
      title: Activity Type
      description: Definition of an available activity executor type with its configuration schema
      required:
        - type
        - name
        - description
        - config_schema
      properties:
        type:
          type: string
          description: Unique identifier for the executor type
          example: agentic
          enum:
            - agentic
            - connector
            - script
            - api
            - approval
        name:
          type: string
          description: Human-readable name of the executor type
          example: Agentic Tool Execution
        description:
          type: string
          description: Detailed description of what this executor type does
          example: Execute tasks using external agentic tool servers (MCP) with AI model integration
        config_schema:
          type: object
          description: JSON Schema defining the valid configuration structure for this executor type
          example:
            type: object
            required:
              - agent
              - tools
              - model
            properties:
              agent:
                type: string
                description: MCP server URI
                pattern: ^mcp://.+
              tools:
                type: array
                description: List of tool names to invoke
                items:
                  type: string
              model:
                type: string
                description: AI model to use
                enum:
                  - claude-3-opus
                  - claude-3-sonnet
                  - gpt-4
                  - gpt-4-turbo
        examples:
          type: array
          description: Example configurations for this executor type
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the example
              description:
                type: string
                description: What this example demonstrates
              config:
                type: object
                description: Example configuration object
          example:
            - name: Sentiment Analysis
              description: Analyze text sentiment using MCP tool
              config:
                agent: mcp://sentiment-server
                tools:
                  - analyze_sentiment
                model: claude-3-opus
                prompt: Analyze the sentiment of the following text
    ExecutionCreate:
      description: |-
        Schema for creating a new execution (POST /executions).
        Excludes auto-generated fields: id, created_at, created_by (set by backend).
      properties:
        input_data:
          additionalProperties: true
          description: Input data for workflow execution
          title: Input Data
          type: object
        workflow_id:
          description: Workflow ID to execute
          format: uuid
          title: Workflow Id
          type: string
      required:
        - workflow_id
      title: ExecutionCreate
      type: object
    ExecutionRead:
      description: |-
        Schema for execution response (GET /executions/{id}).
        Includes all fields from the database table model.
      properties:
        activities:
          anyOf:
            - items:
                $ref: '#/components/schemas/ActivityData'
              type: array
            - type: 'null'
          description: List of activities with their current status. Only included when requested via ?include=activities query parameter.
          title: Activities
        completed_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Completed At
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          format: uuid
          title: Created By
          type: string
        current_activities:
          description: Currently executing activities
          items:
            $ref: '#/components/schemas/CurrentActivity'
          title: Current Activities
          type: array
        deleted_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          title: Deleted By
        error_details:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Details
        id:
          format: uuid
          title: Id
          type: string
        input_data:
          additionalProperties: true
          title: Input Data
          type: object
        labels:
          additionalProperties: true
          title: Labels
          type: object
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        temporal_workflow_id:
          title: Temporal Workflow Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          title: Updated By
        workflow_definition:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          description: Workflow definition from the executed version. Only included when requested via ?include=workflow_definition query parameter.
          title: Workflow Definition
        workflow_id:
          format: uuid
          title: Workflow Id
          type: string
        workflow_version_id:
          format: uuid
          title: Workflow Version Id
          type: string
      required:
        - id
        - workflow_id
        - workflow_version_id
        - temporal_workflow_id
        - status
        - created_by
        - created_at
        - completed_at
        - updated_at
        - updated_by
        - input_data
        - error_details
      title: ExecutionRead
      type: object
    ExecutionListResponse:
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for next page of results
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor for previous page of results
          title: Prev
        resources:
          items: {}
          title: Resources
          type: array
        total:
          anyOf:
            - minimum: 0.0
              type: integer
            - type: 'null'
          description: Total count of resources (only when include_total=true)
          title: Total
      required:
        - resources
      title: ExecutionListResponse
      type: object
    ActivityData:
      properties:
        activity_id:
          title: Activity Id
          type: string
        completed_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Completed At
        error_details:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Details
        started_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
      required:
        - activity_id
        - status
      title: ActivityData
      type: object
    CurrentActivity:
      description: Currently executing activity information.
      properties:
        activity_name:
          description: Name of the activity
          title: Activity Name
          type: string
        iteration:
          anyOf:
            - type: integer
            - type: 'null'
          description: Iteration number for loops
          title: Iteration
        temporal_activity_id:
          description: Temporal activity ID
          title: Temporal Activity Id
          type: string
      required:
        - activity_name
        - temporal_activity_id
      title: CurrentActivity
      type: object
    ExecutionStatus:
      type: string
      title: ExecutionStatus
      description: Current state of a workflow execution lifecycle
      enum:
        - pending
        - running
        - paused
        - completed
        - failed
        - cancelled
    ActivityExecution:
      allOf:
        - $ref: '#/components/schemas/BaseResource'
        - type: object
          title: Activity Execution
          description: Individual activity execution within a workflow with runtime state, retry tracking, and activity definition snapshot
          properties:
            execution_id:
              type: string
              format: uuid
              description: Parent execution ID
            activity_name:
              type: string
              description: Activity ID from workflow definition
            activity_definition:
              type: object
              description: Snapshot of the activity configuration from workflow definition at execution time, including executor, config, retry policy, timeout, approval settings
            temporal_activity_id:
              type: string
              description: Temporal activity execution ID
            status:
              type: string
              title: Activity Status
              description: Current state of an individual activity execution
              enum:
                - pending
                - running
                - completed
                - failed
                - retrying
                - skipped
                - cancelled
            started_at:
              type:
                - string
                - 'null'
              format: date-time
              description: When activity transitioned from pending to running status (null if still pending)
            completed_at:
              type:
                - string
                - 'null'
              format: date-time
              description: When activity reached terminal state (completed, failed)
            input_data:
              type: object
              description: Runtime input parameters
            output_data:
              type:
                - object
                - 'null'
              description: Activity results
            error_details:
              type:
                - string
                - 'null'
              description: Error information if failed
            retry_count:
              type: integer
              description: Number of retry attempts
            iteration:
              type:
                - integer
                - 'null'
              description: Iteration number if activity is within a loop (0-indexed)
    SignalResponse:
      type: object
      title: Signal Response
      description: Response confirming a signal was sent to a workflow
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - signal_sent
          description: Confirmation that the signal was successfully sent
        message:
          type: string
          description: Human-readable confirmation message
    ActivitySignalPayload:
      type: object
      title: Activity Signal Payload
      description: |
        Generic signal payload for sending arbitrary data to a specific activity
        within a running workflow execution.
      required:
        - signal_data
      properties:
        signal_data:
          type: object
          additionalProperties: true
          description: |
            Arbitrary JSON data to send to the activity. The structure depends
            on what the activity expects to receive.
          example:
            action: resume
            status: completed
            result:
              value: 42
    Workflow:
      allOf:
        - $ref: '#/components/schemas/NamedResource'
        - $ref: '#/components/schemas/SoftDeletableResource'
        - $ref: '#/components/schemas/UserOwnedResource'
        - type: object
          title: Workflow
          description: A complete automation process with versioned definitions, combining named resource, soft delete, and user ownership capabilities
          properties:
            current_version:
              type: integer
              description: Current active version number
            is_enabled:
              type: boolean
              description: Whether workflow is enabled and available for execution
    WorkflowWithVersion:
      allOf:
        - allOf:
            - $ref: '#/components/schemas/NamedResource'
            - $ref: '#/components/schemas/SoftDeletableResource'
            - $ref: '#/components/schemas/UserOwnedResource'
            - type: object
              title: Workflow
              description: A complete automation process with versioned definitions, combining named resource, soft delete, and user ownership capabilities
              properties:
                current_version:
                  type: integer
                  description: Current active version number
                is_enabled:
                  type: boolean
                  description: Whether workflow is enabled and available for execution
        - type: object
          title: Workflow With Version
          description: Workflow combined with a specific version's details including workflow definition (stored as JSON), schema version, and change history
          properties:
            version:
              type: object
              description: Specific version details
              properties:
                version:
                  type: integer
                schema_version:
                  type: string
                workflow_definition:
                  description: |
                    Workflow definition object. The full schema is defined in workflow-definition.schema.json (JSON Schema with recursive activity types). Accepts any valid JSON object.
                created_by:
                  type: string
                  format: uuid
                created_at:
                  type: string
                  format: date-time
                change_description:
                  type:
                    - string
                    - 'null'
    WorkflowVersionResponse:
      type: object
      title: Workflow Version Response
      description: Complete details of a specific workflow version including workflow definition. Note that deleted_at and deleted_by are always null since soft-deleted versions are excluded from queries.
      required:
        - id
        - workflow_id
        - version
        - schema_version
        - workflow_definition
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Version unique identifier
        workflow_id:
          type: string
          format: uuid
          description: Parent workflow ID
        version:
          type: integer
          description: Version number
        schema_version:
          type: string
          description: YAML schema version (e.g., "1.0.0")
        workflow_definition:
          description: |
            Workflow definition object. The full schema is defined in workflow-definition.schema.json (JSON Schema with recursive activity types). Accepts any valid JSON object.
        created_by:
          type: string
          format: uuid
          description: User who created this version
        created_at:
          type: string
          format: date-time
          description: Version creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        change_description:
          type:
            - string
            - 'null'
          description: Description of changes in this version
        deleted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Soft delete timestamp (always null in responses)
        deleted_by:
          type:
            - string
            - 'null'
          format: uuid
          description: User who soft deleted the version (always null in responses)
    WorkflowVersionListResponse:
      type: object
      title: WorkflowVersionListResponse
      description: List of workflow versions ordered by version number descending
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersionResponse'
          description: Array of workflow versions
    CreateWorkflowRequest:
      type: object
      title: Create Workflow Request
      description: Request payload for creating a new workflow from workflow definition
      required:
        - name
        - workflow_definition
      properties:
        name:
          type: string
        description:
          type: string
          maxLength: 2000
        workflow_definition:
          description: |
            Workflow definition object. The full schema is defined in workflow-definition.schema.json (JSON Schema with recursive activity types). Accepts any valid JSON object.
        is_enabled:
          type: boolean
          default: true
          description: Enable workflow for execution (defaults to true if not specified)
    PatchWorkflowRequest:
      type: object
      title: Patch Workflow Request
      description: |
        Request payload for updating workflow fields. Behavior depends on which fields are provided:
        - Metadata only (name, description, is_enabled, labels): Updates without creating new version
        - With workflow_definition: Validates workflow definition, compares with current version, and creates new WorkflowVersion only if definition differs (change detection)
        Note: WorkflowVersion entities are read-only and managed automatically by the system.
        API accepts JSON objects for workflow_definition field.
      properties:
        name:
          type: string
          description: Update workflow name (metadata only, no version created)
        description:
          type: string
          maxLength: 2000
          description: Update workflow description (metadata only, no version created)
        is_enabled:
          type: boolean
          description: Enable or disable workflow for execution (metadata only, no version created)
        labels:
          type: object
          additionalProperties:
            type: string
          description: Update workflow labels (metadata only, no version created)
        workflow_definition:
          description: |
            Workflow definition object. The full schema is defined in workflow-definition.schema.json (JSON Schema with recursive activity types). Accepts any valid JSON object.
        change_description:
          type: string
          description: Description of changes (used when creating new version via workflow_definition)
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
