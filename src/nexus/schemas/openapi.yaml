  /workflows:
    get:
      summary: List workflows
      description: |
        Retrieve a list of workflows with filtering, sorting, and cursor-based pagination.
      operationId: list_workflows
      tags:
        - workflows
      parameters:
        - name: created_by
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by creator user ID
        - name: is_enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of resources to return per page
          example: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor for pagination (from previous response)
          example: eyJpZCI6InV1aWQifQ
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to include total count in response (may impact performance)
          example: true
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Sort order for resources.
            - Ascending: `field` (e.g., `name`)
            - Descending: `-field` (e.g., `-created_at`)
          example: -created_at
        - name: name
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                description: Exact match of the name (case-insensitive). ?name=<name>
              - type: object
                properties:
                  contains:
                    title: Contains
                    description: Substring to match within the name (case-insensitive). ?name[contains]=<substring>
                    type: string
                  starts_with:
                    title: Starts With
                    description: Prefix to match at the start of the name (case-insensitive). ?name[starts_with]=<prefix>
                    type: string
                  eq:
                    title: Equals
                    description: Exact match of the name (case-insensitive). ?name[eq]=<name>
                    type: string
                  gt:
                    title: Greater Than
                    description: Greater than comparison (lexicographical). ?name[gt]=<name>
                    type: string
                  gte:
                    title: Greater Than Or Equal
                    description: Greater than or equal comparison (lexicographical). ?name[gte]=<name>
                    type: string
                  lt:
                    title: Less Than
                    description: Less than comparison (lexicographical). ?name[lt]=<name>
                    type: string
                  lte:
                    title: Less Than Or Equal
                    description: Less than or equal comparison (lexicographical). ?name[lte]=<name>
                    type: string
          description: |
            Filter resources by name.
            - Exact match: `name=value`
            - Contains: `name[contains]=value`
          example: auth
        - name: created_at
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                format: date-time
                description: Exact match of creation timestamp. ?created_at=<timestamp>
              - type: object
                properties:
                  eq:
                    title: Equals
                    description: Exact match of creation timestamp. ?created_at[eq]=<timestamp>
                    type: string
                    format: date-time
                  gt:
                    title: Greater Than
                    description: Greater than comparison. ?created_at[gt]=<timestamp>
                    type: string
                    format: date-time
                  gte:
                    title: Greater Than Or Equal
                    description: Greater than or equal comparison. ?created_at[gte]=<timestamp>
                    type: string
                    format: date-time
                  lt:
                    title: Less Than
                    description: Less than comparison. ?created_at[lt]=<timestamp>
                    type: string
                    format: date-time
                  lte:
                    title: Less Than Or Equal
                    description: Less than or equal comparison. ?created_at[lte]=<timestamp>
                    type: string
                    format: date-time
        - name: updated_at
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                format: date-time
                description: Exact match of last update timestamp. ?updated_at=<timestamp>
              - type: object
                properties:
                  eq:
                    title: Equals
                    description: Exact match of last update timestamp. ?updated_at[eq]=<timestamp>
                    type: string
                    format: date-time
                  gt:
                    title: Greater Than
                    description: Greater than comparison. ?updated_at[gt]=<timestamp>
                    type: string
                    format: date-time
                  gte:
                    title: Greater Than Or Equal
                    description: Greater than or equal comparison. ?updated_at[gte]=<timestamp>
                    type: string
                    format: date-time
                  lt:
                    title: Less Than
                    description: Less than comparison. ?updated_at[lt]=<timestamp>
                    type: string
                    format: date-time
                  lte:
                    title: Less Than Or Equal
                    description: Less than or equal comparison. ?updated_at[lte]=<timestamp>
                    type: string
                    format: date-time
        - name: labels
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
          description: |
            Filter resources by label key-value pairs.
            - Single label: `labels[environment]=production`
            - Multiple labels: `labels[environment]=production&labels[region]=us-east-1`
            All specified labels must match (AND logic).
          example:
            environment: production
            region: us-east-1
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResourcesResponseBase'
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/Workflow'
                        maxItems: 100
                    required:
                      - resources
    post:
      summary: Create workflow
      description: Create a new workflow entity with its initial version. The workflow definition is validated and stored as version 1.
      operationId: create_workflow
      tags:
        - workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid workflow definition
