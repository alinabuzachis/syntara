          example: eyJpZCI6InV1aWQifQ
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Sort order for resources.
            - Ascending: `field` (e.g., `name`)
            - Descending: `-field` (e.g., `-created_at`)
          example: -created_at
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to include total count in response (may impact performance)
          example: true
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category slug (e.g. `context_manager`)
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: Filter by group name (e.g. `Token limits`)
      responses:
        '200':
          description: Paginated list of runtime settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResourcesResponseBase'
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/RuntimeSettingRead'
                        maxItems: 100
                    required:
                      - resources
        '403':
          description: Insufficient permissions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
    patch:
      summary: Bulk update settings
      description: |
        Update multiple settings in a single request. Each update includes
        the setting key, new value, and expected version for optimistic locking.
        If any update fails, the entire batch is rolled back.
      operationId: bulk_update_settings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingBulkUpdateRequest'
      responses:
        '200':
          description: All settings updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeSettingRead'
        '404':
          description: Setting not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
