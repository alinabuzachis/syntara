openapi: 3.1.0
info:
  title: Nexus API
  version: 0.1.0
  description: A distributed multi-agent workflow orchestration system
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Approvals
    description: Human-in-the-loop approval request management
  - name: Authentication
    description: JWT token management and user identity
  - name: Group Role Assignments
    description: System-level group-to-role assignment management
  - name: Authorization
    description: Authorization debug and query endpoints
  - name: Policies
    description: Policy CRUD operations
  - name: Roles
    description: Role CRUD operations
  - name: User Role Assignments
    description: System-level user-to-role assignment management
  - name: Credentials
    description: Encrypted credential management
  - name: Credential Types
    description: Credential type schema definitions
  - name: example
    description: Example operations
  - name: Files
    description: File upload and management operations for agent context
  - name: Invocation
    description: Agent invocation operations
  - name: Interaction
    description: Interactive messaging with running agents
  - name: Control
    description: Process control (pause/cancel)
  - name: Projects
    description: Project CRUD operations
  - name: Project Workflows
    description: Project-scoped workflow listing
  - name: Project Approvals
    description: Project-scoped approval listing
  - name: Project Role Assignments
    description: User role assignments within a project
  - name: Project Group Role Assignments
    description: Group role assignments within a project
  - name: Settings
