paths:
  /approvals:
    get:
      summary: List approval requests
      description: |
        Retrieve a paginated list of approval requests with optional filtering.
        Use this endpoint to:
        - View pending approvals requiring action
        - Review historical approval decisions
        - Filter by execution, status, or date range
      operationId: list_approvals
      tags:
        - Approvals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of resources to return per page
          example: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor for pagination (from previous response)
          example: eyJpZCI6InV1aWQifQ
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Sort order for resources.
            - Ascending: `field` (e.g., `name`)
            - Descending: `-field` (e.g., `-created_at`)
          example: -created_at
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
          description: Filter by approval status
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by parent workflow execution ID
        - name: created_at
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                format: date-time
                description: Exact match of creation timestamp. ?created_at=<timestamp>
              - type: object
                properties:
                  eq:
                    title: Equals
                    description: Exact match of creation timestamp. ?created_at[eq]=<timestamp>
                    type: string
                    format: date-time
                  gt:
                    title: Greater Than
                    description: Greater than comparison. ?created_at[gt]=<timestamp>
                    type: string
                    format: date-time
                  gte:
                    title: Greater Than Or Equal
                    description: Greater than or equal comparison. ?created_at[gte]=<timestamp>
                    type: string
                    format: date-time
                  lt:
                    title: Less Than
                    description: Less than comparison. ?created_at[lt]=<timestamp>
                    type: string
                    format: date-time
                  lte:
                    title: Less Than Or Equal
                    description: Less than or equal comparison. ?created_at[lte]=<timestamp>
                    type: string
                    format: date-time
      responses:
        '200':
          description: Paginated list of approval requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResourcesResponseBase'
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApprovalRequest'
                        maxItems: 100
                    required:
                      - resources
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
    post:
      summary: Create approval request
      description: |
        Create a new approval request for a workflow execution.
        This is an internal endpoint called by the Workflows component when
        a workflow execution reaches an approval node. It should not be called
        directly by end users.
      operationId: create_approval
      tags:
        - Approvals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
      responses:
        '201':
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '409':
          description: Approval request already exists for this execution and approval node
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /approvals/{approval_id}:
    get:
      summary: Get approval request
      description: |
        Retrieve details of a specific approval request.
        The response includes:
        - Full request context (workflow inputs, completed step outputs)
        - Next steps for both approval and rejection paths
        - Decision history if already decided
      operationId: get_approval
      tags:
        - Approvals
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Approval request ID
      responses:
        '200':
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '404':
          description: Approval request not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
    patch:
      summary: Submit approval decision
      description: |
        Submit an approval decision (approve or reject).
        Only pending approval requests can be decided. Attempting to modify an approval
        that is already approved, rejected, expired, or cancelled will return an error.
        When a decision is submitted:
        1. The approval request status is updated
        2. The decided_by, decided_at, and decision_notes fields are populated
        3. A signal is sent to the workflow to resume execution on the appropriate path
      operationId: decide_approval
      tags:
        - Approvals
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Approval request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Approval decision recorded and workflow resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '400':
          description: Invalid request payload (e.g., invalid status value)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '404':
          description: Approval request not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '409':
          description: Approval already decided or workflow cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /approvals/batch:
    post:
      summary: Batch approve/reject multiple requests
      description: |
        Submit decisions for multiple approval requests at once.
        This endpoint processes each decision independently. If some decisions fail,
        the successful ones are still recorded. The response includes detailed results
        for each decision.
        Use cases:
        - Approving multiple related requests at once
        - Bulk rejection of stale or irrelevant requests
      operationId: batch_decide_approvals
      tags:
        - Approvals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchApprovalRequest'
      responses:
        '200':
          description: Batch processing complete (may include partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchApprovalResponse'
        '400':
          description: Invalid request format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /login:
    post:
      summary: Login with username and password
      description: |
        Authenticate with a username and password to receive a JWT access token.
        On success the response body contains an access token and the
        `ao_refresh_token` HttpOnly cookie is set.
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /refresh:
    post:
      summary: Refresh access token
      description: |
        Exchange a valid refresh token for a new access token.
        The refresh token is read from the `ao_refresh_token` HttpOnly cookie.
        It is not rotated — the same refresh token remains valid for its entire
        lifetime (default 8 hours from login). The cookie is re-set on every
        successful refresh so the `max-age` counter restarts.
      operationId: refresh_token
      tags:
        - Authentication
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /logout:
    post:
      summary: Terminate session
      description: |
        Terminate the current session by revoking the refresh token.
        The refresh token is read from the `ao_refresh_token` HttpOnly cookie
        and revoked in the session store. The cookie is cleared in the response.
      operationId: logout
      tags:
        - Authentication
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Successfully logged out
        '401':
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /me:
    get:
      summary: Get current user
      description: |
        Returns information about the currently authenticated user
        from the access token claims. No database round-trip is performed.
      operationId: get_current_user
      tags:
        - Authentication
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Invalid or missing authentication
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
  /providers:
    get:
      summary: List enabled identity providers
      description: |
        Returns a list of enabled identity providers for the login page.
        This is a public endpoint that does not require authentication.
        Only returns provider id, name, and type — no secrets or configuration details.
      operationId: list_auth_providers
      tags:
        - Authentication
      responses:
        '200':
          description: List of enabled identity providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /group-role-assignments:
    post:
      summary: Assign a role to a group
      description: |
        Assign a role to a group at the system level.
        All members of the group will inherit this role.
        Requires: admin permission.
      operationId: assign_group_role
      tags:
        - Group Role Assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRoleAssignmentCreate'
      responses:
        '201':
          description: Role assigned to group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRoleAssignmentRead'
        '404':
          description: Group or role not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '409':
          description: Assignment already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorData'
