    CredentialCreate:
      type: object
      title: Credential Create
      description: Request payload for creating a new Credential
      required:
        - name
        - credential_type_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable Credential name
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional description
        credential_type_id:
          type: string
          format: uuid
          description: ID of the Credential type
        inputs:
          type: object
          additionalProperties: true
          default: {}
          description: |
            Field values validated against the type schema. Max 64KB serialized.
            The $encrypted$ sentinel value is reserved and cannot be used as input (returns 422).
        labels:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Key-value labels
    CredentialRead:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          title: Credential
          description: |
            A named, encrypted credential instance. Secret fields are masked
            as $encrypted$ in responses. Non-secret fields are decrypted.
          required:
            - credential_type_id
            - inputs
            - enabled
          properties:
            credential_type_id:
              type: string
              format: uuid
              description: ID of the Credential type schema
            inputs:
              type: object
              additionalProperties: true
              description: Secret fields masked as $encrypted$, non-secret fields in plaintext
            enabled:
              type: boolean
              default: true
              description: Whether this credential is active
    CredentialPatch:
      type: object
      title: Credential Patch
      description: |
        Request payload for partially updating a Credential.
        Only included fields are updated. Omitted fields are preserved.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
        inputs:
          type: object
          additionalProperties: true
          description: |
            Fields set to $encrypted$ retain existing values. Omitted fields are preserved.
            Max 64KB serialized. The $encrypted$ sentinel cannot be used as input on create (returns 422).
        labels:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
    CredentialTypeRead:
      allOf:
        - $ref: '#/components/schemas/BaseResource'
        - type: object
          title: Credential Type
          description: |
            Defines the field schema and consumption mapping for a class of credentials.
            Managed types are preseeded by the system and cannot be deleted.
          required:
            - name
            - inputs
            - injectors
            - managed
          properties:
            name:
              type: string
              description: Human-readable type name
            description:
              type: string
              nullable: true
              description: Optional description
            inputs:
              type: object
              description: |
                Field schema with fields array and required list.
                Max 64KB serialized. Defines what fields a credential of this type has.
            injectors:
              type: object
              description: |
                Consumption mapping with extra_vars, env, file templates.
                Uses {{field_id}} syntax for template substitution at runtime.
            managed:
              type: boolean
              description: true = preseeded system type that cannot be deleted
            credential_count:
              type: integer
              default: 0
              description: Number of non-deleted credentials using this type
