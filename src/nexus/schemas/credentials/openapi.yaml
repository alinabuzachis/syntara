---
openapi: 3.0.3
info:
  title: Nexus Credentials API
  description: |
    REST API for managing Credentials and Credential Types.

    Credentials are encrypted authentication resources used by workflows,
    chat, and agentic orchestration. Each credential references a Credential
    Type that defines its field schema and injection patterns.

    ## Key Features
    - CRUD operations for Credentials with AES-256-GCM encryption at rest
    - Read-only access to preseeded Credential Types (GA)
    - Secret field masking ($encrypted$) in API responses
    - Partial updates with $encrypted$ sentinel preservation
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Credentials
    description: Encrypted credential management
  - name: Credential Types
    description: Credential type schema definitions

paths:
  /credentials:
    get:
      summary: List Credentials
      description: |
        Retrieve a paginated list of Credentials with optional filtering.
        Secret fields are masked as $encrypted$ without decryption.
      operationId: list_credentials
      tags:
        - Credentials
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam"
        - name: credential_type_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by Credential type ID
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
      responses:
        "200":
          description: Paginated list of Credentials (metadata only, no secret values)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialRead"
                        maxItems: 100
                    required:
                      - resources

    post:
      summary: Create Credential
      description: |
        Create a new Credential. Inputs are validated against the Credential
        type schema and encrypted before storage.
      operationId: create_credential
      tags:
        - Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: Credential created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "404":
          description: Credential type not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Credential name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "422":
          description: Input validation error (unknown fields, missing required fields, $encrypted$ as input, payload > 64KB)
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

  /credentials/{credential_id}:
    get:
      summary: Get Credential
      description: |
        Retrieve a single Credential. Secret fields are masked as $encrypted$.
        Non-secret fields are decrypted and returned in plaintext.
      operationId: get_credential
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        "200":
          description: Credential with secret fields masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    patch:
      summary: Update Credential
      description: |
        Partially update a Credential. Fields set to $encrypted$ retain
        their existing encrypted values. Omitted input fields are preserved.
      operationId: update_credential
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPatch"
      responses:
        "200":
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "422":
          description: Input validation error (unknown fields, missing required fields, $encrypted$ as input, payload > 64KB)
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    delete:
      summary: Delete Credential
      description: Soft-delete a Credential (sets deleted_at timestamp).
      operationId: delete_credential
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        "204":
          description: Credential deleted
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

  /credentials/{credential_id}/workflows:
    get:
      summary: Get Credential Workflows
      description: |
        List workflows that reference this credential in their definitions.
        Returns empty list until workflow credential integration (Epic 3) adds
        credentialId to executor configs.
      operationId: get_credential_workflows
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        "200":
          description: List of workflows referencing this credential
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialWorkflowRef"
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

  /credential_types:
    get:
      summary: List Credential Types
      description: |
        Retrieve all Credential types including preseeded managed types.
        Read-only for GA; full CRUD for custom types deferred to post-GA.
      operationId: list_credential_types
      tags:
        - Credential Types
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        "200":
          description: Paginated list of Credential types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialTypeRead"
                        maxItems: 100
                    required:
                      - resources

  /credential_types/{credential_type_id}:
    get:
      summary: Get Credential Type
      description: |
        Retrieve a single Credential type with its field schema and
        injector templates.
      operationId: get_credential_type
      tags:
        - Credential Types
      parameters:
        - name: credential_type_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential type ID
      responses:
        "200":
          description: Credential type detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTypeRead"
        "404":
          description: Credential type not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

components:
  schemas:
    CredentialCreate:
      type: object
      title: Credential Create
      description: Request payload for creating a new Credential
      required:
        - name
        - credential_type_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable Credential name
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional description
        credential_type_id:
          type: string
          format: uuid
          description: ID of the Credential type
        inputs:
          type: object
          additionalProperties: true
          default: {}
          description: |
            Field values validated against the type schema. Max 64KB serialized.
            The $encrypted$ sentinel value is reserved and cannot be used as input (returns 422).
        labels:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Key-value labels

    CredentialRead:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/Resource"
        - type: object
          title: Credential
          description: |
            A named, encrypted credential instance. Secret fields are masked
            as $encrypted$ in responses. Non-secret fields are decrypted.
          required:
            - credential_type_id
            - inputs
            - enabled
          properties:
            credential_type_id:
              type: string
              format: uuid
              description: ID of the Credential type schema
            inputs:
              type: object
              additionalProperties: true
              description: Secret fields masked as $encrypted$, non-secret fields in plaintext
            enabled:
              type: boolean
              default: true
              description: Whether this credential is active

    CredentialPatch:
      type: object
      title: Credential Patch
      description: |
        Request payload for partially updating a Credential.
        Only included fields are updated. Omitted fields are preserved.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
        inputs:
          type: object
          additionalProperties: true
          description: |
            Fields set to $encrypted$ retain existing values. Omitted fields are preserved.
            Max 64KB serialized. The $encrypted$ sentinel cannot be used as input on create (returns 422).
        labels:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean

    CredentialTypeRead:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: Credential Type
          description: |
            Defines the field schema and consumption mapping for a class of credentials.
            Managed types are preseeded by the system and cannot be deleted.
          required:
            - name
            - inputs
            - injectors
            - managed
          properties:
            name:
              type: string
              description: Human-readable type name
            description:
              type: string
              nullable: true
              description: Optional description
            inputs:
              type: object
              description: |
                Field schema with fields array and required list.
                Max 64KB serialized. Defines what fields a credential of this type has.
            injectors:
              type: object
              description: |
                Consumption mapping with extra_vars, env, file templates.
                Uses {{field_id}} syntax for template substitution at runtime.
            managed:
              type: boolean
              description: true = preseeded system type that cannot be deleted
            credential_count:
              type: integer
              default: 0
              description: Number of non-deleted credentials using this type

    CredentialWorkflowRef:
      type: object
      title: Credential Workflow Reference
      description: Lightweight reference to a workflow that uses a credential
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Workflow ID
        name:
          type: string
          description: Workflow name

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
