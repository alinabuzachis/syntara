---
openapi: 3.1.0
info:
  title: Nexus Credentials API
  description: |
    REST API for managing Credentials and Credential Types.

    Credentials are encrypted authentication resources used by workflows,
    chat, and agentic orchestration. Each credential references a Credential
    Type that defines its field schema and injection patterns.

    ## Key Features
    - CRUD operations for Credentials with AES-256-GCM encryption at rest
    - Read-only access to preseeded Credential Types (GA)
    - Secret field masking ($encrypted$) in API responses
    - Partial updates with $encrypted$ sentinel preservation
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Credentials
    description: Encrypted credential management
  - name: Credential Types
    description: Credential type schema definitions

paths:
  /credentials:
    get:
      summary: List Credentials
      description: |-
        List Credentials with filtering and pagination. Metadata only, no secrets.
      operationId: list_credentials
      tags:
        - Credentials
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam"
        - name: credential_type_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by Credential type ID
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
      responses:
        "200":
          description: Paginated list of Credentials (metadata only, no secret values)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialRead"
                        maxItems: 100
                    required:
                      - resources

      security:
        - bearerAuth: []
    post:
      summary: Create Credential
      description: |-
        Create a new Credential with encrypted inputs.
      operationId: create_credential
      tags:
        - Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: Credential created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "404":
          description: Credential type not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Credential name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "422":
          description: Input validation error (unknown fields, missing required fields, $encrypted$ as input, payload > 64KB)
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
  /credentials/{credential_id}:
    get:
      summary: Get Credential
      description: |-
        Get a Credential. Secret fields masked as $encrypted$.
      operationId: get_credential
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        "200":
          description: Credential with secret fields masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    patch:
      summary: Update Credential
      description: |-
        Update a Credential. Fields set to $encrypted$ retain existing values.
      operationId: update_credential
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPatch"
      responses:
        "200":
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "422":
          description: Input validation error (unknown fields, missing required fields, $encrypted$ as input, payload > 64KB)
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    delete:
      summary: Delete Credential
      description: Soft-delete a Credential.
      operationId: delete_credential
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        "204":
          description: Credential deleted
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
  /credentials/{credential_id}/workflows:
    get:
      summary: Get Credential Workflows
      description: |-
        Get workflows that reference this credential.

        Returns empty list until Epic 3 adds credentialId to executor configs.
      operationId: get_credential_workflows
      tags:
        - Credentials
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        "200":
          description: List of workflows referencing this credential
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialWorkflowRef"
        "404":
          description: Credential not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
  /credential_types:
    get:
      summary: List Credential Types
      description: |-
        List all Credential Types including preseeded managed types.

        Each type includes a credential_count of non-deleted credentials using it.
      operationId: list_credential_types
      tags:
        - Credential Types
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        "200":
          description: Paginated list of Credential types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialTypeRead"
                        maxItems: 100
                    required:
                      - resources

      security:
        - bearerAuth: []
  /credential_types/{credential_type_id}:
    get:
      summary: Get Credential Type
      description: |-
        Get a single Credential Type with credential_count.
      operationId: get_credential_type
      tags:
        - Credential Types
      parameters:
        - name: credential_type_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Credential type ID
      responses:
        "200":
          description: Credential type detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTypeRead"
        "404":
          description: Credential type not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
components:
  schemas:
    CredentialListResponse:
      type: object
      title: CredentialListResponse
      description: Paginated list response for credentials.
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: "null"
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: "null"
          title: Prev
          description: Cursor for previous page of results
        resources:
          type: array
          items: {}
          title: Resources
          description: Array of resources in current page
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: "null"
          title: Total
          description: Total count of resources (only when include_total=true)

    CredentialTypeListResponse:
      type: object
      title: CredentialTypeListResponse
      description: Paginated list response for credential types.
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: "null"
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: "null"
          title: Prev
          description: Cursor for previous page of results
        resources:
          type: array
          items: {}
          title: Resources
          description: Array of resources in current page
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: "null"
          title: Total
          description: Total count of resources (only when include_total=true)

    CredentialCreate:
      description: Schema for creating a new credential.
      properties:
        credential_type_id:
          description: ID of the credential type
          format: uuid
          title: Credential Type Id
          type: string
        description:
          anyOf:
            - maxLength: 2000
              type: string
            - type: "null"
          description: Optional description
          title: Description
        inputs:
          additionalProperties: true
          description: Field values validated against type schema
          title: Inputs
          type: object
        labels:
          additionalProperties:
            type: string
          description: Key-value labels
          title: Labels
          type: object
        name:
          description: Human-readable credential name
          maxLength: 255
          minLength: 1
          title: Name
          type: string
      required:
        - name
        - credential_type_id
      title: CredentialCreate
      type: object

    CredentialPatch:
      description: Schema for partially updating a credential. $encrypted$ preserves existing values.
      properties:
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
          title: Enabled
        inputs:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Inputs
        labels:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: "null"
          title: Labels
        name:
          anyOf:
            - maxLength: 255
              minLength: 1
              type: string
            - type: "null"
          title: Name
      title: CredentialPatch
      type: object

    CredentialRead:
      description: Schema for credential API responses. Secret fields masked as $encrypted$.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
            - type: string
            - format: uuid
              type: string
            - type: "null"
          description: Username or UUID of the credential creator
          title: Created By
        credential_type_id:
          format: uuid
          title: Credential Type Id
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        enabled:
          default: true
          title: Enabled
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        inputs:
          additionalProperties: true
          title: Inputs
          type: object
        labels:
          additionalProperties:
            type: string
          title: Labels
          type: object
        name:
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          anyOf:
            - type: string
            - format: uuid
              type: string
            - type: "null"
          description: Username or UUID of the last modifier
          title: Updated By
        workflow_count:
          default: 0
          description: Number of workflows referencing this credential
          title: Workflow Count
          type: integer
      required:
        - id
        - name
        - credential_type_id
        - created_at
        - updated_at
      title: CredentialRead
      type: object

    CredentialTypeRead:
      description: Read schema for credential type API responses.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        credential_count:
          default: 0
          description: Number of non-deleted credentials using this type
          title: Credential Count
          type: integer
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        injectors:
          additionalProperties: true
          title: Injectors
          type: object
        inputs:
          additionalProperties: true
          title: Inputs
          type: object
        managed:
          default: false
          title: Managed
          type: boolean
        name:
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
        - id
        - name
        - created_at
        - updated_at
      title: CredentialTypeRead
      type: object

    CredentialWorkflowRef:
      description: Reference to a workflow that uses a credential.
      properties:
        created_by:
          anyOf:
            - type: string
            - format: uuid
              type: string
            - type: "null"
          description: Username or UUID of the workflow creator
          title: Created By
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        last_execution_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          description: Timestamp of the most recent execution
          title: Last Execution At
        last_execution_status:
          anyOf:
            - type: string
            - type: "null"
          description: Status of the most recent execution
          title: Last Execution Status
        name:
          title: Name
          type: string
        node_names:
          description: Names of nodes using this credential
          items:
            type: string
          title: Node Names
          type: array
      required:
        - id
        - name
      title: CredentialWorkflowRef
      type: object

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
