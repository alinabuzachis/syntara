---
openapi: 3.0.3
info:
  title: Nexus Metrics API
  version: 1.0.0
  description: |
    REST API for querying raw performance metrics from Nexus.

    Nexus records and exposes raw metric data. KPI calculations (p95,
    averages, aggregations) are performed by external performance tests,
    not by Nexus itself.

    ## Endpoints
    - **GET /metrics** – query raw metrics with filtering and pagination
    - **GET /metrics/summary** – quick summary of metric counts
    - **GET /metrics/openmetrics** – OpenMetrics scrape target

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: metrics
    description: Performance metrics recording and exposure

paths:
  /metrics:
    get:
      summary: Query raw metrics
      description: |
        Query raw metrics with optional filtering by category, time range,
        and labels.  Returns individual metric records for analysis by
        external performance tests.

        Uses cursor-based pagination.
      operationId: query_metrics
      tags:
        - metrics
      parameters:
        - name: category
          in: query
          required: false
          description: Filter by metric category
          schema:
            type: string
            enum:
              - llm
              - cache
              - workflow
              - agent
              - error
              - all
            default: all
        - name: start_time
          in: query
          required: false
          description: Start of time range (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          description: End of time range (ISO 8601)
          schema:
            type: string
            format: date-time
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        "200":
          description: Paginated list of metric records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: "#/components/schemas/MetricRecord"
                        maxItems: 100
                    required:
                      - resources
        "400":
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

  /metrics/summary:
    get:
      summary: Get metrics summary
      description: |
        Return a quick summary of metric counts and rates.
        Useful for health-check dashboards and monitoring.
      operationId: get_metrics_summary
      tags:
        - metrics
      responses:
        "200":
          description: Metrics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"

  /metrics/openmetrics:
    get:
      summary: OpenMetrics scrape endpoint
      description: |
        Returns metrics in the text-based OpenMetrics exposition format
        for scraping by Prometheus, Grafana Agent, or compatible collectors.
      operationId: openmetrics_endpoint
      tags:
        - metrics
      responses:
        "200":
          description: OpenMetrics text format metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP nexus_requests_total Total number of requests processed
                  # TYPE nexus_requests_total counter
                  nexus_requests_total{status="success",endpoint="/api/v1/chat"} 1234

components:
  schemas:
    MetricRecord:
      type: object
      title: Metric Record
      description: Individual metric data point recorded by Nexus
      required:
        - id
        - created_at
        - metric_type
        - value
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the metric record
        created_at:
          type: string
          format: date-time
          description: UTC timestamp when the metric was recorded
        labels:
          type: object
          default: {}
          description: Key-value pairs for filtering and grouping
          additionalProperties:
            type: string
        metric_type:
          type: string
          description: Metric type/category
          enum:
            - llm_duration_ms
            - llm_tokens_input
            - llm_tokens_output
            - llm_ttft_ms
            - llm_status
            - cache_hit
            - cache_miss
            - cache_lookup_ms
            - cache_utilization_ratio
            - workflow_duration_ms
            - workflow_status
            - activity_duration_ms
            - agent_routing_ms
            - agent_invocation_ms
            - agent_status
            - request_duration_ms
            - component_duration_ms
            - error
        value:
          type: number
          description: Metric value (duration in ms, count, or ratio)
        unit:
          type: string
          description: Unit of measurement
          default: ""

    MetricsSummary:
      type: object
      title: Metrics Summary
      description: Quick summary of metric counts
      required:
        - total_requests
        - total_errors
        - cache_hits
        - cache_misses
        - llm_calls
        - total_workflows
        - active_workflows
        - period_start
        - period_end
      properties:
        total_requests:
          type: integer
          minimum: 0
          description: Total requests recorded
        total_errors:
          type: integer
          minimum: 0
          description: Total errors recorded
        cache_hits:
          type: integer
          minimum: 0
          description: Cache hit count
        cache_misses:
          type: integer
          minimum: 0
          description: Cache miss count
        llm_calls:
          type: integer
          minimum: 0
          description: Total LLM API calls
        total_workflows:
          type: integer
          minimum: 0
          description: Total workflow executions started
        active_workflows:
          type: integer
          minimum: 0
          description: Currently active workflows
        period_start:
          type: string
          format: date-time
          description: Start of metrics retention period
        period_end:
          type: string
          format: date-time
          description: End of metrics period (now)
