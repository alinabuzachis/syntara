components:
  schemas:
    AAPOrganization:
      type: object
      title: AAPOrganization
      description: AAP organization resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPJobTemplate:
      type: object
      title: AAPJobTemplate
      description: AAP job template resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPJobTemplateDetail:
      type: object
      title: AAPJobTemplateDetail
      description: AAP job template with prompt-on-launch capabilities.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        url:
          anyOf:
            - type: string
            - type: "null"
          title: Url
          description: Link to the job template in AAP Controller UI
        ask_job_type_on_launch:
          type: boolean
          default: false
        ask_inventory_on_launch:
          type: boolean
          default: false
        ask_credential_on_launch:
          type: boolean
          default: false
        ask_variables_on_launch:
          type: boolean
          default: false
        ask_limit_on_launch:
          type: boolean
          default: false
        ask_tags_on_launch:
          type: boolean
          default: false
        ask_skip_tags_on_launch:
          type: boolean
          default: false
        ask_verbosity_on_launch:
          type: boolean
          default: false
        ask_diff_mode_on_launch:
          type: boolean
          default: false
        ask_forks_on_launch:
          type: boolean
          default: false
        ask_job_slice_count_on_launch:
          type: boolean
          default: false
        ask_execution_environment_on_launch:
          type: boolean
          default: false
        ask_instance_groups_on_launch:
          type: boolean
          default: false
        ask_labels_on_launch:
          type: boolean
          default: false
        ask_timeout_on_launch:
          type: boolean
          default: false
        ask_scm_branch_on_launch:
          type: boolean
          default: false
        survey_enabled:
          type: boolean
          default: false

    AAPInventory:
      type: object
      title: AAPInventory
      description: AAP inventory resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPExecutionEnvironment:
      type: object
      title: AAPExecutionEnvironment
      description: AAP execution environment resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPCredential:
      type: object
      title: AAPCredential
      description: AAP credential resource (description omitted to avoid leaking infrastructure details).
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPInstanceGroup:
      type: object
      title: AAPInstanceGroup
      description: AAP instance group resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPListResponse_AAPOrganization_:
      type: object
      title: "AAPListResponse[AAPOrganization]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          maxItems: 200
          items:
            $ref: "#/components/schemas/AAPOrganization"

    AAPListResponse_AAPJobTemplate_:
      type: object
      title: "AAPListResponse[AAPJobTemplate]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          maxItems: 200
          items:
            $ref: "#/components/schemas/AAPJobTemplate"

    AAPListResponse_AAPInventory_:
