components:
  schemas:
    AAPOrganization:
      type: object
      title: AAPOrganization
      description: AAP organization resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPJobTemplate:
      type: object
      title: AAPJobTemplate
      description: AAP job template resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPJobTemplateDetail:
      type: object
      title: AAPJobTemplateDetail
      description: AAP job template with prompt-on-launch capabilities.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        url:
          anyOf:
            - type: string
            - type: "null"
          title: Url
          description: Link to the job template in AAP Controller UI
        ask_job_type_on_launch:
          type: boolean
          default: false
          title: Ask Job Type On Launch
        ask_inventory_on_launch:
          type: boolean
          default: false
          title: Ask Inventory On Launch
        ask_credential_on_launch:
          type: boolean
          default: false
          title: Ask Credential On Launch
        ask_variables_on_launch:
          type: boolean
          default: false
          title: Ask Variables On Launch
        ask_limit_on_launch:
          type: boolean
          default: false
          title: Ask Limit On Launch
        ask_tags_on_launch:
          type: boolean
          default: false
          title: Ask Tags On Launch
        ask_skip_tags_on_launch:
          type: boolean
          default: false
          title: Ask Skip Tags On Launch
        ask_verbosity_on_launch:
          type: boolean
          default: false
          title: Ask Verbosity On Launch
        ask_diff_mode_on_launch:
          type: boolean
          default: false
          title: Ask Diff Mode On Launch
        ask_forks_on_launch:
          type: boolean
          default: false
          title: Ask Forks On Launch
        ask_job_slice_count_on_launch:
          type: boolean
          default: false
          title: Ask Job Slice Count On Launch
        ask_execution_environment_on_launch:
          type: boolean
          default: false
          title: Ask Execution Environment On Launch
        ask_instance_groups_on_launch:
          type: boolean
          default: false
          title: Ask Instance Groups On Launch
        ask_labels_on_launch:
          type: boolean
          default: false
          title: Ask Labels On Launch
        ask_timeout_on_launch:
          type: boolean
          default: false
          title: Ask Timeout On Launch
        ask_scm_branch_on_launch:
          type: boolean
          default: false
          title: Ask Scm Branch On Launch
        survey_enabled:
          type: boolean
          default: false
          title: Survey Enabled

    AAPInventory:
      type: object
      title: AAPInventory
      description: AAP inventory resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPExecutionEnvironment:
      type: object
      title: AAPExecutionEnvironment
      description: AAP execution environment resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPCredential:
      type: object
      title: AAPCredential
      description: |-
        AAP credential resource.

        Only ``id`` and ``name`` are exposed — descriptions are omitted to avoid
        leaking infrastructure details (e.g. "prod-aws-root-key") to all users.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPInstanceGroup:
      type: object
      title: AAPInstanceGroup
      description: AAP instance group resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPListResponse_AAPOrganization_:
      type: object
      title: "AAPListResponse[AAPOrganization]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/AAPOrganization"

    AAPListResponse_AAPJobTemplate_:
      type: object
      title: "AAPListResponse[AAPJobTemplate]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/AAPJobTemplate"

    AAPListResponse_AAPInventory_:
      type: object
      title: "AAPListResponse[AAPInventory]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/AAPInventory"

    AAPListResponse_AAPExecutionEnvironment_:
      type: object
      title: "AAPListResponse[AAPExecutionEnvironment]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/AAPExecutionEnvironment"

    AAPListResponse_AAPCredential_:
      type: object
      title: "AAPListResponse[AAPCredential]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/AAPCredential"

    AAPListResponse_AAPInstanceGroup_:
      type: object
      title: "AAPListResponse[AAPInstanceGroup]"
      required:
        - count
        - results
      properties:
        count:
          type: integer
          title: Count
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/AAPInstanceGroup"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
