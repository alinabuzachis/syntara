              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - in: query
          name: credential_id
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Credential Id
          description: |
            Optional Nexus credential ID for AAP Controller authentication.
            If provided, the credential is decrypted and used instead of environment variables.
            Credential must be of type "Ansible Automation Platform".
        - in: query
          name: organization
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Organization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPListResponse_AAPJobTemplate_"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      security:
        - bearerAuth: []

  /aap/job-templates/{job_template_id}:
    get:
      summary: Get Job Template
      description: Get AAP job template details including prompt-on-launch capabilities.
      operationId: get_aap_job_template
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: path
          name: job_template_id
          required: true
          schema:
            type: integer
            minimum: 1
            title: Job Template Id
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - in: query
          name: credential_id
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Credential Id
          description: |
            Optional Nexus credential ID for AAP Controller authentication.
            If provided, the credential is decrypted and used instead of environment variables.
            Credential must be of type "Ansible Automation Platform".
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPJobTemplateDetail"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      security:
        - bearerAuth: []

  /aap/inventories:
    get:
      summary: List Inventories
      description: List AAP inventories, optionally filtered by organization.
      operationId: list_aap_inventories
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - in: query
          name: credential_id
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Credential Id
          description: |
            Optional Nexus credential ID for AAP Controller authentication.
            If provided, the credential is decrypted and used instead of environment variables.
            Credential must be of type "Ansible Automation Platform".
        - in: query
          name: organization
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Organization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPListResponse_AAPInventory_"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      security:
        - bearerAuth: []

  /aap/execution-environments:
    get:
      summary: List Execution Environments
      description: List AAP execution environments, optionally filtered by organization.
      operationId: list_aap_execution_environments
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - in: query
          name: credential_id
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Credential Id
          description: |
            Optional Nexus credential ID for AAP Controller authentication.
            If provided, the credential is decrypted and used instead of environment variables.
            Credential must be of type "Ansible Automation Platform".
        - in: query
          name: organization
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Organization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPListResponse_AAPExecutionEnvironment_"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      security:
        - bearerAuth: []

  /aap/credentials:
    get:
      summary: List Credentials
      description: List AAP credentials (not organization-scoped).
      operationId: list_aap_credentials
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
