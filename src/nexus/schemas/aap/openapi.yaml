---
openapi: 3.1.0
info:
  title: Nexus AAP Proxy API
  version: 1.0.0
  description: |
    Backend-for-Frontend proxy that forwards requests to a configured
    AAP (Ansible Automation Platform) Controller instance.

    Enables the workflow-builder UI to browse AAP resources
    (organizations, job templates, inventories) via cascading dropdowns
    without direct AAP Controller access.

    Authentication to the AAP Controller is resolved server-side from
    environment variables (`APP_AAP_BASE_URL`, `APP_AAP_TOKEN`).

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: aap
    description: Ansible Automation Platform resource proxy

paths:
  /aap/organizations:
    get:
      summary: List Organizations
      description: List AAP organizations.
      operationId: list_organizations_aap_organizations_get
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - in: query
          name: credential_id
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Credential ID
          description: |
            Optional Nexus credential ID for AAP Controller authentication.
            If provided, the credential is decrypted and used instead of environment variables.
            Credential must be of type "Ansible Automation Platform".
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPListResponse_AAPOrganization_"
        "502":
          description: AAP connection, authentication, or upstream error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                connection_error:
                  summary: Connection timeout
                  value:
                    type: "https://api.nexus.com/errors/provider-error"
                    title: "AAP Connection Error"
                    detail: "Failed to connect to AAP Controller"
                    code: "AAP_CONNECTION_ERROR"
                    retryable: true
                auth_error:
                  summary: Authentication failed
                  value:
                    type: "https://api.nexus.com/errors/provider-error"
                    title: "AAP Authentication Failed"
                    detail: "AAP Controller authentication failed"
                    code: "AAP_AUTHENTICATION_ERROR"
                    retryable: false
                upstream_error:
                  summary: AAP upstream error
                  value:
                    type: "https://api.nexus.com/errors/provider-error"
                    title: "AAP Upstream Error"
                    detail: "AAP Controller returned an error"
                    code: "AAP_UPSTREAM_ERROR"
                    retryable: true
        "503":
          description: AAP Controller not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://api.nexus.com/errors/service-unavailable"
                title: "AAP Controller Not Configured"
                detail: "AAP Controller connection is not configured"
                code: "AAP_NOT_CONFIGURED"
                retryable: false
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - bearerAuth: []

