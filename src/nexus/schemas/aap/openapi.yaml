---
openapi: 3.1.0
info:
  title: Nexus AAP Proxy API
  version: 1.0.0
  description: |
    Backend-for-Frontend proxy that forwards requests to a configured
    AAP (Ansible Automation Platform) Controller instance.

    Enables the workflow-builder UI to browse AAP resources
    (organizations, job templates, inventories) via cascading dropdowns
    without direct AAP Controller access.

    Authentication to the AAP Controller is resolved server-side from
    environment variables (`APP_AAP_BASE_URL`, `APP_AAP_TOKEN`).

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: aap
    description: Ansible Automation Platform resource proxy

paths:
  /aap/organizations:
    get:
      summary: List Organizations
      description: List AAP organizations.
      operationId: list_aap_organizations
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - in: query
          name: credential_id
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Credential Id
          description: |
            Optional Nexus credential ID for AAP Controller authentication.
            If provided, the credential is decrypted and used instead of environment variables.
            Credential must be of type "Ansible Automation Platform".
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPListResponse_AAPOrganization_"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      security:
        - bearerAuth: []

  /aap/job-templates:
    get:
      summary: List Job Templates
      description: List AAP job templates, optionally filtered by organization.
      operationId: list_aap_job_templates
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
