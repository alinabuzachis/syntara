      operationId: list_aap_instance_groups
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - aap
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
