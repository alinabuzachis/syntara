---
openapi: 3.1.0
info:
  title: Workflow Engine API
  description: |
    API for managing dynamic workflows with agentic and non-agentic tasks.

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    └── NamedResource (+ name, description)
        └── Workflow (+ SoftDeletableResource + UserOwnedResource)
            └── WorkflowWithVersion (+ version details)

    SoftDeletableResource (deleted_at, deleted_by)
    UserOwnedResource (created_by)
    ```

    Note: Approval resources are in a separate API. See `/api/v1/approvals`.

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints
  version: 1.0.0
  contact:
    name: Automation Nexus Team

servers:
  - url: /api/v1
    description: API server (relative path)

paths:
  /workflows:
    get:
      summary: List Workflows
      description: |-
        List workflows the current user has read access to.

        Supports filtering using query parameters with standard operators:
        - created_by: Filter by creator user ID (created_by=uuid)
        - is_enabled: Filter by enabled status (is_enabled=true|false)
        - labels: Filter by labels using bracket notation (labels[environment]=production)

        Uses cursor-based pagination for scalability and consistency.
      operationId: list_workflows
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
    post:
      summary: Create Workflow
      description: Create a new workflow with initial version.
      operationId: create_workflow
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRead'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /workflows/{workflow_id}:
    get:
      summary: Get Workflow
      description: Get a workflow by ID including its current active version.
      operationId: get_workflow
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
    patch:
      summary: Update Workflow
      description: |-
        Update workflow.

        Supports both metadata-only updates and workflow definition updates:
        - Metadata only (name, description, is_enabled, labels): Updates without creating new version
        - With workflow_definition: Validates definition, compares with current version, creates new WorkflowVersion
          only if definition differs (change detection optimization)
      operationId: update_workflow
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
    delete:
      summary: Delete Workflow
      description: Soft delete a workflow.
      operationId: delete_workflow
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: delete
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '204':
          description: Workflow deleted
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /workflows/{workflow_id}/versions:
    get:
      summary: List Workflow Versions
      description: |-
        List all versions for a workflow.
      operationId: list_workflow_versions
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Workflow version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionListResponse'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /workflows/{workflow_id}/versions/{version}:
    get:
      summary: Get Workflow Version
      description: Get a specific workflow version.
      operationId: get_workflow_version
      tags: [workflows]
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: version
          in: path
          required: true
          schema:
            type: integer
            title: Version
      responses:
        '200':
          description: Workflow version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionRead'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

      # Note: Approval endpoints are in a separate API
      # See: src/nexus/schemas/approvals/openapi.yaml

      security:
        - bearerAuth: []
components:
  schemas:
    # Import workflow-specific schemas
    WorkflowRead:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowRead

    WorkflowReadWithVersion:
      type: object
      title: WorkflowReadWithVersion
      description: |-
        Schema for workflow response with current version details.

        Used when retrieving a single workflow to include the active workflow definition.
      required:
        - name
        - id
        - current_version
        - is_enabled
        - created_by
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Workflow name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Workflow description
          title: Description
        labels:
          type: object
          additionalProperties: true
          description: Workflow labels
          title: Labels
        current_version:
          type: integer
          title: Current Version
        is_enabled:
          type: boolean
          title: Is Enabled
        created_by:
          type: string
          format: uuid
          title: Created By
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Deleted By
        version:
          $ref: '#/components/schemas/WorkflowVersionRead'
          description: Current active version details

    WorkflowVersionRead:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowVersionRead

    WorkflowListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowRead'
              description: Array of resources in current page
              title: Resources
      title: WorkflowListResponse
      description: Paginated list response for workflows.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    WorkflowVersionListResponse:
      type: object
      title: WorkflowVersionListResponse
      description: Schema for workflow version list response.
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersionRead'
          title: Versions

    # Note: Approval schemas are in src/nexus/schemas/approvals/openapi.yaml

    WorkflowCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowCreate

    WorkflowUpdate:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowUpdate

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
