---
openapi: 3.1.0
info:
  title: Workflow Engine API
  description: |
    API for executing dynamic workflows with agentic and non-agentic tasks.

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    ├── Execution (+ workflow execution fields)
    └── ActivityExecution (+ activity execution fields)
    ```

    Note: Approval resources are in a separate API. See `/api/v1/approvals`.

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints
  version: 1.0.0
  contact:
    name: Automation Nexus Team

servers:
  - url: /api/v1
    description: API server (relative path)

paths:
  /executions:
    get:
      summary: List executions
      description: |
        Retrieve executions with filtering, sorting, and cursor-based pagination.
      operationId: list_executions
      tags: [executions]
      parameters:
        - name: workflow_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by workflow ID
        - name: created_by
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by user who created the execution
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExecutionStatus'
          description: |
            Filter executions by status.
            - Exact match: `status=running`
            - Multiple values: `status[in]=running,pending`
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/Execution'
                        maxItems: 100
                    required:
                      - resources
    post:
      summary: Create execution
      description: Start a new workflow execution
      operationId: create_execution
      tags: [executions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionRequest'
      responses:
        '201':
          description: Execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          description: Workflow is disabled
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
              example:
                type: https://api.nexus.com/errors/workflow-disabled
                title: Workflow Disabled
                detail: Cannot execute a disabled workflow
                code: WORKFLOW_DISABLED
                retryable: false
                instance: /api/v1/executions
        '404':
          description: Workflow not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
              example:
                type: https://api.nexus.com/errors/not-found
                title: Workflow Not Found
                detail: No workflow exists with the provided identifier
                code: WORKFLOW_NOT_FOUND
                retryable: false
                instance: /api/v1/executions

  /executions/{execution_id}:
    get:
      summary: Get execution
      description: |
        Retrieve details of a specific execution with optional includes.

        **Include Parameters**:
        - `workflow_definition`: Include the workflow definition from the executed version (for building visualization graph)
        - `activities`: Include the list of activities with their current status (for completed executions or fallback)

        **Usage**:
        - Normal request: `GET /executions/{id}` - returns execution without optional fields
        - Visualization: `GET /executions/{id}?include=workflow_definition&include=activities` - for building graph and checking execution status
      operationId: get_execution
      tags: [executions]
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of related data to include in the response.
            Valid values: workflow_definition, activities
          example: workflow_definition,activities
      responses:
        '200':
          description: Execution details with optional includes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Execution not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
    patch:
      summary: Control execution
      description: Pause, resume, or cancel a workflow execution
      operationId: control_execution
      tags: [executions]
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionControlRequest'
      responses:
        '200':
          description: Execution control applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Execution not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

  /executions/{execution_id}/activities:
    get:
      summary: List activity executions
      description: |
        Retrieve activity executions for a workflow execution with cursor-based pagination.
      operationId: list_execution_activities
      tags: [executions]
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      responses:
        '200':
          description: List of activity executions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActivityExecution'
                        maxItems: 100
                    required:
                      - resources
        '404':
          description: Execution not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

  /executions/{execution_id}/activities/{activity_id}/signal:
    post:
      summary: Send signal to activity in workflow
      description: |
        Send a signal to a specific activity within a running workflow execution.

        This endpoint allows external systems to send arbitrary signals to
        activities that are waiting for external events. The activity must be
        designed to handle signals via the workflow's signal handler.

        The signal is durable - if the workflow is temporarily unavailable,
        the signal will be delivered when it becomes available again.
      operationId: signal_activity
      tags: [executions]
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Execution ID of the running workflow
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
          description: Activity ID from the workflow definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySignalPayload'
      responses:
        '200':
          description: Signal sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: Execution not found
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '500':
          description: Failed to send signal
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData
        '503':
          description: Temporal workflow engine unavailable
          content:
            application/problem+json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ErrorData

  # Note: Approval endpoints are in a separate API
  # See: src/nexus/schemas/approvals/openapi.yaml

components:
  schemas:
    # Import base resource schemas
    BaseResource:
      $ref: ../base/shared-resources.openapi.yaml#/components/schemas/BaseResource

    Execution:
      $ref: ./shared-schemas.yaml#/components/schemas/Execution

    ActivityExecution:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityExecution

    # Note: Approval schemas are in src/nexus/schemas/approvals/openapi.yaml

    ExecutionStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionStatus

    CreateExecutionRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/CreateExecutionRequest

    ExecutionControlRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionControlRequest


    SignalResponse:
      type: object
      title: Signal Response
      description: Response confirming a signal was sent to a workflow
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - signal_sent
          description: Confirmation that the signal was successfully sent
        message:
          type: string
          description: Human-readable confirmation message

    ActivitySignalPayload:
      type: object
      title: Activity Signal Payload
      description: |
        Generic signal payload for sending arbitrary data to a specific activity
        within a running workflow execution.
      required:
        - signal_data
      properties:
        signal_data:
          type: object
          additionalProperties: true
          description: |
            Arbitrary JSON data to send to the activity. The structure depends
            on what the activity expects to receive.
          example:
            action: "resume"
            status: "completed"
            result:
              value: 42

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
