---
openapi: 3.1.0
info:
  title: Workflow Engine API
  description: |
    API for executing dynamic workflows with agentic and non-agentic tasks.
  version: 1.0.0
  contact:
    name: Automation Nexus Team

servers:
  - url: /api/v1
    description: API server (relative path)

paths:
  /executions:
    get:
      summary: List executions
      description: Retrieve executions with filtering, sorting, and cursor-based pagination.
      operationId: list_executions
      tags: [executions]
      parameters:
        - description: Maximum number of results per page
          in: query
          name: limit
          required: false
          schema:
            default: 20
            description: Maximum number of results per page
            exclusiveMinimum: 0
            maximum: 100
            title: Limit
            type: integer
        - description: Pagination cursor from previous response
          in: query
          name: cursor
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
        - description: Sort parameter (e.g., 'name', '-created_at')
          in: query
          name: sort
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Sort parameter (e.g., 'name', '-created_at')
            title: Sort
        - description: Include total count in response (expensive)
          in: query
          name: include_total
          required: false
          schema:
            default: false
            description: Include total count in response (expensive)
            title: Include Total
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - bearerAuth: []
    post:
      summary: Create execution
      description: Start a new workflow execution.
      operationId: create_execution
      tags: [executions]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - bearerAuth: []

  /executions/{execution_id}:
    get:
      summary: Get execution
      description: Retrieve details of a specific execution with optional includes.
      operationId: get_execution
      tags: [executions]
      parameters:
        - in: path
          name: execution_id
          required: true
          schema:
            format: uuid
            title: Execution Id
            type: string
        - description: 'Comma-separated list of related data to include. Valid values: workflow_definition, activities'
          in: query
          name: include
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: 'Comma-separated list of related data to include. Valid values: workflow_definition, activities'
            title: Include
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - bearerAuth: []

  /executions/{execution_id}/activities:
    get:
      summary: List activity executions
      description: Retrieve activity executions for a workflow execution.
      operationId: list_execution_activities
      tags: [executions]
      parameters:
        - in: path
          name: execution_id
          required: true
          schema:
            format: uuid
            title: Execution Id
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityExecution'
                title: Response List Execution Activities
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - bearerAuth: []

  /executions/{execution_id}/activities/{activity_id}/signal:
    post:
      summary: Send signal to activity in workflow
      description: Send a signal to a specific activity within a running workflow execution.
      operationId: signal_activity
      tags: [executions]
      parameters:
        - in: path
          name: execution_id
          required: true
          schema:
            format: uuid
            title: Execution Id
            type: string
        - in: path
          name: activity_id
          required: true
          schema:
            title: Activity Id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySignalPayload'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - bearerAuth: []

  # Note: Approval endpoints are in a separate API
  # See: src/nexus/schemas/approvals/openapi.yaml

components:
  schemas:
    ExecutionCreate:
      description: "Schema for creating a new execution (POST /executions).\n\nExcludes auto-generated fields: id, created_at, created_by (set by backend)."
      properties:
        input_data:
          additionalProperties: true
          description: Input data for workflow execution
          title: Input Data
          type: object
        workflow_id:
          description: Workflow ID to execute
          format: uuid
          title: Workflow Id
          type: string
      required:
        - workflow_id
      title: ExecutionCreate
      type: object

    ExecutionRead:
      description: "Schema for execution response (GET /executions/{id}).\n\nIncludes all fields from the database table model."
      properties:
        activities:
          anyOf:
            - items:
                $ref: '#/components/schemas/ActivityData'
              type: array
            - type: 'null'
          description: List of activities with their current status. Only included when requested via ?include=activities query parameter.
          title: Activities
        completed_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Completed At
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          format: uuid
          title: Created By
          type: string
        current_activities:
          description: Currently executing activities
          items:
            $ref: '#/components/schemas/CurrentActivity'
          title: Current Activities
          type: array
        deleted_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          title: Deleted By
        error_details:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Details
        id:
          format: uuid
          title: Id
          type: string
        input_data:
          additionalProperties: true
          title: Input Data
          type: object
        labels:
          additionalProperties: true
          title: Labels
          type: object
        project_id:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          title: Project Id
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        temporal_workflow_id:
          title: Temporal Workflow Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          title: Updated By
        workflow_definition:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          description: Workflow definition from the executed version. Only included when requested via ?include=workflow_definition query parameter.
          title: Workflow Definition
        workflow_id:
          format: uuid
          title: Workflow Id
          type: string
        workflow_version_id:
          format: uuid
          title: Workflow Version Id
          type: string
      required:
        - id
        - workflow_id
        - workflow_version_id
        - temporal_workflow_id
        - status
        - created_by
        - created_at
        - completed_at
        - updated_at
        - updated_by
        - input_data
        - error_details
      title: ExecutionRead
      type: object

    ExecutionListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ExecutionRead'
              title: Resources
              description: Array of resources in current page
      title: ExecutionListResponse
      description: Paginated list response for executions.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    ActivityData:
      description: Activity data for execution response.
      properties:
        activity_id:
          title: Activity Id
          type: string
        completed_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Completed At
        error_details:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Details
        output_data:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Output Data
        started_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
      required:
        - activity_id
        - status
      title: ActivityData
      type: object

    CurrentActivity:
      description: Currently executing activity information.
      properties:
        activity_name:
          description: Name of the activity
          title: Activity Name
          type: string
        iteration:
          anyOf:
            - type: integer
            - type: 'null'
          description: Iteration number for loops
          title: Iteration
        temporal_activity_id:
          description: Temporal activity ID
          title: Temporal Activity Id
          type: string
      required:
        - activity_name
        - temporal_activity_id
      title: CurrentActivity
      type: object

    ExecutionStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionStatus

    ActivityStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityStatus

    ActivityExecution:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityExecution

    SignalResponse:
      type: object
      title: Signal Response
      description: Response confirming a signal was sent to a workflow
      required:
        - status
      properties:
        status:
          type: string
          pattern: ^signal_sent$
          title: Status
          description: Confirmation that the signal was successfully sent
        message:
          anyOf:
            - type: string
            - type: "null"
          title: Message
          description: Human-readable confirmation message

    ActivitySignalPayload:
      type: object
      title: Activity Signal Payload
      description: Generic signal payload for sending arbitrary data to a specific activity within a running workflow execution.
      required:
        - signal_data
      properties:
        signal_data:
          type: object
          additionalProperties: true
          title: Signal Data
          description: Arbitrary JSON data to send to the activity. The structure depends on what the activity expects to receive.
          examples:
            - action: "resume"
              status: "completed"
              result:
                value: 42

    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object

    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
