---
# Shared Schemas for Workflow Engine API
# This file contains workflow-specific schema definitions used by both REST API (OpenAPI) and WebSocket API (AsyncAPI)
# Base resource schemas (BaseResource, NamedResource, etc.) are in ../base/shared-resources.openapi.yaml

components:
  schemas:
    WorkflowRead:
      type: object
      title: WorkflowRead
      description: |-
        Schema for workflow response (GET /workflows/{id}).

        Includes all fields from the database table model.
        Note: deleted_at and deleted_by are None since soft-deleted workflows are excluded from queries.
      required:
        - name
        - id
        - current_version
        - is_enabled
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Workflow name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Workflow description
          title: Description
        labels:
          type: object
          additionalProperties: true
          description: Workflow labels
          title: Labels
        current_version:
          type: integer
          title: Current Version
        is_enabled:
          type: boolean
          title: Is Enabled
        created_by:
          type: string
          format: uuid
          title: Created By
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Deleted By


    WorkflowVersionRead:
      type: object
      title: WorkflowVersionRead
      description: |-
        Schema for workflow version response (GET /workflows/{id}/versions/{version}).

        WorkflowVersion entities are read-only and managed automatically by the system.
        Note: deleted_at and deleted_by are None since soft-deleted versions are excluded from queries.
      required:
        - id
        - workflow_id
        - version
        - schema_version
        - workflow_definition
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        workflow_id:
          type: string
          format: uuid
          title: Workflow Id
        version:
          type: integer
          title: Version
        schema_version:
          type: string
          title: Schema Version
        workflow_definition:
          type: object
          additionalProperties: true
          title: Workflow Definition
        created_by:
          type: string
          format: uuid
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        change_description:
          anyOf:
            - type: string
            - type: 'null'
          title: Change Description
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Deleted By

    ActivityData:
      type: object
      title: Activity Data
      description: Activity data for execution response when include=activities is requested
      required:
        - activity_id
        - status
      properties:
        activity_id:
          type: string
          description: Activity ID from workflow definition
          example: process_data
        status:
          $ref: "#/components/schemas/ActivityStatus"
        error_details:
          type: [string, "null"]
          description: Error message if status is failed
          example: Connection timeout to external service
        started_at:
          type: [string, "null"]
          format: date-time
          description: When activity started execution
          example: '2025-12-10T15:00:10Z'
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When activity completed
          example: '2025-12-10T15:00:15Z'

    Execution:
      allOf:
        - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/BaseResource
        - type: object
          title: Execution
          description: Runtime instance of a workflow execution with current state, activity tracking, and execution history
          properties:
            workflow_id:
              type: string
              format: uuid
              description: ID of the workflow being executed
            workflow_version_id:
              type: string
              format: uuid
              description: ID of the workflow version being executed
            temporal_workflow_id:
              type: string
              description: Temporal workflow execution ID
            status:
              $ref: "#/components/schemas/ExecutionStatus"
            started_by:
              type: string
              format: uuid
              description: User who started the execution
            started_at:
              type: [string, "null"]
              format: date-time
              description: When execution transitioned from pending to running status (null if still pending)
            completed_at:
              type: [string, "null"]
              format: date-time
              description: When execution reached terminal state (completed, failed, or cancelled)
            input_data:
              type: object
              description: Input parameters for the execution
            error_details:
              type: [string, "null"]
              description: Error information if execution failed
            current_activities:
              type: array
              description: Currently executing activities
              items:
                type: object
                properties:
                  activity_name:
                    type: string
                  temporal_activity_id:
                    type: string
                  iteration:
                    type: [integer, "null"]
            workflow_definition:
              type: [object, "null"]
              description: |
                Workflow definition from the executed version.
                Only included when requested via ?include=workflow_definition query parameter.
                Used for building visualization graph.
            activities:
              type: [array, "null"]
              description: |
                List of activities with their current status.
                Only included when requested via ?include=activities query parameter.
                Used for visualization of completed executions or as fallback.
              items:
                $ref: "#/components/schemas/ActivityData"

    ActivityExecution:
      allOf:
        - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/BaseResource
        - type: object
          title: Activity Execution
          description: Individual activity execution within a workflow with runtime state, retry tracking, and activity definition snapshot
          properties:
            execution_id:
              type: string
              format: uuid
              description: Parent execution ID
            activity_name:
              type: string
              description: Activity ID from workflow definition
            activity_definition:
              type: object
              description: Snapshot of the activity configuration from workflow definition at execution time, including executor, config, retry policy, timeout, approval settings
            temporal_activity_id:
              type: string
              description: Temporal activity execution ID
            status:
              $ref: "#/components/schemas/ActivityStatus"
            started_at:
              type: [string, "null"]
              format: date-time
              description: When activity transitioned from pending to running status (null if still pending)
            completed_at:
              type: [string, "null"]
              format: date-time
              description: When activity reached terminal state (completed, failed)
            input_data:
              type: object
              description: Runtime input parameters
            output_data:
              type: [object, "null"]
              description: Activity results
            error_details:
              type: [string, "null"]
              description: Error information if failed
            retry_count:
              type: integer
              description: Number of retry attempts
            iteration:
              type: [integer, "null"]
              description: Iteration number if activity is within a loop (0-indexed)

    # NOTE: Approval schemas are defined in ../approvals/openapi.yaml
    # Do not duplicate here - use $ref to the approvals API when needed

    ExecutionStatus:
      type: string
      title: ExecutionStatus
      description: Current state of a workflow execution lifecycle.
      enum: [pending, running, paused, completed, failed, cancelled]

    ActivityStatus:
      type: string
      title: ActivityStatus
      description: Activity execution status enumeration.
      enum: [pending, running, completed, failed, retrying, skipped, cancelled]

    # NOTE: ApprovalStatus is defined in ../approvals/openapi.yaml

    WorkflowDefinition:
      description: >
        Workflow definition object. The full schema is defined in
        workflow-definition.schema.json (JSON Schema with recursive activity types).
        Accepts any valid JSON object.

    # Request/Response schemas
    WorkflowCreate:
      type: object
      title: WorkflowCreate
      description: |-
        Schema for creating a new workflow (POST /workflows).

        Excludes auto-generated fields: id, created_at, updated_at, created_by (set by backend).
      required:
        - name
        - workflow_definition
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Workflow name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Workflow description
          title: Description
        labels:
          type: object
          additionalProperties: true
          description: Workflow labels
          title: Labels
        workflow_definition:
          description: Workflow definition object
          title: Workflow Definition
        is_enabled:
          type: boolean
          default: true
          description: Enable workflow for execution
          title: Is Enabled
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Project to assign workflow to
          title: Project Id

    WorkflowUpdate:
      type: object
      title: WorkflowUpdate
      description: |-
        Schema for updating workflow (PATCH /workflows/{id}).

        All fields are optional for partial updates.
        Supports metadata updates and workflow definition updates (creates new version).
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: "null"
          title: Name
          description: Update workflow name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Description
          description: Update workflow description
        is_enabled:
          anyOf:
            - type: boolean
            - type: "null"
          title: Is Enabled
          description: Enable/disable workflow
        labels:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Labels
          description: Update workflow labels
        workflow_definition:
          anyOf:
            - {}
            - type: "null"
          title: Workflow Definition
          description: New workflow definition (auto-creates version)
        change_description:
          anyOf:
            - type: string
            - type: "null"
          title: Change Description
          description: Description of changes for version history

    CreateExecutionRequest:
      type: object
      title: Create Execution Request
      description: Request payload for starting a new workflow execution with optional input parameters
      required:
        - workflow_id
      properties:
        workflow_id:
          type: string
          format: uuid
          description: ID of the workflow to execute
        input_data:
          type: object
          description: Input parameters for the workflow execution

    ExecutionControlRequest:
      type: object
      title: Execution Control Request
      description: Request payload for controlling workflow execution state (pause, resume, cancel)
      required:
        - action
      properties:
        action:
          type: string
          enum: [pause, resume, cancel]

    # NOTE: Approval request/response schemas are defined in ../approvals/openapi.yaml
    # Including: ApprovalDecisionRequest, BatchApprovalDecision, BatchApprovalRequest,
    # BatchApprovalResult, BatchApprovalResponse

    # WebSocket-specific schemas
    WebSocketMessage:
      type: object
      title: WebSocket Message
      description: |-
        Message format for bidirectional WebSocket communication.
        Server sends execution updates, clients send commands and subscriptions.
      required:
        - message_type
        - timestamp
      properties:
        message_type:
          type: string
          description: Type of message
          enum:
            - execution_update
            - activity_update
            - approval_notification
            - subscription
            - error
            - connection_ack
        api_version:
          type: string
          description: API version for this message (optional, defaults to connection version)
          example: v1
        protocol_version:
          type: string
          description: Protocol version for this message
          example: 1.0.0
        event_id:
          type: string
          description: Unique event identifier for message replay and deduplication
        session_id:
          type: string
          description: Session identifier provided by server on connection
        execution_id:
          type: string
          format: uuid
          description: Workflow execution ID (for execution-related messages)
        activity_id:
          type: string
          description: Activity ID (for activity-related messages)
        approval_id:
          type: string
          format: uuid
          description: Approval ID (for approval-related messages)
        data:
          type: object
          description: Message payload (varies by message_type)
        timestamp:
          type: string
          format: date-time
          description: Message timestamp
        error:
          type: object
          description: Error details (only for message_type=error)
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    WebSocketCommand:
      type: object
      title: WebSocket Command
      description: Client-to-server command message
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - pause
            - resume
            - cancel
            - subscribe
            - unsubscribe
          description: Command to execute
        api_version:
          type: string
          description: API version (optional, defaults to connection version)
          example: v1
        execution_id:
          type: string
          format: uuid
          description: Target execution ID (for pause/resume/cancel)
        subscription_filter:
          type: object
          description: Filter criteria (for subscribe command)
          properties:
            workflow_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/ExecutionStatus"
            labels:
              type: object
              additionalProperties:
                type: string

    WebSocketSubscription:

      type: object
      title: WebSocket Subscription
      description: Client subscription to workflow events
      properties:
        subscription_id:
          type: string
          description: Unique subscription identifier
        filter:
          type: object
          description: Subscription filter criteria
          properties:
            workflow_id:
              type: string
              format: uuid
            execution_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/ExecutionStatus"
            labels:
              type: object
              additionalProperties:
                type: string
