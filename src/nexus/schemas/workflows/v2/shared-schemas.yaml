---
# Shared Schemas for Workflow Engine API v2
# This file contains workflow-specific schema definitions used by both REST API (OpenAPI) and WebSocket API (AsyncAPI)
# Base resource schemas (BaseResource, NamedResource, etc.) are in ../../base/shared-resources.openapi.yaml

components:
  schemas:
    Workflow:
      allOf:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/schemas/NamedResource
        - $ref: ../../base/shared-resources.openapi.yaml#/components/schemas/SoftDeletableResource
        - $ref: ../../base/shared-resources.openapi.yaml#/components/schemas/UserOwnedResource
        - type: object
          title: Workflow
          description: A complete automation process with versioned graph-based definitions, combining named resource, soft delete, and user ownership capabilities
          properties:
            current_version:
              type: integer
              description: Current active version number
            is_enabled:
              type: boolean
              description: Whether workflow is enabled and available for execution
            project_id:
              type: string
              format: uuid
              nullable: true
              description: Project this workflow belongs to

    WorkflowWithVersion:
      allOf:
        - $ref: "#/components/schemas/Workflow"
        - type: object
          title: Workflow With Version
          description: Workflow combined with a specific version's details including workflow definition (stored as JSON), schema version, and change history
          properties:
            version:
              type: object
              description: Specific version details
              properties:
                version:
                  type: integer
                schema_version:
                  type: string
                  description: Always "2.0.0" for v2 workflows
                  example: "2.0.0"
                workflow_definition:
                  $ref: ./workflow_definition.schema.json
                created_by:
                  type: string
                  format: uuid
                created_at:
                  type: string
                  format: date-time
                change_description:
                  type: string
                  nullable: true

    ActivityData:
      type: object
      title: Activity Data
      description: Activity data for execution response when include=activities is requested
      required:
        - activity_id
        - status
      properties:
        activity_id:
          type: string
          description: Node ID from workflow definition
          example: patch_servers
        status:
          $ref: "#/components/schemas/ActivityStatus"
        error_details:
          type: string
          nullable: true
          description: Error message if status is failed
          example: Connection timeout to external service
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When activity started execution
          example: '2025-12-10T15:00:10Z'
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When activity completed
          example: '2025-12-10T15:00:15Z'

    Execution:
      allOf:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/schemas/BaseResource
        - type: object
          title: Execution
          description: Runtime instance of a v2 workflow execution with current state, activity tracking, and execution history
          properties:
            workflow_id:
              type: string
              format: uuid
              description: ID of the workflow being executed
            workflow_version_id:
              type: string
              format: uuid
              description: ID of the workflow version being executed
            temporal_workflow_id:
              type: string
              description: Temporal workflow execution ID
            status:
              $ref: "#/components/schemas/ExecutionStatus"
            started_by:
              type: string
              format: uuid
              description: User who started the execution
            started_at:
              type: string
              format: date-time
              nullable: true
              description: When execution transitioned from pending to running status (null if still pending)
            completed_at:
              type: string
              format: date-time
              nullable: true
              description: When execution reached terminal state (completed, failed, or cancelled)
            input_data:
              type: object
              description: Input parameters for the execution
            error_details:
              type: string
              nullable: true
              description: Error information if execution failed
            current_activities:
              type: array
              description: Currently executing activities
              items:
                type: object
                properties:
                  activity_name:
                    type: string
                  temporal_activity_id:
                    type: string
                  iteration:
                    type: integer
                    nullable: true
            workflow_definition:
              type: object
              nullable: true
              description: |
                Workflow definition from the executed version.
                Only included when requested via ?include=workflow_definition query parameter.
                Used for building visualization graph.
            activities:
              type: array
              nullable: true
              description: |
                List of activities with their current status.
                Only included when requested via ?include=activities query parameter.
                Used for visualization of completed executions or as fallback.
              items:
                $ref: "#/components/schemas/ActivityData"

    ActivityExecution:
      allOf:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/schemas/BaseResource
        - type: object
          title: Activity Execution
          description: Individual activity execution within a workflow with runtime state, retry tracking, and activity definition snapshot
          properties:
            execution_id:
              type: string
              format: uuid
              description: Parent execution ID
            activity_name:
              type: string
              description: Node ID from workflow definition
            activity_definition:
              type: object
              description: Snapshot of the node definition from workflow at execution time, including type, config, retry policy, timeout, output mapping
            temporal_activity_id:
              type: string
              description: Temporal activity execution ID
            status:
              $ref: "#/components/schemas/ActivityStatus"
            started_at:
              type: string
              format: date-time
              nullable: true
              description: When activity transitioned from pending to running status (null if still pending)
            completed_at:
              type: string
              format: date-time
              nullable: true
              description: When activity reached terminal state (completed, failed)
            input_data:
              type: object
              description: Resolved config values passed to the activity at runtime
            output_data:
              type: object
              nullable: true
              description: Activity results (after output mapping applied)
            error_details:
              type: string
              nullable: true
              description: Error information if failed
            retry_count:
              type: integer
              description: Number of retry attempts
            iteration:
              type: integer
              nullable: true
              description: Iteration number if activity is within a loop (0-indexed)

    ExecutionStatus:
      type: string
      title: ExecutionStatus
      description: Current state of a workflow execution lifecycle
      enum: [pending, running, paused, completed, failed, cancelled]

    ActivityStatus:
      type: string
      title: Activity Status
      description: Current state of an individual activity execution
      enum: [pending, running, completed, failed, retrying, skipped, cancelled]

    # Request/Response schemas
    WorkflowCreate:
      type: object
      title: WorkflowCreate
      description: Request payload for creating a new workflow from a v2 graph-based workflow definition
      required:
        - name
        - workflow_definition
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Workflow name
        description:
          type: string
          maxLength: 2000
          description: Workflow description
        labels:
          type: object
          additionalProperties: true
          default: {}
          description: Workflow labels
        workflow_definition:
          $ref: ./workflow_definition.schema.json
        is_enabled:
          type: boolean
          default: true
          description: Enable workflow for execution
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Project to assign workflow to

    WorkflowUpdate:
      type: object
      title: WorkflowUpdate
      description: |-
        Schema for updating workflow (PATCH /workflows/{id}).

        All fields are optional for partial updates.
        Supports metadata updates and workflow definition updates (creates new version).
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: "null"
          title: Name
          description: Update workflow name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Description
          description: Update workflow description
        is_enabled:
          anyOf:
            - type: boolean
            - type: "null"
          title: Is Enabled
          description: Enable/disable workflow
        labels:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Labels
          description: Update workflow labels
        workflow_definition:
          anyOf:
            - $ref: ./workflow_definition.schema.json
            - type: "null"
          title: Workflow Definition
          description: New workflow definition (auto-creates version)
        change_description:
          anyOf:
            - type: string
            - type: "null"
          title: Change Description
          description: Description of changes for version history

    CreateExecutionRequest:
      type: object
      title: Create Execution Request
      description: Request payload for starting a new workflow execution with optional input parameters
      required:
        - workflow_id
      properties:
        workflow_id:
          type: string
          format: uuid
          description: ID of the workflow to execute
        input_data:
          type: object
          description: Input parameters for the workflow execution (validated against trigger's input_schema if defined)

    ExecutionControlRequest:
      type: object
      title: Execution Control Request
      description: Request payload for controlling workflow execution state (pause, resume, cancel)
      required:
        - action
      properties:
        action:
          type: string
          enum: [pause, resume, cancel]

    # WebSocket-specific schemas
    WebSocketMessage:
      type: object
      title: WebSocket Message
      description: |-
        Message format for bidirectional WebSocket communication.
        Server sends execution updates, clients send commands and subscriptions.
      required:
        - message_type
        - timestamp
      properties:
        message_type:
          type: string
          description: Type of message
          enum:
            - execution_update
            - activity_update
            - approval_notification
            - subscription
            - error
            - connection_ack
        api_version:
          type: string
          description: API version for this message (optional, defaults to connection version)
          example: v1
        protocol_version:
          type: string
          description: Protocol version for this message
          example: 1.0.0
        event_id:
          type: string
          description: Unique event identifier for message replay and deduplication
        session_id:
          type: string
          description: Session identifier provided by server on connection
        execution_id:
          type: string
          format: uuid
          description: Workflow execution ID (for execution-related messages)
        activity_id:
          type: string
          description: Activity ID (for activity-related messages)
        approval_id:
          type: string
          format: uuid
          description: Approval ID (for approval-related messages)
        data:
          type: object
          description: Message payload (varies by message_type)
        timestamp:
          type: string
          format: date-time
          description: Message timestamp
        error:
          type: object
          description: Error details (only for message_type=error)
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    WebSocketCommand:
      type: object
      title: WebSocket Command
      description: Client-to-server command message
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - pause
            - resume
            - cancel
            - subscribe
            - unsubscribe
          description: Command to execute
        api_version:
          type: string
          description: API version (optional, defaults to connection version)
          example: v1
        execution_id:
          type: string
          format: uuid
          description: Target execution ID (for pause/resume/cancel)
        subscription_filter:
          type: object
          description: Filter criteria (for subscribe command)
          properties:
            workflow_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/ExecutionStatus"
            labels:
              type: object
              additionalProperties:
                type: string

    WebSocketSubscription:
      type: object
      title: WebSocket Subscription
      description: Client subscription to workflow events
      properties:
        subscription_id:
          type: string
          description: Unique subscription identifier
        filter:
          type: object
          description: Subscription filter criteria
          properties:
            workflow_id:
              type: string
              format: uuid
            execution_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/ExecutionStatus"
            labels:
              type: object
              additionalProperties:
                type: string
