---
openapi: 3.1.0
info:
  title: Nexus Integrations API
  description: |
    REST API for managing Integrations.

    Integrations are named, managed connections to external services -
    MCP servers, LLM providers, and AAP gateways - that workflows use
    as building blocks.

    ## Key Features
    - CRUD operations for Integrations with discriminated configuration per type
    - Project-scoped visibility via integration-project assignments
    - Soft-delete support
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Integrations
    description: Integration management

paths:
  /integrations:
    get:
      summary: List Integrations
      description: |-
        List integrations with filtering and pagination.
      operationId: list_integrations
      tags:
        - Integrations
      x-app-permission:
        resource: integration
        action: read
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: integration_type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/IntegrationType'
              - type: "null"
            title: Integration Type
          description: Filter by integration type
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/IntegrationStatus'
              - type: "null"
            title: Status
          description: Filter by integration status
        - name: enabled
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            description: Filter by enabled status
            title: Enabled
          description: Filter by enabled status
        - name: scope
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/IntegrationScope'
              - type: "null"
            title: Scope
          description: Filter by visibility scope
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    post:
      summary: Create Integration
      description: |-
        Create a new integration.
      operationId: create_integration
      tags:
        - Integrations
      x-app-permission:
        resource: integration
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /integrations/{integration_id}:
    get:
      summary: Get Integration
      description: |-
        Get an integration by ID.
      operationId: get_integration
      tags:
        - Integrations
      x-app-permission:
        resource: integration
        action: read
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    patch:
      summary: Update Integration
      description: |-
        Update an integration.
      operationId: update_integration
      tags:
        - Integrations
      x-app-permission:
        resource: integration
        action: update
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationPatch"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete Integration
      description: Delete an integration.
      operationId: delete_integration
      tags:
        - Integrations
      x-app-permission:
        resource: integration
        action: delete
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      responses:
        "204":
          description: Successful Response
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

components:
  schemas:
    IntegrationType:
      type: string
      enum:
        - mcp_server
        - llm_provider
        - aap_gateway
      title: IntegrationType
      description: Type of external integration.

    IntegrationStatus:
      type: string
      enum:
        - validating
        - available
        - error
      title: IntegrationStatus
      description: Current status of an integration.

    IntegrationScope:
      type: string
      enum:
        - global
        - project
      title: IntegrationScope
      description: Visibility scope of an integration.

    IntegrationListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/IntegrationRead'
              title: Resources
              description: Array of resources in current page
      title: IntegrationListResponse
      description: Paginated list response for integrations.

    IntegrationCreate:
      description: Schema for creating a new integration.
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Human-readable name for the integration
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Description
          description: Detailed description of the integration
        integration_type:
          $ref: '#/components/schemas/IntegrationType'
          description: Type of external integration
        configuration:
          oneOf:
            - $ref: '#/components/schemas/MCPServerConfiguration'
            - $ref: '#/components/schemas/LLMProviderConfiguration'
            - $ref: '#/components/schemas/AAPGatewayConfiguration'
          title: Configuration
          description: Integration-specific configuration
          discriminator:
            propertyName: integration_type
            mapping:
              aap_gateway: '#/components/schemas/AAPGatewayConfiguration'
              llm_provider: '#/components/schemas/LLMProviderConfiguration'
              mcp_server: '#/components/schemas/MCPServerConfiguration'
        management_credential_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Management Credential Id
          description: Optional credential for admin operations
        enabled:
          type: boolean
          title: Enabled
          description: Whether the integration is active
          default: true
        scope:
          $ref: '#/components/schemas/IntegrationScope'
          description: "Visibility scope: global or project"
          default: global
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Key-value labels
      required:
        - name
        - integration_type
        - configuration
      title: IntegrationCreate
      type: object

    IntegrationPatch:
      description: "Schema for partially updating an integration (user-facing)."
      additionalProperties: false
      properties:
        name:
          anyOf:
            - type: string
              maxLength: 255
              minLength: 1
            - type: "null"
          title: Name
          description: Human-readable name for the integration
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Description
          description: Detailed description of the integration
        configuration:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/MCPServerConfiguration'
                - $ref: '#/components/schemas/LLMProviderConfiguration'
                - $ref: '#/components/schemas/AAPGatewayConfiguration'
              discriminator:
                propertyName: integration_type
                mapping:
                  aap_gateway: '#/components/schemas/AAPGatewayConfiguration'
                  llm_provider: '#/components/schemas/LLMProviderConfiguration'
                  mcp_server: '#/components/schemas/MCPServerConfiguration'
            - type: "null"
          title: Configuration
          description: Integration-specific configuration
        management_credential_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Management Credential Id
          description: Optional credential for admin operations
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
          title: Enabled
          description: Whether the integration is active
        scope:
          anyOf:
            - $ref: '#/components/schemas/IntegrationScope'
            - type: "null"
          description: "Visibility scope: global or project"
        labels:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: "null"
          title: Labels
          description: Key-value labels
      title: IntegrationPatch
      type: object

    IntegrationRead:
      description: Schema for integration API responses.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/Resource"
        - type: object
          title: IntegrationRead
          required:
            - integration_type
            - configuration
          properties:
            integration_type:
              $ref: '#/components/schemas/IntegrationType'
            enabled:
              type: boolean
              title: Enabled
              default: true
            status:
              $ref: '#/components/schemas/IntegrationStatus'
              default: validating
            scope:
              $ref: '#/components/schemas/IntegrationScope'
              default: global
            configuration:
              oneOf:
                - $ref: '#/components/schemas/MCPServerConfiguration'
                - $ref: '#/components/schemas/LLMProviderConfiguration'
                - $ref: '#/components/schemas/AAPGatewayConfiguration'
              title: Configuration
              description: Integration-specific configuration
              discriminator:
                propertyName: integration_type
                mapping:
                  aap_gateway: '#/components/schemas/AAPGatewayConfiguration'
                  llm_provider: '#/components/schemas/LLMProviderConfiguration'
                  mcp_server: '#/components/schemas/MCPServerConfiguration'
            management_credential_id:
              anyOf:
                - type: string
                  format: uuid
                - type: "null"
              title: Management Credential Id
            validation_error:
              anyOf:
                - type: string
                - type: "null"
              title: Validation Error

    MCPServerConfiguration:
      description: Configuration for MCP (Model Context Protocol) server integrations.
      additionalProperties: false
      properties:
        integration_type:
          type: string
          const: mcp_server
          default: mcp_server
          title: Integration Type
        base_url:
          type: string
          format: uri
          title: Base Url
          description: Base URL for the MCP server
      required:
        - base_url
      title: MCPServerConfiguration
      type: object

    LLMProviderConfiguration:
      description: Configuration for LLM provider integrations (OpenAI-compatible endpoints).
      additionalProperties: false
      properties:
        integration_type:
          type: string
          const: llm_provider
          default: llm_provider
          title: Integration Type
        base_url:
          type: string
          format: uri
          title: Base Url
          description: Base URL for the LLM provider API
        provider_hint:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Hint
          description: Hint indicating the LLM provider backend (e.g. openai, azure, ollama)
      required:
        - base_url
      title: LLMProviderConfiguration
      type: object

    AAPGatewayConfiguration:
      description: Configuration for Ansible Automation Platform Gateway integrations.
      additionalProperties: false
      properties:
        integration_type:
          type: string
          const: aap_gateway
          default: aap_gateway
          title: Integration Type
        gateway_url:
          type: string
          format: uri
          title: Gateway Url
          description: URL of the AAP Gateway
        insecure_skip_tls_verify:
          type: boolean
          title: Insecure Skip Tls Verify
          description: Disable TLS certificate verification. Insecure; do not enable in production.
          default: false
      required:
        - gateway_url
      title: AAPGatewayConfiguration
      type: object

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
