---
openapi: 3.1.0
info:
  title: Nexus User Role Assignments API
  version: 1.0.0
  description: |
    System-level user-to-role assignment endpoints for the Nexus platform.

    These endpoints manage direct role assignments to individual users
    at the system level (not project-scoped).

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: User Role Assignments
    description: System-level user-to-role assignment management

paths:
  /user-role-assignments:
    post:
      summary: Assign User Role
      description: |-
        Assign a role directly to a user (system-level). Requires: admin permission.
      operationId: assign_user_role
      x-app-permission:
        resource: user-role
        action: assign
        scope: any
        default_roles: [admin]
      tags:
        - User Role Assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleAssignmentRead"
        "404":
          description: User or role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"
        "409":
          description: Assignment already exists
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    get:
      summary: List User Role Assignments
      description: List all system-level user→role assignments.
      operationId: list_user_role_assignments
      x-app-permission:
        resource: null
        action: null
        scope: null
        default_roles: []
      tags:
        - User Role Assignments
      responses:
        "200":
          description: List of user-role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRoleAssignmentRead"

      security:
        - bearerAuth: []
  /user-role-assignments/{assignment_id}:
    delete:
      summary: Revoke User Role Assignment
      description: |-
        Remove a user→role assignment. Requires: admin permission.
      operationId: revoke_user_role_assignment
      x-app-permission:
        resource: user-role
        action: revoke
        scope: any
        default_roles: [admin]
      tags:
        - User Role Assignments
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Assignment removed
        "404":
          description: Assignment not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
components:
  schemas:
    UserRoleAssignmentCreate:
      type: object
      title: UserRoleAssignmentCreate
      description: Request body for assigning a role to a user.
      required:
        - user_id
        - role_id
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role_id:
          type: string
          format: uuid
          title: Role Id

    UserRoleAssignmentRead:
      type: object
      title: UserRoleAssignmentRead
      description: "Response body for a user→role assignment."
      required:
        - id
        - user_id
        - username
        - role_id
        - role_name
      properties:
        id:
          type: string
          title: Id
        user_id:
          type: string
          title: User Id
        username:
          type: string
          title: Username
        role_id:
          type: string
          title: Role Id
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
