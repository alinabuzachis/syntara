---
openapi: 3.1.0
info:
  title: Nexus User Role Assignments API
  version: 1.0.0
  description: |
    System-level user-to-role assignment endpoints for the Nexus platform.

    These endpoints manage direct role assignments to individual users
    at the system level (not project-scoped).

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: UserRoleAssignments
    description: System-level user-to-role assignment management

paths:
  /user-role-assignments:
    post:
      summary: Assign User Role
      description: |-
        Assign a role directly to a user (system-level). Requires: admin permission.
      operationId: assign_user_role
      x-app-permission:
        resource: user-role
        action: assign
      tags:
        - UserRoleAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List User Role Assignments
      description: |-
        List system-level user→role assignments.

        Admin/auditor see all assignments; other users see only their own.
      operationId: list_user_role_assignments
      x-app-permission:
        resource: null
        action: null
      tags:
        - UserRoleAssignments
      responses:
        "200":
          description: List of user-role assignments
          content:
            application/json:
              schema:
                type: array
                title: Response List User Role Assignments
                items:
                  $ref: "#/components/schemas/UserRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /user-role-assignments/{assignment_id}:
    delete:
      summary: Revoke User Role Assignment
      description: |-
        Remove a user→role assignment. Requires: admin permission.
      operationId: revoke_user_role_assignment
      x-app-permission:
        resource: user-role
        action: revoke
      tags:
        - UserRoleAssignments
      parameters:
        - in: path
          name: assignment_id
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
components:
  schemas:
    UserRoleAssignmentCreate:
      type: object
      title: UserRoleAssignmentCreate
      description: Request body for assigning a role to a user.
      required:
        - user_id
        - role_name
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role_name:
          type: string
          title: Role Name

    UserRoleAssignmentRead:
      type: object
      title: UserRoleAssignmentRead
      description: "Response body for a user→role assignment."
      required:
        - id
        - user_id
        - username
        - role_name
      properties:
        id:
          type: string
          title: Id
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
        project_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Name
        user_id:
          type: string
          title: User Id
        username:
          type: string
          title: Username
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
