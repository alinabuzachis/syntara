---
openapi: 3.1.0
info:
  title: Nexus All Role Assignments API
  version: 1.0.0
  description: |
    Unified role-assignment list combining user and group assignments
    into a single paginated, filterable, sortable stream.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: All Role Assignments
    description: Unified view of user and group role assignments

paths:
  /all-role-assignments:
    get:
      summary: List All Role Assignments
      description: |-
        List all role assignments (user and group) with filtering, sorting, and pagination.

        Admins see all assignments; other users see only their own user
        assignments and assignments for groups they belong to.
      operationId: list_all_role_assignments
      x-app-permission:
        resource: null
        action: null
      tags:
        - All Role Assignments
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: principal_type
          in: query
          required: false
          description: Filter by principal type (user or group)
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Principal Type
        - name: principal_name
          in: query
          required: false
          description: Filter by principal name (username or group name)
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Principal Name
        - name: role_name
          in: query
          required: false
          description: Filter by role name
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Role Name
        - name: project_id
          in: query
          required: false
          description: Filter by project ID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Project Id
      responses:
        "200":
          description: Paginated list of role assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllRoleAssignmentListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []

components:
  schemas:
    AllRoleAssignmentRead:
      type: object
      title: AllRoleAssignmentRead
      description: A single role assignment (user or group).
      required:
        - id
        - principal_id
        - principal_name
        - principal_type
        - role_name
      properties:
        id:
          type: string
          title: Id
        principal_id:
          type: string
          title: Principal Id
        principal_name:
          type: string
          title: Principal Name
        principal_type:
          type: string
          title: Principal Type
        role_name:
          type: string
          title: Role Name
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
        project_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At

    AllRoleAssignmentListResponse:
      type: object
      title: AllRoleAssignmentListResponse
      description: Paginated response for all role assignments.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AllRoleAssignmentRead"
          title: Resources
          description: Array of resources in current page

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
