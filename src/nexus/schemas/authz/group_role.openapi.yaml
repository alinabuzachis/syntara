---
openapi: 3.1.0
info:
  title: Nexus Group Role Assignments API
  version: 1.0.0
  description: |
    System-level group-to-role assignment endpoints for the Nexus platform.

    These endpoints manage role assignments to groups at the system level.
    All members of a group inherit the group's role assignments.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Group Role Assignments
    description: System-level group-to-role assignment management

paths:
  /group-role-assignments:
    post:
      summary: Assign Group Role
      description: |-
        Assign a role to a group (system-level). Requires: admin permission.
      operationId: assign_group_role
      x-app-permission:
        resource: group-role
        action: assign
      tags:
        - Group Role Assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned to group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
    get:
      summary: List Group Role Assignments
      description: |-
        List system-level group→role assignments.

        Admin/auditor see all assignments; other users see only assignments
        for groups they belong to.
      operationId: list_group_role_assignments
      x-app-permission:
        resource: null
        action: null
      tags:
        - Group Role Assignments
      responses:
        "200":
          description: List of group-role assignments
          content:
            application/json:
              schema:
                type: array
                title: Response List Group Role Assignments
                items:
                  $ref: "#/components/schemas/GroupRoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
  /group-role-assignments/{assignment_id}:
    delete:
      summary: Revoke Group Role Assignment
      description: |-
        Remove a group→role assignment. Requires: admin permission.
      operationId: revoke_group_role_assignment
      x-app-permission:
        resource: group-role
        action: revoke
      tags:
        - Group Role Assignments
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
components:
  schemas:
    GroupRoleAssignmentCreate:
      type: object
      title: GroupRoleAssignmentCreate
      description: Request body for assigning a role to a group.
      required:
        - group_id
        - role_name
      properties:
        group_id:
          type: string
          format: uuid
          title: Group Id
        role_name:
          type: string
          title: Role Name

    GroupRoleAssignmentRead:
      type: object
      title: GroupRoleAssignmentRead
      description: Response body for a group-to-role assignment.
      required:
        - id
        - group_id
        - group_name
        - role_name
      properties:
        id:
          type: string
          title: Id
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
        project_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Name
        group_id:
          type: string
          title: Group Id
        group_name:
          type: string
          title: Group Name
        role_name:
          type: string
          title: Role Name
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
