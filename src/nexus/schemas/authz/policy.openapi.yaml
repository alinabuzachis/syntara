---
openapi: 3.1.0
info:
  title: Nexus Policies API
  version: 1.0.0
  description: |
    Policy management endpoints for the Nexus authorization system.

    Policies define fine-grained access control rules with allow/deny statements.
    Each statement specifies actions, scope, and optional conditions.
    Builtin policies cannot be modified or deleted.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Policies
    description: Policy CRUD operations

paths:
  /policies:
    post:
      summary: Create a custom policy
      description: |
        Create a new custom policy with one or more statements.
        Requires: policy:create permission (admin role).
      operationId: create_policy
      tags:
        - Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreate"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "409":
          description: Policy name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    get:
      summary: List policies
      description: List policies with filtering and pagination.
      operationId: list_policies
      tags:
        - Policies
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by policy name
        - name: is_builtin
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by builtin status
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by project scope
      responses:
        "200":
          description: Paginated list of policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"

  /policies/{policy_id}:
    get:
      summary: Get a policy by ID
      operationId: get_policy
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Policy UUID
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "404":
          description: Policy not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    patch:
      summary: Update a policy
      description: |
        Update a policy. Builtin policies cannot be modified.
        Requires: policy:update permission (admin role).
      operationId: update_policy
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Policy UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "404":
          description: Policy not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    put:
      summary: Update a policy (full replacement)
      description: |
        Update a policy. Builtin policies cannot be modified.
        Requires: policy:update permission (admin role).
      operationId: replace_policy
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Policy UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "404":
          description: Policy not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    delete:
      summary: Delete a policy
      description: |
        Delete a policy. Builtin policies cannot be deleted.
        Requires: policy:delete permission (admin role).
      operationId: delete_policy
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Policy UUID
      responses:
        "204":
          description: Policy deleted
        "404":
          description: Policy not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

components:
  schemas:
    PolicyStatementSchema:
      type: object
      title: Policy Statement
      description: A single policy statement defining an access rule
      required:
        - effect
        - actions
        - scope
      properties:
        effect:
          type: string
          enum:
            - allow
            - deny
          description: Whether this statement allows or denies access
        actions:
          type: array
          items:
            type: string
          description: List of resource_type:action strings (e.g., "workflow:read")
        scope:
          type: string
          enum:
            - any
            - self
          description: Scope of the statement (any = all resources, self = owned resources)
        conditions:
          type: [object, "null"]
          additionalProperties: true
          description: Optional attribute-based conditions

    PolicyCreate:
      type: object
      title: Policy Create
      description: Request body for creating a policy
      required:
        - name
        - statements
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique policy name
        description:
          type: [string, "null"]
          description: Policy description
        statements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PolicyStatementSchema"
          description: Policy statements
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          description: Key-value labels
        project_id:
          type: [string, "null"]
          format: uuid
          description: Project scope (null for system-level)

    PolicyUpdate:
      type: object
      title: Policy Update
      description: Request body for updating a policy (partial)
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          description: Update policy name
        description:
          type: [string, "null"]
          description: Update description
        statements:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PolicyStatementSchema"
          description: Update statements
        labels:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: Update labels

    PolicyRead:
      type: object
      title: Policy Read
      description: Response body for a policy
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Policy UUID
        name:
          type: string
          description: Policy name
        description:
          type: [string, "null"]
          description: Policy description
        statements:
          type: array
          default: []
          items:
            type: object
            additionalProperties: true
          description: Policy statements
        is_builtin:
          type: boolean
          default: false
          description: Whether this is a builtin policy
        project_id:
          type: [string, "null"]
          format: uuid
          description: Project scope (null for system-level)
        labels:
          type: object
          default: {}
          additionalProperties: true
          description: Key-value labels
        created_at:
          type: [string, "null"]
          format: date-time
          description: Creation timestamp
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Last update timestamp

    PolicyListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: "#/components/schemas/PolicyRead"
          required:
            - resources

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
