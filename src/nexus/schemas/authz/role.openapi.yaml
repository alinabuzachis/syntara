---
openapi: 3.1.0
info:
  title: Nexus Roles API
  version: 1.0.0
  description: |
    Role management endpoints for the Nexus authorization system.

    Roles are collections of policies that can be assigned to users or groups.
    Builtin roles (e.g., admin, viewer) cannot be modified or deleted.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Roles
    description: Role CRUD operations

paths:
  /roles:
    post:
      summary: Create a custom role
      description: |
        Create a new custom role with one or more policy references.
        Requires: role:create permission (admin role).
      operationId: create_role
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "409":
          description: Role name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    get:
      summary: List roles
      description: List roles with filtering and pagination.
      operationId: list_roles
      tags:
        - Roles
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by role name
        - name: is_builtin
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by builtin status
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by project scope
      responses:
        "200":
          description: Paginated list of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"

  /roles/{role_id}:
    get:
      summary: Get a role by ID
      operationId: get_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Role UUID
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    patch:
      summary: Update a role
      description: |
        Update a role. Builtin roles cannot be modified.
        Requires: role:update permission (admin role).
      operationId: update_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Role UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    put:
      summary: Update a role (full replacement)
      description: |
        Update a role. Builtin roles cannot be modified.
        Requires: role:update permission (admin role).
      operationId: update_role_put
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Role UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

    delete:
      summary: Delete a role
      description: |
        Delete a role. Builtin roles cannot be deleted.
        Requires: role:delete permission (admin role).
      operationId: delete_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Role UUID
      responses:
        "204":
          description: Role deleted
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

components:
  schemas:
    RoleCreate:
      type: object
      title: Role Create
      description: Request body for creating a role
      required:
        - name
        - policies
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique role name
        description:
          type: [string, "null"]
          description: Role description
        policies:
          type: array
          minItems: 1
          items:
            type: string
          description: List of policy names to attach to this role
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          description: Key-value labels
        project_id:
          type: [string, "null"]
          format: uuid
          description: Project scope (null for system-level)

    RoleUpdate:
      type: object
      title: Role Update
      description: Request body for updating a role (partial)
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          description: Update role name
        description:
          type: [string, "null"]
          description: Update description
        policies:
          type: [array, "null"]
          items:
            type: string
          description: Update attached policies
        labels:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: Update labels

    RoleRead:
      type: object
      title: Role Read
      description: Response body for a role
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Role UUID
        name:
          type: string
          description: Role name
        description:
          type: [string, "null"]
          description: Role description
        policies:
          type: array
          default: []
          items:
            type: string
          description: Attached policy names
        is_builtin:
          type: boolean
          default: false
          description: Whether this is a builtin role
        project_id:
          type: [string, "null"]
          format: uuid
          description: Project scope (null for system-level)
        labels:
          type: object
          default: {}
          additionalProperties: true
          description: Key-value labels
        created_at:
          type: [string, "null"]
          format: date-time
          description: Creation timestamp
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Last update timestamp

    RoleListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: "#/components/schemas/RoleRead"
          required:
            - resources

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
