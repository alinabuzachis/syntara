---
openapi: 3.1.0
info:
  title: Nexus Roles API
  version: 1.0.0
  description: |
    Role management endpoints for the Nexus authorization system.

    Roles are collections of policies that can be assigned to users or groups.
    Builtin roles (e.g., admin, viewer) cannot be modified or deleted.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Roles
    description: Role CRUD operations

paths:
  /roles:
    post:
      summary: Create Role
      description: |-
        Create a custom role. Requires: role:create permission.
      operationId: create_role
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "409":
          description: Role name conflict
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    get:
      summary: List Roles
      description: List roles with filtering and pagination.
      operationId: list_roles
      tags:
        - Roles
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by role name
        - name: is_builtin
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by builtin status
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by project scope
      responses:
        "200":
          description: Paginated list of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"

      security:
        - bearerAuth: []
  /roles/{role_id}:
    get:
      summary: Get Role
      operationId: get_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    patch:
      summary: Update Role
      description: |-
        Patch a role. Builtin roles cannot be modified. Requires: role:update permission.
      operationId: update_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    put:
      summary: Replace Role
      description: |-
        Replace a role. Builtin roles cannot be modified. Requires: role:update permission.
      operationId: replace_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
    delete:
      summary: Delete Role
      description: |-
        Delete a role. Builtin roles cannot be deleted. Requires: role:delete permission.
      operationId: delete_role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Role deleted
        "404":
          description: Role not found
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

      security:
        - bearerAuth: []
components:
  schemas:
    RoleCreate:
      type: object
      title: RoleCreate
      description: Request body for creating a role.
      required:
        - name
        - policies
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        policies:
          type: array
          minItems: 1
          items:
            type: string
          title: Policies
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          title: Labels
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Project Id

    RoleUpdate:
      type: object
      title: RoleUpdate
      description: Request body for updating a role (partial).
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        policies:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          title: Policies
        labels:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
          title: Labels

    RoleRead:
      type: object
      title: RoleRead
      description: Response body for a role.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        policies:
          type: array
          default: []
          items:
            type: string
          title: Policies
        is_builtin:
          type: boolean
          default: false
          title: Is Builtin
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Project Id
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updated At

    RoleListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: "#/components/schemas/RoleRead"
          required:
            - resources

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
