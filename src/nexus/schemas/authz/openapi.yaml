---
openapi: 3.1.0
info:
  title: Nexus Authorization Query API
  version: 1.0.0
  description: |
    Authorization debug and query endpoints for the Nexus platform.

    Provides three query patterns for inspecting authorization decisions:
    - **Can I?** - Check if the current user can perform a specific action
    - **Who can?** - List users who can perform a specific action
    - **What can I?** - List all permissions for the current user

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Authorization
    description: Authorization debug and query endpoints

paths:
  /authz/can-i:
    post:
      summary: Check if the current user can perform an action
      description: |
        Evaluates the current user's effective policies against OPA to determine
        if a specific action is allowed on a resource.
      operationId: can_i
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanIRequest"
      responses:
        "200":
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanIResponse"

  /authz/who-can:
    post:
      summary: List users who can perform an action
      description: |
        Iterates all active users, resolves their policies, and checks each
        against OPA. This is a debugging endpoint.
      operationId: who_can
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhoCanRequest"
      responses:
        "200":
          description: List of authorized users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoCanResponse"

  /authz/what-can-i:
    post:
      summary: List all permissions for the current user
      description: |
        Resolves the current user's effective policies and returns them as a
        flat list of permission entries. No OPA call needed.
      operationId: what_can_i
      tags:
        - Authorization
      responses:
        "200":
          description: List of permission entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatCanIResponse"

components:
  schemas:
    CanIRequest:
      type: object
      title: Can I Request
      description: Request body for the Can I? authorization check
      required:
        - action
        - resource_type
      properties:
        action:
          type: string
          description: The action to check (e.g., "read", "create", "delete")
        resource_type:
          type: string
          description: The type of resource (e.g., "workflow", "project")
        resource_id:
          type: string
          default: ""
          description: Optional specific resource ID
        resource_labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          description: Labels on the target resource
        resource_metadata:
          type: object
          default: {}
          additionalProperties: true
          description: Additional metadata about the target resource
        resource_project:
          type: string
          default: ""
          description: Project scope of the resource

    CanIResponse:
      type: object
      title: Can I Response
      description: Authorization decision result
      required:
        - allowed
        - denied
        - matched_policy
        - denial_reason
        - denied_by
      properties:
        allowed:
          type: boolean
          description: Whether the action is allowed
        denied:
          type: boolean
          description: Whether the action is explicitly denied
        matched_policy:
          type: string
          description: Name of the policy that matched
        denial_reason:
          type: string
          description: Reason for denial (empty if allowed)
        denied_by:
          type: string
          description: Name of the deny policy (empty if allowed)

    WhoCanRequest:
      type: object
      title: Who Can Request
      description: Request body for the Who Can? query
      required:
        - action
        - resource_type
      properties:
        action:
          type: string
          description: The action to check
        resource_type:
          type: string
          description: The type of resource
        resource_id:
          type: string
          default: ""
          description: Optional specific resource ID
        resource_labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          description: Labels on the target resource
        resource_metadata:
          type: object
          default: {}
          additionalProperties: true
          description: Additional metadata about the target resource
        resource_project:
          type: string
          default: ""
          description: Project scope of the resource
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
          description: Maximum number of results per page
        cursor:
          type: string
          format: uuid
          nullable: true
          default: null
          description: Cursor for pagination (UUID of last user from previous page)

    WhoCanUser:
      type: object
      title: Who Can User
      description: A user who can perform the requested action
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
          description: User UUID
        username:
          type: string
          description: Username

    WhoCanResponse:
      type: object
      title: Who Can Response
      description: Paginated list of users authorized to perform the action
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/WhoCanUser"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: Cursor for the next page (null when no more results)

    PermissionEntry:
      type: object
      title: Permission Entry
      description: A single permission from a policy statement
      required:
        - policy_name
        - effect
        - actions
        - scope
      properties:
        policy_name:
          type: string
          description: Name of the policy
        effect:
          type: string
          description: "allow or deny"
        actions:
          type: array
          items:
            type: string
          description: List of resource_type:action strings
        scope:
          type: string
          description: "any or self"
        project:
          type: string
          default: ""
          description: Project scope (empty for system-level)

    WhatCanIResponse:
      type: object
      title: What Can I Response
      description: All permissions for the current user
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
