---
openapi: 3.1.0
info:
  title: Nexus Audit Events API
  version: 1.0.0
  description: |
    Audit event query API for the Nexus platform.

    This API provides endpoints for querying structured audit events
    emitted by the system during request processing, workflow execution,
    and other tracked operations.

    ## Key Features
    - List audit events with filtering and pagination
    - Filter by actor, date range, workflow, activity, or execution
    - Cursor-based pagination for scalable result traversal

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Audit Events
    description: Audit event query and retrieval

paths:
  /audit:
    get:
      summary: List Audit Events
      description: |-
        Retrieve a paginated list of audit events with optional filtering.

        Use this endpoint to:
        - Review system activity for a specific actor
        - Trace operations within a workflow or execution
        - Investigate events within a date range
        - Filter by actor type (user, system, service)
      operationId: list_audit_events
      x-app-permission:
        resource: audit
        action: read
        scope: any
        default_roles: [admin, auditor]
      tags:
        - Audit Events
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of results per page
          schema:
            type: integer
            maximum: 100
            exclusiveMinimum: 0
            default: 20
            title: Limit
            description: Maximum number of results per page
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from previous response
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Cursor
            description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          description: Sort parameter (e.g., 'name', '-created_at')
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Sort
            description: Sort parameter (e.g., 'name', '-created_at')
        - name: include_total
          in: query
          required: false
          description: Include total count in response (expensive)
          schema:
            type: boolean
            default: false
            title: Include Total
            description: Include total count in response (expensive)
        - name: event_category
          in: query
          required: false
          description: Filter by event category
          schema:
            anyOf:
              - $ref: '#/components/schemas/EventCategory'
              - type: 'null'
            title: Event Category
            description: Filter by event category
        - name: event_severity
          in: query
          required: false
          description: Filter by event severity level
          schema:
            anyOf:
              - $ref: '#/components/schemas/EventSeverity'
              - type: 'null'
            title: Event Severity
            description: Filter by event severity level
        - name: event_status
          in: query
          required: false
          description: Filter by event status
          schema:
            anyOf:
              - $ref: '#/components/schemas/EventStatus'
              - type: 'null'
            title: Event Status
            description: Filter by event status
        - name: event_action
          in: query
          required: false
          description: Filter by specific action
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Event Action
            description: Filter by specific action
        - name: actor_id
          in: query
          required: false
          description: Filter by actor UUID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Actor Id
            description: Filter by actor UUID
        - name: actor_type
          in: query
          required: false
          description: Filter by actor type
          schema:
            anyOf:
              - $ref: '#/components/schemas/ActorType'
              - type: 'null'
            title: Actor Type
            description: Filter by actor type
        - name: source_component
          in: query
          required: false
          description: Filter by source component
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Source Component
            description: Filter by source component
        - name: workflow_id
          in: query
          required: false
          description: Filter by workflow UUID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Workflow Id
            description: Filter by workflow UUID
        - name: activity_id
          in: query
          required: false
          description: Filter by activity identifier
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Activity Id
            description: Filter by activity identifier
        - name: execution_id
          in: query
          required: false
          description: Filter by execution UUID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
            description: Filter by execution UUID
      responses:
        '200':
          description: Paginated list of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

      security:
        - bearerAuth: []
components:
  schemas:
    AuditEventListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/AuditEventRead'
              description: Array of resources in current page
              title: Resources
      title: AuditEventListResponse
      description: Paginated list response for audit events.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    AuditEventRead:
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: AuditEventRead
          description: Structured audit event representing a tracked system activity, user action, or operational occurrence.
          required:
            - event_category
            - event_action
            - source_component
            - event_message
          properties:
            event_category:
              $ref: '#/components/schemas/EventCategory'
            event_severity:
              $ref: '#/components/schemas/EventSeverity'
              default: info
            event_status:
              anyOf:
                - $ref: '#/components/schemas/EventStatus'
                - type: 'null'
              description: Status of the audited operation
            event_action:
              type: string
              title: Event Action
              description: Specific action that occurred
            actor_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Actor Id
              description: User, system, or service that performed the action
            actor_type:
              anyOf:
                - $ref: '#/components/schemas/ActorType'
                - type: 'null'
              description: Type of actor (user|system|service)
            source_component:
              type: string
              title: Source Component
              description: Component that generated the event
            workflow_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Workflow Id
              description: Workflow identifier for workflow-scoped events
            activity_id:
              anyOf:
                - type: string
                - type: 'null'
              title: Activity Id
              description: Activity identifier for activity-level events
            execution_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Execution Id
              description: Execution identifier for execution tracing
            event_message:
              type: string
              title: Event Message
              description: Human-readable description of the event
            structured_data:
              anyOf:
                - $ref: '#/components/schemas/FunctionData'
                - $ref: '#/components/schemas/AuditContextData'
                - $ref: '#/components/schemas/RequestCompletedData'
                - $ref: '#/components/schemas/BaseAuditData'
              title: Structured Data
              description: Structured event data (sanitized), discriminated by ``data_type``.

    BaseAuditData:
      type: object
      title: BaseAuditData
      description: Base schema for audit event structured data with no additional fields.
      properties:
        data_type:
          type: string
          const: base
          default: base
          title: Data Type
          description: Discriminator for the structured data variant
        error_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Type
          description: Type of error if an error occurred
        error_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Message
          description: Detailed error message if an error occurred

    FunctionData:
      type: object
      title: FunctionData
      description: Structured data for function decoration audit events.
      properties:
        data_type:
          type: string
          const: function
          default: function
          title: Data Type
          description: Discriminator for the structured data variant
        error_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Type
          description: Type of error if an error occurred
        error_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Message
          description: Detailed error message if an error occurred
        function_args:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          title: Function Args
          description: Function arguments that were passed
        function_result:
          title: Function Result
          description: Function return value or result

    AuditContextData:
      type: object
      title: AuditContextData
      description: |-
        Structured data for general audit context operations.

        Accepts arbitrary extra fields so callers may pass ad-hoc context
        through ``**context_data`` in the context manager.
      additionalProperties: true
      properties:
        data_type:
          type: string
          const: context
          default: context
          title: Data Type
          description: Discriminator for the structured data variant
        error_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Type
          description: Type of error if an error occurred
        error_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Message
          description: Detailed error message if an error occurred

    RequestCompletedData:
      type: object
      title: RequestCompletedData
      description: Structured data for HTTP request completion audit events from middleware.
      required:
        - method
        - path
        - status_code
      properties:
        data_type:
          type: string
          const: request_completed
          default: request_completed
          title: Data Type
          description: Discriminator for the structured data variant
        error_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Type
          description: Type of error if an error occurred
        error_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Message
          description: Detailed error message if an error occurred
        method:
          type: string
          title: Method
          description: HTTP method of the request
        path:
          type: string
          title: Path
          description: Normalized request path
        status_code:
          type: integer
          title: Status Code
          description: HTTP response status code
        query_params:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          title: Query Params
          description: Parsed query parameters
        user_role:
          anyOf:
            - type: string
            - type: 'null'
          title: User Role
          description: Authenticated user role if available

    EventCategory:
      type: string
      title: EventCategory
      description: Categories for different types of audit events.
      enum:
        - user_action
        - workflow_event
        - agent_interaction
        - llm_interaction
        - llm_tool_call
        - llm_reasoning
        - api_execution
        - system_operation
        - security_event
    EventSeverity:
      type: string
      title: EventSeverity
      description: Severity levels for audit events.
      enum:
        - info
        - warning
        - error
        - critical
    EventStatus:
      type: string
      title: EventStatus
      description: Status of an audited operation.
      enum:
        - success
        - error
    ActorType:
      type: string
      title: ActorType
      description: Types of actors that can perform audited actions.
      enum:
        - user
        - system
        - service

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
