---
openapi: 3.1.0
info:
  title: Nexus Audit Events API
  version: 1.0.0
  description: |
    Audit event query API for the Nexus platform.

    This API provides endpoints for querying structured audit events
    emitted by the system during request processing, workflow execution,
    and other tracked operations.

    ## Key Features
    - List audit events with filtering and pagination
    - Filter by actor, date range, workflow, activity, or execution
    - Cursor-based pagination for scalable result traversal

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Audit Events
    description: Audit event query and retrieval

paths:
  /audit:
    get:
      summary: List Audit Events
      description: |-
        Retrieve a paginated list of audit events with optional filtering.

        Use this endpoint to:
        - Review system activity for a specific actor
        - Trace operations within a workflow or execution
        - Investigate events within a date range
        - Filter by actor type (user, system, service)
      operationId: list_audit_events
      x-app-permission:
        resource: audit
        action: read
      tags:
        - Audit Events
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of results per page
          schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 500
            default: 20
            title: Limit
            description: Maximum number of results per page
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: event_category
          in: query
          required: false
          description: Filter by event category
          schema:
            anyOf:
              - $ref: '#/components/schemas/EventCategory'
              - type: 'null'
            title: Event Category
            description: Filter by event category
        - name: event_severity
          in: query
          required: false
          description: Filter by event severity level
          schema:
            anyOf:
              - $ref: '#/components/schemas/EventSeverity'
              - type: 'null'
            title: Event Severity
            description: Filter by event severity level
        - name: event_status
          in: query
          required: false
          description: Filter by event status
          schema:
            anyOf:
              - $ref: '#/components/schemas/EventStatus'
              - type: 'null'
            title: Event Status
            description: Filter by event status
        - name: event_action
          in: query
          required: false
          description: Filter by specific action
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Event Action
            description: Filter by specific action
        - name: actor_id
          in: query
          required: false
          description: Filter by actor UUID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Actor Id
            description: Filter by actor UUID
        - name: actor_type
          in: query
          required: false
          description: Filter by actor type
          schema:
            anyOf:
              - $ref: '#/components/schemas/ActorType'
              - type: 'null'
            title: Actor Type
            description: Filter by actor type
        - name: actor_username
          in: query
          required: false
          description: Filter by actor username
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Actor Username
            description: Filter by actor username
        - name: source_component
          in: query
          required: false
          description: Filter by source component
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Source Component
            description: Filter by source component
        - name: resource_urn
          in: query
          required: false
          description: Filter by resource URN
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Resource Urn
            description: Filter by resource URN
        - name: resource_name
          in: query
          required: false
          description: Filter by resource name
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Resource Name
            description: Filter by resource name
        - name: workflow_id
          in: query
          required: false
          description: Filter by workflow UUID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Workflow Id
            description: Filter by workflow UUID
        - name: activity_id
          in: query
          required: false
          description: Filter by activity identifier
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Activity Id
            description: Filter by activity identifier
        - name: execution_id
          in: query
          required: false
          description: Filter by execution UUID
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
            description: Filter by execution UUID
      responses:
        '200':
          description: Paginated list of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

      security:
        - bearerAuth: []

  /audit/exports:
    post:
      summary: Start Audit Export
      description: |-
        Start an asynchronous audit event export.

        Returns immediately with an export ID that can be used to poll for
        status and download the result once complete.
      operationId: start_audit_export
      x-app-permission:
        resource: audit
        action: read
      tags:
        - Audit Events
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/AuditExportCreate'
                - type: 'null'
              title: Body
      responses:
        '202':
          description: Export job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportRead'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /audit/exports/{export_id}:
    get:
      summary: Get Audit Export Status
      description: Check the status of an audit export job.
      operationId: get_audit_export_status
      x-app-permission:
        resource: audit
        action: read
      tags:
        - Audit Events
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Export Id
      responses:
        '200':
          description: Export job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportRead'
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /audit/exports/{export_id}/download:
    get:
      summary: Download Audit Export
      description: Download the result of a completed audit export.
      operationId: download_audit_export
      x-app-permission:
        resource: audit
        action: read
      tags:
        - Audit Events
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Export Id
      responses:
        '200':
          description: Exported audit data file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

components:
  schemas:
    AuditEventListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/AuditEventRead'
              description: Array of resources in current page
              title: Resources
      title: AuditEventListResponse
      description: Paginated list response for audit events.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    AuditEventRead:
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: AuditEventRead
          description: Structured audit event representing a tracked system activity, user action, or operational occurrence.
          required:
            - event_category
            - event_action
            - source_component
            - event_message
            - structured_data
          properties:
            event_category:
              $ref: '#/components/schemas/EventCategory'
            event_severity:
              $ref: '#/components/schemas/EventSeverity'
              default: info
            event_status:
              anyOf:
                - $ref: '#/components/schemas/EventStatus'
                - type: 'null'
              description: Status of the audited operation
            event_action:
              type: string
              title: Event Action
              description: Specific action that occurred
            actor_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Actor Id
              description: User, system, or service that performed the action
            actor_type:
              anyOf:
                - $ref: '#/components/schemas/ActorType'
                - type: 'null'
              description: Type of actor (user|system|service)
            actor_username:
              anyOf:
                - type: string
                - type: 'null'
              title: Actor Username
              description: Username of the actor
            source_component:
              type: string
              title: Source Component
              description: Component that generated the event
            resource_urn:
              anyOf:
                - type: string
                  maxLength: 1024
                - type: 'null'
              title: Resource Urn
              description: RFC 8141 compliant URN identifying the resource
            resource_name:
              anyOf:
                - type: string
                  maxLength: 255
                - type: 'null'
              title: Resource Name
              description: Human-readable name of the resource at event creation time
            workflow_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Workflow Id
              description: Workflow identifier for workflow-scoped events
            activity_id:
              anyOf:
                - type: string
                - type: 'null'
              title: Activity Id
              description: Activity identifier for activity-level events
            execution_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Execution Id
              description: Execution identifier for execution tracing
            event_message:
              type: string
              title: Event Message
              description: Human-readable description of the event
            structured_data:
              $ref: '#/components/schemas/AuditContextData'
              description: Structured event data (sanitized).

    AuditContextData:
      type: object
      title: AuditContextData
      description: |-
        Universal structured data for all audit events.

        Accepts arbitrary extra fields so callers may pass domain-specific context.
        All audit events use this single structured data type.

        The data_type field serves as a discriminator for UI/frontend purposes,
        allowing different audit event types to be distinguished and rendered appropriately.
      additionalProperties: true
      required:
        - data_type
      properties:
        data_type:
          type: string
          title: Data Type
          description: Discriminator identifying the audit event type
        error_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Type
          description: Type of error if an error occurred
        error_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Message
          description: Detailed error message if an error occurred

    AuditExportCreate:
      type: object
      title: AuditExportCreate
      description: API request body for starting an audit export.
      properties:
        created_at_gte:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At Gte
          description: Export events created at or after this time
        created_at_lte:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At Lte
          description: Export events created at or before this time
        event_category:
          anyOf:
            - $ref: '#/components/schemas/EventCategory'
            - type: 'null'
          description: Filter by event category
        event_severity:
          anyOf:
            - $ref: '#/components/schemas/EventSeverity'
            - type: 'null'
          description: Filter by severity level
        event_status:
          anyOf:
            - $ref: '#/components/schemas/EventStatus'
            - type: 'null'
          description: Filter by event status
        event_action:
          anyOf:
            - type: string
            - type: 'null'
          title: Event Action
          description: Filter by specific action
        actor_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Actor Id
          description: Filter by actor UUID
        actor_type:
          anyOf:
            - $ref: '#/components/schemas/ActorType'
            - type: 'null'
          description: Filter by actor type
        source_component:
          anyOf:
            - type: string
            - type: 'null'
          title: Source Component
          description: Filter by source component
        workflow_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Workflow Id
          description: Filter by workflow UUID
        activity_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Activity Id
          description: Filter by activity ID
        execution_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Execution Id
          description: Filter by execution UUID
        export_format:
          $ref: '#/components/schemas/ExportFormat'
          description: Export file format
          default: csv

    AuditExportRead:
      type: object
      title: AuditExportRead
      description: API response for an audit export job.
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique identifier for this export job
        status:
          $ref: '#/components/schemas/ExportStatus'
          description: Current status of the export job
        file_name:
          anyOf:
            - type: string
            - type: 'null'
          title: File Name
          description: Name of the export file when completed
        row_count:
          anyOf:
            - type: integer
            - type: 'null'
          title: Row Count
          description: Number of rows exported
        error:
          anyOf:
            - type: string
            - type: 'null'
          title: Error
          description: Error message if export failed

    ExportStatus:
      type: string
      title: ExportStatus
      description: Status of an audit export job.
      enum:
        - pending
        - running
        - completed
        - failed

    ExportFormat:
      type: string
      title: ExportFormat
      description: Supported export file formats.
      enum:
        - csv

    EventCategory:
      type: string
      title: EventCategory
      description: Categories for different types of audit events.
      enum:
        - user_action
        - workflow_event
        - agent_interaction
        - llm_interaction
        - llm_tool_call
        - llm_reasoning
        - api_execution
        - system_operation
        - security_event
    EventSeverity:
      type: string
      title: EventSeverity
      description: Severity levels for audit events.
      enum:
        - info
        - warning
        - error
        - critical
    EventStatus:
      type: string
      title: EventStatus
      description: Status of an audited operation.
      enum:
        - success
        - error
    ActorType:
      type: string
      title: ActorType
      description: Types of actors that can perform audited actions.
      enum:
        - user
        - system
        - service

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
