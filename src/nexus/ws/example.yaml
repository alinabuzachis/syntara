---
asyncapi: 3.0.0
info:
  title: Example Component WebSocket API
  version: 1.0.0
  description: |
    Example WebSocket component demonstrating multiple channels.

    This component provides two channels:
    - Coffee: Generates coffee-related words for each input character
    - Chat: Bidirectional chat with random server messages and uppercase echo

servers:
  development:
    host: localhost:8000
    protocol: ws
    description: Local development server
  production:
    host: api.nexus.example.com
    protocol: wss
    description: Production server with TLS

channels:
  coffee:
    address: /ws/example/v1/coffee
    description: |
      Coffee word generator endpoint that receives input text and
      responds with coffee-related words.

      For each character in the input, the server returns a different
      coffee-related word.
      Example: input="hi" returns "espresso hario"

      Connection lifecycle:
      1. Client initiates WebSocket handshake to /ws/example/v1/coffee
      2. Server accepts connection
      3. Client sends CoffeeRequest message with input text
      4. Server responds with CoffeeResponse containing
         space-separated coffee words
      5. Connection remains open for additional requests
      6. Either party can close the connection

    messages:
      coffeeRequest:
        $ref: '#/components/messages/CoffeeRequest'
      coffeeResponse:
        $ref: '#/components/messages/CoffeeResponse'
      errorResponse:
        $ref: '#/components/messages/ErrorResponse'

  chat:
    address: /ws/example/v1/chat
    description: |
      Bidirectional chat endpoint with server-initiated messages.

      Features:
      - Server sends random messages to client every 3 seconds
      - Client can send messages and receives uppercase echo responses

      Connection lifecycle:
      1. Client initiates WebSocket handshake to /ws/example/v1/chat
      2. Server accepts connection and starts sending random messages
      3. Client can send ChatRequest with message text at any time
      4. Server responds with ChatResponse containing uppercase message
      5. Server continues sending random messages every 3 seconds
      6. Either party can close the connection

    messages:
      chatRequest:
        $ref: '#/components/messages/ChatRequest'
      chatResponse:
        $ref: '#/components/messages/ChatResponse'
      errorResponse:
        $ref: '#/components/messages/ErrorResponse'

  agent_events:
    address: /ws/example/v1/agent_events
    description: |
      Subscription-based event streaming endpoint for agent events.

      Features:
      - Client subscribes to event groups: 'log' and/or 'progress'
      - Server sends events only for subscribed groups
      - Each group has independent timing (random 3-8 second intervals)
      - Client can subscribe/unsubscribe to multiple groups

      Connection lifecycle:
      1. Client initiates WebSocket handshake to /ws/example/v1/agent_events
      2. Server accepts connection (no events sent yet)
      3. Client sends AgentEventsRequest to subscribe to groups
      4. Server confirms with AgentEventsResponse
      5. Server begins sending AgentEvent messages for subscribed groups
      6. Client can send additional subscribe/unsubscribe requests
      7. Either party can close the connection

    messages:
      agentEventsRequest:
        $ref: '#/components/messages/AgentEventsRequest'
      agentEventsResponse:
        $ref: '#/components/messages/AgentEventsResponse'
      agentEvent:
        $ref: '#/components/messages/AgentEvent'
      errorResponse:
        $ref: '#/components/messages/ErrorResponse'

operations:
  sendCoffeeRequest:
    action: send
    channel:
      $ref: '#/channels/coffee'
    summary: Send a coffee request with input text
    description: |
      Client sends input text to receive coffee-related words for
      each character
    messages:
      - $ref: '#/channels/coffee/messages/coffeeRequest'

  receiveCoffeeResponse:
    action: receive
    channel:
      $ref: '#/channels/coffee'
    summary: Receive a coffee response
    description: |
      Server responds with space-separated coffee words corresponding
      to each input character
    messages:
      - $ref: '#/channels/coffee/messages/coffeeResponse'
      - $ref: '#/channels/coffee/messages/errorResponse'

  sendChatRequest:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: Send a chat message
    description: |
      Client sends a chat message and receives an uppercase echo response
    messages:
      - $ref: '#/channels/chat/messages/chatRequest'

  receiveChatResponse:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: Receive chat responses and random messages
    description: |
      Server responds with uppercase echo of client messages and
      periodically sends random messages every 3 seconds
    messages:
      - $ref: '#/channels/chat/messages/chatResponse'
      - $ref: '#/channels/chat/messages/errorResponse'

  sendAgentEventsRequest:
    action: send
    channel:
      $ref: '#/channels/agent_events'
    summary: Subscribe or unsubscribe to event groups
    description: |
      Client sends subscription management request to subscribe or
      unsubscribe from event groups (log, progress)
    messages:
      - $ref: '#/channels/agent_events/messages/agentEventsRequest'

  receiveAgentEventsResponse:
    action: receive
    channel:
      $ref: '#/channels/agent_events'
    summary: Receive subscription confirmations and event notifications
    description: |
      Server responds with subscription confirmation and sends event
      notifications for subscribed groups at random 3-8 second intervals
    messages:
      - $ref: '#/channels/agent_events/messages/agentEventsResponse'
      - $ref: '#/channels/agent_events/messages/agentEvent'
      - $ref: '#/channels/agent_events/messages/errorResponse'

components:
  messages:
    CoffeeRequest:
      name: CoffeeRequest
      title: Coffee Request
      summary: Request message containing input text for coffee word generation
      contentType: application/json
      payload:
        type: object
        required:
          - input
        properties:
          input:
            type: string
            description: The input text to convert to coffee words
            minLength: 1
            maxLength: 100
            example: hi
      examples:
        - name: SimpleInput
          summary: A simple coffee request
          payload:
            input: hi
        - name: LongerInput
          summary: A longer coffee request
          payload:
            input: coffee

    CoffeeResponse:
      name: CoffeeResponse
      title: Coffee Response
      summary: Response message containing coffee-related words
      contentType: application/json
      payload:
        type: object
        required:
          - output
        properties:
          output:
            type: string
            description: |
              Space-separated coffee words corresponding to each
              input character
            example: espresso hario
          timestamp:
            type: string
            format: date-time
            description: |
              ISO 8601 timestamp when the response was generated
              (UTC)
            example: '2025-10-23T10:30:00.000Z'
      examples:
        - name: SimpleCoffeeResponse
          summary: Response to a simple coffee request (input="hi")
          payload:
            output: espresso hario
            timestamp: '2025-10-23T10:30:00.000Z'
        - name: LongerCoffeeResponse
          summary: Response to a longer coffee request (input="coffee")
          payload:
            output: cappuccino origin filter filter extraction extraction
            timestamp: '2025-10-23T10:30:00.000Z'

    ChatRequest:
      name: ChatRequest
      title: Chat Request
      summary: Request message containing chat text
      contentType: application/json
      payload:
        type: object
        required:
          - message
        properties:
          message:
            type: string
            description: The chat message to send
            minLength: 1
            maxLength: 1000
            example: Hello there
      examples:
        - name: SimpleMessage
          summary: A simple chat message
          payload:
            message: Hello there
        - name: LongerMessage
          summary: A longer chat message
          payload:
            message: How are you doing today?

    ChatResponse:
      name: ChatResponse
      title: Chat Response
      summary: Response message containing chat reply
      contentType: application/json
      payload:
        type: object
        required:
          - reply
          - type
        properties:
          reply:
            type: string
            description: |
              The chat reply - either uppercase echo of client message
              or a random server message
            example: HELLO THERE
          type:
            type: string
            description: Type of message - 'echo' for client echo or 'random' for server-initiated
            enum:
              - echo
              - random
            example: echo
          timestamp:
            type: string
            format: date-time
            description: |
              ISO 8601 timestamp when the response was generated
              (UTC)
            example: '2025-10-23T10:30:00.000Z'
      examples:
        - name: EchoResponse
          summary: Response echoing client message in uppercase
          payload:
            reply: HELLO THERE
            type: echo
            timestamp: '2025-10-23T10:30:00.000Z'
        - name: RandomMessage
          summary: Random server-initiated message
          payload:
            reply: How's your day going?
            type: random
            timestamp: '2025-10-23T10:30:00.000Z'

    ErrorResponse:
      name: ErrorResponse
      title: Error Response
      summary: Error message for invalid requests
      contentType: application/json
      payload:
        type: object
        required:
          - error
          - message
        properties:
          error:
            type: string
            description: Error type identifier
            enum:
              - INVALID_REQUEST
              - VALIDATION_ERROR
              - INTERNAL_ERROR
            example: VALIDATION_ERROR
          message:
            type: string
            description: Human-readable error message
            example: Name field is required
          timestamp:
            type: string
            format: date-time
            description: ISO 8601 timestamp when the error occurred (UTC)
            example: '2025-10-23T10:30:00.000Z'
      examples:
        - name: ValidationError
          summary: Error when input is missing
          payload:
            error: VALIDATION_ERROR
            message: Input field is required
            timestamp: '2025-10-23T10:30:00.000Z'
        - name: InvalidRequest
          summary: Error when request format is invalid
          payload:
            error: INVALID_REQUEST
            message: Invalid JSON format
            timestamp: '2025-10-23T10:30:00.000Z'

    AgentEventsRequest:
      name: AgentEventsRequest
      title: Agent Events Request
      summary: Request message for subscribing or unsubscribing to event groups
      contentType: application/json
      payload:
        type: object
        required:
          - action
          - groups
        properties:
          action:
            type: string
            description: Action to perform on the event groups
            enum:
              - subscribe
              - unsubscribe
            example: subscribe
          groups:
            type: array
            description: List of event groups to subscribe or unsubscribe to
            items:
              type: string
              enum:
                - log
                - progress
            minItems: 1
            example:
              - log
              - progress
      examples:
        - name: SubscribeToLogs
          summary: Subscribe to log events only
          payload:
            action: subscribe
            groups:
              - log
        - name: SubscribeToBoth
          summary: Subscribe to both log and progress events
          payload:
            action: subscribe
            groups:
              - log
              - progress
        - name: UnsubscribeFromProgress
          summary: Unsubscribe from progress events
          payload:
            action: unsubscribe
            groups:
              - progress

    AgentEventsResponse:
      name: AgentEventsResponse
      title: Agent Events Response
      summary: Response message confirming subscription action
      contentType: application/json
      payload:
        type: object
        required:
          - status
          - action
          - groups
        properties:
          status:
            type: string
            description: Status of the subscription action
            enum:
              - success
            example: success
          action:
            type: string
            description: Action that was performed
            enum:
              - subscribe
              - unsubscribe
            example: subscribe
          groups:
            type: array
            description: List of groups affected by the action
            items:
              type: string
              enum:
                - log
                - progress
            example:
              - log
              - progress
          timestamp:
            type: string
            format: date-time
            description: ISO 8601 timestamp when the action was processed (UTC)
            example: '2025-10-29T10:30:00.000Z'
      examples:
        - name: SubscribeSuccess
          summary: Successful subscription confirmation
          payload:
            status: success
            action: subscribe
            groups:
              - log
              - progress
            timestamp: '2025-10-29T10:30:00.000Z'
        - name: UnsubscribeSuccess
          summary: Successful unsubscription confirmation
          payload:
            status: success
            action: unsubscribe
            groups:
              - progress
            timestamp: '2025-10-29T10:30:00.000Z'

    AgentEvent:
      name: AgentEvent
      title: Agent Event
      summary: Event notification message for subscribed groups
      contentType: application/json
      payload:
        type: object
        required:
          - type
          - group
          - message
        properties:
          type:
            type: string
            description: Message type identifier
            enum:
              - event
            example: event
          group:
            type: string
            description: Event group this message belongs to
            enum:
              - log
              - progress
            example: log
          level:
            type: string
            description: Log level (only for log group events)
            enum:
              - debug
              - info
              - warning
              - error
            example: info
          message:
            type: string
            description: Event message content
            example: Agent initialized successfully
          progress:
            type: integer
            description: Progress percentage (only for progress group events)
            minimum: 0
            maximum: 100
            example: 45
          task:
            type: string
            description: Task name (only for progress group events)
            example: Processing documents
          timestamp:
            type: string
            format: date-time
            description: ISO 8601 timestamp when the event occurred (UTC)
            example: '2025-10-29T10:30:00.000Z'
      examples:
        - name: LogEvent
          summary: Log event notification
          payload:
            type: event
            group: log
            level: info
            message: Agent initialized successfully
            timestamp: '2025-10-29T10:30:00.000Z'
        - name: ProgressEvent
          summary: Progress event notification
          payload:
            type: event
            group: progress
            task: Processing documents
            progress: 45
            message: Completed 45 of 100 documents
            timestamp: '2025-10-29T10:30:00.000Z'
