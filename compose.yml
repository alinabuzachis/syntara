services:
  nexus-ui:
    container_name: nexus-ui
    image: ghcr.io/syntara-orchestration/syntara-ui:latest
    ports:
      - 4000:80
    environment:
      VIRTUAL_HOST: ansibledev.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ansibledev.com
    restart: always
    networks:
      - proxy-net

  nginx-proxy:
    container_name: nginx-proxy
    image: nginxproxy/nginx-proxy:1.7-alpine
    environment:
      TRUST_DOWNSTREAM_PROXY: false
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    ports:
      - 80:80
      - 443:443
    volumes:
      - certs:/etc/nginx/certs:ro
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-net

  nginx-acme:
    container_name: nginx-acme
    image: nginxproxy/acme-companion:latest
    environment:
      DEFAULT_EMAIL: 6277895+jamestalton@users.noreply.github.com
      NGINX_PROXY_CONTAINER: nginx-proxy
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    restart: always
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-net

volumes:
  certs:
  acme:
  html:      

networks:
  proxy-net:
    driver: bridge
