apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/syntara-orchestration/syntara-ui?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-main
    appstudio.openshift.io/component: ansible-automation-orchestrator-ui-main
    pipelines.appstudio.openshift.io/type: build
  name: ansible-automation-orchestrator-ui-main-on-push
  namespace: nexus-tenant
spec:
  params:
  - name: git-url
    value: '{{repo_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/nexus-tenant/ansible-automation-platform/automation-orchestrator-ui-rhel9:{{revision}}
  - name: dockerfile
    value: packages/nexus-ui/Containerfile.konflux
  - name: path-context
    value: .
  - name: build-platforms
    value:
      - linux/x86_64
      - linux/arm64
  - name: hermetic
    value: 'true'
  - name: prefetch-input
    value: '{"type": "npm", "path": "."}'
  pipelineRef:
    params:
      - name: name
        value: container
      - name: bundle
        value: quay.io/aap-ci/tekton-catalog/pipeline/build/container:0.2@sha256:d47e738364f52c28c95c82ae7de6dee106270a707a821d779a709e2bbba1ce01
      - name: kind
        value: pipeline
      - name: secret
        value: quay-aap-ci-viewer
    resolver: bundles
  taskRunTemplate:
    serviceAccountName: build-pipeline-ansible-automation-orchestrator-ui-main
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
