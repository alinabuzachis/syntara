apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/syntara-orchestration/syntara?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch.startsWith("refs/tags/")
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-stable
    appstudio.openshift.io/component: ansible-automation-orchestrator-backend-stable
    pipelines.appstudio.openshift.io/type: build
  name: ansible-automation-orchestrator-backend-stable-on-tag
  namespace: nexus-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/nexus-tenant/ansible-automation-platform/automation-orchestrator-backend-rhel9:{{revision}}
  - name: dockerfile
    value: containers/nexus/Containerfile
  - name: path-context
    value: .
  - name: build-platforms
    value:
      - linux/x86_64
      - linux/arm64
  - name: hermetic
    value: 'false'
  pipelineRef:
    params:
    - name: name
      value: pde-docker-build-multi-platform-oci-ta
    - name: bundle
      value: quay.io/aap-ci/pde-docker-build-multi-platform-oci-ta-bundle@sha256:08b18400effc29e02d3783b33c40633823294483f557ffad21d75a75b98b1f57
    - name: kind
      value: pipeline
    resolver: bundles
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    params:
    - name: mode
      value: 'permissive'
  taskRunTemplate:
    serviceAccountName: build-pipeline-ansible-automation-orchestrator-backend-stable
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
