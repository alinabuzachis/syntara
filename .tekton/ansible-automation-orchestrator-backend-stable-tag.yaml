---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/syntara-orchestration/syntara?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch.startsWith("refs/tags/")
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-stable
    appstudio.openshift.io/component: ansible-automation-orchestrator-backend-stable
    pipelines.appstudio.openshift.io/type: build
  name: ansible-automation-orchestrator-backend-stable-on-tag
  namespace: nexus-tenant
spec:
  params:
    - name: git-url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
    - name: output-image
      value: quay.io/redhat-user-workloads/nexus-tenant/ansible-automation-platform/automation-orchestrator-backend-rhel9:{{revision}}
    - name: dockerfile
      value: containers/nexus/Containerfile
    - name: path-context
      value: .
    - name: build-platforms
      value:
        - linux/x86_64
        - linux/arm64
    - name: hermetic
      value: "true"
    - name: prefetch-input
      value: '[{"type": "pip", "path": ".", "allow_binary": true}, {"type": "rpm", "path": "."}]'
    - name: prefetch-mode
      value: permissive
    - name: additional-secret
      value: nexus-segment-write-keys
  pipelineRef:
    params:
      - name: name
        value: docker-build-multi-platform-oci-ta
      - name: bundle
        value: quay.io/aap-ci/tekton-catalog/pipeline/build/docker-build-multi-platform-oci-ta:0.2@sha256:19ec0336c22d45c3b0dbd9e1bb84b2c522c28b902dc7b026ef2e3be2ed46dabc
      - name: kind
        value: pipeline
      - name: secret
        value: quay-aap-ci-viewer
    resolver: bundles
  taskRunTemplate:
    serviceAccountName: build-pipeline-ansible-automation-orchestrator-backend-stable
  workspaces:
    - name: git-auth
      secret:
        secretName: "{{ git_auth_secret }}"
status: {}
