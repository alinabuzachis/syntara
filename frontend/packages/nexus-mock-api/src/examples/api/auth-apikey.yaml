---
schema_version: "2.0.0"
name: auth-apikey
description: API request with API key authentication

secrets:
  api_key:
    secretId: test-api-key
    type: api_key

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_with_api_key
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/apikey-auth
      authentication:
        type: apiKey
        credentials: ${secrets.api_key}
edges: []
