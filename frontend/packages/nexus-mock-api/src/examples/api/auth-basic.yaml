---
schema_version: "2.0.0"
name: auth-basic
description: API request with basic authentication

secrets:
  basic_credentials:
    secretId: test-basic-credentials
    type: basic_auth

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_with_basic_auth
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/basic-auth
      authentication:
        type: basic
        credentials: ${secrets.basic_credentials}
edges: []
