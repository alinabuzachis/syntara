---
schema_version: "2.0.0"
name: join-sequential-test
description: Test join after sequential activities complete
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: seq1
    type: script
    config:
      language: bash
      code: echo "Step 1"

  - id: seq2
    type: script
    config:
      language: bash
      code: echo "Step 2"

  - id: seq3
    type: script
    config:
      language: bash
      code: echo "Step 3"

  - id: join_sequential
    type: converge
    config:
      branches:
        - seq1
        - seq2
        - seq3
      strategy: all
edges:
  - from: trigger_manual
    to: seq1
  - from: seq1
    to: seq2
  - from: seq2
    to: seq3
  - from: seq3
    to: join_sequential
