---
schema_version: '2.0.0'
name: join-count-test
description: Test join with count strategy - wait for specific number of branches
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: parallel_count
    type: parallel

  - id: count_task1
    type: script
    parameters:
      language: bash
      code: echo "Count task 1"

  - id: count_task2
    type: script
    parameters:
      language: bash
      code: echo "Count task 2"

  - id: count_task3
    type: script
    parameters:
      language: bash
      code: echo "Count task 3"

  - id: join_count
    type: converge
    parameters:
      branches:
        - count_task1
        - count_task2
        - count_task3
      strategy: count
      count: 2
edges:
  - from: trigger_manual
    to: parallel_count
  - from: parallel_count
    to: count_task1
    from_port: branch
  - from: parallel_count
    to: count_task2
    from_port: branch
  - from: parallel_count
    to: count_task3
    from_port: branch
  - from: parallel_count
    to: join_count
