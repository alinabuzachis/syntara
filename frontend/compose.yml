---
services:
  syntara-mock-api:
    container_name: syntara-mock-api
    image: ghcr.io/syntara-orchestration/syntara-mock-api:latest
    ports:
      - 3000:3000
    environment:
      PORT: 3000
    restart: always
    networks:
      - nexus-net

  nexus-ui:
    container_name: nexus-ui
    image: ghcr.io/syntara-orchestration/syntara-ui:latest
    ports:
      - 4000:80
    environment:
      VIRTUAL_HOST: ansibledev.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ansibledev.com
    restart: always
    networks:
      - nexus-net
    depends_on:
      - syntara-mock-api

  nginx-proxy:
    container_name: nginx-proxy
    image: docker.io/nginxproxy/nginx-proxy:1.7-alpine
    environment:
      TRUST_DOWNSTREAM_PROXY: 'false'
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    ports:
      - 80:80
      - 443:443
    volumes:
      - certs:/etc/nginx/certs:ro
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - nexus-net

  nginx-acme:
    container_name: nginx-acme
    image: docker.io/nginxproxy/acme-companion:latest
    environment:
      DEFAULT_EMAIL: 6277895+jamestalton@users.noreply.github.com
      NGINX_PROXY_CONTAINER: nginx-proxy
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    restart: always
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nexus-net
    depends_on:
      - nginx-proxy

volumes:
  certs:
  acme:
  html:

networks:
  nexus-net:
    driver: bridge
