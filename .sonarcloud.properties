# SonarCloud Configuration for Nexus UI

# Project identification
sonar.projectKey=syntara-orchestration_nexus-ui
sonar.organization=syntara-orchestration

# Source and test directories
sonar.sources=packages/nexus-ui/src,packages/nexus-ui-framework/src
sonar.tests=packages/nexus-ui/src,packages/nexus-ui-framework/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx

# Language settings
sonar.javascript.lcov.reportPaths=packages/nexus-ui/coverage/lcov.info,packages/nexus-ui-framework/coverage/lcov.info

# Duplication Detection Settings
# Exclude test files from duplication detection
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Increase minimum tokens for duplication detection (default is 100)
# Higher values = less sensitive to duplications
sonar.cpd.minimumTokens=200

# Alternative: Completely disable duplication detection
# Uncomment the following lines to completely ignore all duplication issues:
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=common-ts:DuplicatedBlocks
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
