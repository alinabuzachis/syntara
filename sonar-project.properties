# SonarCloud Configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# Project identification
sonar.projectKey=syntara-orchestration_nexus
sonar.organization=syntara-orchestration

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12, 3.13

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reporting
sonar.python.coverage.reportPaths=coverage.xml

# Test reporting
sonar.python.xunit.reportPath=pytest-results.xml

# Exclusions
sonar.exclusions=**/alembic/versions/**,**/__pycache__/**,**/node_modules/**
sonar.coverage.exclusions=tests/**/*,**/alembic/**/*,**/__init__.py

# Duplication detection exclusions
sonar.cpd.exclusions=**/alembic/versions/**
