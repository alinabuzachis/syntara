# SonarCloud Configuration for Nexus UI

# Project identification
sonar.projectKey=syntara-orchestration_nexus-ui
sonar.organization=syntara-orchestration

# Block CI on Quality Gate failure
sonar.qualitygate.wait=true

# Source and test directories
sonar.sources=packages/nexus-ui/src
sonar.tests=packages/nexus-ui/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Language settings - Coverage report paths
sonar.javascript.lcov.reportPaths=packages/nexus-ui/coverage/lcov.info
sonar.typescript.lcov.reportPaths=packages/nexus-ui/coverage/lcov.info

# Duplication Detection Settings
# Exclude test files from duplication detection
# GroupFormModal and ProjectFormModal are intentionally parallel implementations
# of the same name+description modal pattern for different resources (group vs project).
# Their structural similarity is by design, not accidental duplication.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  **/GroupFormModal.tsx,**/ProjectFormModal.tsx

# Increase minimum tokens for duplication detection (default is 100)
# Higher values = less sensitive to duplications
sonar.cpd.minimumTokens=200

# Alternative: Completely disable duplication detection
# Uncomment the following lines to completely ignore all duplication issues:
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=common-ts:DuplicatedBlocks
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
