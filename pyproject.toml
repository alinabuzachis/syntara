[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "A distributed multi-agent system. Nexus enables coordinated AI agents to work together on complex tasks."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.104.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "alembic>=1.12.0",
    "python-multipart>=0.0.6",
    "temporalio>=1.5.0",
    "httpx>=0.25.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.0.20",
    "python-dotenv>=1.0.0",
    "beartype>=0.22.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "httpx>=0.25.0",  # for testing FastAPI
    "respx>=0.20.0",  # for mocking httpx requests
    "websockets>=12.0",  # for WebSocket client testing
    "types-pyyaml>=6.0.12",  # type stubs for PyYAML
    "yamllint>=1.35.1",
    "yamlfmt>=1.1.1",
    "ruamel.yaml>=0.17.40",
    "pre-commit>=3.5.0",
    "yamlfmt",
    "podman-compose>=1.5.0",  # for container orchestration
    "jsonschema>=4.0.0",  # for schema validation tests
    "types-PyYAML>=6.0.0",  # for mypy type stubs
    "types-jsonschema>=4.0.0",  # for mypy type stubs
    "types-requests>=2.31.0",  # type stubs for requests library
    # MCP testing infrastructure
    "fastmcp>=2.13.0",  # for MCP test server creation
]

[project.urls]
Homepage = "https://github.com/syntara-orchestration/syntara"
Repository = "https://github.com/syntara-orchestration/syntara"
Issues = "https://github.com/syntara-orchestration/syntara/issues"

# Hatchling configuration for multiple modules
[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nexus/**",
    "README.md",
    "LICENSE",
    "uv.lock",
]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "PLR0913",  # Allow more than 5 arguments in FastAPI
    "TRY300",  # Standard exception handling pattern
    "FIX002",  # Allow TODO comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"src/nexus/core/models/base/resource.py" = ["A005"]  # Allow module name shadowing stdlib
"tests/**/*.py" = [
    "S101",     # Allow assert statements in tests
    "ANN001",   # Don't require type annotations for test function arguments (fixtures)
    "PLR2004",  # Allow magic values in tests
    "TD002",    # TODO formatting
    "TD003",    # TODO formatting
    "ARG001",   # Allow unused test fixture arguments
]
"src/nexus/api/repositories/*.py" = ["ANN401"]  # Allow Any for database row types
"src/nexus/api/alembic/**/*.py" = ["INP001", "D400", "D415"]  # Alembic files
"src/nexus/api/main.py" = ["S104"]  # Binding to all interfaces for development

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mcp: marks tests that require MCP server infrastructure (deselect with '-m \"not mcp\"')",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "tools/*",  # Manual utilities, not production code
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "respx>=0.22.0",
]
