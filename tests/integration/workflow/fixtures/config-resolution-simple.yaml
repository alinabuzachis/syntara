---
schemaVersion: 1.0.0
version: 1

metadata:
  name: config-resolution-simple-test
  description: Simple test for activity config resolution using outputs

triggers:
  - type: manual

workflow:
  activities:
    # Activity 1: Bash script that outputs a timeout value
    - id: generate_timeout
      name: Generate Timeout
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo '{"timeout_value": 120}'
        outputs:
          config: $.stdout

    # Activity 2: Python script that uses the timeout from Activity 1
    - id: use_timeout
      name: Use Timeout
      type: task
      task:
        executor: script
        config:
          language: python
          # Config resolution: Use timeout from previous activity's output
          timeout: ${generate_timeout.output.config.timeout_value}
          code: |
            import json
            import os

            # Verify we received the timeout
            result = {
                "success": True,
                "message": "Config resolution worked!"
            }

            print(json.dumps(result))
        outputs:
          result: $.output
