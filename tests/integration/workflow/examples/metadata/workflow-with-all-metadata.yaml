---
schemaVersion: 1.0.0
version: 1

metadata:
  name: full-metadata-workflow
  description: Workflow demonstrating all metadata fields
  tags:
    - test
    - metadata
    - comprehensive
  owner: qa-team
  timeout: 30

triggers:
  - type: manual

workflow:
  activities:
    - id: validate_metadata
      name: Validate Metadata
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo "Workflow with complete metadata"
            echo "Tags: test, metadata, comprehensive"
            echo "Owner: qa-team"
            echo "Timeout: 30 seconds"
            echo '{"validated": true}'
        outputs:
          result: $.stdout
