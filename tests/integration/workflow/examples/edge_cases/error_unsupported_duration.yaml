---
schemaVersion: 1.0.0
version: 1

metadata:
  name: error-invalid-timeout
  description: Test error with invalid timeout value

triggers:
  - type: manual

workflow:
  activities:
    - id: task_with_invalid_timeout
      name: Task With Invalid Timeout Value
      type: task
      timeout: -1 # Negative timeout - should raise ValidationError
      task:
        executor: script
        config:
          language: bash
          code: echo "Should not execute"
