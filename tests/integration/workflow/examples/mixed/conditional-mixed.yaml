---
schemaVersion: 1.0.0
version: 1

metadata:
  name: conditional-mixed
  description: Conditional execution with different activity types

inputs:
  use_python:
    type: boolean
    description: Whether to use Python branch or API branch
    default: true

triggers:
  - type: manual

workflow:
  activities:
    - id: check_condition
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo '{"condition_checked": true}'

    - id: python_branch
      type: task
      condition: ${input.use_python} == true
      task:
        executor: script
        config:
          language: python
          code: |
            print("Python branch executed")

    - id: api_branch
      type: task
      condition: ${input.use_python} == false
      task:
        executor: api
        config:
          method: GET
          url: http://test-api.example.com/api/data
