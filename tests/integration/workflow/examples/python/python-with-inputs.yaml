schemaVersion: 1.0.0
version: 1

metadata:
  name: python-with-inputs
  description: Python script that receives inputs and produces outputs with environment
    variables

inputs:
  value1:
    type: number
    description: First value for calculation
    default: 10
  value2:
    type: number
    description: Second value for calculation
    default: 20

triggers:
- type: manual

workflow:
  activities:
  - id: calculator
    type: task
    task:
      executor: script
      config:
        language: python
        environment:
          APP_NAME: CalculatorService
          DEBUG_MODE: 'true'
        code: |
          import json
          import os

          # Read inputs from environment variables (INPUT_ prefix)
          value1 = int(os.getenv('INPUT_VALUE1', '10'))
          value2 = int(os.getenv('INPUT_VALUE2', '20'))

          # Read config from custom environment variables
          app_name = os.getenv('APP_NAME', 'Unknown')
          debug = os.getenv('DEBUG_MODE', 'false')

          result = value1 + value2

          if debug == 'true':
              print(f"Debug: {app_name} calculating {value1} + {value2}", file=__import__('sys').stderr)

          print(json.dumps({"result": result, "app": app_name}))
      outputs:
        result: $.output.result
        app: $.output.app

  - id: print_result
    type: task
    task:
      executor: script
      config:
        language: bash
        environment:
          LOG_LEVEL: INFO
        code: |
          echo "[${LOG_LEVEL}] The result is: ${INPUT_RESULT}"
      inputs:
        result: ${calculator.output.result}
