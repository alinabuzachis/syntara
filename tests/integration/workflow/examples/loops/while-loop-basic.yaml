schemaVersion: 1.0.0
version: 1

metadata:
  name: while-loop-basic-test
  description: Test while loop with condition and maxIterations

triggers:
- type: manual

workflow:
  activities:
  - id: initialize_counter
    name: Initialize Counter
    type: task
    task:
      executor: script
      config:
        language: bash
        code: |
          echo '{"counter": 0}'
      outputs:
        data: $.stdout

  - id: while_loop
    name: While Loop
    type: loop
    loop:
      type: while
      condition: ${initialize_counter.output.data.counter} < 5
      max_iterations: 10
      do:
      - id: loop_task
        type: task
        task:
          executor: script
          config:
            language: bash
            code: |
              echo "Loop iteration executed"
          outputs:
            result: $.stdout
