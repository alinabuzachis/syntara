schemaVersion: 1.0.0
version: 1
metadata:
  name: loop-demo
  description: Demonstrates forEach loop
triggers:
- type: manual
inputs:
  items:
    type: array
    description: List of items to process
    default: [apple, banana, cherry]
workflow:
  activities:
  - id: process_items
    type: loop
    loop:
      type: forEach
      items: ${input.items}
      itemVariable: item
      indexVariable: idx
      do:
      - id: process_item
        type: task
        task:
          executor: script
          config:
            language: bash
            code: |
              echo "Processing item #$INPUT_INDEX: $INPUT_ITEM"
          inputs:
            item: ${item}
            index: ${idx}

  - id: summary
    type: task
    task:
      executor: script
      config:
        language: bash
        code: |
          echo "All items processed!"
