---
schemaVersion: 1.0.0
version: 1

metadata:
  name: auth-oauth2
  description: API request with OAuth2 authentication

secrets:
  oauth2_token:
    secretId: test-oauth2-token
    type: oauth2

triggers:
  - type: manual

workflow:
  activities:
    - id: fetch_with_oauth2
      type: task
      task:
        executor: api
        config:
          method: GET
          url: http://test-api.example.com/api/oauth-auth
          authentication:
            type: oauth2
            credentials: ${secrets.oauth2_token}
