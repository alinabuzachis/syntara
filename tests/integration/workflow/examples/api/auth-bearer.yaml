schemaVersion: 1.0.0
version: 1

metadata:
  name: auth-bearer
  description: API request with bearer token authentication

secrets:
  api_token:
    secretId: test-bearer-token
    type: bearer_token

triggers:
- type: manual

workflow:
  activities:
  - id: fetch_protected_data
    type: task
    task:
      executor: api
      config:
        method: GET
        url: http://test-api.example.com/api/protected
        authentication:
          type: bearer
          credentials: ${secrets.api_token}
