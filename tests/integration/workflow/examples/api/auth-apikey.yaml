---
schemaVersion: 1.0.0
version: 1

metadata:
  name: auth-apikey
  description: API request with API key authentication

secrets:
  api_key:
    secretId: test-api-key
    type: api_key

triggers:
  - type: manual

workflow:
  activities:
    - id: fetch_with_api_key
      type: task
      task:
        executor: api
        config:
          method: GET
          url: http://test-api.example.com/api/apikey-auth
          authentication:
            type: apiKey
            credentials: ${secrets.api_key}
