schemaVersion: 1.0.0
version: 1
metadata:
  name: conditional-agent-routing
  description: Route to different specialized agents based on conditions
  tags:
  - agentic
  - conditional
  - routing
triggers:
- type: manual

inputs:
  user_request:
    type: string
    description: User request to be classified and routed to appropriate specialist
    default: How do I optimize database query performance?

workflow:
  activities:
  - id: classify_request
    type: task
    task:
      executor: agentic
      config:
        agent: production://classifier-agent
        model: claude-3-5-sonnet-20241022
        prompt: |
          Classify the following request and determine the appropriate domain:
          ${input.user_request}

          Domains:
          - technical: Technical questions, coding, architecture
          - business: Business strategy, market analysis, planning
          - creative: Content creation, design, marketing

          Respond with ONLY one word: technical, business, or creative
      inputs:
        user_request: ${inputs.user_request}
      outputs:
        domain: $.result.content

  - id: route_to_specialist
    type: condition
    condition: ${classify_request.output.domain}
    then:
    - id: handle_technical
      type: task
      condition: ${classify_request.output.domain} == 'technical'
      task:
        executor: agentic
        config:
          agent: production://technical-specialist
          model: claude-3-5-sonnet-20241022
          prompt: |
            Provide technical assistance for: ${input.user_request}
        inputs:
          user_request: ${inputs.user_request}
        outputs:
          response: $.result.content

    - id: handle_business
      type: task
      condition: ${classify_request.output.domain} == 'business'
      task:
        executor: agentic
        config:
          agent: production://business-specialist
          model: claude-3-5-sonnet-20241022
          prompt: |
            Provide business guidance for: ${input.user_request}
        inputs:
          user_request: ${inputs.user_request}
        outputs:
          response: $.result.content

    - id: handle_creative
      type: task
      condition: ${classify_request.output.domain} == 'creative'
      task:
        executor: agentic
        config:
          agent: production://creative-specialist
          model: claude-3-5-sonnet-20241022
          prompt: |
            Provide creative assistance for: ${input.user_request}
        inputs:
          user_request: ${inputs.user_request}
        outputs:
          response: $.result.content
