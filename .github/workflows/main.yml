name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Tests run here (in addition to pull-request.yml) solely to generate coverage data for SonarCloud.
  # They do not gate the build-image or deploy jobs — that enforcement happens on PRs before merge.
  unit-tests:
    name: Unit Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Run unit test shard with coverage
        id: unit-test-shard
        run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4
        working-directory: packages/nexus-ui
        env:
          VITEST_COVERAGE_DIR: coverage/shard-${{ matrix.shard }}

      - name: Upload shard coverage artifact
        if: steps.unit-test-shard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-${{ matrix.shard }}
          path: packages/nexus-ui/coverage/shard-${{ matrix.shard }}/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unit-test-coverage-*
          path: packages/nexus-ui/coverage-artifacts

      - name: Merge shard coverage reports
        run: npm run test:coverage:merge
        working-directory: packages/nexus-ui

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-report
          path: packages/nexus-ui/coverage
          if-no-files-found: error
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: coverage-report
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download merged coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage-report
          path: packages/nexus-ui/coverage

      - name: SonarCloud Scan
        # No continue-on-error: a failure here surfaces token/config problems early.
        # This job does not gate build-image or deploy (no downstream needs it),
        # so a failure is visible noise but never a deployment blocker.
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ansible+nexus_ci_bot
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push nexus-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-ui/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-ui:latest
            ghcr.io/${{ github.repository_owner }}/nexus-ui:${{ github.sha }}
            quay.io/ansible/nexus-ui:latest
            quay.io/ansible/nexus-ui:${{ github.sha }}

      - name: Build and push nexus-mock-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-mock-api/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-mock-api:latest
            ghcr.io/${{ github.repository_owner }}/nexus-mock-api:${{ github.sha }}
