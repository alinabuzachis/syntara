name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nexus-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-ui/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-ui:latest
            ghcr.io/${{ github.repository_owner }}/nexus-ui:${{ github.sha }}

      - name: Build and push nexus-mock-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-mock-api/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-mock-api:latest
            ghcr.io/${{ github.repository_owner }}/nexus-mock-api:${{ github.sha }}
