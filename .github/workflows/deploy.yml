name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and tag image
        run: |
          podman build -f packages/nexus-ui/Containerfile \
            -t nexus-ui:latest \
            -t ghcr.io/${{ github.repository_owner }}/nexus-ui:latest \
            -t ghcr.io/${{ github.repository_owner }}/nexus-ui:${{ github.sha }} \
            .

      - name: Push image to GitHub Container Registry
        run: |
          podman push ghcr.io/${{ github.repository_owner }}/nexus-ui:latest
          podman push ghcr.io/${{ github.repository_owner }}/nexus-ui:${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose.yml and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp -i ~/.ssh/deploy_key compose.yml "$SSH_USER@$SSH_HOST:/home/ubuntu/"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << EOF
          cd /home/ubuntu

          # Install docker and docker-compose if not present
          if ! command -v podman &> /dev/null; then
            sudo apt update
            sudo apt install -y podman
          fi

          if ! command -v podman-compose &> /dev/null; then
            echo "Installing podman compose..."
            sudo apt install -y podman-compose
          fi

          # Login to GitHub Container Registry
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull the latest image
          podman pull ghcr.io/${{ github.repository_owner }}/nexus-ui:latest

          # Start services using podman compose
          podman-compose up -d

          # Logout
          podman logout ghcr.io

          podman system prune -a -f
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
