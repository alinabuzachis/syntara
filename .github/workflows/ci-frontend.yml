---
name: CI Frontend

on:
  pull_request:
    branches: [devel]
  merge_group:
    branches: [devel]
  push:
    branches: [devel]

permissions:
  contents: read # checkout code
  pull-requests: read # gh api needs PR file list for doc-only detection
  statuses: read # read E2E commit status

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

# Scoped to this file only — other workflows pin their own.
env:
  NODE_VERSION: '22.13.0'

jobs:
  changes:
    name: (Frontend) Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
      backend: ${{ steps.check.outputs.backend }}
      contracts: ${{ steps.check.outputs.contracts }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No PR number (merge_group context), running all CI as fallback"
            { echo "code=true"; echo "backend=true"; echo "contracts=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "::warning::No files from API, running all CI as fallback"
            { echo "code=true"; echo "backend=true"; echo "contracts=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$FILES" | grep -qvE '(\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^backend/src/nexus/schemas/'; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  gen-contracts:
    name: (Frontend) Generate Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Generate TypeScript contracts from OpenAPI specs
        run: npm run gen:ts
        working-directory: frontend/packages/nexus-contracts

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- frontend/packages/nexus-contracts/src/ 2>/dev/null; then
            echo "::error::Generated contracts have uncommitted changes. Run 'make gen-contracts' locally and commit the changes."
            exit 1
          fi

  checks:
    name: (Frontend) Checks
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Static analysis
        run: npm run check
        working-directory: frontend

  unit-tests:
    name: (Frontend) Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run unit test shard with coverage
        id: unit-test-shard
        run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4
        working-directory: frontend/packages/nexus-ui
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITEST_COVERAGE_DIR: coverage/shard-${{ matrix.shard }}

      - name: Upload shard coverage artifact
        if: steps.unit-test-shard.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-test-coverage-${{ matrix.shard }}
          path: frontend/packages/nexus-ui/coverage/shard-${{ matrix.shard }}/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: (Frontend) Coverage Report
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: frontend-unit-test-coverage-*
          path: frontend/packages/nexus-ui/coverage-artifacts

      - name: Merge shard coverage reports
        run: npm run test:coverage:merge
        working-directory: frontend/packages/nexus-ui

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/nexus-ui/coverage
          if-no-files-found: error
          retention-days: 7

      # Pass the PR number as an artifact so the workflow_run-based SonarCloud
      # fallback (for fork PRs) can identify and tag the analysis correctly.
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload PR number artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-pr_number
          path: pr_number.txt
          retention-days: 7

  sonarcloud:
    name: (Frontend) SonarCloud Analysis
    needs: [changes, coverage-report]
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/nexus-ui/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

  sonarcloud-baseline:
    name: (Frontend) SonarCloud Baseline
    needs: [changes, coverage-report]
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/nexus-ui/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          projectBaseDir: frontend

  storybook-build:
    name: (Frontend) Storybook Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build Storybook
        run: npm run storybook:build
        working-directory: frontend/packages/nexus-ui

  test-build:
    name: (Frontend) Test Container Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Test build nexus-ui image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/nexus-ui/Containerfile
          platforms: linux/amd64
          push: false
          tags: nexus-ui:test

      - name: Test build syntara-mock-api image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/syntara-mock-api/Containerfile
          platforms: linux/amd64
          push: false
          tags: syntara-mock-api:test

  shared-checks-gate:
    name: (Frontend) Shared Checks Gate
    if: github.event_name != 'push'
    permissions:
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for shared checks
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const timeout = 15 * 60 * 1000;
            const interval = 30 * 1000;
            const start = Date.now();
            const required = ['Pre-commit'];

            while (Date.now() - start < timeout) {
              const results = [];
              for (const checkName of required) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  check_name: checkName,
                  per_page: 1,
                });
                results.push({ name: checkName, run: data.check_runs[0] });
              }

              const failed = results.find(r =>
                r.run?.status === 'completed' &&
                !['success', 'neutral'].includes(r.run.conclusion)
              );
              if (failed) {
                core.setFailed(`${failed.name} failed (${failed.run.conclusion}): ${failed.run.html_url}`);
                return;
              }

              const allPassed = results.every(r =>
                r.run?.status === 'completed' &&
                ['success', 'neutral'].includes(r.run.conclusion)
              );
              if (allPassed) {
                console.log(`All shared checks passed: ${required.join(', ')}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const summary = results.map(r => {
                if (!r.run) return `${r.name}: not started`;
                return `${r.name}: ${r.run.status}`;
              }).join(', ');
              console.log(`${summary} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out waiting for shared checks: ${required.join(', ')}`);

  e2e-gate:
    name: (Frontend) E2E Gate
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for E2E commit statuses
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            let sha;
            if (context.eventName === 'merge_group') {
              sha = context.sha;
            } else {
              sha = context.payload.pull_request.head.sha;
            }
            const timeout = 100 * 60 * 1000; // 100 minutes (total wall-clock)
            const startupWindow = 30 * 60 * 1000; // 30 minutes for runner allocation
            const interval = 30 * 1000; // poll every 30s
            const start = Date.now();
            const required = ['E2E Tests (UI)'];

            // Phase 1: wait for E2E to post a commit status (pending/success/failure).
            // The e2e-ui workflow posts 'pending' as its first step once a runner is
            // allocated. If no status appears within the startup window the
            // workflow_run event was not delivered or the runner pool is exhausted.
            console.log('Waiting for E2E Tests (UI) to start...');
            while (true) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });
              const found = required.every(name => statuses.find(s => s.context === name));
              if (found) {
                console.log('E2E status appeared — waiting for completion...');
                break;
              }
              if (Date.now() - start > startupWindow) {
                core.setFailed(
                  `E2E Tests (UI) never posted a commit status after ${startupWindow / 60000} minutes — ` +
                  `the workflow_run may not have fired or no runner was allocated`
                );
                return;
              }
              const elapsed = Math.round((Date.now() - start) / 1000);
              console.log(`Waiting for E2E to start... (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }

            // Phase 2: status appeared — poll until success or failure.
            while (Date.now() - start < timeout) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const results = required.map(name => ({
                name,
                status: statuses.find(s => s.context === name),
              }));

              const failed = results.find(r => r.status?.state === 'failure' || r.status?.state === 'error');
              if (failed) {
                core.setFailed(`${failed.name} ${failed.status.state}: ${failed.status.target_url}`);
                return;
              }

              const allPassed = results.every(r => r.status?.state === 'success');
              if (allPassed) {
                console.log(`All E2E suites passed: ${required.join(', ')}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const summary = results.map(r => `${r.name}: ${r.status?.state ?? 'not reported yet'}`).join(', ');
              console.log(`${summary} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out waiting for E2E statuses: ${required.join(', ')}`);

  konflux-frontend-gate:
    name: (Frontend) Konflux Gate
    # Tekton PAC only fires on pull_request events (not merge_group or push).
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for Konflux conforma check
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const timeout = 85 * 60 * 1000;
            const startupWindow = 15 * 60 * 1000;
            const interval = 30 * 1000;
            const start = Date.now();
            const pipelineCheckName = 'Konflux kflux-prd-rh03 / ansible-automation-orchestrator-ui-devel-on-pull-request';
            const conformaCheckName = 'Red Hat Konflux / conforma-on-pull-request-devel / ansible-automation-orchestrator-ui-devel';

            // Phase 1: wait up to 15 minutes for the parent pipeline check to appear.
            // If it never appears the Tekton CEL did not match (no frontend/ changes) — skip.
            console.log('Waiting for Konflux pipeline to start...');
            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: pipelineCheckName,
                per_page: 1,
              });
              if (data.check_runs.length > 0) {
                console.log('Konflux pipeline started — waiting for conforma check...');
                break;
              }
              const elapsed = Math.round((Date.now() - start) / 1000);
              if (Date.now() - start > startupWindow) {
                console.log(`Konflux pipeline never appeared after 15 minutes — Tekton CEL did not match, skipping`);
                return;
              }
              console.log(`Waiting for pipeline to start... (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }

            // Phase 2: pipeline fired — wait for conforma to pass, bailing early if
            // the parent pipeline itself fails before conforma runs (e.g. build error).
            while (Date.now() - start < timeout) {
              const { data: parentData } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: pipelineCheckName,
                per_page: 1,
              });
              const parentRun = parentData.check_runs[0];
              if (parentRun?.status === 'completed' && !['success', 'neutral'].includes(parentRun.conclusion)) {
                core.setFailed(`Konflux pipeline failed (${parentRun.conclusion}) before conforma ran: ${parentRun.html_url}`);
                return;
              }

              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: conformaCheckName,
                per_page: 100,
              });

              const runs = data.check_runs;
              const completed = runs.filter(r => r.status === 'completed');
              const succeeded = completed.filter(r => ['success', 'neutral'].includes(r.conclusion));
              const failed = completed.filter(r => !['success', 'neutral', 'cancelled', 'skipped'].includes(r.conclusion));

              if (failed.length > 0) {
                core.setFailed(`${conformaCheckName} failed (${failed[0].conclusion}): ${failed[0].html_url}`);
                return;
              }
              if (succeeded.length > 0) {
                const r = succeeded[0];
                const suffix = r.conclusion === 'neutral' ? ' (with warnings)' : '';
                console.log(`${conformaCheckName} passed${suffix}: ${r.html_url}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const state = runs.length === 0 ? 'not started yet' : runs[runs.length - 1].status;
              console.log(`${conformaCheckName}: ${state} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out after 85 minutes waiting for: ${conformaCheckName}`);

  # Single required status check for branch protection. All merge-blocking jobs
  # are listed in `needs` so we manage requirements in code instead of maintaining
  # a separate list in GitHub rulesets that can drift out of sync with the workflow.
  #
  # For doc-only PRs the `changes` job sets code=false, all CI jobs are skipped,
  # and this gate passes because `skipped` is accepted alongside `success`.
  required-checks:
    name: (Frontend) Required Checks
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - gen-contracts
      - checks
      - unit-tests
      - coverage-report
      - storybook-build
      - test-build
      - e2e-gate
      - konflux-frontend-gate
      - shared-checks-gate
    steps:
      - name: Check required jobs passed
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Detect Changes job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi

          ok="success|skipped"
          for job in gen-contracts checks unit-tests coverage-report storybook-build test-build e2e-gate konflux-frontend-gate shared-checks-gate; do
            case "$job" in
              gen-contracts)          result="${{ needs.gen-contracts.result }}" ;;
              checks)                 result="${{ needs.checks.result }}" ;;
              unit-tests)             result="${{ needs.unit-tests.result }}" ;;
              coverage-report)        result="${{ needs.coverage-report.result }}" ;;
              storybook-build)        result="${{ needs.storybook-build.result }}" ;;
              test-build)             result="${{ needs.test-build.result }}" ;;
              e2e-gate)               result="${{ needs.e2e-gate.result }}" ;;
              konflux-frontend-gate)  result="${{ needs.konflux-frontend-gate.result }}" ;;
              shared-checks-gate)     result="${{ needs.shared-checks-gate.result }}" ;;
            esac
            echo "$job: $result"
            if [[ ! "$result" =~ ^($ok)$ ]]; then
              echo "::error::Required job '$job' has result '$result'"
              exit 1
            fi
          done
          echo "All required checks passed (or skipped for doc-only PRs)"
