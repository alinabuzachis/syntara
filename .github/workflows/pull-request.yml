name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch enough history for Codecov to compare against base branch
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: packages/nexus-ui

      - name: Check PR coverage
        run: npm run test:coverage:check origin/${{ github.base_ref }}
        working-directory: packages/nexus-ui
        env:
          COVERAGE_THRESHOLD: 80

  test-build:
    name: Test Multi-Arch Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build nexus-ui image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-ui/Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: nexus-ui:test

      - name: Test build nexus-mock-api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-mock-api/Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: nexus-mock-api:test
