name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Lint Mermaid diagrams
        run: npm run lint:mermaid

      - name: TypeScript type check
        run: npm run tsc
        working-directory: packages/nexus-ui

      - name: ESLint
        run: npm run lint
        working-directory: packages/nexus-ui

      - name: Check for dead code with knip
        run: npm run knip -- --reporter compact
        working-directory: packages/nexus-ui

  unit-tests:
    name: Unit Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Run unit test shard with coverage
        id: unit-test-shard
        run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4
        working-directory: packages/nexus-ui
        env:
          VITEST_COVERAGE_DIR: coverage/shard-${{ matrix.shard }}

      - name: Upload shard coverage artifact
        if: steps.unit-test-shard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-${{ matrix.shard }}
          path: packages/nexus-ui/coverage/shard-${{ matrix.shard }}/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch enough history for coverage diff against base branch
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unit-test-coverage-*
          path: packages/nexus-ui/coverage-artifacts

      - name: Merge shard coverage reports
        run: npm run test:coverage:merge
        working-directory: packages/nexus-ui

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-report
          path: packages/nexus-ui/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Enforce 80% coverage on changed files
        id: coverage-check
        run: npm run test:coverage:check "origin/${BASE_REF}"
        working-directory: packages/nexus-ui
        env:
          BASE_REF: ${{ github.base_ref }}
          COVERAGE_THRESHOLD: 80

      - name: Post coverage report on PR
        if: >-
          always()
          && steps.coverage-check.outcome != 'skipped'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/nexus-ui/coverage/pr-coverage-report.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No coverage report found, skipping PR comment');
              return;
            }

            const body = fs.readFileSync(reportPath, 'utf-8');
            const marker = '<!-- coverage-report -->';
            const commentBody = `${marker}\n${body}`;

            // Find existing coverage comment to update (avoid spam)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              console.log('Updated existing coverage comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new coverage comment');
            }

  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check PR size
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            const base = '${{ github.event.pull_request.base.sha }}';
            const head = '${{ github.event.pull_request.head.sha }}';

            // Exclude tests and Markdown from size calculation — they shouldn't count toward the PR budget
            const excludes = [
              ':(exclude)*.test.*',
              ':(exclude)*.spec.*',
              ':(exclude)**/__tests__/**',
              ':(exclude)**/__mocks__/**',
              ':(exclude)**/test-utils/**',
              ':(exclude)**/e2e/**',
              ':(exclude,glob)**/*.md',
            ].map(e => `'${e}'`).join(' ');

            const diffStat = execSync(`git diff --stat ${base}...${head} -- . ${excludes}`).toString();
            const shortstat = execSync(`git diff --shortstat ${base}...${head} -- . ${excludes}`).toString().trim();

            // Also get total stats (including tests and Markdown) for informational display
            const totalShortstat = execSync(`git diff --shortstat ${base}...${head}`).toString().trim();

            function parseShortstat(s) {
              const f = s.match(/(\d+) files? changed/);
              const i = s.match(/(\d+) insertions?/);
              const d = s.match(/(\d+) deletions?/);
              return {
                files: f ? parseInt(f[1]) : 0,
                insertions: i ? parseInt(i[1]) : 0,
                deletions: d ? parseInt(d[1]) : 0,
              };
            }

            const feature = parseShortstat(shortstat);
            const total = parseShortstat(totalShortstat);

            const filesChanged = feature.files;
            const totalChanged = feature.insertions + feature.deletions;
            const testLines = (total.insertions + total.deletions) - totalChanged;

            const SOFT_LINES = 500;
            const SOFT_FILES = 15;

            const marker = '<!-- pr-size-check -->';
            let body = '';

            const testNote = testLines > 0 ? ` (+ ${testLines} lines in tests or Markdown)` : '';

            if (totalChanged > SOFT_LINES || filesChanged > SOFT_FILES) {
              const warnings = [];
              if (totalChanged > SOFT_LINES) {
                warnings.push(`**${totalChanged} feature lines changed** (soft limit: ${SOFT_LINES})`);
              }
              if (filesChanged > SOFT_FILES) {
                warnings.push(`**${filesChanged} feature files changed** (soft limit: ${SOFT_FILES})`);
              }

              body = [
                marker,
                '### ⚠️ Large PR detected',
                '',
                warnings.join('\n'),
                '',
                `_Test and Markdown (\`*.md\`) files excluded from budget.${testNote}_`,
                '',
                'This PR may be easier to review if broken into smaller, stacked PRs.',
                `See [PR_GUIDELINES.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/PR_GUIDELINES.md) for sizing policy.`,
                '',
                '<details><summary>Feature diff stats</summary>',
                '',
                '```',
                diffStat.trim(),
                '```',
                '',
                '</details>',
              ].join('\n');
            } else {
              body = [
                marker,
                `### ✅ PR size OK`,
                '',
                `${totalChanged} feature lines changed across ${filesChanged} files — within policy limits.${testNote}`,
              ].join('\n');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/nexus-ui

      - name: Run page screenshot tests
        id: screenshots
        run: npx playwright test e2e/visual-regression/page-screenshots.spec.ts
        working-directory: packages/nexus-ui
        continue-on-error: true

      - name: Check visual baselines
        id: baselines
        run: node scripts/check-visual-baselines.js
        working-directory: packages/nexus-ui
        continue-on-error: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: |
            packages/nexus-ui/e2e/visual-regression/page-screenshots.spec.ts-snapshots/
            packages/nexus-ui/test-results/
          retention-days: 30

      - name: Upload diff report on failure
        if: steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: packages/nexus-ui/test-results/
          retention-days: 30

      - name: Post visual regression report on PR
        if: >-
          always()
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- visual-regression-report -->';
            const screenshotResult = '${{ steps.screenshots.outcome }}';
            const baselineResult = '${{ steps.baselines.outcome }}';
            const allPassed = screenshotResult === 'success' && baselineResult === 'success';

            let body;
            if (allPassed) {
              body = [
                marker,
                '### :white_check_mark: Visual regression — all screenshots match baselines',
                '',
                'Download the [visual-regression-screenshots](' +
                  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                  ') artifact to review all page screenshots.',
              ].join('\n');
            } else {
              const issues = [];
              if (screenshotResult === 'failure') {
                issues.push('- Screenshot diffs detected — UI has changed from baseline');
              }
              if (baselineResult === 'failure') {
                issues.push('- Missing baselines or uncovered routes');
              }

              body = [
                marker,
                '### :x: Visual regression — diffs detected',
                '',
                ...issues,
                '',
                '**To update baselines:**',
                '1. Download the `visual-regression-diffs` artifact from the [workflow run](' +
                  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '2. Copy the `*-actual.png` files as the new baselines',
                '3. Or run locally: `npx playwright test page-screenshots --update-snapshots`',
              ].join('\n');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test-build:
    name: Test Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build nexus-ui image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-ui/Containerfile
          platforms: linux/amd64
          push: false
          tags: nexus-ui:test

      - name: Test build nexus-mock-api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-mock-api/Containerfile
          platforms: linux/amd64
          push: false
          tags: nexus-mock-api:test
