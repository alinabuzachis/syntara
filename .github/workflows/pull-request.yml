name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch enough history for Codecov to compare against base branch
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript type check
        run: npm run tsc
        working-directory: packages/nexus-ui

      - name: ESLint
        run: npm run lint
        working-directory: packages/nexus-ui

      - name: Check for dead code with knip
        run: npm run knip -- --reporter compact
        working-directory: packages/nexus-ui

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: packages/nexus-ui

      - name: Enforce 80% coverage on changed files
        id: coverage-check
        run: npm run test:coverage:check origin/${{ github.base_ref }}
        working-directory: packages/nexus-ui
        env:
          COVERAGE_THRESHOLD: 80

      - name: Post coverage report on PR
        if: >-
          always()
          && steps.coverage-check.outcome != 'skipped'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/nexus-ui/coverage/pr-coverage-report.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No coverage report found, skipping PR comment');
              return;
            }

            const body = fs.readFileSync(reportPath, 'utf-8');
            const marker = '<!-- coverage-report -->';
            const commentBody = `${marker}\n${body}`;

            // Find existing coverage comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              console.log('Updated existing coverage comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new coverage comment');
            }

  test-build:
    name: Test Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build nexus-ui image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-ui/Containerfile
          platforms: linux/amd64
          push: false
          tags: nexus-ui:test

      - name: Test build nexus-mock-api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/nexus-mock-api/Containerfile
          platforms: linux/amd64
          push: false
          tags: nexus-mock-api:test
