---
name: SAST Snyk Code (Backend)

on:
  schedule:
    - cron: '23 14 * * *'
  push:
    branches:
      - 'devel'
    paths:
      - 'backend/**'
      - '.github/workflows/sast-snyk-backend.yml'
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Generate code vulnerability report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --project-name="${{ github.repository }}" --report ${{ github.workspace }}/backend
        continue-on-error: true
