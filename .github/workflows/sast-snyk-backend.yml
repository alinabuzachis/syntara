---
name: SAST & SCA - Snyk Backend

on:
  schedule:
    - cron: '23 14 * * *'
  push:
    branches:
      - 'devel'
    paths:
      - 'backend/**'
      - '.github/workflows/sast-snyk-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/sast-snyk-backend.yml'
  workflow_dispatch:

jobs:
  snyk-sast:
    name: Snyk SAST (Code Analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Generate code vulnerability report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --project-name="${{ github.repository }}/backend" --report ${{ github.workspace }}/backend

  snyk-sca:
    name: Snyk SCA (Dependency Scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snyk to check for vulnerabilities
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --severity-threshold=high \
            --project-name="${{ github.repository }}/python" \
            --file=requirements.txt \
            --package-manager=pip \
            --sarif-file-output=snyk-python.sarif \
            --json-file-output=snyk-python.json

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('backend/snyk-python.sarif') != ''
        # continue-on-error: GitHub Advanced Security (required for SARIF upload)
        # is only available for public repos or paid Enterprise plan.
        # This allows the workflow to succeed even when Advanced Security is unavailable,
        # while still uploading SARIF if the feature becomes available later.
        continue-on-error: true
        with:
          sarif_file: backend/snyk-python.sarif
          category: snyk-sca-python

      - name: Upload Snyk JSON report as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('backend/snyk-python.json') != ''
        with:
          name: snyk-python-report
          path: backend/snyk-python.json
          retention-days: 90
