---
name: CI Backend

on:
  pull_request:
    branches: [devel]
  merge_group:
    branches: [devel]
  push:
    branches: [devel]



concurrency:
  group: ci-backend-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: (Backend) Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      backend_py: ${{ steps.check.outputs.backend_py }}
      backend_yaml: ${{ steps.check.outputs.backend_yaml }}
      backend_schema: ${{ steps.check.outputs.backend_schema }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # For push/merge_group events, always run backend checks
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "backend_py=true" >> "$GITHUB_OUTPUT"
            echo "backend_yaml=true" >> "$GITHUB_OUTPUT"
            echo "backend_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "::warning::No files from API, running all CI as fallback"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "backend_py=true" >> "$GITHUB_OUTPUT"
            echo "backend_yaml=true" >> "$GITHUB_OUTPUT"
            echo "backend_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Detect overall backend changes (for jobs that need any backend change)
          if echo "$FILES" | grep -qE '^(backend/|\.github/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # Detect Python file changes
          if echo "$FILES" | grep -qE '^backend/.*\.py$'; then
            echo "backend_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_py=false" >> "$GITHUB_OUTPUT"
          fi

          # Detect YAML file changes
          if echo "$FILES" | grep -qE '^backend/.*\.(yaml|yml)$'; then
            echo "backend_yaml=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_yaml=false" >> "$GITHUB_OUTPUT"
          fi

          # Detect schema changes
          if echo "$FILES" | grep -qE '^backend/src/nexus/schemas/'; then
            echo "backend_schema=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_schema=false" >> "$GITHUB_OUTPUT"
          fi

  api-spec-validation:
    name: (Backend) API Spec Validation
    needs: changes
    if: needs.changes.outputs.backend_py == 'true' || needs.changes.outputs.backend_yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Validate OpenAPI sub-spec syntax
        run: make api-spec-validation
        working-directory: backend

  api-spec-bundle:
    name: (Backend) API Spec Bundle
    needs: changes
    if: needs.changes.outputs.backend_py == 'true' || needs.changes.outputs.backend_yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Bundle OpenAPI sub-specs
        run: make api-spec-bundle
        working-directory: backend

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- backend/src/nexus/schemas/openapi.yaml 2>/dev/null; then
            echo "::error::Bundled OpenAPI spec has uncommitted changes. Run 'make -C backend api-spec-bundle' locally and commit the changes."
            exit 1
          fi

  api-spec-drift:
    name: (Backend) API Spec Drift
    needs: changes
    if: needs.changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Check OpenAPI spec matches implementation
        run: make api-spec-drift
        working-directory: backend

  generate-api-client:
    name: (Backend) Generate API Client
    needs: changes
    if: needs.changes.outputs.backend_py == 'true' || needs.changes.outputs.backend_yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Generate Python API client
        run: make generate-api-client
        working-directory: backend

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- backend/src/nexus/api_client/ 2>/dev/null; then
            echo "::error::Generated API client has uncommitted changes. Run 'make -C backend generate-api-client' locally and commit the changes."
            exit 1
          fi

  check-api-paths:
    name: (Backend) Check API Paths
    needs: changes
    if: needs.changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Check API paths use snake_case
        run: make check-api-paths
        working-directory: backend

  check-dead-code:
    name: (Backend) Check Dead Code
    needs: changes
    if: needs.changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Check for dead code (vulture)
        run: make check-dead-code
        working-directory: backend

  check-cycles:
    name: (Backend) Check Import Cycles
    needs: changes
    if: needs.changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Check for import cycles (pyan3)
        run: make check-cycles
        working-directory: backend

  check-orphans:
    name: (Backend) Check Orphan Modules
    needs: changes
    if: needs.changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Check for orphan modules
        run: make check-orphans
        working-directory: backend

  check-openapi-breaking:
    name: (Backend) Check OpenAPI Breaking Changes
    needs: changes
    if: needs.changes.outputs.backend_schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Fetch devel branch for OpenAPI comparison
        run: git fetch origin devel

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Check OpenAPI breaking changes against devel
        run: make check-openapi-breaking-pre-commit
        working-directory: backend
        env:
          OPENAPI_PR_BODY: ${{ github.event.pull_request.body }}

  verify-test-structure:
    name: (Backend) Verify Test Structure
    needs: changes
    if: needs.changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Verify test structure matches source
        run: make verify-test-structure
        working-directory: backend

  pre-commit:
    name: (Backend) pre-commit
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Cache pre-commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run --project backend pre-commit run --all-files
        env:
          SKIP: frontend-prettier,frontend-eslint,frontend-tsc

  mypy:
    name: (Backend) mypy
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Run mypy (strict)
        run: make typecheck
        working-directory: backend

  check-migrations:
    name: (Backend) check-migrations
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: "3.12"

      - name: Check migrations
        run: make check-migrations
        working-directory: backend

  test-unit:
    name: (Backend) Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        run: make test-unit-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-unit-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-unit/
            backend/pytest-results-unit.xml
          retention-days: 30
          include-hidden-files: true

  test-cli:
    name: (Backend) CLI Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run CLI tests with coverage
        run: make test-cli-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-cli-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-cli/
            backend/pytest-results-cli.xml
          retention-days: 30
          include-hidden-files: true

  test-integration:
    name: (Backend) Integration Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run integration tests with coverage
        run: make test-integration-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-integration-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-integration/
            backend/pytest-results-integration.xml
          retention-days: 30
          include-hidden-files: true

  test-compose:
    name: (Backend) Test Compose
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Generate secrets
        run: make secrets-generate
        working-directory: backend

      - name: Generate TLS certificates
        run: make certs-generate
        working-directory: backend

      - name: (Backend) Log in to registry.redhat.io
        env:
          RH_REGISTRY_TOKEN: ${{ secrets.RH_REGISTRY_TOKEN }}
          RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
        run: echo "$RH_REGISTRY_TOKEN" | podman login registry.redhat.io -u "$RH_REGISTRY_USER" --password-stdin

      - name: Start services with podman-compose
        timeout-minutes: 15
        env:
          APP_SEGMENT_WRITE_KEY: test-e2e-write-key
          APP_SEGMENT_ENDPOINT: http://mock-segment:9999
          APP_COLLECTION_INTERVAL_SECONDS: "10"
          APP_WORKFLOW_HTTP_REQUEST_ALLOWED_HOSTS: '["host.containers.internal"]'
        run: |
          # Start core services + mock-segment (exclude nexus-ui which is private)
          uvx podman-compose -p nexus-ci --profile telemetry-e2e up --build -d database temporal nexus temporal-worker temporal-background-worker mcp-server mock-segment

      - name: Verify services are healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          # Use exact container names (with _1 suffix) to avoid substring
          # matches — e.g. "nexus-ci_temporal" would also match
          # "nexus-ci_temporal-worker_1", causing podman wait to block on
          # a container we don't intend to check here.
          podman wait --condition=healthy \
            nexus-ci_database_1 \
            nexus-ci_temporal_1 \
            nexus-ci_nexus_1 \
            nexus-ci_temporal-background-worker_1 \
            nexus-ci_mcp-server_1 \
            nexus-ci_mock-segment_1
          echo "All services are healthy"

      - name: Run E2E tests (excluding global revocation)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd backend && make test-e2e
        env:
          APP_BASE_URL: https://localhost:8000
          APP_WORKER_BASE_URL: https://host.containers.internal:8000
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGMENT_SERVER_URL: http://localhost:9999

      - name: Run E2E tests (global revocation, isolated session)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd backend && make test-e2e-global-revocation
        env:
          APP_BASE_URL: https://localhost:8000
          APP_WORKER_BASE_URL: https://host.containers.internal:8000
          SEGMENT_SERVER_URL: http://localhost:9999

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Compose logs ==="
          uvx podman-compose -p nexus-ci --profile telemetry-e2e logs database temporal nexus temporal-worker temporal-background-worker mcp-server mock-segment

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e down -v || true


  combine:
    name: (Backend) Combine Test Reports
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-unit
      - test-cli
      - test-integration
    if: needs.changes.outputs.backend == 'true' && success()

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: backend-coverage-*
          path: backend/coverage-artifacts
          merge-multiple: false

      - name: Combine coverage reports
        run: |
          # Copy .coverage files from each artifact directory with unique suffixes
          # coverage combine will automatically find all .coverage.* files
          for artifact_dir in coverage-artifacts/*/; do
            if [ -f "${artifact_dir}backend/.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}backend/.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}backend/.coverage → .coverage.${artifact_name}"
            elif [ -f "${artifact_dir}.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}.coverage → .coverage.${artifact_name}"
            fi
          done

          # List coverage files ready to combine
          echo ""
          echo "Coverage files:"
          ls -la .coverage.* 2>/dev/null || { echo "No coverage files found"; exit 1; }

          # Combine all .coverage.* files into .coverage
          uv run coverage combine

          # Generate combined reports
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov
          uv run coverage report

          echo "Combined coverage from all test jobs"
        working-directory: backend

      - name: Combine JUnit XML reports
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d coverage-artifacts ]]; then
            echo "coverage-artifacts directory not found"
            exit 1
          fi

          mapfile -d '' reports < <(
            find coverage-artifacts \
              -type f \
              -name 'pytest-results-*.xml' \
              -print0
          )

          if ((${#reports[@]} == 0)); then
            echo "No JUnit XML files found to merge"
            exit 1
          fi

          echo "Merging ${#reports[@]} JUnit XML report(s):"
          printf '  %s\n' "${reports[@]}"

          uv run python -m junitparser merge -- "${reports[@]}" pytest-results.xml

          echo "Combined report written to pytest-results.xml"

      # Pass the PR number as an artifact so the workflow_run-based SonarCloud
      # fallback (for fork PRs) can identify and tag the analysis correctly.
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.number }}" > pr_number.txt

      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-pr_number
          path: pr_number.txt

      - name: Upload combined coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-combined
          path: |
            backend/coverage.xml
            backend/pytest-results.xml
            backend/htmlcov/
          retention-days: 30

  sonarcloud:
    name: (Backend) SonarCloud Analysis
    needs: combine
    if: >-
      success()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download combined coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage-combined
          path: backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_BACKEND_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

  sonarcloud-baseline:
    name: (Backend) SonarCloud Baseline
    needs: combine
    if: >-
      success()
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download combined coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage-combined
          path: backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_BACKEND_TOKEN }}
        with:
          projectBaseDir: backend

  e2e-gate:
    name: (Backend) E2E Gate
    needs: changes
    # Skip on push — push-to-devel E2E runs share one concurrency group and
    # cascade-cancel each other, so E2E Tests (AO Operator) is skipped for push
    # events (see e2e-ao-operator.yml). No commit status is posted.
    if: needs.changes.outputs.backend == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for E2E commit status
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            let sha;
            if (context.eventName === 'merge_group') {
              sha = context.sha;
            } else {
              sha = context.payload.pull_request.head.sha;
            }
            const timeout = 70 * 60 * 1000; // 70 minutes
            const interval = 30 * 1000; // poll every 30s
            const start = Date.now();
            const required = ['E2E Tests (AO Operator)'];

            while (Date.now() - start < timeout) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const results = required.map(name => ({
                name,
                status: statuses.find(s => s.context === name),
              }));

              const failed = results.find(r => r.status?.state === 'failure' || r.status?.state === 'error');
              if (failed) {
                core.setFailed(`${failed.name} ${failed.status.state}: ${failed.status.target_url}`);
                return;
              }

              const allPassed = results.every(r => r.status?.state === 'success');
              if (allPassed) {
                console.log(`All E2E suites passed: ${required.join(', ')}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const summary = results.map(r => `${r.name}: ${r.status?.state ?? 'not reported yet'}`).join(', ');
              console.log(`${summary} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out waiting for E2E statuses: ${required.join(', ')}`);

  konflux-backend-gate:
    name: (Backend) Konflux Gate
    # Tekton PAC only fires on pull_request events (not merge_group or push).
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for Konflux conforma check
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const timeout = 85 * 60 * 1000;
            const startupWindow = 15 * 60 * 1000;
            const interval = 30 * 1000;
            const start = Date.now();
            const pipelineCheckName = 'Konflux kflux-prd-rh03 / ansible-automation-orchestrator-backend-devel-on-pull-request';
            const conformaCheckName = 'Red Hat Konflux / conforma-on-pull-request-devel / ansible-automation-orchestrator-backend-devel';

            // Phase 1: wait up to 15 minutes for the parent pipeline check to appear.
            // If it never appears the Tekton CEL did not match (no backend/ changes) — skip.
            console.log('Waiting for Konflux pipeline to start...');
            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: pipelineCheckName,
                per_page: 1,
              });
              if (data.check_runs.length > 0) {
                console.log('Konflux pipeline started — waiting for conforma check...');
                break;
              }
              const elapsed = Math.round((Date.now() - start) / 1000);
              if (Date.now() - start > startupWindow) {
                console.log(`Konflux pipeline never appeared after 15 minutes — Tekton CEL did not match, skipping`);
                return;
              }
              console.log(`Waiting for pipeline to start... (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }

            // Phase 2: pipeline fired — wait for conforma to pass, bailing early if
            // the parent pipeline itself fails before conforma runs (e.g. build error).
            while (Date.now() - start < timeout) {
              const { data: parentData } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: pipelineCheckName,
                per_page: 1,
              });
              const parentRun = parentData.check_runs[0];
              if (parentRun?.status === 'completed' && !['success', 'neutral'].includes(parentRun.conclusion)) {
                core.setFailed(`Konflux pipeline failed (${parentRun.conclusion}) before conforma ran: ${parentRun.html_url}`);
                return;
              }

              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: conformaCheckName,
                per_page: 100,
              });

              const runs = data.check_runs;
              const completed = runs.filter(r => r.status === 'completed');
              const succeeded = completed.filter(r => ['success', 'neutral'].includes(r.conclusion));
              const failed = completed.filter(r => !['success', 'neutral', 'cancelled', 'skipped'].includes(r.conclusion));

              if (failed.length > 0) {
                core.setFailed(`${conformaCheckName} failed (${failed[0].conclusion}): ${failed[0].html_url}`);
                return;
              }
              if (succeeded.length > 0) {
                const r = succeeded[0];
                const suffix = r.conclusion === 'neutral' ? ' (with warnings)' : '';
                console.log(`${conformaCheckName} passed${suffix}: ${r.html_url}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const state = runs.length === 0 ? 'not started yet' : runs[runs.length - 1].status;
              console.log(`${conformaCheckName}: ${state} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out after 85 minutes waiting for: ${conformaCheckName}`);

  required-checks:
    name: (Backend) Required Checks
    runs-on: ubuntu-latest
    needs:
      - changes
      - api-spec-validation
      - api-spec-bundle
      - api-spec-drift
      - generate-api-client
      - check-api-paths
      - check-dead-code
      - check-cycles
      - check-orphans
      - check-openapi-breaking
      - verify-test-structure
      - pre-commit
      - mypy
      - test-unit
      - test-cli
      - test-integration
      - test-compose
      - e2e-gate
      - konflux-backend-gate
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          # If no backend changes, pass immediately
          if [[ "${{ needs.changes.outputs.backend }}" == "false" ]]; then
            echo "No backend changes detected - skipping backend checks"
            exit 0
          fi

          # Check if changes job succeeded
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Detect Changes job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi

          # Check all other required jobs
          ok="success|skipped"
          for job in api-spec-validation api-spec-bundle api-spec-drift generate-api-client check-api-paths check-dead-code check-cycles check-orphans check-openapi-breaking verify-test-structure pre-commit mypy test-unit test-cli test-integration test-compose e2e-gate konflux-backend-gate; do
            case "$job" in
              api-spec-validation)   result="${{ needs.api-spec-validation.result }}" ;;
              api-spec-bundle)       result="${{ needs.api-spec-bundle.result }}" ;;
              api-spec-drift)        result="${{ needs.api-spec-drift.result }}" ;;
              generate-api-client)   result="${{ needs.generate-api-client.result }}" ;;
              check-api-paths)       result="${{ needs.check-api-paths.result }}" ;;
              check-dead-code)       result="${{ needs.check-dead-code.result }}" ;;
              check-cycles)          result="${{ needs.check-cycles.result }}" ;;
              check-orphans)         result="${{ needs.check-orphans.result }}" ;;
              check-openapi-breaking) result="${{ needs.check-openapi-breaking.result }}" ;;
              verify-test-structure) result="${{ needs.verify-test-structure.result }}" ;;
              pre-commit)            result="${{ needs.pre-commit.result }}" ;;
              mypy)                  result="${{ needs.mypy.result }}" ;;
              test-unit)             result="${{ needs.test-unit.result }}" ;;
              test-cli)              result="${{ needs.test-cli.result }}" ;;
              test-integration)      result="${{ needs.test-integration.result }}" ;;
              test-compose)          result="${{ needs.test-compose.result }}" ;;
              e2e-gate)              result="${{ needs.e2e-gate.result }}" ;;
              konflux-backend-gate)  result="${{ needs.konflux-backend-gate.result }}" ;;
            esac
            echo "$job: $result"
            if [[ ! "$result" =~ ^($ok)$ ]]; then
              echo "::error::Required job '$job' has result '$result'"
              exit 1
            fi
          done
          echo "All required checks passed"
