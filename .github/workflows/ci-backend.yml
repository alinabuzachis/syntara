---
name: CI Backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/setup-test-env/**'
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/setup-test-env/**'

concurrency:
  group: ci-backend-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('backend/.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
        working-directory: backend

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Run mypy (strict)
        run: make typecheck
        working-directory: backend

  check-migrations:
    runs-on: ubuntu-latest

    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: "3.12"

      - name: Check migrations
        run: make check-migrations
        working-directory: backend

  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        run: make test-unit-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-unit-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-unit/
          retention-days: 30
          include-hidden-files: true

  test-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}
          install-opa: 'false'

      - name: Run CLI tests with coverage
        run: make test-cli-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-cli-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-cli/
          retention-days: 30
          include-hidden-files: true

  test-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run integration tests with coverage
        run: make test-integration-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-integration-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-integration/
          retention-days: 30
          include-hidden-files: true

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Generate secrets
        run: make secrets-generate
        working-directory: backend

      - name: Start services with podman-compose
        timeout-minutes: 15
        env:
          APP_SEGMENT_WRITE_KEY: test-e2e-write-key
          APP_SEGMENT_ENDPOINT: http://mock-segment:9999
          APP_COLLECTION_INTERVAL_SECONDS: "10"
        run: |
          # Start core services + mock-segment (exclude nexus-ui which is private)
          uvx podman-compose -p nexus-ci --profile telemetry-e2e up --build -d database temporal nexus temporal-worker mcp-server opa mock-segment
        working-directory: backend

      - name: Verify services are healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          # Use exact container names (with _1 suffix) to avoid substring
          # matches — e.g. "nexus-ci_temporal" would also match
          # "nexus-ci_temporal-worker_1", causing podman wait to block on
          # a container we don't intend to check here.
          podman wait --condition=healthy \
            nexus-ci_database_1 \
            nexus-ci_temporal_1 \
            nexus-ci_nexus_1 \
            nexus-ci_mcp-server_1 \
            nexus-ci_opa_1 \
            nexus-ci_mock-segment_1
          echo "All services are healthy"

      - name: Create system user
        run: |
          # Re-run create_system_user after services are healthy so the
          # admins group (seeded during API startup) already exists.
          podman exec nexus-ci_nexus_1 uv run python tools/create_system_user.py

      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd backend && make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGMENT_SERVER_URL: http://localhost:9999

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Compose logs ==="
          uvx podman-compose -p nexus-ci --profile telemetry-e2e logs database temporal nexus temporal-worker mcp-server opa mock-segment
        working-directory: backend

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e down -v || true
        working-directory: backend

  combine:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-cli
      - test-integration
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Combine coverage reports
        run: |
          # Copy .coverage files from each artifact directory with unique suffixes
          # coverage combine will automatically find all .coverage.* files
          for artifact_dir in coverage-artifacts/*/; do
            if [ -f "${artifact_dir}backend/.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}backend/.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}backend/.coverage → .coverage.${artifact_name}"
            elif [ -f "${artifact_dir}.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}.coverage → .coverage.${artifact_name}"
            fi
          done

          # List coverage files ready to combine
          echo ""
          echo "Coverage files:"
          ls -la .coverage.* 2>/dev/null || { echo "No coverage files found"; exit 1; }

          # Combine all .coverage.* files into .coverage
          uv run coverage combine

          # Generate combined reports
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov
          uv run coverage report

          echo "Combined coverage from all test jobs"
        working-directory: backend

      - name: Save off PR Number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.number }}" > pr_number.txt

      - name: Upload PR Number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: backend-pr_number
          path: pr_number.txt

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-combined
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 30

  required-checks:
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - mypy
      - test-unit
      - test-cli
      - test-integration
      - test-compose
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          results="${{ toJSON(needs.*.result) }}"
          echo "Job results: $results"

          # Check if any job failed, was cancelled, or skipped
          # Note: Don't match on quotes since toJSON() escapes them
          if echo "$results" | grep -qE '(failure|cancelled|skipped)'; then
            echo "One or more required checks failed, were cancelled, or skipped"
            exit 1
          fi
          echo "All required checks passed"
