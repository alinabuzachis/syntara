---
name: CI Backend

on:
  pull_request:
    branches: [devel]
    paths:
      - 'backend/**'
      - '.github/**'
  merge_group:
    branches: [devel]
  push:
    branches: [devel]
    paths:
      - 'backend/**'
      - '.github/**'

concurrency:
  group: ci-backend-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Fetch devel branch for OpenAPI comparison
        run: git fetch origin devel:devel

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Cache pre-commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run --project backend pre-commit run --all-files
        env:
          SKIP: frontend-prettier,frontend-eslint,frontend-tsc
          OPENAPI_PR_BODY: ${{ github.event.pull_request.body }}

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Run mypy (strict)
        run: make typecheck
        working-directory: backend

  check-migrations:
    runs-on: ubuntu-latest

    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: "3.12"

      - name: Check migrations
        run: make check-migrations
        working-directory: backend

  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        run: make test-unit-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-unit-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-unit/
          retention-days: 30
          include-hidden-files: true

  test-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}
          install-opa: 'false'

      - name: Run CLI tests with coverage
        run: make test-cli-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-cli-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-cli/
          retention-days: 30
          include-hidden-files: true

  test-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run integration tests with coverage
        run: make test-integration-coverage
        working-directory: backend

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-integration-${{ matrix.python-version }}
          path: |
            backend/.coverage
            backend/htmlcov-integration/
          retention-days: 30
          include-hidden-files: true

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Generate secrets
        run: make secrets-generate
        working-directory: backend

      - name: Start services with podman-compose
        timeout-minutes: 15
        env:
          APP_SEGMENT_WRITE_KEY: test-e2e-write-key
          APP_SEGMENT_ENDPOINT: http://mock-segment:9999
          APP_COLLECTION_INTERVAL_SECONDS: "10"
        run: |
          # Start core services + mock-segment (exclude nexus-ui which is private)
          uvx podman-compose -p nexus-ci --profile telemetry-e2e up --build -d database temporal nexus temporal-worker mcp-server opa mock-segment

      - name: Verify services are healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          # Use exact container names (with _1 suffix) to avoid substring
          # matches — e.g. "nexus-ci_temporal" would also match
          # "nexus-ci_temporal-worker_1", causing podman wait to block on
          # a container we don't intend to check here.
          podman wait --condition=healthy \
            nexus-ci_database_1 \
            nexus-ci_temporal_1 \
            nexus-ci_nexus_1 \
            nexus-ci_mcp-server_1 \
            nexus-ci_opa_1 \
            nexus-ci_mock-segment_1
          echo "All services are healthy"

      - name: Create system user
        run: |
          # Re-run create_system_user after services are healthy so the
          # admins group (seeded during API startup) already exists.
          podman exec nexus-ci_nexus_1 uv run python tools/create_system_user.py

      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd backend && make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGMENT_SERVER_URL: http://localhost:9999

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Compose logs ==="
          uvx podman-compose -p nexus-ci --profile telemetry-e2e logs database temporal nexus temporal-worker mcp-server opa mock-segment

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e down -v || true

  openapi-breaking-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch devel branch for comparison
        run: git fetch origin devel:devel

      - name: Detect OpenAPI spec changes
        id: detect
        run: |
          if git diff --name-only origin/devel...HEAD | grep -qx 'backend/src/nexus/schemas/openapi.yaml'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oasdiff
        if: steps.detect.outputs.changed == 'true'
        run: ./scripts/openapi/install-oasdiff.sh
        working-directory: backend

      - name: Check for breaking changes
        if: steps.detect.outputs.changed == 'true'
        id: breaking
        continue-on-error: true
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq .body)
          ./scripts/openapi/check-breaking-changes.py \
            --base devel \
            --head HEAD \
            --output breaking-results.json \
            --pr-body "$PR_BODY"
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post breaking changes comment
        if: steps.detect.outputs.changed == 'true' && steps.breaking.outcome != 'skipped'
        run: |
          if [ -f breaking-results.json ]; then
            ./scripts/openapi/post-breaking-changes-comment.py \
              --results breaking-results.json \
              --pr-number ${{ github.event.pull_request.number }}
          fi
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check contract regeneration
        if: steps.detect.outputs.changed == 'true'
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq .body)
          ./scripts/openapi/check-companion-pr.py \
            --changed-files-from devel \
            --output companion-results.json \
            --pr-body "$PR_BODY"
          ./scripts/openapi/post-companion-pr-comment.py \
            --results companion-results.json \
            --pr-number ${{ github.event.pull_request.number }}
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}

  combine:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-cli
      - test-integration
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: backend-coverage-*
          path: backend/coverage-artifacts
          merge-multiple: false

      - name: Combine coverage reports
        run: |
          # Copy .coverage files from each artifact directory with unique suffixes
          # coverage combine will automatically find all .coverage.* files
          for artifact_dir in coverage-artifacts/*/; do
            if [ -f "${artifact_dir}backend/.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}backend/.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}backend/.coverage → .coverage.${artifact_name}"
            elif [ -f "${artifact_dir}.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}.coverage → .coverage.${artifact_name}"
            fi
          done

          # List coverage files ready to combine
          echo ""
          echo "Coverage files:"
          ls -la .coverage.* 2>/dev/null || { echo "No coverage files found"; exit 1; }

          # Combine all .coverage.* files into .coverage
          uv run coverage combine

          # Generate combined reports
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov
          uv run coverage report

          echo "Combined coverage from all test jobs"
        working-directory: backend

      - name: Save off PR Number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.number }}" > pr_number.txt

      - name: Upload PR Number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-pr_number
          path: pr_number.txt

      - name: Upload combined coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-combined
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 30

  required-checks:
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - mypy
      - test-unit
      - test-cli
      - test-integration
      - test-compose
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          results="${{ toJSON(needs.*.result) }}"
          echo "Job results: $results"

          # Check if any job failed, was cancelled, or skipped
          # Note: Don't match on quotes since toJSON() escapes them
          if echo "$results" | grep -qE '(failure|cancelled|skipped)'; then
            echo "One or more required checks failed, were cancelled, or skipped"
            exit 1
          fi
          echo "All required checks passed"
