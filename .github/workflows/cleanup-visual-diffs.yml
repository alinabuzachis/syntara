---
name: Cleanup Visual Diff Branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete visual-diffs branch for this PR
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const branch = `visual-diffs/pr-${context.issue.number}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch ${branch}`);
            } catch (err) {
              if (err.status === 422) {
                core.info(`Branch ${branch} does not exist — nothing to clean up`);
              } else {
                core.warning(`Failed to delete ${branch}: ${err.message}`);
              }
            }
