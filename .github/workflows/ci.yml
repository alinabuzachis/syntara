---
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Run mypy (strict)
        run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Install OPA CLI
        run: |
          OPA_VERSION="v1.4.2"
          curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static" -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa
          opa version

      - name: Generate secrets
        run: make secrets-generate

      - name: Check migrations
        run: make check-migrations

      - name: Run tests (excluding MCP) with coverage
        run: make test-coverage

      - name: Run MCP tests
        run: make test-mcp

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 30

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Generate secrets
        run: make secrets-generate

      - name: Start services with podman-compose
        timeout-minutes: 15
        env:
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_SEGMENT_WRITE_KEY: test-e2e-write-key
          APP_SEGMENT_ENDPOINT: http://mock-segment:9999
          APP_COLLECTION_INTERVAL_SECONDS: "10"
          E2E_LLM_CREDENTIAL_CONFIGURED: ${{ secrets.OPENROUTER_API_KEY && '1' || '' }}
        run: |
          # Start core services + mock-segment (exclude nexus-ui which is private)
          uvx podman-compose -p nexus-ci --profile telemetry-e2e up --build -d database temporal nexus temporal-worker mcp-server opa mock-segment

      - name: Verify services are healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          # Use exact container names (with _1 suffix) to avoid substring
          # matches — e.g. "nexus-ci_temporal" would also match
          # "nexus-ci_temporal-worker_1", causing podman wait to block on
          # a container we don't intend to check here.
          podman wait --condition=healthy \
            nexus-ci_database_1 \
            nexus-ci_temporal_1 \
            nexus-ci_nexus_1 \
            nexus-ci_mcp-server_1 \
            nexus-ci_opa_1 \
            nexus-ci_mock-segment_1
          echo "✅ All services are healthy"

      - name: Create system user
        run: |
          # Re-run create_system_user after services are healthy so the
          # admins group (seeded during API startup) already exists.
          podman exec nexus-ci_nexus_1 uv run python tools/create_system_user.py

      - name: Run E2E tests
        run: make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          E2E_LLM_CREDENTIAL_CONFIGURED: ${{ secrets.OPENROUTER_API_KEY && '1' || '' }}
          SEGMENT_SERVER_URL: http://localhost:9999

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Compose logs ==="
          uvx podman-compose -p nexus-ci --profile telemetry-e2e logs database temporal nexus temporal-worker mcp-server opa mock-segment

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e down -v || true

  combine:
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Save off PR Number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.number }}" > pr_number.txt

      - name: Upload PR Number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: pr_number
          path: pr_number.txt

      - name: Merge logs into a single archive
        # Should do nothing if job is retried
        uses: actions/upload-artifact/merge@v6
        with:
          name: coverage-report
          pattern: coverage-*
          delete-merged: true
          include-hidden-files: true
          separate-directories: true
