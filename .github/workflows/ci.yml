---
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Run mypy (strict)
        run: make typecheck

  check-migrations:
    runs-on: ubuntu-latest

    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: "3.12"

      - name: Check migrations
        run: make check-migrations

  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        run: make test-unit-coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: |
            .coverage
            htmlcov-unit/
          retention-days: 30
          include-hidden-files: true

  test-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}
          install-opa: 'false'

      - name: Run CLI tests with coverage
        run: make test-cli-coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cli-${{ matrix.python-version }}
          path: |
            .coverage
            htmlcov-cli/
          retention-days: 30
          include-hidden-files: true

  test-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run integration tests with coverage
        run: make test-integration-coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.python-version }}
          path: |
            .coverage
            htmlcov-integration/
          retention-days: 30
          include-hidden-files: true

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Generate secrets
        run: make secrets-generate

      - name: Start services with podman-compose
        timeout-minutes: 15
        env:
          APP_SEGMENT_WRITE_KEY: test-e2e-write-key
          APP_SEGMENT_ENDPOINT: http://mock-segment:9999
          APP_COLLECTION_INTERVAL_SECONDS: "10"
        run: |
          # Start core services + mock-segment (exclude nexus-ui which is private)
          uvx podman-compose -p nexus-ci --profile telemetry-e2e up --build -d database temporal nexus temporal-worker mcp-server opa mock-segment

      - name: Verify services are healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          # Use exact container names (with _1 suffix) to avoid substring
          # matches — e.g. "nexus-ci_temporal" would also match
          # "nexus-ci_temporal-worker_1", causing podman wait to block on
          # a container we don't intend to check here.
          podman wait --condition=healthy \
            nexus-ci_database_1 \
            nexus-ci_temporal_1 \
            nexus-ci_nexus_1 \
            nexus-ci_mcp-server_1 \
            nexus-ci_opa_1 \
            nexus-ci_mock-segment_1
          echo "✅ All services are healthy"

      - name: Create system user
        run: |
          # Re-run create_system_user after services are healthy so the
          # admins group (seeded during API startup) already exists.
          podman exec nexus-ci_nexus_1 uv run python tools/create_system_user.py

      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGMENT_SERVER_URL: http://localhost:9999

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Compose logs ==="
          uvx podman-compose -p nexus-ci --profile telemetry-e2e logs database temporal nexus temporal-worker mcp-server opa mock-segment

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e down -v || true

  combine:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-cli
      - test-integration
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Combine coverage reports
        run: |
          # Copy .coverage files from each artifact directory with unique suffixes
          # coverage combine will automatically find all .coverage.* files
          for artifact_dir in coverage-artifacts/*/; do
            if [ -f "${artifact_dir}.coverage" ]; then
              artifact_name=$(basename "$artifact_dir")
              cp "${artifact_dir}.coverage" ".coverage.${artifact_name}"
              echo "Copied ${artifact_dir}.coverage → .coverage.${artifact_name}"
            fi
          done

          # List coverage files ready to combine
          echo ""
          echo "📋 Coverage files:"
          ls -la .coverage.* 2>/dev/null || { echo "❌ No coverage files found"; exit 1; }

          # Combine all .coverage.* files into .coverage
          uv run coverage combine

          # Generate combined reports
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov
          uv run coverage report

          echo "✅ Combined coverage from all test jobs"

      - name: Save off PR Number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.number }}" > pr_number.txt

      - name: Upload PR Number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: pr_number
          path: pr_number.txt

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  # This check is needed to make tekton build required only on PRs,
  # not on merge queues.
  check-tekton-build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Tekton build passed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          check_name="ansible-automation-orchestrator-backend-main-on-pull-request"
          timeout=3600
          interval=30
          elapsed=0

          while [ "$elapsed" -lt "$timeout" ]; do
            check_data=$(gh api "repos/${{ github.repository }}/commits/${sha}/check-runs" \
              --jq "[.check_runs[] | select(.name | contains(\"${check_name}\"))] | sort_by(.started_at) | last | {status: .status, conclusion: .conclusion}" \
              2>/dev/null)

            status=$(echo "$check_data" | jq -r '.status // empty')
            conclusion=$(echo "$check_data" | jq -r '.conclusion // empty')

            echo "Tekton check '${check_name}': status=${status:-not_found}, conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "✅ Tekton build passed"
                exit 0
              else
                echo "❌ Tekton build ${conclusion}"
                exit 1
              fi
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "❌ Tekton check did not complete within ${timeout}s"
          exit 1

  required-checks:
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - mypy
      - test-unit
      - test-cli
      - test-integration
      - test-compose
      - check-tekton-build
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          results="${{ toJSON(needs.*.result) }}"
          echo "Job results: $results"

          # Check if any job failed, was cancelled, or skipped
          # Note: Don't match on quotes since toJSON() escapes them
          if echo "$results" | grep -qE '(failure|cancelled|skipped)'; then
            echo "❌ One or more required checks failed, were cancelled, or skipped"
            exit 1
          fi
          echo "✅ All required checks passed"
