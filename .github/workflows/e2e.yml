---
name: E2E Tests

on:
  workflow_run:
    workflows: ["CI Backend", "CI Frontend"]
    types: [requested]
  workflow_dispatch:

permissions:
  statuses: write
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: aap-dev
    if: github.event.workflow_run.event != 'merge_group'
    steps:
      - name: Report pending status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'pending',
              context: 'E2E Tests',
              description: 'E2E tests in progress...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        if: github.event_name == 'workflow_run'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Deploy Nexus
        uses: ./.github/actions/deploy-nexus
        with:
          deployment-mode: standalone
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          rh-registry-token: ${{ secrets.RH_REGISTRY_TOKEN }}
          rh-registry-user: ${{ secrets.RH_REGISTRY_USER }}
          quay-user: ${{ secrets.QUAY_USER }}
          quay-token: ${{ secrets.QUAY_TOKEN }}
          quay-aap-user: ${{ secrets.QUAY_AAP_USER }}
          quay-aap-token: ${{ secrets.QUAY_AAP_TOKEN }}

      - name: Export KUBECONFIG
        if: always()
        run: echo "KUBECONFIG=${{ github.workspace }}/aap-dev/.tmp/27.kubeconfig" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up SSH for private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EXTERNAL_SERVICES_DEPLOY_KEY }}

      - name: Install dependencies
        working-directory: backend
        run: make install-integration

      - name: Generate secrets
        working-directory: backend
        run: make secrets-generate

      - name: Inject JWT signing key into cluster
        working-directory: backend
        run: |
          JWT_KEY_B64=$(base64 -w 0 .secrets/jwt-primary.pem)
          kubectl create secret generic myaap-ao-jwt-key \
            --from-literal=APP_JWT_PRIVATE_KEY_BASE64="$JWT_KEY_B64" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl set env deployment/myaap-ao-api --from=secret/myaap-ao-jwt-key
          kubectl set env deployment/myaap-ao-worker --from=secret/myaap-ao-jwt-key
          kubectl rollout status deployment/myaap-ao-api --timeout=120s
          kubectl rollout status deployment/myaap-ao-worker --timeout=120s

      - name: Initialize admin password
        working-directory: backend
        run: |
          POD=$(kubectl get endpoints myaap-ao-api -o jsonpath='{.subsets[0].addresses[0].targetRef.name}')
          kubectl exec -i "${POD}" -- sh -c 'cat > /opt/app-root/src/tools/set_admin_password.py' < tools/set_admin_password.py
          cat .secrets/admin-password | kubectl exec -i "${POD}" -- sh -c 'cd /opt/app-root/src && uv run python tools/set_admin_password.py'

      - name: Create system user
        working-directory: backend
        run: |
          POD=$(kubectl get endpoints myaap-ao-api -o jsonpath='{.subsets[0].addresses[0].targetRef.name}')
          kubectl exec -i "${POD}" -- sh -c 'cat > /opt/app-root/src/tools/create_system_user.py' < tools/create_system_user.py
          kubectl exec "${POD}" -- sh -c 'cd /opt/app-root/src && uv run python tools/create_system_user.py'

      - name: Deploy test helpers in cluster
        working-directory: backend
        run: |
          # --- MCP server (build inside Kind node so it's available to K8s) ---
          export MCP_IMAGE="localhost/nexus-mcp:e2e"
          KIND_NODE="27-control-plane"
          podman build -t "${MCP_IMAGE}" -f containers/mcp/Containerfile .
          podman save "${MCP_IMAGE}" | podman exec -i "${KIND_NODE}" ctr --namespace=k8s.io images import -

          kubectl apply -f tools/ci/e2e/mock-segment-pod.yaml
          kubectl apply -f tools/ci/e2e/mock-segment-svc.yaml
          envsubst < tools/ci/e2e/mcp-server-pod.yaml | kubectl apply -f -
          envsubst < tools/ci/e2e/mcp-server-svc.yaml | kubectl apply -f -

          kubectl wait --for=condition=ready pod/mock-segment --timeout=60s
          kubectl wait --for=condition=ready pod/mcp-server --timeout=60s

      - name: Configure worker internal API URLs
        run: |
          kubectl set env deployment/myaap-ao-worker \
            APP_APPROVALS_API_BASE_URL=http://myaap-ao-api:8000/api/v1 \
            APP_AGENT_ORCHESTRATOR_BASE_URL=http://myaap-ao-api:8000/api/v1

      - name: Configure Nexus to send telemetry to mock Segment
        run: |
          kubectl set env deployment/myaap-ao-api \
            APP_SEGMENT_WRITE_KEY=test-e2e-write-key \
            APP_SEGMENT_ENDPOINT="http://mock-segment:9999" \
            APP_COLLECTION_INTERVAL_SECONDS=10
          kubectl set env deployment/myaap-ao-worker \
            APP_SEGMENT_WRITE_KEY=test-e2e-write-key \
            APP_SEGMENT_ENDPOINT="http://mock-segment:9999" \
            APP_COLLECTION_INTERVAL_SECONDS=10
          kubectl rollout status deployment/myaap-ao-api --timeout=120s
          kubectl rollout status deployment/myaap-ao-worker --timeout=120s

      - name: Verify worker internal API config
        run: |
          WORKER_POD=$(kubectl get pods -l app.kubernetes.io/component=worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null \
            || kubectl get pods -o name | grep worker | head -1 | sed 's|pod/||')
          echo "Worker pod: ${WORKER_POD}"
          echo "--- APP_APPROVALS_API_BASE_URL ---"
          kubectl exec "${WORKER_POD}" -- printenv APP_APPROVALS_API_BASE_URL || echo "(not set — will default to localhost:8000)"
          echo "--- DNS check: myaap-ao-api ---"
          kubectl exec "${WORKER_POD}" -- getent hosts myaap-ao-api || echo "(DNS lookup failed)"

      - name: Port-forward services
        run: |
          resilient_port_forward() {
            local svc=$1 local_port=$2 remote_port=$3
            while true; do
              kubectl port-forward "svc/$svc" "$local_port:$remote_port" 2>/dev/null || true
              sleep 1
            done
          }

          resilient_port_forward myaap-ao-api 8000 8000 &
          resilient_port_forward mock-segment 9999 9999 &
          resilient_port_forward mcp-server 8765 8765 &

          wait_for() {
            local url=$1 label=$2 timeout=$3
            for i in $(seq 1 "$timeout"); do
              curl -sf "$url" > /dev/null 2>&1 && return 0
              sleep 1
            done
            echo "::error::${label} not reachable after ${timeout}s"
            return 1
          }

          wait_for http://localhost:8000/health "Nexus API" 60
          wait_for http://localhost:9999/health "Mock Segment" 30
          wait_for http://localhost:8765/health "MCP server" 30

      - name: Run E2E tests
        working-directory: backend
        run: make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000
          APP_WORKER_BASE_URL: http://myaap-ao-api:8000
          APP_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGMENT_SERVER_URL: http://localhost:9999
          GKE_CLUSTER_ENDPOINT: ${{ secrets.GKE_CLUSTER_ENDPOINT }}
          GKE_CLUSTER_API_KEY: ${{ secrets.GKE_CLUSTER_API_KEY }}
          GKE_CLUSTER_DOMAIN: ${{ secrets.GKE_CLUSTER_DOMAIN }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_USER_PASSWORD: ${{ secrets.AZURE_AD_USER_PASSWORD }}

      - name: Save service logs on failure
        if: failure()
        run: |
          KUBECONFIG="${{ github.workspace }}/aap-dev/.tmp/27.kubeconfig"
          export KUBECONFIG
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::warning::KUBECONFIG not found at $KUBECONFIG — KinD cluster may not have been created"
            exit 0
          fi
          mkdir -p /tmp/nexus-e2e-logs
          echo "=== Pod status ==="
          kubectl get pods -o wide 2>&1 | tee /tmp/nexus-e2e-logs/pod-status.txt
          echo ""
          echo "=== Pod events ==="
          kubectl get events --sort-by='.lastTimestamp' 2>&1 | tee /tmp/nexus-e2e-logs/events.txt
          echo ""
          for pod in $(kubectl get pods -o name 2>/dev/null); do
            pod_name="${pod#pod/}"
            echo "=== Logs: $pod_name ==="
            kubectl logs "$pod" --all-containers --ignore-errors 2>&1 | tee "/tmp/nexus-e2e-logs/${pod_name}.log"
            echo ""
            echo "=== Init container logs: $pod_name ==="
            for init in $(kubectl get pod "$pod_name" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
              echo "--- $init ---"
              kubectl logs "$pod_name" -c "$init" 2>&1 | tee -a "/tmp/nexus-e2e-logs/${pod_name}-init-${init}.log"
            done
            echo ""
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-logs
          path: /tmp/nexus-e2e-logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: aap-dev
        run: make clean

      - name: Report final status
        if: always() && github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: state,
              context: 'E2E Tests',
              description: `E2E tests ${state}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
