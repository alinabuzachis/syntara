---
name: E2E Tests

on:
  workflow_run:
    workflows: ["CI"]
    types: [requested]

jobs:
  test-e2e:
    runs-on: aap-dev
    # Only run for PRs — push-to-main already has secrets available in CI
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Report pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'pending',
              context: 'E2E Tests',
              description: 'E2E tests in progress...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          repository: ${{ github.event.workflow_run.head_repository.full_name }}

      - name: Deploy Nexus
        uses: ./.github/actions/deploy-nexus
        with:
          deployment-mode: standalone
          nexus-ref: ${{ github.event.workflow_run.head_sha }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          rh-registry-token: ${{ secrets.RH_REGISTRY_TOKEN }}
          rh-registry-user: ${{ secrets.RH_REGISTRY_USER }}
          quay-user: ${{ secrets.QUAY_USER }}
          quay-token: ${{ secrets.QUAY_TOKEN }}
          quay-aap-user: ${{ secrets.QUAY_AAP_USER }}
          quay-aap-token: ${{ secrets.QUAY_AAP_TOKEN }}

      - name: Port-forward Nexus API
        run: kubectl port-forward svc/myaap-ao-api 8000:8000 &

      - name: Install dependencies
        working-directory: aap-dev/src/nexus
        run: make install

      - name: Run E2E tests
        working-directory: aap-dev/src/nexus
        run: make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000

      - name: Cleanup
        if: always()
        working-directory: aap-dev
        run: make clean

      - name: Report final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: state,
              context: 'E2E Tests',
              description: `E2E tests ${state}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
