---
name: E2E Tests

on:
  workflow_run:
    workflows: ["CI"]
    types: [requested]

jobs:
  test-e2e:
    runs-on: aap-dev
    steps:
      # Disabled: e2e tests are non-blocking for PRs
      # - name: Report pending status
      #   if: github.event.workflow_run.event == 'pull_request'
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       await github.rest.repos.createCommitStatus({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         sha: '${{ github.event.workflow_run.head_sha }}',
      #         state: 'pending',
      #         context: 'E2E Tests',
      #         description: 'E2E tests in progress...',
      #         target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
      #       });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Nexus
        uses: ./.github/actions/deploy-nexus
        with:
          deployment-mode: standalone
          nexus-ref: ${{ github.event.workflow_run.head_sha }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          rh-registry-token: ${{ secrets.RH_REGISTRY_TOKEN }}
          rh-registry-user: ${{ secrets.RH_REGISTRY_USER }}
          quay-user: ${{ secrets.QUAY_USER }}
          quay-token: ${{ secrets.QUAY_TOKEN }}
          quay-aap-user: ${{ secrets.QUAY_AAP_USER }}
          quay-aap-token: ${{ secrets.QUAY_AAP_TOKEN }}

      - name: Export KUBECONFIG
        run: echo "KUBECONFIG=${{ github.workspace }}/aap-dev/.tmp/27.kubeconfig" >> "$GITHUB_ENV"

      - name: Port-forward Nexus API
        run: kubectl port-forward svc/myaap-ao-api 8000:8000 &


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: aap-dev/src/nexus
        run: make install

      - name: Run E2E tests
        working-directory: aap-dev/src/nexus
        run: make test-e2e
        env:
          APP_BASE_URL: http://localhost:8000

      - name: Cleanup
        if: always()
        working-directory: aap-dev
        run: make clean

    # Disabled: e2e tests are non-blocking for PRs
