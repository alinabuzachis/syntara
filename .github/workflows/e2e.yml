name: E2E Test

on:
  push:
    branches: [main, agent_orchestrator_architecture]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies with uv
      run: |
        uv sync --all-extras

    - name: Create .env file
      run: |
        cat > .env << EOF
        # Database configuration (matches podman-compose.yml defaults)
        NEXUS_DB_HOST=localhost
        NEXUS_DB_PORT=5432
        NEXUS_DB_USER=admin
        NEXUS_DB_PASSWORD=admin
        NEXUS_DB_NAME=nexus_api

        # OpenRouter API Key
        OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
        EOF

    - name: Build generic-agent image
      run: |
        # Build the generic-agent image locally before starting services
        docker build -f containers/nexus_agents/Containerfile -t nexus/nexus_agents:latest .

    - name: Start services with docker compose
      run: |
        # Use docker compose to start services defined in podman-compose.yml
        docker compose -f podman-compose.yml up -d generic-agent

        echo "Waiting for services to be healthy..."
        # Wait for database
        for i in {1..30}; do
          if docker compose -f podman-compose.yml exec -T database pg_isready -U admin -d nexus_api > /dev/null 2>&1; then
            echo "✅ Database is ready"
            break
          fi
          echo "  Waiting for database... ($i/30)"
          sleep 2
        done

        # Wait for generic-agent
        for i in {1..30}; do
          if curl -s http://localhost:8001/.well-known/agent-card.json > /dev/null; then
            echo "✅ Generic agent is ready"
            break
          fi
          echo "  Waiting for generic-agent... ($i/30)"
          sleep 2
        done

    - name: Verify services
      run: |
        echo "=== Service Status ==="
        docker compose -f podman-compose.yml ps

        echo -e "\n=== Generic Agent Card ==="
        curl -s http://localhost:8001/.well-known/agent-card.json | jq -r '.name, .version'

    - name: Run E2E tests
      env:
        GENERIC_AGENT_URL: http://localhost:8001
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        TEST_MODEL: openai/gpt-4o-mini
      run: |
        # Run all E2E tests
        # Tests are organized under tests/e2e/ with subdirectories per agent
        uv run pytest tests/e2e/ -v -s --tb=short --confcutdir=tests/e2e

    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Generic Agent Logs ==="
        docker compose -f podman-compose.yml logs generic-agent

        echo -e "\n=== Database Logs ==="
        docker compose -f podman-compose.yml logs database

    - name: Cleanup
      if: always()
      run: |
        docker compose -f podman-compose.yml down -v
