---
name: E2E Tests

on:
  workflow_run:
    workflows: ['Pull Request', 'Deploy to Production']
    types: [requested]

permissions:
  statuses: write
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: aap-dev
    steps:
      - name: Report pending status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'pending',
              context: 'E2E Tests',
              description: 'E2E tests in progress...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout nexus-ui
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      # --- Node.js deps: start in background while Nexus deploys ---
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/nexus-ui/package.json') }}

      - name: Install npm + Playwright in background
        run: |
          (
            set -euo pipefail
            npm ci
            if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
              cd packages/nexus-ui && npx playwright install-deps chromium
            else
              cd packages/nexus-ui && npx playwright install --with-deps chromium
            fi
            echo $? > /tmp/deps-install.exit
          ) > /tmp/deps-install.log 2>&1 || echo $? > /tmp/deps-install.exit &
          echo $! > /tmp/deps-install.pid
          echo "Started background install (PID $(cat /tmp/deps-install.pid))"

      # --- Deploy Nexus cluster (runs in parallel with npm/Playwright install) ---
      - name: Generate token for syntara-orchestration org
        id: token-nexus
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: syntara-orchestration
          repositories: nexus

      - name: Checkout nexus (for deploy-nexus action)
        uses: actions/checkout@v6
        with:
          repository: syntara-orchestration/syntara
          path: _nexus
          token: ${{ steps.token-nexus.outputs.token }}

      - name: Deploy Nexus
        uses: ./_nexus/.github/actions/deploy-nexus
        with:
          deployment-mode: standalone
          nexus-ui-ref: ${{ github.event.workflow_run.head_sha }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          rh-registry-token: ${{ secrets.RH_REGISTRY_TOKEN }}
          rh-registry-user: ${{ secrets.RH_REGISTRY_USER }}
          quay-user: ${{ secrets.QUAY_USER }}
          quay-token: ${{ secrets.QUAY_TOKEN }}
          quay-aap-user: ${{ secrets.QUAY_AAP_USER }}
          quay-aap-token: ${{ secrets.QUAY_AAP_TOKEN }}

      - name: Export KUBECONFIG
        run: echo "KUBECONFIG=${{ github.workspace }}/aap-dev/.tmp/27.kubeconfig" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        working-directory: aap-dev/src/nexus
        run: make install

      - name: Generate secrets
        working-directory: aap-dev/src/nexus
        run: make secrets-generate

      - name: Inject JWT signing key into cluster
        working-directory: aap-dev/src/nexus
        run: |
          JWT_KEY_B64=$(base64 -w 0 .secrets/jwt-primary.pem)
          kubectl create secret generic myaap-ao-jwt-key \
            --from-literal=APP_JWT_PRIVATE_KEY_BASE64="$JWT_KEY_B64" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl set env deployment/myaap-ao-api --from=secret/myaap-ao-jwt-key
          kubectl set env deployment/myaap-ao-worker --from=secret/myaap-ao-jwt-key
          kubectl rollout status deployment/myaap-ao-api --timeout=120s
          kubectl rollout status deployment/myaap-ao-worker --timeout=120s

      - name: Initialize admin password
        working-directory: aap-dev/src/nexus
        run: |
          POD=$(kubectl get endpoints myaap-ao-api -o jsonpath='{.subsets[0].addresses[0].targetRef.name}')
          kubectl exec -i "${POD}" -- sh -c 'cat > /opt/app-root/src/tools/set_admin_password.py' < tools/set_admin_password.py
          cat .secrets/admin-password | kubectl exec -i "${POD}" -- sh -c 'cd /opt/app-root/src && uv run python tools/set_admin_password.py'

      - name: Seed database (settings, credential types, authz, default project)
        run: |
          POD=$(kubectl get endpoints myaap-ao-api -o jsonpath='{.subsets[0].addresses[0].targetRef.name}')
          kubectl exec "${POD}" -- sh -c 'cd /opt/app-root/src && uv run python -m nexus.seed'

      # --- Wait for background npm/Playwright install to finish ---
      - name: Wait for npm + Playwright install
        run: |
          PID=$(cat /tmp/deps-install.pid)
          echo "Waiting for background install (PID $PID)..."
          while kill -0 "$PID" 2>/dev/null; do
            sleep 2
          done
          EXIT_CODE=$(cat /tmp/deps-install.exit 2>/dev/null || echo "1")
          if [ "$EXIT_CODE" = "0" ]; then
            echo "Background install completed successfully"
          else
            echo "::error::Background install failed (exit $EXIT_CODE). Logs:"
            cat /tmp/deps-install.log
            exit 1
          fi

      - name: Port-forward Nexus UI
        run: |
          kubectl port-forward svc/myaap-ao-ui 8000:80 &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/health > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::Service did not become healthy after 20s"
          exit 1

      - name: Read admin password
        working-directory: aap-dev/src/nexus
        run: |
          password=$(cat .secrets/admin-password)
          echo "::add-mask::$password"
          echo "NEXUS_E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Run E2E tests
        working-directory: packages/nexus-ui
        run: npx playwright test --retries=1
        env:
          NEXUS_E2E_SKIP_WEB_SERVER: '1'
          NEXUS_E2E_BASE_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/nexus-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: aap-dev
        run: make clean

      - name: Report final status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: state,
              context: 'E2E Tests',
              description: `E2E tests ${state}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
