---
name: Visual Regression (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend/packages/nexus-ui

      - name: Run page screenshot tests
        id: screenshots
        run: npx playwright test e2e/visual-regression/page-screenshots.spec.ts
        working-directory: frontend/packages/nexus-ui
        continue-on-error: true

      - name: Check visual baselines
        id: baselines
        run: npm exec tsx -- scripts/check-visual-baselines.ts
        working-directory: frontend/packages/nexus-ui
        continue-on-error: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-screenshots
          path: |
            frontend/packages/nexus-ui/e2e/visual-regression/page-screenshots.spec.ts-snapshots/
            frontend/packages/nexus-ui/test-results/
          retention-days: 30

      - name: Upload diff report on failure
        if: steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diffs
          path: frontend/packages/nexus-ui/test-results/
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-html-report
          path: frontend/packages/nexus-ui/playwright-report/
          retention-days: 30

      - name: Generate visual diff report
        if: steps.screenshots.outcome == 'failure'
        id: diff-report
        continue-on-error: true
        run: node scripts/generate-visual-diff-report.js
        working-directory: frontend/packages/nexus-ui

      - name: Write visual diff to Job Summary
        if: always()
        working-directory: frontend
        run: |
          SCREENSHOTS_OUTCOME="${{ steps.screenshots.outcome }}"
          BASELINES_OUTCOME="${{ steps.baselines.outcome }}"

          if [[ "$SCREENSHOTS_OUTCOME" == "success" && "$BASELINES_OUTCOME" != "failure" ]]; then
            echo "### :white_check_mark: Visual Regression — all screenshots match baselines" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [[ "$BASELINES_OUTCOME" == "failure" ]]; then
            echo "### :warning: Baseline coverage check failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Missing baselines or uncovered routes detected. See the step log above for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          SUMMARY_FILE="packages/nexus-ui/visual-diff-summary.json"
          if [ ! -f "$SUMMARY_FILE" ]; then
            if [[ "$SCREENSHOTS_OUTCOME" == "failure" ]]; then
              echo "### :x: Visual Regression — screenshot tests failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Check the workflow logs and download the **visual-regression-diffs** artifact for details." >> $GITHUB_STEP_SUMMARY
            fi
            exit 0
          fi

          COUNT=$(jq '.count' "$SUMMARY_FILE")
          echo "### :x: Visual Regression — ${COUNT} screenshot(s) differ" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          INLINE=$(jq -r '.inlineImages // false' "$SUMMARY_FILE")
          if [ "$INLINE" = "true" ]; then
            echo "| Screenshot | Expected | Actual | Diff |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|----------|--------|------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.files[] | "| `\(.name)` | ![\(.name)-expected](\(.expectedPath // "—")) | ![\(.name)-actual](\(.actualPath // "—")) | ![\(.name)-diff](\(.diffPath)) |"' "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Screenshot | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.changed[] | "| `\(.)` | :x: changed |"' "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **visual-regression-diffs** artifact for full image comparison." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **visual-regression-html-report** artifact for interactive Playwright review." >> $GITHUB_STEP_SUMMARY
