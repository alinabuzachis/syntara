---
name: Label PR
on:
  pull_request:
    types: [opened, synchronize, reopened] # cover full PR lifecycle so labels stay accurate after force-pushes or reopens
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          sync-labels: true
