---
name: SAST Snyk Code (Frontend)

on:
  schedule:
    - cron: '23 14 * * *'
  push:
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/sast-snyk-frontend.yml'
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: snyk/actions/setup@v1

      - name: Generate code vulnerability report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --project-name="${{ github.repository }}" --report ${{ github.workspace }}/frontend
        continue-on-error: true
