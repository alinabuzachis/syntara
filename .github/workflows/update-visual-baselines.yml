name: Update Visual Baselines

# Triggered by a PR comment: /update-screenshots
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baselines:
    name: Generate & Commit Baselines
    # Baselines must run with mock webServer; do not inherit org/repo env that sets
    # NEXUS_E2E_SKIP_WEB_SERVER for real-backend E2E (would skip all snapshot tests).
    env:
      NEXUS_E2E_SKIP_WEB_SERVER: ''
    if: >-
      github.event.issue.pull_request
      && contains(github.event.comment.body, '/update-screenshots')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const sameRepo = pr.data.head.repo.full_name === baseRepo;
            if (!sameRepo) {
              core.setFailed('Refusing to run /update-screenshots on fork PRs.');
              return;
            }
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/nexus-ui

      - name: Generate screenshots
        run: npx playwright test e2e/visual-regression/page-screenshots.spec.ts --update-snapshots
        working-directory: packages/nexus-ui

      - name: Commit updated baselines
        id: commit
        working-directory: packages/nexus-ui
        env:
          PR_REF: ${{ steps.pr.outputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual-regression/page-screenshots.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            ADDED=$(git diff --cached --diff-filter=A --name-only | wc -l | tr -d ' ')
            MODIFIED=$(git diff --cached --diff-filter=M --name-only | wc -l | tr -d ' ')
            git commit -m "chore: update visual regression baselines (${ADDED} new, ${MODIFIED} changed)"
            git push origin "HEAD:${PR_REF}"
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "added=${ADDED}" >> $GITHUB_OUTPUT
            echo "modified=${MODIFIED}" >> $GITHUB_OUTPUT
          fi

      - name: Post result comment
        uses: actions/github-script@v9
        with:
          script: |
            const committed = '${{ steps.commit.outputs.committed }}' === 'true';
            const added = '${{ steps.commit.outputs.added }}';
            const modified = '${{ steps.commit.outputs.modified }}';

            let body;
            if (committed) {
              body = [
                '### :camera: Visual baselines updated',
                '',
                `- **${added}** new baseline(s) added`,
                `- **${modified}** existing baseline(s) updated`,
                '',
                'The updated `-linux.png` files have been committed to this branch.',
                'Review the image diffs in the Files Changed tab.',
              ].join('\n');
            } else {
              body = [
                '### :white_check_mark: Visual baselines already up to date',
                '',
                'No screenshot changes detected — all baselines match.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
