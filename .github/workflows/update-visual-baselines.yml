---
name: Update Visual Baselines

# Dispatched by update-screenshots-listener.yml after validating a
# /update-screenshots PR comment. Using workflow_dispatch instead of
# issue_comment prevents bot report comments (which contain the literal
# text "/update-screenshots") from creating ghost "skipped" runs.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      pr_ref:
        description: 'PR head branch ref'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-screenshots-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Generate & Commit Baselines
    # Baselines must run with mock webServer; do not inherit org/repo env that sets
    # NEXUS_E2E_SKIP_WEB_SERVER for real-backend E2E (would skip all snapshot tests).
    env:
      NEXUS_E2E_SKIP_WEB_SERVER: ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.pr_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend/packages/nexus-ui

      - name: Generate screenshots
        id: screenshots
        continue-on-error: true
        run: npx playwright test e2e/visual-regression/page-screenshots.spec.ts --update-snapshots
        working-directory: frontend/packages/nexus-ui

      - name: Upload Playwright results on failure
        if: steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-update-baselines-results
          path: |
            frontend/packages/nexus-ui/test-results/
            frontend/packages/nexus-ui/playwright-report/
          retention-days: 7

      - name: Commit updated baselines
        id: commit
        continue-on-error: true
        working-directory: frontend/packages/nexus-ui
        env:
          PR_REF: ${{ inputs.pr_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual-regression/page-screenshots.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            ADDED=$(git diff --cached --diff-filter=A --name-only | wc -l | tr -d ' ')
            MODIFIED=$(git diff --cached --diff-filter=M --name-only | wc -l | tr -d ' ')
            git commit -m "chore: update visual regression baselines (${ADDED} new, ${MODIFIED} changed)"
            git push origin "HEAD:${PR_REF}"
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "added=${ADDED}" >> $GITHUB_OUTPUT
            echo "modified=${MODIFIED}" >> $GITHUB_OUTPUT
          fi

      - name: Post result comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
          ADDED: ${{ steps.commit.outputs.added }}
          MODIFIED: ${{ steps.commit.outputs.modified }}
          TESTS_FAILED: ${{ steps.screenshots.outcome == 'failure' || steps.screenshots.conclusion == 'failure' }}
          COMMIT_FAILED: ${{ steps.commit.outcome == 'failure' }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const committed = process.env.COMMITTED === 'true';
            const added = process.env.ADDED || '0';
            const modified = process.env.MODIFIED || '0';
            const testsFailed = process.env.TESTS_FAILED === 'true';
            const commitFailed = process.env.COMMIT_FAILED === 'true';
            const commitOutcome = process.env.COMMIT_OUTCOME || '';
            const runUrl = process.env.RUN_URL;

            let body;
            if (commitFailed && testsFailed) {
              body = [
                '### :x: Visual baselines not updated — screenshot generation and commit both failed',
                '',
                'Screenshot generation failed, and the commit step also encountered an error.',
                '',
                `Check the [workflow run](${runUrl}) logs and the \`frontend-update-baselines-results\` artifact for details.`,
              ].join('\n');
            } else if (commitFailed) {
              body = [
                '### :x: Visual baselines not updated — commit/push failed',
                '',
                'Screenshots were generated but could not be committed to the branch.',
                '',
                `Check the [workflow run](${runUrl}) logs for details.`,
              ].join('\n');
            } else if (committed && testsFailed) {
              body = [
                '### :camera: Visual baselines partially updated',
                '',
                `- **${added}** new baseline(s) added`,
                `- **${modified}** existing baseline(s) updated`,
                '',
                ':warning: Some screenshot tests failed — baselines for passing tests were committed, but failing tests still need fixes in `page-registry.ts`.',
                '',
                `Check the [workflow run](${runUrl}) logs and the \`frontend-update-baselines-results\` artifact for details.`,
              ].join('\n');
            } else if (committed) {
              body = [
                '### :camera: Visual baselines updated',
                '',
                `- **${added}** new baseline(s) added`,
                `- **${modified}** existing baseline(s) updated`,
                '',
                'The updated `-linux.png` files have been committed to this branch.',
                'Review the image diffs in the Files Changed tab.',
              ].join('\n');
            } else if (testsFailed) {
              body = [
                '### :warning: Visual baselines not updated — test failures',
                '',
                'Screenshot generation failed for one or more pages. No baselines were committed.',
                '',
                `Check the [workflow run](${runUrl}) logs and the \`frontend-update-baselines-results\` artifact for details — the \`page-registry.ts\` entry likely has a locator or setup error.`,
              ].join('\n');
            } else if (commitOutcome !== 'success') {
              body = [
                '### :warning: Visual baselines update did not complete',
                '',
                'The workflow hit an error before baseline generation completed.',
                '',
                `Check the [workflow run](${runUrl}) logs for details.`,
              ].join('\n');
            } else {
              body = [
                '### :white_check_mark: Visual baselines already up to date',
                '',
                'No screenshot PNG changes were committed — generated images match the baselines already on this branch.',
                '',
                'If the **Visual Regression** check on this PR still fails, the failing test may have errored during `setup`/`waitFor` (no screenshot taken). Download the PR `frontend-visual-regression-diffs` artifact or inspect the [workflow run](${runUrl}) logs.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Fail job if screenshots had errors
        if: steps.screenshots.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::Screenshot generation or commit had failures — see comment on PR"
          exit 1
