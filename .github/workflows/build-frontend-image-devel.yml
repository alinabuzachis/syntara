---
name: Deploy Frontend to Production

on:
  push:
    branches:
      - devel
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend-image-devel.yml'
  workflow_dispatch:

jobs:
  # Tests run here (in addition to ci-frontend.yml) solely to generate coverage data for SonarCloud.
  # They do not gate the build-image or deploy jobs — that enforcement happens on PRs before merge.
  unit-tests:
    name: Unit Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run unit test shard with coverage
        id: unit-test-shard
        run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4
        working-directory: frontend/packages/nexus-ui
        env:
          VITEST_COVERAGE_DIR: coverage/shard-${{ matrix.shard }}

      - name: Upload shard coverage artifact
        if: steps.unit-test-shard.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-test-coverage-${{ matrix.shard }}
          path: frontend/packages/nexus-ui/coverage/shard-${{ matrix.shard }}/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: frontend-unit-test-coverage-*
          path: frontend/packages/nexus-ui/coverage-artifacts

      - name: Merge shard coverage reports
        run: npm run test:coverage:merge
        working-directory: frontend/packages/nexus-ui

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/nexus-ui/coverage
          if-no-files-found: error
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: coverage-report
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download merged coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/nexus-ui/coverage

      - name: SonarCloud Scan
        # No continue-on-error: a failure here surfaces token/config problems early.
        # This job does not gate build-image or deploy (no downstream needs it),
        # so a failure is visible noise but never a deployment blocker.
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push nexus-ui image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/nexus-ui/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syntara-ui:latest
            ghcr.io/${{ github.repository_owner }}/syntara-ui:${{ github.sha }}
            quay.io/ansible/syntara-ui:latest
            quay.io/ansible/syntara-ui:${{ github.sha }}

      - name: Build and push nexus-mock-api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/nexus-mock-api/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syntara-mock-api:latest
            ghcr.io/${{ github.repository_owner }}/syntara-mock-api:${{ github.sha }}
