---
name: Setup Test Environment
description: Common setup steps for test jobs (Python, uv, dependencies, secrets)

inputs:
  python-version:
    description: Python version to use
    required: true
  working-directory:
    description: Working directory for make commands (relative to repo root)
    required: false
    default: 'backend'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

    - name: Cache uv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-
          uv-${{ runner.os }}-

    - name: Install regopy build toolchain (aarch64)
      if: runner.arch == 'ARM64'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y cmake g++ git libssl-dev

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make install

    - name: Generate secrets
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make secrets-generate
