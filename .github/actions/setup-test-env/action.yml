---
name: Setup Test Environment
description: Common setup steps for test jobs (Python, uv, dependencies, secrets, OPA)

inputs:
  python-version:
    description: Python version to use
    required: true
  install-opa:
    description: Whether to install OPA CLI
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

    - name: Cache uv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-
          uv-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: make install

    - name: Install OPA CLI
      if: inputs.install-opa == 'true'
      shell: bash
      run: make install-opa

    - name: Generate secrets
      shell: bash
      run: make secrets-generate
