# Example 7: Loop Output Reference Patterns
# Demonstrates: How to reference outputs from activities within loops

schemaVersion: 1.0.0
version: 1

metadata:
  name: loop-output-reference-demo
  description: Demonstrates various patterns for referencing loop activity outputs
  tags:
    - loops
    - output-reference
    - example
  owner: platform-team
  timeout: PT1H

triggers:
  - type: manual

inputs:
  userIds:
    type: array
    description: List of user IDs to process
    required: true

workflow:
  activities:
    # Step 1: Fetch user details for each ID
    - id: fetch_user_details
      name: Fetch User Details for Each ID
      type: loop
      loop:
        type: forEach
        items: ${input.userIds}
        itemVariable: userId
        indexVariable: idx
        do:
          - id: get_user
            name: Get User from API
            type: task
            task:
              executor: api
              config:
                method: GET
                url: https://api.example.com/users/${userId}
                headers:
                  Content-Type: application/json
              outputs:
                userData: $.user
                fetchedAt: $.timestamp
            timeout: PT30S

          - id: enrich_user
            name: Enrich User Data
            type: task
            task:
              executor: script
              config:
                language: python
                code: |
                  import json
                  user = ${get_user.output.userData}
                  user['enriched'] = True
                  user['index'] = ${idx}
                  print(json.dumps({'enrichedUser': user}))
              outputs:
                enrichedUser: $.enrichedUser
            timeout: PT10S

    # Step 2: Reference specific iteration outputs
    - id: check_first_user
      name: Check First User Result
      type: task
      task:
        executor: script
        config:
          language: python
          code: |
            import json
            # Access first iteration (index 0)
            first_user = ${fetch_user_details.output.get_user[0].userData}
            print(json.dumps({
              'first_user_id': first_user.get('id'),
              'message': f"First user is {first_user.get('name')}"
            }))
        outputs:
          firstUserId: $.first_user_id
          message: $.message

    # Step 3: Reference last iteration output
    - id: check_last_user
      name: Check Last User Result
      type: task
      task:
        executor: script
        config:
          language: python
          code: |
            import json
            # Access last iteration (index -1)
            last_user = ${fetch_user_details.output.enrich_user[-1].enrichedUser}
            print(json.dumps({
              'last_user_id': last_user.get('id'),
              'message': f"Last user is {last_user.get('name')}"
            }))
        outputs:
          lastUserId: $.last_user_id

    # Step 4: Aggregate all iteration outputs
    - id: aggregate_all_users
      name: Aggregate All User Data
      type: task
      task:
        executor: script
        config:
          language: python
          code: |
            import json
            # Get all iterations as array
            all_users = ${fetch_user_details.output.enrich_user}

            # Extract just the enriched user data
            enriched_users = [iteration['enrichedUser'] for iteration in all_users]

            # Calculate statistics
            total_count = len(enriched_users)
            user_names = [user.get('name') for user in enriched_users]

            print(json.dumps({
              'total_users': total_count,
              'all_names': user_names,
              'enriched_data': enriched_users
            }))
        outputs:
          totalUsers: $.total_users
          allNames: $.all_names
          enrichedData: $.enriched_data
      timeout: PT1M

    # Step 5: Filter loop outputs based on condition
    - id: filter_active_users
      name: Filter Only Active Users
      type: task
      task:
        executor: script
        config:
          language: python
          code: |
            import json
            # Get all user data from loop
            all_users = ${fetch_user_details.output.get_user}

            # Filter for active users only
            active_users = [
              iteration['userData']
              for iteration in all_users
              if iteration['userData'].get('status') == 'active'
            ]

            print(json.dumps({
              'active_count': len(active_users),
              'active_user_ids': [u.get('id') for u in active_users]
            }))
        outputs:
          activeCount: $.active_count
          activeUserIds: $.active_user_ids

    # Step 6: Nested loop with output reference
    - id: process_user_orders
      name: Process Orders for Each User
      type: loop
      loop:
        type: forEach
        items: ${aggregate_all_users.output.enrichedData}
        itemVariable: user
        indexVariable: userIdx
        do:
          - id: fetch_user_orders
            name: Fetch Orders for User
            type: task
            task:
              executor: api
              config:
                method: GET
                url: https://api.example.com/users/${user.id}/orders
              outputs:
                orders: $.orders
                orderCount: $.total

          - id: process_each_order
            name: Process Each Order
            type: loop
            loop:
              type: forEach
              items: ${fetch_user_orders.output.orders}
              itemVariable: order
              indexVariable: orderIdx
              do:
                - id: validate_order
                  name: Validate Order
                  type: task
                  task:
                    executor: script
                    config:
                      language: python
                      code: |
                        import json
                        print(json.dumps({
                          'order_id': '${order.id}',
                          'user_id': '${user.id}',
                          'valid': True,
                          'user_index': ${userIdx},
                          'order_index': ${orderIdx}
                        }))
                    outputs:
                      orderId: $.order_id
                      userId: $.user_id
                      valid: $.valid

    # Step 7: Reference nested loop outputs
    - id: summarize_all_orders
      name: Summarize All Orders from Nested Loops
      type: task
      task:
        executor: script
        config:
          language: python
          code: |
            import json
            # Outer loop iterations (users)
            user_iterations = ${process_user_orders.output.process_each_order}

            # Flatten nested structure
            all_orders = []
            for user_iter in user_iterations:
              # Inner loop iterations (orders for this user)
              order_iterations = user_iter
              for order_iter in order_iterations:
                all_orders.append(order_iter['validate_order'])

            print(json.dumps({
              'total_orders': len(all_orders),
              'order_ids': [o['orderId'] for o in all_orders]
            }))
        outputs:
          totalOrders: $.total_orders
          orderIds: $.order_ids

    # Step 8: Conditional processing based on loop output
    - id: check_processing_results
      name: Check if All Users Were Processed Successfully
      type: condition
      condition: ${aggregate_all_users.output.totalUsers == len(input.userIds)}
      then:
        - id: success_notification
          name: Send Success Notification
          type: task
          task:
            executor: api
            config:
              method: POST
              url: https://notifications.example.com/success
              body:
                message: All ${aggregate_all_users.output.totalUsers} users processed
                users: ${aggregate_all_users.output.allNames}
            outputs:
              notificationId: $.id

      else:
        - id: failure_notification
          name: Send Failure Notification
          type: task
          task:
            executor: api
            config:
              method: POST
              url: https://notifications.example.com/failure
              body:
                message: Only ${aggregate_all_users.output.totalUsers} of ${len(input.userIds)}
                  users processed
            outputs:
              notificationId: $.id
