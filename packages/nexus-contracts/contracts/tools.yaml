openapi: 3.0.3
info:
  title: Tool Management API
  description: API for managing tools from Tool Providers
  version: 1.0.0

servers:
- url: http://localhost:8000/api/v1
  description: Development server

paths:
  /tools:
    get:
      summary: List all tools
      description: Retrieve list of tools from all Tool Providers with filtering
      parameters:
      - name: field[operator]
        in: query
        description: |
          Generic field filtering with operators. Syntax: field[operator]=value

          Supported operators:
          - eq: equals
          - ne: not equals
          - in: in array (comma-separated values)
          - contains: string contains
          - startswith: string starts with
          - endswith: string ends with
          - gt: greater than
          - gte: greater than or equal
          - lt: less than
          - lte: less than or equal
          - between: between two values (comma-separated)

          Examples:
          - ?status[eq]=available
          - ?name[contains]=search
          - ?enabled[eq]=true
          - ?execution_count[gte]=10
          - ?created_at[between]=2025-01-01,2025-12-31
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: limit
        in: query
        description: Maximum number of tools to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for keyset pagination (tool ID to start after)
        schema:
          type: string
          format: uuid
      - name: include_total
        in: query
        description: Include total count in response (may impact performance)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tool'
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type: string
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                    nullable: true
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                - tools
                - limit
                - has_more
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tools/{tool_id}:
    get:
      summary: Get tool details
      description: Retrieve detailed information about specific tool
      parameters:
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDetail'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update tool configuration
      description: Update tool enablement status and configuration
      parameters:
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolUpdate'
      responses:
        '200':
          description: Tool updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          description: Invalid tool configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tools/bulk-update:
    patch:
      summary: Bulk update tool enablement
      description: Enable or disable multiple tools at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 50
                enabled:
                  type: boolean
              required:
              - tool_ids
              - enabled
      responses:
        '200':
          description: Tools updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                  skipped_count:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Tool:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        namespaced_name:
          type: string
          maxLength: 200
        description:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          enum: [available, missing, error]
        execution_count:
          type: integer
        last_executed_at:
          type: string
          format: date-time
        last_refreshed_at:
          type: string
          format: date-time
        refresh_error:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - provider_id
      - name
      - namespaced_name
      - description
      - enabled
      - status
      - execution_count
      - last_discovered_at
      - created_at
      - created_by

    ToolDetail:
      allOf:
      - $ref: '#/components/schemas/Tool'
      - type: object
        properties:
          parameters:
            type: array
            items:
              $ref: '#/components/schemas/ToolParameter'
          schema:
            type: object
          recent_metrics:
            type: object
            properties:
              last_24h_executions:
                type: integer
              last_24h_success_rate:
                type: number
                format: float
                minimum: 0
                maximum: 1
              avg_duration_ms:
                type: integer

    ToolParameter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [string, number, boolean, object, array]
        description:
          type: string
        required:
          type: boolean
        default_value:
          type: object
        example_value:
          type: object
      required:
      - id
      - name
      - type
      - description
      - required

    ToolUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
      required:
      - error
      - message
