schemaVersion: 1.0.0
version: 1

metadata:
  name: retry-policy-test
  description: Test retry policy with exponential backoff

triggers:
- type: manual

workflow:
  activities:
  - id: task_with_retry
    name: Task With Retry Policy
    type: task
    retryPolicy:
      maxAttempts: 3
      initialInterval: PT1S
      maxInterval: PT30S
      backoff: exponential
      multiplier: 2.0
    task:
      executor: script
      config:
        language: bash
        code: |
          echo "Task executed successfully"
      outputs:
        result: $.stdout
