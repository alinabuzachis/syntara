---
schemaVersion: 1.0.0
version: 1
metadata:
  name: environment-variables-demo
  description: Demonstrates using custom environment variables in script activities

inputs:
  user_name:
    type: string
    description: User name for personalized greeting
    default: Alice

triggers:
  - type: manual

workflow:
  activities:
    - id: bash_with_env
      type: task
      task:
        executor: script
        config:
          language: bash
          environment:
            API_URL: https://api.example.com
            API_VERSION: v1
            ENVIRONMENT: production
          code: |
            echo "API Endpoint: ${API_URL}/${API_VERSION}"
            echo "Environment: ${ENVIRONMENT}"
            echo "User: ${INPUT_USER_NAME}"
        inputs:
          user_name: ${inputs.user_name}
        outputs:
          endpoint: $.stdout

    - id: python_with_env
      type: task
      task:
        executor: script
        config:
          language: python
          environment:
            DATABASE_HOST: db.example.com
            DATABASE_PORT: '5432'
            DATABASE_NAME: myapp
            LOG_LEVEL: INFO
          code: |
            import json
            import os

            config = {
                "database": {
                    "host": os.getenv("DATABASE_HOST"),
                    "port": os.getenv("DATABASE_PORT"),
                    "name": os.getenv("DATABASE_NAME")
                },
                "logging": {
                    "level": os.getenv("LOG_LEVEL")
                },
                "user": os.getenv("INPUT_USER_NAME")
            }

            print(json.dumps(config, indent=2))
        inputs:
          user_name: ${inputs.user_name}
        outputs:
          config: $.output

    - id: bash_with_combined
      type: task
      task:
        executor: script
        config:
          language: bash
          environment:
            SERVICE_NAME: WorkflowEngine
            MAX_RETRIES: '3'
          code: |
            echo "Service: ${SERVICE_NAME}"
            echo "Max Retries: ${MAX_RETRIES}"
            echo "User: ${INPUT_USER_NAME}"
        inputs:
          user_name: ${inputs.user_name}
        outputs:
          message: $.stdout
