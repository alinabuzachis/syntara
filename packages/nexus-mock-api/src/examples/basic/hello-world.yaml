---
schemaVersion: 1.0.0
version: 1
metadata:
  name: hello-world
  description: Simple hello world workflow with environment variables
triggers:
  - type: manual
workflow:
  activities:
    - id: say_hello
      type: task
      task:
        executor: script
        config:
          language: bash
          environment:
            GREETING: Hello
            WORLD_NAME: World
          code: |
            echo "${GREETING}, ${WORLD_NAME}!"
            echo "Current time: $(date)"

    - id: say_goodbye
      type: task
      task:
        executor: script
        config:
          language: bash
          environment:
            FAREWELL: Goodbye
          code: |
            echo "${FAREWELL}, World!"
