schemaVersion: 1.0.0
version: 1
metadata:
  name: join-missing-branch-test
  description: Test join with a branch ID that doesn't exist
triggers:
- type: manual
workflow:
  activities:
  - id: existing_task
    type: task
    task:
      executor: script
      config:
        language: bash
        code: echo "Existing task"
  - id: join_missing
    type: join
    join:
      branches:
      - existing_task
      - nonexistent_task
      strategy: all
