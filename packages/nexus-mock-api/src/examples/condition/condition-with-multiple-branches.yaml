schemaVersion: 1.0.0
version: 1

metadata:
  name: multi-branch-condition-test
  description: Test condition with multiple activities in then/else branches

inputs:
  score:
    type: integer
    description: Test score
    default: 75

triggers:
- type: manual

workflow:
  activities:
  - id: score_evaluation
    name: Evaluate Score
    type: condition
    condition: ${input.score} >= 60
    then:
    - id: pass_notification
      name: Pass Notification
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo "Congratulations! You passed the test."
        outputs:
          result: $.stdout

    - id: certificate
      name: Generate Certificate
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo "Certificate generated"
            echo "Grade: PASS"
        outputs:
          cert: $.stdout

    else:
    - id: fail_notification
      name: Fail Notification
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo "Sorry, you did not pass the test."
        outputs:
          result: $.stdout

    - id: retry_info
      name: Retry Information
      type: task
      task:
        executor: script
        config:
          language: bash
          code: |
            echo "You can retake the test after 30 days"
            echo "Study materials: /path/to/materials"
        outputs:
          info: $.stdout
