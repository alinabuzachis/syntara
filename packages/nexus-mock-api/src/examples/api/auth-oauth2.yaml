---
schema_version: "2.0.0"
name: auth-oauth2
description: API request with OAuth2 authentication

# SECURITY WARNING: This is a mock example only.
# NEVER hardcode real secret IDs in production workflow definitions.
# Use environment-specific references or vault paths instead.
secrets:
  oauth2_token:
    secretId: test-oauth2-token  # Example only - use ${env.SECRET_ID} in production
    type: oauth2

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_with_oauth2
    type: http_request
    config:
      method: GET
      url: http://test-api.example.com/api/oauth-auth
      authentication:
        type: oauth2
        credentials: ${secrets.oauth2_token}
edges: []
