---
schema_version: "2.0.0"
name: auth-bearer
description: API request with bearer token authentication

secrets:
  api_token:
    secretId: test-bearer-token
    type: bearer_token

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_protected_data
    type: http_request
    config:
      method: GET
      url: http://test-api.example.com/api/protected
      authentication:
        type: bearer
        credentials: ${secrets.api_token}
edges: []
