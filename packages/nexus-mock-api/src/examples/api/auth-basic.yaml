---
schema_version: "2.0.0"
name: auth-basic
description: API request with basic authentication

# SECURITY WARNING: This is a mock example only.
# NEVER hardcode real secret IDs in production workflow definitions.
# Use environment-specific references or vault paths instead.
secrets:
  basic_credentials:
    secretId: test-basic-credentials  # Example only - use ${env.SECRET_ID} in production
    type: basic_auth

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_with_basic_auth
    type: http_request
    config:
      method: GET
      url: http://test-api.example.com/api/basic-auth
      authentication:
        type: basic
        credentials: ${secrets.basic_credentials}
edges: []
