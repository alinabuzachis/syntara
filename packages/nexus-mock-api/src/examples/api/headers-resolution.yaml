---
schemaVersion: 1.0.0
version: 1

metadata:
  name: headers-resolution
  description: Test header resolution from inputs and variables

inputs:
  customHeader:
    type: string
    description: Custom header value
    default: custom-value
  apiKey:
    type: string
    description: API key for authentication
    default: api-key-123

triggers:
  - type: manual

workflow:
  activities:
    - id: headers_test
      type: task
      task:
        executor: api
        config:
          method: GET
          url: http://test-api.example.com/api/data
          headers:
            X-Custom-Header: ${input.customHeader}
            X-API-Key: ${input.apiKey}
            X-Static-Header: static-value
        inputs:
          customHeader: ${inputs.customHeader}
          apiKey: ${inputs.apiKey}
