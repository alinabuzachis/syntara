---
schemaVersion: 1.0.0
version: 1
metadata:
  name: converge-aggregate-test
  description: Test converge with output aggregation from multiple branches
triggers:
  - type: manual
workflow:
  activities:
    - id: parallel_aggregate
      type: parallel
      branches:
        - id: data_task1
          type: task
          task:
            executor: script
            config:
              language: bash
              code: "echo '{\"value\": 10}'"
        - id: data_task2
          type: task
          task:
            executor: script
            config:
              language: bash
              code: "echo '{\"value\": 20}'"
        - id: data_task3
          type: task
          task:
            executor: script
            config:
              language: bash
              code: "echo '{\"value\": 30}'"
    - id: converge_aggregate
      type: converge
      converge:
        branches:
          - data_task1
          - data_task2
          - data_task3
        strategy: all
        aggregateOutputs: true
