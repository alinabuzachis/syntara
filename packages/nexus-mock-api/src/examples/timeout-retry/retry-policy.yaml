---
schemaVersion: 1.0.0
version: 1

metadata:
  name: retry-test
  description: Test activity retry

triggers:
  - type: manual

workflow:
  activities:
    - id: flaky_task
      name: Flaky Task
      type: task
      retryPolicy:
        maxAttempts: 3
        backoff: exponential
        multiplier: 2
        initialInterval: 1
        maxInterval: 60
      task:
        executor: script
        config:
          language: bash
          code: |
            # Fail on first 2 attempts, succeed on 3rd
            ATTEMPT_FILE="/tmp/attempt_counter_$$"
            ATTEMPT=0
            if [ -f "$ATTEMPT_FILE" ]; then
              ATTEMPT=$(cat "$ATTEMPT_FILE")
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo $ATTEMPT > "$ATTEMPT_FILE"

            if [ $ATTEMPT -lt 3 ]; then
              echo "Attempt $ATTEMPT failed"
              exit 1
            else
              echo "Attempt $ATTEMPT succeeded"
              rm "$ATTEMPT_FILE"
              exit 0
            fi
