---
schemaVersion: 1.0.0
version: 1

metadata:
  name: timeout-test
  description: Test activity timeout

triggers:
  - type: manual

workflow:
  activities:
    - id: slow_task
      name: Slow Task
      type: task
      timeout: 2
      task:
        executor: script
        config:
          language: bash
          code: |
            sleep 10
            echo "This should not complete"
