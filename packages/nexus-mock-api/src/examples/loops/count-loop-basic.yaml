---
schemaVersion: 1.0.0
version: 1

metadata:
  name: count-loop-basic-test
  description: Test count loop with fixed number of iterations

triggers:
  - type: manual

workflow:
  activities:
    - id: count_loop
      name: Count Loop
      type: loop
      loop:
        type: count
        count: 5
        indexVariable: idx
        do:
          - id: count_task
            type: task
            task:
              executor: script
              config:
                language: bash
                code: |
                  echo "Count loop iteration"
              outputs:
                result: $.stdout
