schemaVersion: 1.0.0
version: 1

metadata:
  name: while-loop-max-iterations-test
  description: Test while loop stops at maxIterations

triggers:
- type: manual

workflow:
  activities:
  - id: while_with_max
    name: While Loop with Max Iterations
    type: loop
    loop:
      type: while
      condition: 'true'
      maxIterations: 3
      do:
      - id: iteration_task
        type: task
        task:
          executor: script
          config:
            language: bash
            code: |
              echo "Iteration executed"
          outputs:
            result: $.stdout
