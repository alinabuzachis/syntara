---
services:
  database:
    image: public.ecr.aws/docker/library/postgres:15
    restart: unless-stopped
    ports:
      - ${NEXUS_DB_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${NEXUS_DB_USER:-admin}
      POSTGRES_PASSWORD: ${NEXUS_DB_PASSWORD:-admin}
      POSTGRES_DB: ${NEXUS_DB_NAME:-nexus_api}
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-nexus_api}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ${NEXUS_CACHE_IMAGE:-public.ecr.aws/docker/library/redis:6}
    restart: unless-stopped
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD:-cache}"
    ports:
      - ${NEXUS_CACHE_PORT:-6379}:6379
    environment:
      REDIS_PASSWORD: ${NEXUS_CACHE_PASSWORD:-cache}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -h 127.0.0.1 -p 6379 -a $${REDIS_PASSWORD:-cache} ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-ui:
    image: ${NEXUS_UI_IMAGE:-quay.io/ansible/nexus-ui}:${NEXUS_UI_VERSION:-latest}
    restart: unless-stopped
    ports:
      - ${NEXUS_UI_PORT:-8080}:80
    environment:
      - NEXUS_API_URL=${NEXUS_API_URL:-http://nexus:8000}
    depends_on:
      nexus:
        condition: service_healthy

  temporal:
    image: mirror.gcr.io/temporalio/auto-setup:1.25.1
    restart: unless-stopped
    ports:
      - ${NEXUS_TEMPORAL_PORT:-7233}:7233
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${NEXUS_DB_USER:-admin}
      - POSTGRES_PWD=${NEXUS_DB_PASSWORD:-admin}
      - POSTGRES_SEEDS=database
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./containers/temporal-server/temporal-config:/etc/temporal/config/dynamicconfig:z
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, tctl, --address, 'temporal:7233', cluster, health]
      interval: 10s
      timeout: 5s
      retries: 10

  # Temporal UI - Web interface for monitoring and debugging workflows, only for local development
  temporal-ui:
    image: mirror.gcr.io/temporalio/ui:2.31.2
    restart: unless-stopped
    ports:
      - ${NEXUS_TEMPORAL_UI_PORT:-8081}:8080
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy

  nexus:
    build:
      context: .
      dockerfile: containers/nexus/Containerfile
    image: ${NEXUS_IMAGE:-localhost/nexus:latest}
    restart: unless-stopped
    command: [sh, -c, 'uv run alembic upgrade head && uv run tools/load_sample_workflows.py samples && uv run uvicorn nexus.api.main:app --host 0.0.0.0 --port 8000']
    ports:
      - ${NEXUS_API_PORT:-8000}:8000
    environment:
      - NEXUS_DB_HOST=database
      - NEXUS_DB_PORT=5432
      - NEXUS_DB_USER=${NEXUS_DB_USER:-admin}
      - NEXUS_DB_PASSWORD=${NEXUS_DB_PASSWORD:-admin}
      - NEXUS_DB_NAME=${NEXUS_DB_NAME:-nexus_api}
      - NEXUS_TEMPORAL_ADDRESS=temporal:7233
      - NEXUS_TEMPORAL_NAMESPACE=default
      - NEXUS_CACHE_HOST=redis
      - NEXUS_CACHE_PASSWORD=${NEXUS_CACHE_PASSWORD:-cache}
      - NEXUS_OPENROUTER_API_KEY=${NEXUS_OPENROUTER_API_KEY}
      - NEXUS_OPENROUTER_MODEL=${NEXUS_OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - NEXUS_OPENROUTER_BASE_URL=${NEXUS_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - NEXUS_ENV_FILE_PATH=${NEXUS_ENV_FILE_PATH:-.env}
      - NEXUS_LOG_LEVEL=${NEXUS_LOG_LEVEL:-INFO}
      - NEXUS_SEGMENT_WRITE_KEY=${NEXUS_SEGMENT_WRITE_KEY}
      - NEXUS_ENTITLEMENT_ID=${NEXUS_ENTITLEMENT_ID}
    volumes:
      - ./src:/opt/app-root/src/src:z
    depends_on:
      database:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8000/health']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Temporal Worker - Executes workflow and activity tasks
  temporal-worker:
    image: ${NEXUS_IMAGE:-localhost/nexus:latest}
    restart: unless-stopped
    command: [sh, -c, uv run python -m nexus.workflows.worker]
    environment:
      # Database Configuration (for activity sync service)
      - NEXUS_DB_HOST=database
      - NEXUS_DB_PORT=5432
      - NEXUS_DB_USER=${NEXUS_DB_USER:-admin}
      - NEXUS_DB_PASSWORD=${NEXUS_DB_PASSWORD:-admin}
      - NEXUS_DB_NAME=${NEXUS_DB_NAME:-nexus_api}
      # Temporal Configuration
      - NEXUS_TEMPORAL_ADDRESS=temporal:7233
      - NEXUS_TEMPORAL_NAMESPACE=default
      - NEXUS_TASK_QUEUE=nexus-workflow-queue
      - NEXUS_ENV_FILE_PATH=${NEXUS_ENV_FILE_PATH:-.env}
      - NEXUS_LOG_LEVEL=${NEXUS_LOG_LEVEL:-INFO}
      # Cache Configuration (for activity streaming)
      - NEXUS_CACHE_HOST=redis
      - NEXUS_CACHE_PASSWORD=${NEXUS_CACHE_PASSWORD:-cache}
      # Workflow API Base URL (for workflow callback URL generation)
      - NEXUS_WORKFLOW_BASE_URL=${NEXUS_WORKFLOW_BASE_URL:-http://nexus:8000/api/v1}
      # Agent Orchestrator Configuration (for agentic activities)
      - NEXUS_AGENT_ORCHESTRATOR_BASE_URL=${NEXUS_AGENT_ORCHESTRATOR_BASE_URL:-http://nexus:8000/api/v1}
      # AAP Configuration (for AAP Job Template activity)
      - NEXUS_AAP_BASE_URL=${NEXUS_AAP_BASE_URL}
      - NEXUS_AAP_USERNAME=${NEXUS_AAP_USERNAME}
      - NEXUS_AAP_PASSWORD=${NEXUS_AAP_PASSWORD}
      - NEXUS_AAP_TOKEN=${NEXUS_AAP_TOKEN}
      - NEXUS_AAP_TIMEOUT_SECONDS=${NEXUS_AAP_TIMEOUT_SECONDS:-3600}
      - NEXUS_AAP_POLL_INTERVAL_SECONDS=${NEXUS_AAP_POLL_INTERVAL_SECONDS:-5.0}
      - NEXUS_AAP_VERIFY_SSL=${NEXUS_AAP_VERIFY_SSL:-true}
      - NEXUS_SEGMENT_WRITE_KEY=${NEXUS_SEGMENT_WRITE_KEY}
      - NEXUS_ENTITLEMENT_ID=${NEXUS_ENTITLEMENT_ID}
    volumes:
      - ./src:/opt/app-root/src/src:z
    depends_on:
      database:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, pgrep, -f, nexus.workflows.worker]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MCP Server - Test MCP server for integration testing
  mcp-server:
    build:
      context: .
      dockerfile: containers/mcp/Containerfile
    image: ${MCP_IMAGE:-localhost/nexus-mcp:latest}
    restart: unless-stopped
    ports:
      - ${MCP_PORT:-8765}:8765
    environment:
      - NEXUS_LOG_LEVEL=${NEXUS_LOG_LEVEL:-INFO}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8765/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nexus_postgres_data:
    driver: local
