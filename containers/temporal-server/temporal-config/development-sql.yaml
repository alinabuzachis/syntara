---
# Temporal Dynamic Configuration for Development
# This file configures Temporal server behavior at runtime

# Frontend service configuration
frontend.enableClientVersionCheck:
  - value: true
    constraints: {}

# History service configuration
history.maxAutoResetPoints:
  - value: 20
    constraints: {}

# Workflow execution limits
limit.maxIDLength:
  - value: 255
    constraints: {}

# Persistence configuration
system.enableNamespaceNotActiveAutoForwarding:
  - value: true
    constraints: {}

# Visibility configuration
system.advancedVisibilityWritingMode:
  - value: off
    constraints: {}

# Worker settings
worker.buildIdScavengerEnabled:
  - value: true
    constraints: {}
