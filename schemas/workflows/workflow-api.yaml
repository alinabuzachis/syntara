openapi: 3.0.3
info:
  title: Workflow Engine API
  description: |
    API for managing and executing dynamic workflows with agentic and non-agentic tasks.

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    ├── NamedResource (+ name, description)
    │   └── Workflow (+ SoftDeletableResource + UserOwnedResource)
    │       └── WorkflowWithVersion (+ version details)
    ├── Execution (+ workflow execution fields)
    ├── ActivityExecution (+ activity execution fields)
    └── Approval (+ approval fields)

    SoftDeletableResource (deleted_at, deleted_by)
    UserOwnedResource (created_by)
    ```

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints
  version: 1.0.0
  contact:
    name: Automation Nexus Team

servers:
- url: /api/v1
  description: API server (relative path)

paths:
  /activity-types:
    get:
      summary: List available activity types
      description: |
        Retrieve all available activity executor types that can be used in workflow definitions.
        This endpoint is used for workflow validation, UI tooling, and documentation.
      responses:
        '200':
          description: List of available activity types with their configuration schemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityType'

  /workflows:
    get:
      summary: List workflows
      description: |
        Retrieve a list of workflows with filtering, sorting, and cursor-based pagination.
      parameters:
      - name: created_by
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by creator user ID
      - name: is_enabled
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by enabled status
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/Workflow'
                      maxItems: 100
                  required:
                  - resources
    post:
      summary: Create workflow
      description: Create a new workflow entity with its initial version. The workflow
        definition is validated and stored as version 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid workflow definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{workflowId}:
    get:
      summary: Get workflow
      description: Retrieve a specific workflow by ID including its current active
        version. Returns workflow metadata along with the version specified by current_version
        field.
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Workflow details including current version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowWithVersion'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update workflow
      description: |
        Update workflow fields. Supports both metadata updates and workflow definition updates:
        - Metadata only (name, description, is_enabled, labels): Updates without creating new version
        - With workflow_definition: Validates definition, compares with current version, and creates new version only if definition differs (change detection)
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully (may include new version if workflow_definition
            changed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowWithVersion'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid workflow definition or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete workflow (soft delete)
      description: Soft delete a workflow by setting deleted_at and deleted_by fields.
        The workflow remains in the database for audit purposes but is excluded from
        normal queries.
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Workflow soft deleted successfully
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Workflow cannot be deleted (has running executions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{workflowId}/versions:
    get:
      summary: List workflow versions
      description: |
        Retrieve all versions for a workflow with cursor-based pagination.
        WorkflowVersion entities are read-only and managed automatically by the system.
        Versions are ordered by version number descending (newest first) by default.
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      responses:
        '200':
          description: List of workflow versions
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/WorkflowVersionResponse'
                      maxItems: 100
                  required:
                  - resources
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{workflowId}/versions/{version}:
    get:
      summary: Get workflow version
      description: Retrieve a specific version of a workflow by version number. Returns
        the complete workflow definition for that version.
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Version number to retrieve
      responses:
        '200':
          description: Workflow version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionResponse'
        '404':
          description: Workflow or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /executions:
    get:
      summary: List executions
      description: |
        Retrieve executions with filtering, sorting, and cursor-based pagination.
      parameters:
      - name: workflow_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by workflow ID
      - name: created_by
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by user who created the execution
      - name: status
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/ExecutionStatus'
            description: Exact match of status. ?status=<status>
          - type: object
            properties:
              in:
                type: string
                description: Match any of the comma-separated values. ?status[in]=<val1,val2>
        description: |
          Filter executions by status.
          - Exact match: `status=running`
          - Multiple values: `status[in]=running,pending`
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/Execution'
                      maxItems: 100
                  required:
                  - resources
    post:
      summary: Create execution
      description: Start a new workflow execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionRequest'
      responses:
        '201':
          description: Execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /executions/{executionId}:
    get:
      summary: Get execution
      description: Retrieve details of a specific execution.
      parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Control execution
      description: Pause, resume, or cancel a workflow execution
      parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionControlRequest'
      responses:
        '200':
          description: Execution control applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /executions/{executionId}/activities:
    get:
      summary: List activity executions
      description: |
        Retrieve activity executions for a workflow execution with cursor-based pagination.
      parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      responses:
        '200':
          description: List of activity executions
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/ActivityExecution'
                      maxItems: 100
                  required:
                  - resources
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /approvals:
    get:
      summary: List pending approvals
      description: |
        Retrieve approvals for the current user with filtering, sorting, and cursor-based pagination.
      parameters:
      - name: status
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatus'
            description: Exact match of status. ?status=<status>
          - type: object
            properties:
              in:
                type: string
                description: Match any of the comma-separated values. ?status[in]=<val1,val2>
        description: |
          Filter approvals by status.
          - Exact match: `status=pending`
          - Multiple values: `status[in]=pending,approved`
      - name: activity_execution_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by activity execution ID
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
      - $ref: 
          ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      responses:
        '200':
          description: List of approvals
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/Approval'
                      maxItems: 100
                  required:
                  - resources

  /approvals/{approvalId}:
    get:
      summary: Get approval
      description: Retrieve details of a specific approval request.
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Approval details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '404':
          description: Approval not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Respond to approval
      description: Approve or reject an approval request
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalResponseRequest'
      responses:
        '200':
          description: Approval response recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '404':
          description: Approval not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # Import base resource schemas
    BaseResource:
      $ref: ../base/shared-resources.openapi.yaml#/components/schemas/BaseResource

    NamedResource:
      $ref: ../base/shared-resources.openapi.yaml#/components/schemas/NamedResource

    SoftDeletableResource:
      $ref: ../base/shared-resources.openapi.yaml#/components/schemas/SoftDeletableResource

    UserOwnedResource:
      $ref: ../base/shared-resources.openapi.yaml#/components/schemas/UserOwnedResource

    # Import workflow-specific schemas
    Workflow:
      $ref: ./shared-schemas.yaml#/components/schemas/Workflow

    WorkflowWithVersion:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowWithVersion

    WorkflowVersionResponse:
      type: object
      title: Workflow Version Response
      description: Complete details of a specific workflow version including workflow
        definition. Note that deleted_at and deleted_by are always null since soft-deleted
        versions are excluded from queries.
      required:
      - id
      - workflow_id
      - version
      - schema_version
      - workflow_definition
      - created_by
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Version unique identifier
        workflow_id:
          type: string
          format: uuid
          description: Parent workflow ID
        version:
          type: integer
          description: Version number
        schema_version:
          type: string
          description: YAML schema version (e.g., "1.0.0")
        workflow_definition:
          $ref: ./workflow-definition.schema.json
          description: Workflow definition object conforming to workflow-definition.schema.json
        created_by:
          type: string
          format: uuid
          description: User who created this version
        created_at:
          type: string
          format: date-time
          description: Version creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        change_description:
          type: string
          nullable: true
          description: Description of changes in this version
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Soft delete timestamp (always null in responses)
        deleted_by:
          type: string
          format: uuid
          nullable: true
          description: User who soft deleted the version (always null in responses)

    WorkflowVersionListResponse:
      type: object
      title: Workflow Version List Response
      description: List of workflow versions ordered by version number descending
      required:
      - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersionResponse'
          description: Array of workflow versions

    Execution:
      $ref: ./shared-schemas.yaml#/components/schemas/Execution

    ActivityExecution:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityExecution

    Approval:
      $ref: ./shared-schemas.yaml#/components/schemas/Approval

    ExecutionStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionStatus

    ActivityStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityStatus

    ApprovalStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ApprovalStatus

    CreateWorkflowRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/CreateWorkflowRequest

    PatchWorkflowRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/PatchWorkflowRequest

    CreateExecutionRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/CreateExecutionRequest

    ExecutionControlRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionControlRequest

    ApprovalResponseRequest:
      $ref: ./shared-schemas.yaml#/components/schemas/ApprovalResponseRequest

    ActivityType:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityType

    Error:
      $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
- bearerAuth: []
