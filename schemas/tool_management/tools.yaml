---
openapi: 3.0.3
info:
  title: Tool Management API
  description: API for managing tools from Tool Providers
  version: 1.0.0

servers:
  - url: /api/v1
    description: API server (relative path)

# Reference shared resource schemas
x-shared-contracts:
  - path: ../base/shared-resources.openapi.yaml
    namespace: shared

paths:
  /tools:
    get:
      summary: List all tools
      description: Retrieve list of tools from all Tool Providers with filtering
      parameters:
        - name: status
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            allOf:
              - type: string
                description: Exact match of the status. ?status=<status>
              - type: object
                properties:
                  eq:
                    type: string
                    description: Exact match of the status. ?status[eq]=<status>
          description: |
            Filter tools by status.
            - Exact match: `status=available`
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter tools by enabled status
        - name: provider_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter tools by provider ID
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., 'name', '-created_at')
        - name: namespaced_name
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: string
            description: Filter by namespaced name (namespaced_name[contains]=text)
          description: Filter tools by namespaced name with text matching
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                  - type: object
                    properties:
                      resources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ToolWithParameters'
                        maxItems: 100
                    required:
                      - resources
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error

  /tools/{tool_id}:
    get:
      summary: Get tool details
      description: Retrieve detailed information about specific tool
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWithParameters'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error

    patch:
      summary: Update tool configuration
      description: Update tool enablement status and configuration
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ToolUpdate'
      responses:
        '200':
          description: Tool updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWithParameters'
        '400':
          description: Invalid tool configuration
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error

  /tools/bulk-update:
    patch:
      summary: Bulk update tool enablement
      description: Enable or disable multiple tools at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolBulkUpdate'
      responses:
        '200':
          description: Tools updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolBulkUpdateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Error

components:
  schemas:
    ToolWithParameters:
      allOf:
        - $ref: ../base/shared-resources.openapi.yaml#/components/schemas/Resource
        - type: object
          properties:
            provider_id:
              type: string
              format: uuid
              description: UUID of the associated tool provider
            namespaced_name:
              type: string
              maxLength: 200
              description: Unique namespaced name for the tool
            enabled:
              type: boolean
              default: true
              description: Whether the tool is enabled
            status:
              type: string
              enum: [available, missing, error]
              default: available
              description: Current status of the tool
            last_executed_at:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of last execution
            last_refreshed_at:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of last refresh from provider
            refresh_error:
              type: string
              nullable: true
              description: Error message from last refresh attempt
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/ToolParameter'
              description: Tool parameters
          required:
            - provider_id
            - namespaced_name
            - enabled
            - status
            - parameters

    ToolParameter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [string, number, boolean, object, array]
        description:
          type: string
        required:
          type: boolean
        default_value:
          type: object
        example_value:
          type: object
      required:
        - id
        - name
        - type
        - description
        - required

    ToolUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled

    ToolBulkUpdate:
      type: object
      properties:
        tool_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          minItems: 1
          description: List of tool UUIDs to update (max 50)
        enabled:
          type: boolean
          description: Enable/disable the tools
      required:
        - tool_ids
        - enabled

    ToolBulkUpdateResponse:
      type: object
      properties:
        updated_count:
          type: integer
          description: Number of tools successfully updated
        skipped_count:
          type: integer
          description: Number of tools skipped (already in target state)
        updated_at:
          type: string
          format: date-time
          description: Timestamp when bulk update completed
      required:
        - updated_count
        - skipped_count
        - updated_at
