openapi: 3.0.3
info:
  title: Tool Metrics API
  description: API for monitoring tool usage metrics and rate limiting
  version: 1.0.0

servers:
- url: http://localhost:8000/api/v1
  description: Development server

paths:
  /metrics/tools:
    get:
      summary: Get tool usage metrics
      description: Retrieve usage statistics for tools and providers
      parameters:
      - name: field[operator]
        in: query
        description: |
          Generic field filtering with operators. Syntax: field[operator]=value

          Supported operators:
          - eq: equals
          - ne: not equals
          - in: in array (comma-separated values)
          - contains: string contains
          - startswith: string starts with
          - endswith: string ends with
          - gt: greater than
          - gte: greater than or equal
          - lt: less than
          - lte: less than or equal
          - between: between two values (comma-separated)

          Examples:
          - ?time_window[eq]=day
          - ?start_date[gte]=2025-01-01
          - ?provider_id[in]=uuid1,uuid2,uuid3
          - ?user_id[contains]=agent
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: limit
        in: query
        description: Maximum number of metric records to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for keyset pagination (metric ID to start after)
        schema:
          type: string
          format: uuid
      - name: include_total
        in: query
        description: Include total count in response (may impact performance)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Tool usage metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolMetrics'
                  summary:
                    $ref: '#/components/schemas/MetricsSummary'
                  time_window:
                    type: string
                  start_date:
                    type: string
                    format: date
                  end_date:
                    type: string
                    format: date
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type: string
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                    nullable: true
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                - metrics
                - summary
                - limit
                - has_more
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics/executions:
    get:
      summary: Get detailed execution logs
      description: Retrieve detailed execution logs for troubleshooting
      parameters:
      - name: field[operator]
        in: query
        description: |
          Generic field filtering with operators. Syntax: field[operator]=value

          Supported operators:
          - eq: equals
          - ne: not equals
          - in: in array (comma-separated values)
          - contains: string contains
          - startswith: string starts with
          - endswith: string ends with
          - gt: greater than
          - gte: greater than or equal
          - lt: less than
          - lte: less than or equal
          - between: between two values (comma-separated)

          Examples:
          - ?status[eq]=success
          - ?execution_start[gte]=2025-01-01T00:00:00Z
          - ?duration_ms[between]=100,5000
          - ?user_id[contains]=agent
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: limit
        in: query
        description: Maximum number of executions to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        description: Cursor for keyset pagination (execution ID to start after)
        schema:
          type: string
          format: uuid
      - name: include_total
        in: query
        description: Include total count in response (may impact performance)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Execution logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolExecution'
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type: string
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                    nullable: true
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                - executions
                - limit
                - has_more
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rate-limits:
    get:
      summary: List rate limit configurations
      description: Retrieve all rate limit configurations
      parameters:
      - name: field[operator]
        in: query
        description: |
          Generic field filtering with operators. Syntax: field[operator]=value

          Supported operators:
          - eq: equals
          - ne: not equals
          - in: in array (comma-separated values)
          - contains: string contains
          - startswith: string starts with
          - endswith: string ends with
          - gt: greater than
          - gte: greater than or equal
          - lt: less than
          - lte: less than or equal
          - between: between two values (comma-separated)

          Examples:
          - ?target_type[eq]=tool
          - ?enabled[eq]=true
          - ?requests_per_window[gte]=100
          - ?created_at[between]=2025-01-01,2025-12-31
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: limit
        in: query
        description: Maximum number of rate limits to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for keyset pagination (rate limit ID to start after)
        schema:
          type: string
          format: uuid
      - name: include_total
        in: query
        description: Include total count in response (may impact performance)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Rate limit configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate_limits:
                    type: array
                    items:
                      $ref: '#/components/schemas/RateLimit'
                  limit:
                    type: integer
                    description: Maximum number of items requested
                  next_cursor:
                    type: string
                    format: uuid
                    description: Cursor for the next page (null if no more pages)
                    nullable: true
                  has_more:
                    type: boolean
                    description: Whether there are more items available
                  total:
                    type: integer
                    description: Total count (only included if include_total=true)
                required:
                - rate_limits
                - limit
                - has_more
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create rate limit configuration
      description: Create new rate limit for provider, tool, or user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitCreate'
      responses:
        '201':
          description: Rate limit created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit'
        '400':
          description: Invalid rate limit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rate-limits/{limit_id}:
    get:
      summary: Get rate limit details
      description: Retrieve specific rate limit configuration
      parameters:
      - name: limit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Rate limit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rate limit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update rate limit configuration
      description: Update existing rate limit configuration
      parameters:
      - name: limit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitUpdate'
      responses:
        '200':
          description: Rate limit updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit'
        '400':
          description: Invalid rate limit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rate limit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete rate limit configuration
      description: Remove rate limit configuration
      parameters:
      - name: limit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Rate limit deleted successfully
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rate limit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ToolMetrics:
      type: object
      properties:
        tool_id:
          type: string
          format: uuid
        tool_name:
          type: string
        provider_name:
          type: string
        total_executions:
          type: integer
        successful_executions:
          type: integer
        failed_executions:
          type: integer
        success_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
        avg_duration_ms:
          type: integer
        min_duration_ms:
          type: integer
        max_duration_ms:
          type: integer
        total_duration_ms:
          type: integer
        time_period:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
      required:
      - tool_id
      - tool_name
      - provider_name
      - total_executions
      - successful_executions
      - failed_executions
      - success_rate
      - time_period
      - period_start
      - period_end

    MetricsSummary:
      type: object
      properties:
        total_tools:
          type: integer
        total_executions:
          type: integer
        overall_success_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
        most_used_tool:
          type: string
        least_used_tool:
          type: string
        avg_execution_duration_ms:
          type: integer

    ToolExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tool_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        execution_start:
          type: string
          format: date-time
        execution_end:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        status:
          type: string
          enum: [running, success, error, timeout]
        input_parameters:
          type: object
          description: Tool input parameters as JSON
        output_data:
          type: object
          nullable: true
          description: Tool output data as JSON
        error_message:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - tool_id
      - provider_id
      - user_id
      - execution_start
      - status
      - input_parameters
      - created_at
      - created_by

    RateLimit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [provider, tool, user]
        target_id:
          type: string
        target_name:
          type: string
        requests_per_window:
          type: integer
          minimum: 1
        window_duration_seconds:
          type: integer
          minimum: 1
        burst_allowance:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        current_usage:
          type: integer
        usage_reset_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - target_type
      - target_id
      - requests_per_window
      - window_duration_seconds
      - burst_allowance
      - enabled
      - created_at
      - created_by

    RateLimitCreate:
      type: object
      properties:
        target_type:
          type: string
          enum: [provider, tool, user]
        target_id:
          type: string
        requests_per_window:
          type: integer
          minimum: 1
        window_duration_seconds:
          type: integer
          minimum: 1
        burst_allowance:
          type: integer
          minimum: 0
          default: 0
        enabled:
          type: boolean
          default: true
      required:
      - target_type
      - target_id
      - requests_per_window
      - window_duration_seconds

    RateLimitUpdate:
      type: object
      properties:
        requests_per_window:
          type: integer
          minimum: 1
        window_duration_seconds:
          type: integer
          minimum: 1
        burst_allowance:
          type: integer
          minimum: 0
        enabled:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
      required:
      - error
      - message
