---
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false

exclude: ^\.tekton/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: make
        args: [ruff]
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy type checking
        entry: make
        args: [typecheck]
        language: system
        pass_filenames: false
        always_run: true

      - id: check-path-sequence
        name: check numbered path sequence
        entry: make
        args: [check-path-sequence]
        language: system
        pass_filenames: false
        always_run: true

      - id: sync-requirements
        name: sync requirements.txt with uv.lock
        entry: make
        args: [sync-requirements]
        language: system
        pass_filenames: false
        files: ^(uv\.lock|pyproject\.toml|requirements\.txt)$

      - id: api-spec-validation
        name: validate openapi sub-spec syntax
        entry: make
        args: [api-spec-validation]
        language: system
        pass_filenames: false
        always_run: true

      - id: api-spec-bundle
        name: bundle openapi sub-specs into merged spec
        entry: make
        args: [api-spec-bundle]
        language: system
        pass_filenames: false
        always_run: true

      - id: api-spec-drift
        name: check openapi spec matches implementation
        entry: make
        args: [api-spec-drift]
        verbose: true
        language: system
        pass_filenames: false
        always_run: true

      - id: generate-api-client
        name: generate python api client from openapi spec
        entry: make
        args: [generate-api-client]
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        args:
          - --formatter
          - include_document_start=true,retain_line_breaks=true,scan_folded_as_literal=true
