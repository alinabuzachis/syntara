# Ansible Inventory for AAP Parameter Testing
# This inventory can be used for local testing of the test-aap-parameters.yml playbook

# Local testing - runs on localhost
[local]
localhost ansible_connection=local

# Example web servers (add your actual hosts here)
[webservers]
# web-01.example.com
# web-02.example.com

# Example database servers
[databases]
# db-01.example.com

# Example application servers
[appservers]
# app-01.example.com
# app-02.example.com

# Groups of groups
[production:children]
webservers
databases
appservers

# Group variables example
[webservers:vars]
# ansible_user=deploy
# ansible_python_interpreter=/usr/bin/python3

[local:vars]
# Variables specific to localhost
ansible_python_interpreter=python3
