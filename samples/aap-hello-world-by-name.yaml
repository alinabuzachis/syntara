---
schema_version: "2.0.0"
name: aap-hello-world-by-name
description: AAP job template workflow using name-based reference
triggers:
  - id: trigger_manual
    type: manual_trigger
    config:
      inputs:
        template_name:
          type: string
          description: Name of the AAP job template to launch
          required: true
          default: "Demo Job Template"
        organization_name:
          type: string
          description: Name of the organization in AAP
          required: true
          default: "Default"
nodes:
  - id: launch_job_by_name
    type: aap_job_template
    name: Launch Job By Name
    config:
      job_template_name: ${trigger.template_name}
      organization_name: ${trigger.organization_name}
      verbosity: 3
edges:
  - from: trigger_manual
    to: launch_job_by_name
