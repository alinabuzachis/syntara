---
schemaVersion: 1.0.0
version: 1

metadata:
  name: github-repo-info
  description: Fetch GitHub repository information and analyze it
  tags:
    - real-world
    - api
    - github
  owner: demo-team

triggers:
  - type: manual

inputs:
  owner:
    type: string
    description: GitHub repository owner/organization
    default: anthropics
  repo:
    type: string
    description: GitHub repository name
    default: anthropic-sdk-python

workflow:
  activities:
    # Fetch repository information from GitHub API
    - id: fetch_repo
      name: Fetch Repository Info
      type: task
      task:
        executor: api
        config:
          method: GET
          url: https://api.github.com/repos/${input.owner}/${input.repo}
          headers:
            Accept: application/vnd.github.v3+json
            User-Agent: Nexus-Workflow-Engine
        outputs:
          repoData: $.body
          name: $.body.name
          description: $.body.description
          stars: $.body.stargazers_count
          forks: $.body.forks_count
          language: $.body.language
          openIssues: $.body.open_issues_count
          createdAt: $.body.created_at
          updatedAt: $.body.updated_at
      timeout: PT30S

    # Fetch repository languages
    - id: fetch_languages
      name: Fetch Repository Languages
      type: task
      task:
        executor: api
        config:
          method: GET
          url: https://api.github.com/repos/${input.owner}/${input.repo}/languages
          headers:
            Accept: application/vnd.github.v3+json
            User-Agent: Nexus-Workflow-Engine
        outputs:
          languages: $.body
      timeout: PT30S

    # Analyze repository data with Python
    - id: analyze_repo
      name: Analyze Repository Data
      type: task
      task:
        executor: script
        config:
          language: python
          code: |
            import json
            import os
            from datetime import datetime

            # Get inputs
            name = os.getenv('INPUT_NAME', 'Unknown')
            description = os.getenv('INPUT_DESCRIPTION', 'No description')
            stars = int(os.getenv('INPUT_STARS', '0'))
            forks = int(os.getenv('INPUT_FORKS', '0'))
            language = os.getenv('INPUT_LANGUAGE', 'Unknown')
            open_issues = int(os.getenv('INPUT_OPEN_ISSUES', '0'))
            created_at = os.getenv('INPUT_CREATED_AT', '')
            updated_at = os.getenv('INPUT_UPDATED_AT', '')
            languages_json = os.getenv('INPUT_LANGUAGES', '{}')

            # Parse languages
            languages = json.loads(languages_json)

            # Calculate popularity score (simple formula)
            popularity_score = (stars * 2) + (forks * 5) - (open_issues * 0.5)

            # Determine activity level
            if stars > 10000:
                activity = "Very Popular"
            elif stars > 1000:
                activity = "Popular"
            elif stars > 100:
                activity = "Moderately Active"
            else:
                activity = "Growing"

            # Format languages
            language_list = list(languages.keys())

            # Create analysis report
            report = {
                "repository": name,
                "description": description,
                "primary_language": language,
                "all_languages": language_list,
                "statistics": {
                    "stars": stars,
                    "forks": forks,
                    "open_issues": open_issues,
                    "popularity_score": round(popularity_score, 2)
                },
                "activity_level": activity,
                "summary": f"{name} is a {activity.lower()} repository with {stars} stars and {forks} forks, primarily written in {language}."
            }

            print(json.dumps(report, indent=2))
        inputs:
          name: ${fetch_repo.output.name}
          description: ${fetch_repo.output.description}
          stars: ${fetch_repo.output.stars}
          forks: ${fetch_repo.output.forks}
          language: ${fetch_repo.output.language}
          open_issues: ${fetch_repo.output.openIssues}
          created_at: ${fetch_repo.output.createdAt}
          updated_at: ${fetch_repo.output.updatedAt}
          languages: ${fetch_languages.output.languages}
        outputs:
          report: $.output
          summary: $.output.summary
          popularityScore: $.output.statistics.popularity_score
      timeout: PT1M
