---
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false

exclude: ^(\.tekton/|frontend/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: make -C backend
        args: [ruff]
        language: system
        pass_filenames: false
        always_run: true

      - id: pyrefly
        name: pyrefly type checking
        entry: make -C backend
        args: [typecheck-pyrefly]
        language: system
        pass_filenames: false
        always_run: true

      - id: sync-requirements
        name: sync requirements.txt with uv.lock
        entry: make -C backend
        args: [sync-requirements]
        language: system
        pass_filenames: false
        files: ^(uv\.lock|pyproject\.toml|requirements\.txt)$

      - id: api-spec-validation
        name: validate openapi sub-spec syntax
        entry: make -C backend
        args: [api-spec-validation]
        language: system
        pass_filenames: false
        always_run: true

      - id: api-spec-bundle
        name: bundle openapi sub-specs into merged spec
        entry: make -C backend
        args: [api-spec-bundle]
        language: system
        pass_filenames: false
        always_run: true

      - id: api-spec-drift
        name: check openapi spec matches implementation
        entry: make -C backend
        args: [api-spec-drift]
        verbose: true
        language: system
        pass_filenames: false
        always_run: true

      - id: generate-api-client
        name: generate python api client from openapi spec
        entry: make -C backend
        args: [generate-api-client]
        language: system
        pass_filenames: false
        always_run: true

      - id: check-api-paths
        name: check API paths use snake_case
        entry: make -C backend
        args: [check-api-paths]
        language: system
        pass_filenames: false
        always_run: true

      - id: check-dead-code
        name: check for dead code (vulture)
        entry: make -C backend
        args: [check-dead-code]
        language: system
        pass_filenames: false
        always_run: true

      - id: check-cycles
        name: check for import cycles (pyan3)
        entry: make -C backend
        args: [check-cycles]
        language: system
        pass_filenames: false
        always_run: true

      - id: check-orphans
        name: check for orphan modules
        entry: make -C backend
        args: [check-orphans]
        language: system
        pass_filenames: false
        always_run: true

      - id: verify-test-structure
        name: verify test structure matches source domains
        entry: make -C backend
        args: [verify-test-structure]
        language: system
        pass_filenames: false
        files: ^(tests/|src/nexus/)

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        args:
          - --formatter
          - include_document_start=true,retain_line_breaks=true,scan_folded_as_literal=true
