---
# Temporal Dynamic Configuration for Development
# This file configures Temporal server behavior at runtime

# Frontend service configuration
frontend.enableClientVersionCheck:
  - value: true
    constraints: {}

# History service configuration
history.maxAutoResetPoints:
  - value: 20
    constraints: {}

# Workflow execution limits
limit.maxIDLength:
  - value: 255
    constraints: {}

# Persistence configuration
system.enableNamespaceNotActiveAutoForwarding:
  - value: true
    constraints: {}

# Visibility configuration
system.advancedVisibilityWritingMode:
  - value: off
    constraints: {}

# Worker settings
worker.buildIdScavengerEnabled:
  - value: true
    constraints: {}

# Payload size limits — explicit values matching Temporal defaults.
# Prevents silent payload rejection that causes misleading timeout errors.
limit.blobSize.error:
  - value: 2097152 # 2 MB
    constraints: {}

limit.blobSize.warn:
  - value: 1572864 # 1.5 MB
    constraints: {}
