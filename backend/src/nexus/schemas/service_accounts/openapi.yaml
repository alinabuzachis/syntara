components:
  schemas:
    ServiceAccountCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Human-readable name for the service account
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Description
          description: Optional description of the service account's purpose
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: Project to create the service account in
      type: object
      required:
        - name
        - project_id
      title: ServiceAccountCreate
      description: Schema for creating a new service account.
    ServiceAccountListResponse:
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          items:
            $ref: '#/components/schemas/ServiceAccountRead'
          type: array
          maxItems: 100
          title: Resources
          description: Array of resources in current page
      type: object
      required:
        - resources
      title: ServiceAccountListResponse
      description: Paginated list response for service accounts.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ
    ServiceAccountRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        status:
          $ref: '#/components/schemas/ServiceAccountStatus'
        project_id:
          type: string
          format: uuid
          title: Project Id
        last_authenticated_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Authenticated At
        created_by:
          type: string
          format: uuid
          title: Created By
        updated_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Updated By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
      type: object
      required:
        - id
        - name
        - status
        - project_id
        - created_by
        - created_at
        - updated_at
      title: ServiceAccountRead
      description: Schema for service account responses.
    ServiceAccountStatus:
      type: string
      enum:
        - active
        - disabled
      title: ServiceAccountStatus
