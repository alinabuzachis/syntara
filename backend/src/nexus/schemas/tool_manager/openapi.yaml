---
openapi: 3.1.0
info:
  title: Tool Provider Management API
  description: API for registering and managing external Tool Providers
  version: 1.0.0

servers:
  - url: /api/v1
    description: API server (relative path)

# Reference shared resource schemas
x-shared-contracts:
  - path: ../base/shared-resources.openapi.yaml
    namespace: shared

paths:
  /tool_manager/tools:
    get:
      summary: Get Tools
      description: |-
        List tools with filtering, sorting, and pagination.

        Supports filtering using query parameters with standard operators:
        - name: Filter by tool name (name=tool_name, name[contains]=text)
        - enabled: Filter by enabled status (enabled=true|false)
        - status: Filter by tool status (status=available|missing|error)
        - integration_id: Filter by integration ID (integration_id=uuid)
        - namespaced_name: Filter by namespaced name (namespaced_name[contains]=text)
        - labels: Filter by labels using bracket notation (labels[environment]=production)

        Uses cursor-based pagination for scalability and consistency.

        Args:
            request: FastAPI request object containing query parameters
            service: Tool service
            params: Query parameters for pagination and filtering

        Returns:
            ToolListResponse with tools, pagination metadata, and optional total
      operationId: get_tools
      x-app-permission:
        resource: null
        action: null
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
      tags:
        - ToolManager
  /tool_manager/tools/{tool_id}:
    get:
      summary: Get Tool
      description: Get tool details by ID.
      operationId: get_tool
      x-app-permission:
        resource: null
        action: null
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Tool Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWithParameters'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
      tags:
        - ToolManager
    patch:
      summary: Patch Tool
      description: Update tool status (enable/disable).
      operationId: patch_tool
      x-app-permission:
        resource: null
        action: null
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Tool Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWithParameters'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
      tags:
        - ToolManager
  /tool_manager/tools/bulk_update:
    patch:
      summary: Bulk Update Tools
      description: Bulk update tool status (enable/disable multiple tools).
      operationId: bulk_update_tools
      x-app-permission:
        resource: null
        action: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolBulkUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Bulk Update Tools
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"

      security:
        - bearerAuth: []
      tags:
        - ToolManager
components:
  schemas:
    ToolListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolWithParameters'
              description: Array of resources in current page
              title: Resources
      title: ToolListResponse
      description: Paginated list response for tools.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    ToolStatus:
      type: string
      title: ToolStatus
      description: Status of a tool.
      enum:
        - available
        - missing
        - error

    ToolParameterType:
      type: string
      title: ToolParameterType
      description: Parameter types for tools.
      enum:
        - string
        - number
        - boolean
        - object
        - array

    ToolWithParameters:
      allOf:
        - $ref: '../base/shared-resources.openapi.yaml#/components/schemas/Resource'
        - type: object
          title: ToolWithParameters
          additionalProperties: false
          description: Schema for Tool response with ToolParameter details.
          required:
            - namespaced_name
            - parameters
          properties:
            integration_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Integration Id
              description: UUID of the owning Integration (mcp_server)
            namespaced_name:
              type: string
              minLength: 1
              maxLength: 200
              title: Namespaced Name
              description: Unique namespaced name for the tool
            enabled:
              type: boolean
              default: true
              title: Enabled
              description: Whether the tool is enabled
            status:
              $ref: '#/components/schemas/ToolStatus'
              default: available
              description: Current status of the tool
            last_executed_at:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              title: Last Executed At
              description: Timestamp of last execution
            last_refreshed_at:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              title: Last Refreshed At
              description: Timestamp of last refresh from provider
            refresh_error:
              anyOf:
                - type: string
                - type: 'null'
              title: Refresh Error
              description: Error message from last refresh attempt
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/ToolParameter'
              title: Parameters
              description: Tool parameters

    ToolParameter:
      allOf:
        - $ref: '../base/shared-resources.openapi.yaml#/components/schemas/BaseResource'
        - type: object
          title: ToolParameter
          additionalProperties: false
          description: |-
            Tool parameter definition stored in database.

            Represents a parameter that a tool accepts, with its type, validation rules,
            and example values.

            Inherits from BaseResource:
                id: UUID primary key
                created_at: Creation timestamp
                updated_at: Last update timestamp
                labels: Optional key-value metadata
          required:
            - tool_id
            - name
            - type
            - description
            - required
          properties:
            tool_id:
              type: string
              format: uuid
              title: Tool Id
            name:
              type: string
              minLength: 1
              maxLength: 100
              title: Name
              description: Parameter name
            type:
              $ref: '#/components/schemas/ToolParameterType'
              description: Parameter type
            description:
              type: string
              title: Description
              description: Parameter description
            required:
              type: boolean
              title: Required
              description: Whether this parameter is required
            default_value:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
              title: Default Value
              description: Default value for the parameter
            example_value:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
              title: Example Value
              description: Example value for the parameter

    ToolUpdate:
      type: object
      title: ToolUpdate
      additionalProperties: false
      description: Model for updating tool configuration.
      properties:
        enabled:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Enabled
          description: Whether the tool is enabled
        status:
          anyOf:
            - $ref: '#/components/schemas/ToolStatus'
            - type: 'null'
          description: Current status of the tool
        refresh_error:
          anyOf:
            - type: string
            - type: 'null'
          title: Refresh Error
          description: Error message from last refresh attempt

    ToolBulkUpdate:
      type: object
      title: ToolBulkUpdate
      additionalProperties: false
      description: |-
        Request model for bulk updating tool status.

        Attributes:
            tool_ids: List of tool UUIDs to update (max 50)
            enabled: Enable or disable the Tool.
      properties:
        tool_ids:
          type: array
          title: Tool Ids
          items:
            type: string
            format: uuid
          maxItems: 50
          description: List of tool UUIDs to update (max 50)
        enabled:
          type: boolean
          title: Enabled
          description: Enable/disable the Tool
      required:
        - tool_ids
        - enabled
