---
openapi: 3.0.3
info:
  title: Workflow Engine API (v2)
  description: |
    API for managing graph-based (DAG) workflows with agentic and non-agentic tasks.

    ## V2 Workflow Model

    V2 workflows use a directed acyclic graph (DAG) structure with explicit nodes and edges,
    replacing the V1 tree-based activity model. Key concepts:

    - **Triggers**: Entry points that initiate workflow execution (e.g., manual_trigger)
    - **Nodes**: Execution units (script, http_request, agentic, aap_job_template, approval)
      and control flow (condition, loop, converge)
    - **Edges**: Directed connections between nodes with optional port-based routing
      (e.g., condition true/false, loop iterate/complete)
    - **Implicit parallelism**: Multiple edges from the same node execute concurrently
      (no dedicated parallel node needed)

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    +-- NamedResource (+ name, description)
        +-- Workflow (+ SoftDeletableResource + UserOwnedResource)
            +-- WorkflowWithVersion (+ version details)

    SoftDeletableResource (deleted_at, deleted_by)
    UserOwnedResource (created_by)
    ```

    Note: Approval resources are in a separate API. See `/api/v1/approvals`.

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints

    ## Node Type Catalog

    Available node types and their configuration schemas are defined in the
    [Node Type Catalog](./catalog/node_type_catalog.json). Individual node schemas
    (config and result) are in the `executors/`, `control-nodes/`, and `triggers/` directories.
  version: 2.0.0
  contact:
    name: Automation Nexus Team

servers:
  - url: /api/v1
    description: API server (relative path)

paths:
  /workflows:
    get:
      summary: List Workflows
      description: "List workflows the current user has read access to.\n\nSupports filtering using query parameters with standard operators:\n- created_by: Filter by creator user ID (created_by=uuid)\n- is_enabled: Filter by enabled status (is_enabled=true|false)\n- labels: Filter by labels using bracket notation (labels[environment]=production)\n\nUses cursor-based pagination for scalability and consistency."
      operationId: list_workflows
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    post:
      summary: Create Workflow
      description: Create a new workflow with initial version.
      operationId: create_workflow
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/{workflow_id}:
    get:
      summary: Get Workflow
      description: Get a workflow by ID including its current active version.
      operationId: get_workflow
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    patch:
      summary: Update Workflow
      description: "Update workflow.\n\nSupports both metadata-only updates and workflow definition updates:\n- Metadata only (name, description, labels): Updates without creating new version\n- With workflow_definition: Validates definition, compares with current version, creates new WorkflowVersion\n  only if definition differs (change detection optimization)"
      operationId: update_workflow
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    delete:
      summary: Delete Workflow
      description: Soft delete a workflow.
      operationId: delete_workflow
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: delete
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '204':
          description: Workflow deleted
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/{workflow_id}/test:
    post:
      summary: Test a single node in a workflow
      description: "Test a single node in a workflow with mocked predecessor outputs.\n\nCreates a test execution that:\n1. Uses mocked outputs for all nodes in pre_resolved_nodes\n2. Executes the target_node_id for real with actual logic\n3. Stops after the target node completes\n4. Returns results in the execution response\n\nThis enables testing individual nodes in isolation without running the entire workflow.\n\nArgs:\n    workflow_id: Workflow ID to test\n    request: Test execution request with target node and mocked outputs\n    execution_service: Execution service (injected by FastAPI)\n\nReturns:\n    Created test execution with mode=TEST and status=PENDING\n\nRaises:\n    HTTPException: 404 if workflow not found\n    HTTPException: 400 if target_node_id not found in workflow\n    HTTPException: 503 if Temporal unavailable"
      operationId: test_workflow_node
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestExecutionCreate'
      responses:
        '201':
          description: Test execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/{workflow_id}/versions:
    get:
      summary: List Workflow Versions
      description: List all versions for a workflow.
      operationId: list_workflow_versions
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Workflow version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/{workflow_id}/versions/{version}:
    get:
      summary: Get Workflow Version
      description: Get a specific workflow version.
      operationId: get_workflow_version
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: version
          in: path
          required: true
          schema:
            type: integer
            title: Version
          description: Version number to retrieve
      responses:
        '200':
          description: Workflow version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/{workflow_id}/versions/{version}/publish:
    post:
      summary: Publish Workflow Version
      description: Publish a specific workflow version.
      operationId: publish_workflow_version
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: version
          in: path
          required: true
          schema:
            type: integer
            title: Version
          description: Version number to publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishVersionRequest'
      responses:
        '200':
          description: Published workflow version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/{workflow_id}/unpublish:
    post:
      summary: Unpublish Workflow
      description: Unpublish the currently published workflow version.
      operationId: unpublish_workflow
      tags:
        - workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Unpublished workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  # Note: Approval endpoints are in a separate API
  # See: src/nexus/schemas/approvals/openapi.yaml

  /webhooks/{webhook_path}:
    post:
      summary: Receive webhook event
      description: >-
        Receive a webhook event from an external system and trigger the matching
        workflow. Only POST method is supported; other methods receive 405 Method
        Not Allowed.
      operationId: receive_webhook
      tags: [webhooks]
      security: []
      x-app-permission:
        resource: null
        action: null
      parameters:
        - name: webhook_path
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
            title: Webhook Path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Payload
      responses:
        '202':
          description: Webhook accepted and workflow execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

components:
  schemas:
    # Import workflow-specific schemas
    WorkflowRead:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowRead

    WorkflowReadWithVersion:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowReadWithVersion

    WorkflowVersionRead:
      type: object
      title: WorkflowVersionRead
      description: |-
        Schema for workflow version response (GET /workflows/{id}/versions/{version}).

        WorkflowVersion entities are read-only and managed automatically by the system.

        Note: deleted_at and deleted_by are None since soft-deleted versions are excluded from queries.
      required:
        - id
        - workflow_id
        - version
        - schema_version
        - workflow_definition
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        workflow_id:
          type: string
          format: uuid
          title: Workflow Id
        version:
          type: integer
          title: Version
        schema_version:
          type: string
          title: Schema Version
        workflow_definition:
          additionalProperties: true
          type: object
          title: Workflow Definition
        change_description:
          anyOf:
            - type: string
            - type: 'null'
          title: Change Description
        status:
          $ref: '#/components/schemas/WorkflowVersionStatus'
          default: draft
        publish_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Publish Name
        created_by:
          type: string
          format: uuid
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Deleted By

    WorkflowVersionStatus:
      type: string
      title: WorkflowVersionStatus
      description: Publish status of a workflow version.
      enum:
        - draft
        - published
        - previously_published

    PublishVersionRequest:
      type: object
      title: PublishVersionRequest
      description: Request body for publishing a workflow version.
      properties:
        publish_name:
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
          title: Publish Name
          description: Optional name for this published version
        change_description:
          anyOf:
            - type: string
              maxLength: 1024
            - type: 'null'
          title: Change Description
          description: Description of changes in this version

    WorkflowVersionListResponse:
      type: object
      title: WorkflowVersionListResponse
      description: Schema for workflow version list response.
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersionRead'
          title: Versions

    WorkflowListResponse:
      type: object
      required:
        - resources
      title: WorkflowListResponse
      description: Paginated list response for workflows.
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRead'
          maxItems: 100
          title: Resources
          description: Array of resources in current page
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    # Note: Approval schemas are in src/nexus/schemas/approvals/openapi.yaml

    WorkflowCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowCreate

    WorkflowUpdate:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowUpdate

    TestExecutionCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/TestExecutionCreate

    PreResolvedNodeOutput:
      $ref: ./shared-schemas.yaml#/components/schemas/PreResolvedNodeOutput

    ExecutionMode:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionMode

    ExecutionRead:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionRead

    WorkflowDefinition:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowDefinition

    WebhookResponse:
      type: object
      title: WebhookResponse
      description: Response from webhook reception endpoint.
      required:
        - execution_id
        - message
      properties:
        execution_id:
          type: string
          format: uuid
          title: Execution Id
          description: ID of the triggered workflow execution
        message:
          type: string
          title: Message
          description: Human-readable status message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
