---
name: Deploy Nexus
description: Checks out aap-dev, builds, and deploys Nexus using Skaffold.

inputs:
  app-id:
    description: "GitHub App ID for generating tokens"
    required: true
  app-private-key:
    description: "GitHub App private key for generating tokens"
    required: true
  rh-registry-token:
    description: "Red Hat registry token"
    required: true
  rh-registry-user:
    description: "Red Hat registry username"
    required: true
  quay-user:
    description: "quay.io username"
    required: true
  quay-token:
    description: "quay.io token"
    required: true
  quay-aap-user:
    description: "quay.io/aap username"
    required: true
  quay-aap-token:
    description: "quay.io/aap token"
    required: true
  aap-dev-ref:
    description: "aap-dev git ref (branch, tag, or SHA)"
    required: false
    default: main
  nexus-ref:
    description: "Nexus git ref (branch, tag, or SHA)."
    required: false
    default: main
  nexus-ui-ref:
    description: "Nexus UI git ref (branch, tag, or SHA)."
    required: false
    default: main
  ao-version:
    description: "quay.io/ansible/nexus image tag — base image for API and worker"
    required: false
    default: latest
  ao-ui-version:
    description: "quay.io/ansible/nexus-ui image tag — base image for UI"
    required: false
    default: latest
  aap-version:
    description: "AAP version (used as source directory name, e.g. 2.7)"
    required: false
    default: "2.7"
  deployment-mode:
    description: "Deployment mode: standalone (nexus + datastores only), ao-operator (nexus via OLM operator), or aap (nexus + full AAP stack)"
    required: false
    default: standalone

runs:
  using: composite
  steps:
    - name: Generate token for ansible org
      id: token-ansible
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ansible
        repositories: aap-dev

    - name: Generate token for syntara-orchestration org
      id: token-nexus
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: syntara-orchestration
        repositories: nexus,nexus-ui

    - name: Checkout aap-dev
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: ansible/aap-dev
        ref: ${{ inputs.aap-dev-ref }}
        path: aap-dev
        token: ${{ steps.token-ansible.outputs.token }}

    - name: Checkout Nexus source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: syntara-orchestration/syntara
        ref: ${{ inputs.nexus-ref }}
        path: aap-dev/src/nexus
        token: ${{ steps.token-nexus.outputs.token }}

    - name: Checkout Nexus UI source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: syntara-orchestration/syntara-ui
        ref: ${{ inputs.nexus-ui-ref }}
        path: aap-dev/src/nexus-ui
        token: ${{ steps.token-nexus.outputs.token }}

    - name: Create versioned source symlinks for build script
      shell: bash
      run: |
        mkdir -p aap-dev/src/${{ inputs.aap-version }}
        ln -s ../nexus aap-dev/src/${{ inputs.aap-version }}/nexus
        ln -s ../nexus-ui aap-dev/src/${{ inputs.aap-version }}/nexus-ui

    - name: Disable AppArmor rsyslogd profile
      # Required by aap-deploy. Only the rsyslogd profile is unloaded —
      # all other AppArmor confinement on the runner remains active.
      shell: bash
      run: |
        sudo ln -s /etc/apparmor.d/usr.sbin.rsyslogd /etc/apparmor.d/disable/
        sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.rsyslogd

    - name: Set inotify limits
      shell: bash
      run: |
        sudo sysctl fs.inotify.max_user_watches=749973
        sudo sysctl fs.inotify.max_user_instances=512

    - name: Upgrade Podman
      shell: bash
      run: sudo bash aap-dev/.github/utils/install-podman.sh

    - name: Initialize rootless podman
      continue-on-error: true
      shell: bash
      run: podman info

    - name: Log in to registry.redhat.io
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.rh-registry-token }}
        REGISTRY_USER: ${{ inputs.rh-registry-user }}
      run: echo "$REGISTRY_TOKEN" | podman login registry.redhat.io -u "$REGISTRY_USER" --password-stdin

    - name: Log in to quay.io
      uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
      with:
        registry: quay.io
        username: ${{ inputs.quay-user }}
        password: ${{ inputs.quay-token }}

    - name: Log in to quay.io/aap
      uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
      with:
        registry: quay.io/aap
        username: ${{ inputs.quay-aap-user }}
        password: ${{ inputs.quay-aap-token }}

    - name: Increase kernel.keys.maxkeys for aap-dev
      shell: bash
      run: |
        sudo sysctl kernel.keys.maxkeys=2000

    - name: Add aap-dev bin to PATH
      shell: bash
      env:
        AAP_DEV_BIN: ${{ github.workspace }}/aap-dev/bin
      run: echo "$AAP_DEV_BIN" >> "$GITHUB_PATH"

    - name: Build Nexus
      working-directory: aap-dev
      shell: bash
      env:
        AO_VERSION: ${{ inputs.ao-version }}
        AO_UI_VERSION: ${{ inputs.ao-ui-version }}
        AAP_VERSION: ${{ inputs.aap-version }}
        DEPLOYMENT_MODE: ${{ inputs.deployment-mode }}
        QUAY_USERNAME: ${{ inputs.quay-user }}
        QUAY_PASSWORD: ${{ inputs.quay-token }}
        RHN_USERNAME: ${{ inputs.rh-registry-user }}
        RHN_PASSWORD: ${{ inputs.rh-registry-token }}
      run: |
        if [ "$DEPLOYMENT_MODE" = "standalone" ]; then
          make AO=true SKAFFOLD_CONFIG=$(pwd)/skaffolding/skaffold-ao-standalone.yaml aap-build
        elif [ "$DEPLOYMENT_MODE" = "ao-operator" ]; then
          make AO_OPERATOR=true SKAFFOLD_CONFIG=$(pwd)/skaffolding/skaffold-ao-operator.yaml aap-build
        else
          make AO=true aap-build
        fi

    - name: Deploy Nexus
      working-directory: aap-dev
      shell: bash
      env:
        AO_VERSION: ${{ inputs.ao-version }}
        AO_UI_VERSION: ${{ inputs.ao-ui-version }}
        AAP_VERSION: ${{ inputs.aap-version }}
        DEPLOYMENT_MODE: ${{ inputs.deployment-mode }}
        QUAY_USERNAME: ${{ inputs.quay-user }}
        QUAY_PASSWORD: ${{ inputs.quay-token }}
        RHN_USERNAME: ${{ inputs.rh-registry-user }}
        RHN_PASSWORD: ${{ inputs.rh-registry-token }}
      run: |
        if [ "$DEPLOYMENT_MODE" = "standalone" ]; then
          make AO=true SKAFFOLD_CONFIG=$(pwd)/skaffolding/skaffold-ao-standalone.yaml aap-deploy
        elif [ "$DEPLOYMENT_MODE" = "ao-operator" ]; then
          make AO_OPERATOR=true SKAFFOLD_CONFIG=$(pwd)/skaffolding/skaffold-ao-operator.yaml aap-deploy
        else
          make AO=true aap-deploy
        fi
