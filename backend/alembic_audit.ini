# Alembic configuration for the audit event database.
# Run with: alembic -c alembic_audit.ini <command>

[alembic]
script_location = %(here)s/src/nexus/core/database/audit_migrations

prepend_sys_path = .

path_separator = os

# Leave empty - URL provided via APP_AUDIT_DB_* or APP_AUDIT_DATABASE_URL env vars
sqlalchemy.url =


[post_write_hooks]
# Format generated migration files with ruff.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = .venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
