openapi: 3.0.3
info:
  title: Tool Provider Management API
  description: API for registering and managing external Tool Providers
  version: 1.0.0

servers:
- url: http://localhost:8000/api/v1
  description: Development server

# Reference shared resource schemas
x-shared-contracts:
- path: ../../../schemas/base/shared-resources.openapi.yaml
  namespace: shared

paths:
  /tool-providers:
    get:
      summary: List all registered Tool Providers
      description: Retrieve list of all Tool Providers with optional filtering
      parameters:
      - name: status
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          allOf:
          - type: string
            description: Exact match of the status. ?status=<status>
          - type: object
            properties:
              eq:
                type: string
                description: Exact match of the status. ?status[eq]=<status>
        description: |
          Filter providers by status.
          - Exact match: `status=available`
      - name: provider_type
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          allOf:
          - type: string
            description: Exact match of the provider type. ?provider_type=<type>
          - type: object
            properties:
              eq:
                type: string
                description: Exact match of the provider type. ?provider_type[eq]=<type>
        description: |
          Filter providers by provider type.
          - Exact match: `provider_type=mcp`
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of Tool Providers
          content:
            application/json:
              schema:
                allOf:
                - $ref: 
                    ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/ToolProvider'
                      maxItems: 100
                  required:
                  - resources
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

    post:
      summary: Register new Tool Provider
      description: Register a new external Tool Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderCreate'
      responses:
        '201':
          description: Provider registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProvider'
        '400':
          description: Invalid provider configuration
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '409':
          description: Provider name already exists
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

  /tool-providers/{provider_id}:
    get:
      summary: Get Tool Provider details
      description: Retrieve detailed information about specific Tool Provider
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Provider details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProvider'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

    put:
      summary: Update Tool Provider configuration
      description: Update configuration of existing Tool Provider
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderCreate'
      responses:
        '200':
          description: Provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProvider'
        '400':
          description: Invalid provider configuration
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

    patch:
      summary: Partially update Tool Provider configuration
      description: Partially update configuration of existing Tool Provider
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ToolProviderPatch'
      responses:
        '200':
          description: Provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProvider'
        '400':
          description: Invalid provider configuration
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

    delete:
      summary: Remove Tool Provider
      description: Remove Tool Provider and all associated tools
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Provider removed successfully
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

  /tool-providers/{provider_id}/validate:
    post:
      summary: Validate Tool Provider connection
      description: Test connection and validate Tool Provider compatibility
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Provider validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderValidationResult'
        '400':
          description: Provider validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderValidationResult'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

  /tool-providers/{provider_id}/refresh-tools:
    post:
      summary: Refresh tools from Tool Provider
      description: Connect to Tool Provider and refresh available tools
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tool refresh completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolProviderRefreshResult'
        '400':
          description: Tool refresh failed
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

components:
  schemas:
    ToolProvider:
      allOf:
      - $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Resource
      - type: object
        properties:
          configuration:
            description: Provider-specific configuration
            oneOf:
            - $ref: '#/components/schemas/MCPConfiguration'
          enabled:
            type: boolean
            default: true
          status:
            type: string
            enum: [available, error, validating]
            default: validating
          last_validated_at:
            type: string
            format: date-time
            nullable: true
          validation_error:
            type: string
            nullable: true
        required:
        - configuration

    ToolProviderCreate:
      allOf:
      - $ref: 
          ../006-create-shared-resources/contracts/shared-resources.openapi.yaml#/components/schemas/NamedResource
      - type: object
        properties:
          configuration:
            description: Provider-specific configuration
            oneOf:
            - $ref: '#/components/schemas/MCPConfiguration'
        required:
        - configuration

    ToolProviderPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name for the provider
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Detailed description of the provider
        configuration:
          description: Provider-specific configuration
          oneOf:
          - $ref: '#/components/schemas/MCPConfiguration'
        enabled:
          type: boolean
          nullable: true
          description: Enable/disable the provider
      description: |
        Schema for partially updating a Tool Provider.
        All fields are optional - only include fields you want to update.
        If updating the configuration a provider_type must still be provided.

    MCPConfiguration:
      allOf:
      - type: object
        properties:
          provider_type:
            const: mcp
          base_url:
            type: string
            format: uri
          api_key:
            type: string
        required:
        - base_url
        - api_key

    ToolProviderValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        provider_type:
          type: string
        validated_at:
          type: string
          format: date-time
        error:
          type: string
          nullable: true
      required:
      - valid
      - provider_type
      - validated_at

    ToolProviderRefreshResult:
      type: object
      properties:
        refreshed_count:
          type: integer
        updated_count:
          type: integer
        disabled_count:
          type: integer
        refreshed_at:
          type: string
          format: date-time
      required:
      - refreshed_count
      - updated_count
      - disabled_count
      - refreshed_at
