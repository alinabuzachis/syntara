openapi: 3.0.3
info:
  title: Tool Management API
  description: API for managing tools from Tool Providers
  version: 1.0.0

servers:
- url: http://localhost:8000/api/v1
  description: Development server

# Reference shared resource schemas
x-shared-contracts:
- path: ../../../schemas/base/shared-resources.openapi.yaml
  namespace: shared

paths:
  /tools:
    get:
      summary: List all tools
      description: Retrieve list of tools from all Tool Providers with filtering
      parameters:
      - name: status
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          allOf:
          - type: string
            description: Exact match of the status. ?status=<status>
          - type: object
            properties:
              eq:
                type: string
                description: Exact match of the status. ?status[eq]=<status>
        description: |
          Filter tools by status.
          - Exact match: `status=available`
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
        description: Filter tools by enabled status
      - name: provider_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter tools by provider ID
      - name: execution_count
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          allOf:
          - type: integer
            description: Exact match of execution count. ?execution_count=<count>
          - type: object
            properties:
              gte:
                type: integer
                description: Greater than or equal. ?execution_count[gte]=<count>
              lte:
                type: integer
                description: Less than or equal. ?execution_count[lte]=<count>
        description: |
          Filter tools by execution count.
          - Exact match: `execution_count=10`
          - Range: `execution_count[gte]=5&execution_count[lte]=50`
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/limitParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/cursorParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/nameFilterParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/createdAtFilterParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/updatedAtFilterParam
      - $ref: 
          ../../../schemas/base/shared-resources.openapi.yaml#/components/parameters/labelsFilterParam
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                allOf:
                - $ref: 
                    ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase
                - type: object
                  properties:
                    resources:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tool'
                      maxItems: 100
                  required:
                  - resources
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

  /tools/{tool_id}:
    get:
      summary: Get tool details
      description: Retrieve detailed information about specific tool
      parameters:
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

    patch:
      summary: Update tool configuration
      description: Update tool enablement status and configuration
      parameters:
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolUpdate'
      responses:
        '200':
          description: Tool updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          description: Invalid tool configuration
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

  /tools/bulk-update:
    patch:
      summary: Bulk update tool enablement
      description: Enable or disable multiple tools at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 50
                enabled:
                  type: boolean
              required:
              - tool_ids
              - enabled
      responses:
        '200':
          description: Tools updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                  skipped_count:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Error

components:
  schemas:
    Tool:
      allOf:
      - $ref: ../../../schemas/base/shared-resources.openapi.yaml#/components/schemas/Resource
      - type: object
        properties:
          provider_id:
            type: string
            format: uuid
          namespaced_name:
            type: string
            maxLength: 200
          enabled:
            type: boolean
            default: true
          status:
            type: string
            enum: [available, missing, error]
            default: available
          execution_count:
            type: integer
            minimum: 0
            default: 0
          last_executed_at:
            type: string
            format: date-time
            nullable: true
          last_refreshed_at:
            type: string
            format: date-time
            nullable: true
          refresh_error:
            type: string
            nullable: true
          parameters:
            type: array
            items:
              $ref: '#/components/schemas/ToolParameter'
        required:
        - provider_id
        - namespaced_name
        - enabled
        - status
        - execution_count

    ToolParameter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [string, number, boolean, object, array]
        description:
          type: string
        required:
          type: boolean
        default_value:
          type: object
        example_value:
          type: object
      required:
      - id
      - name
      - type
      - description
      - required

    ToolUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
