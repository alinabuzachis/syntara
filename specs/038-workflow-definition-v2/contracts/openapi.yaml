---
openapi: 3.1.0
info:
  title: Nexus Workflow Schema Discovery API V2
  version: 2.0.0
  description: |
    Schema discovery APIs for Nexus workflow v2 definitions.

    This API provides:
    - Schema discovery for visual workflow builders
    - Dynamic node type catalog with label filtering
    - Individual node type schema retrieval

    **Note**: Workflow submission uses existing `/api/v1/workflows` endpoint (not documented here).
    Only the `workflow_definition` field content changes to v2 format with `schema_version: "2.0.0"`.
  contact:
    name: Nexus Team
  license:
    name: Apache 2.0

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.nexus.example.com
    description: Production server

paths:
  /api/v1/workflow-schemas/v2/workflow-definition.schema.json:
    get:
      summary: Get master workflow definition schema
      description: |
        Retrieve the complete JSON Schema for v2 workflow definitions.

        This schema defines the structure of workflow_definition field including:
        - schema_version (must be "2.0.0")
        - metadata object
        - nodes array
        - edges array
      operationId: get_workflow_schema
      tags:
        - Schema Discovery
      security: []
      responses:
        '200':
          description: Workflow definition schema
          content:
            application/json:
              schema:
                type: object
                description: JSON Schema (Draft 2020-12)

  /api/v1/workflow-schemas/v2/executors/{node_type}.schema.json:
    get:
      summary: Get executor node schema
      description: |
        Retrieve JSON Schema for a specific executor node type.

        Executor nodes perform work: aap_job_template, http_request, agentic, approval, script.
      operationId: get_executor_schema
      tags:
        - Schema Discovery
      security: []
      parameters:
        - name: node_type
          in: path
          required: true
          description: Executor node type
          schema:
            type: string
            enum:
              - aap_job_template
              - http_request
              - agentic
              - approval
              - script
          examples:
            aap:
              value: aap_job_template
            http:
              value: http_request
      responses:
        '200':
          description: Executor node schema
          content:
            application/json:
              schema:
                type: object
                description: JSON Schema for executor node config
        '404':
          description: Node type not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/workflow-schemas/v2/control-nodes/{node_type}.schema.json:
    get:
      summary: Get control flow node schema
      description: |
        Retrieve JSON Schema for a specific control flow node type.

        Control nodes manage execution flow: condition, switch, loop, parallel, converge, wait.
      operationId: get_control_node_schema
      tags:
        - Schema Discovery
      security: []
      parameters:
        - name: node_type
          in: path
          required: true
          description: Control flow node type
          schema:
            type: string
            enum:
              - condition
              - switch
              - loop
              - parallel
              - converge
              - wait
      responses:
        '200':
          description: Control node schema
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Node type not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/workflow-schemas/v2/triggers/{node_type}.schema.json:
    get:
      summary: Get trigger node schema
      description: |
        Retrieve JSON Schema for a specific trigger node type.

        Trigger nodes are workflow entry points: manual, scheduled, webhook, eda.
      operationId: get_trigger_schema
      tags:
        - Schema Discovery
      security: []
      parameters:
        - name: node_type
          in: path
          required: true
          description: Trigger node type
          schema:
            type: string
            enum:
              - manual
              - scheduled
              - webhook
              - eda
      responses:
        '200':
          description: Trigger node schema
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Node type not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/workflow-schemas/v2/catalog/node_type_catalog.json:
    get:
      summary: Get complete node type catalog
      description: |
        Retrieve the complete catalog of all available node types with metadata.

        This catalog includes:
        - Node type identifier
        - Display title and description
        - Category labels (executor, control, trigger)
        - Custom labels (system, execution, pattern)
        - JSON Schema path for type validation

        For filtered discovery, use the /discover endpoint instead.
      operationId: get_node_catalog
      tags:
        - Schema Discovery
      security: []
      responses:
        '200':
          description: Complete node type catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeCatalog'
              example:
                node_types:
                  - type: aap_job_template
                    title: AAP Job Template
                    description: Launch AAP job templates
                    labels:
                      category: executor
                      system: aap
                      execution: remote
                    schema_path: /api/v1/workflow-schemas/v2/executors/aap_job_template.schema.json
                  - type: http_request
                    title: HTTP Request
                    description: HTTP API calls
                    labels:
                      category: executor
                      execution: local
                    schema_path: /api/v1/workflow-schemas/v2/executors/http_request.schema.json
                  - type: condition
                    title: Condition
                    description: Binary branching
                    labels:
                      category: control
                      pattern: branching
                    schema_path: /api/v1/workflow-schemas/v2/control-nodes/condition.schema.json

  /api/v1/workflow-schemas/v2/discover:
    get:
      summary: Discover node types with label filtering
      description: |
        Discover available node types with optional label-based filtering.

        This endpoint enables visual workflow builders to:
        - List all available node types
        - Filter by category (executor, control, trigger)
        - Filter by custom labels (system, execution, pattern)
        - Build categorized node palettes

        **Label Filtering**:
        - Multiple filters use AND logic
        - Query param format: `labels[key]=value`
        - Example: `?labels[category]=executor&labels[system]=aap`

        **Common Use Cases**:
        - Executor palette: `?labels[category]=executor`
        - Control flow palette: `?labels[category]=control`
        - AAP nodes: `?labels[system]=aap`
        - Remote execution nodes: `?labels[execution]=remote`
        - Branching nodes: `?labels[pattern]=branching`
      operationId: discover_node_types
      tags:
        - Schema Discovery
      security: []
      parameters:
        - name: labels[category]
          in: query
          description: Filter by category (executor, control, trigger)
          schema:
            type: string
            enum: [executor, control, trigger]
          example: executor
        - name: labels[system]
          in: query
          description: Filter by system integration
          schema:
            type: string
          example: aap
        - name: labels[execution]
          in: query
          description: Filter by execution location
          schema:
            type: string
            enum: [local, remote]
        - name: labels[pattern]
          in: query
          description: Filter by control flow pattern
          schema:
            type: string
            enum: [branching, iteration, synchronization]
      responses:
        '200':
          description: Filtered node type list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeDiscovery'
              examples:
                all_types:
                  summary: All node types (no filter)
                  value:
                    node_types:
                      - type: aap_job_template
                        title: AAP Job Template
                        description: Launch AAP job templates
                        labels:
                          category: executor
                          system: aap
                          execution: remote
                        schema_path: /api/v1/workflow-schemas/v2/executors/aap_job_template.schema.json
                      - type: condition
                        title: Condition
                        description: Binary branching
                        labels:
                          category: control
                          pattern: branching
                        schema_path: /api/v1/workflow-schemas/v2/control-nodes/condition.schema.json
                executors_only:
                  summary: Filter by category=executor
                  value:
                    node_types:
                      - type: aap_job_template
                        title: AAP Job Template
                        description: Launch AAP job templates
                        labels:
                          category: executor
                          system: aap
                        schema_path: /api/v1/workflow-schemas/v2/executors/aap_job_template.schema.json
                      - type: http_request
                        title: HTTP Request
                        description: HTTP API calls
                        labels:
                          category: executor
                        schema_path: /api/v1/workflow-schemas/v2/executors/http_request.schema.json
                aap_nodes:
                  summary: Filter by system=aap
                  value:
                    node_types:
                      - type: aap_job_template
                        title: AAP Job Template
                        description: Launch AAP job templates
                        labels:
                          category: executor
                          system: aap
                          execution: remote
                        schema_path: /api/v1/workflow-schemas/v2/executors/aap_job_template.schema.json
                remote_executors:
                  summary: Filter by category=executor AND execution=remote
                  value:
                    node_types:
                      - type: aap_job_template
                        title: AAP Job Template
                        description: Launch AAP job templates
                        labels:
                          category: executor
                          system: aap
                          execution: remote
                        schema_path: /api/v1/workflow-schemas/v2/executors/aap_job_template.schema.json

components:
  schemas:
    NodeTypeInfo:
      type: object
      required:
        - type
        - title
        - description
        - labels
        - schema_path
      properties:
        type:
          type: string
          description: Node type identifier
          example: aap_job_template
        title:
          type: string
          description: Human-readable node type name
          example: AAP Job Template
        description:
          type: string
          description: Node type purpose and behavior
          example: Launch AAP job templates
        labels:
          type: object
          description: Categorization labels for filtering
          additionalProperties:
            type: string
          example:
            category: executor
            system: aap
            execution: remote
        schema_path:
          type: string
          format: uri
          description: Path to JSON Schema for this node type
          example: /api/v1/workflow-schemas/v2/executors/aap_job_template.schema.json

    NodeTypeCatalog:
      type: object
      required:
        - node_types
      properties:
        node_types:
          type: array
          description: Complete list of available node types
          items:
            $ref: '#/components/schemas/NodeTypeInfo'

    NodeTypeDiscovery:
      type: object
      required:
        - node_types
      properties:
        node_types:
          type: array
          description: Filtered list of node types matching label criteria
          items:
            $ref: '#/components/schemas/NodeTypeInfo'

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Error type URI (RFC 9457)
        title:
          type: string
          description: Short, human-readable summary
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          format: uri
          description: URI identifying the specific occurrence

tags:
  - name: Schema Discovery
    description: Dynamic schema and node type discovery for visual workflow builders
