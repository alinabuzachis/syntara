---
# Example 4: Looping Workflow
# Demonstrates: forEach loop, while loop, batch processing

schemaVersion: 1.0.0
version: 1

metadata:
  name: batch-user-notification
  description: Send notifications to multiple users with retry logic
  tags:
    - notifications
    - batch
    - looping
    - example
  owner: communications-team
  timeout: PT2H

triggers:
  - type: scheduled
    schedule:
      scheduleType: interval
      interval: PT1H # Every hour

inputs:
  campaignId:
    type: string
    description: Notification campaign identifier
    required: true
  batchSize:
    type: integer
    description: Number of users to process per batch
    default: 100
    minimum: 1
    maximum: 1000


workflow:
  activities:
    - id: fetch_pending_users
      name: Fetch Pending User List
      type: task
      task:
        executor: connector
        config:
          connectorId: postgres-db
          operation: query
          parameters:
            query: |
              SELECT user_id, email, preferences
              FROM notification_queue
              WHERE campaign_id = $1 AND status = 'pending'
              ORDER BY created_at ASC
              LIMIT $2
            params:
              - ${input.campaignId}
              - ${input.batchSize}
        outputs:
          users: $.rows
          count: $.row_count
      timeout: PT5M
      retryPolicy:
        maxAttempts: 3
        backoff: exponential
        initialInterval: PT2S

    - id: process_users
      name: Process Each User
      type: loop
      loop:
        type: forEach
        items: ${fetch_pending_users.output.users}
        itemVariable: user
        indexVariable: idx
        do:
          - id: check_user_preferences
            name: Check User Notification Preferences
            type: condition
            condition: ${user.preferences.notifications_enabled == true}
            then:
              - id: send_notification
                name: Send Notification to User
                type: task
                task:
                  executor: connector
                  config:
                    connectorId: email-service
                    operation: sendEmail
                    parameters:
                      to: ${user.email}
                      subject: Campaign Update
                      template: ${input.campaignId}
                      data:
                        userId: ${user.user_id}
                        preferences: ${user.preferences}
                  outputs:
                    messageId: $.message_id
                    status: $.status
                timeout: PT30S
                retryPolicy:
                  maxAttempts: 3
                  backoff: exponential
                  initialInterval: PT5S
                  retryableErrors:
                    - NETWORK_ERROR
                    - RATE_LIMIT
                    - TIMEOUT

              - id: update_status_success
                name: Mark as Sent
                type: task
                task:
                  executor: connector
                  config:
                    connectorId: postgres-db
                    operation: execute
                    parameters:
                      query: |
                        UPDATE notification_queue
                        SET status = 'sent', sent_at = NOW(), message_id = $1
                        WHERE user_id = $2 AND campaign_id = $3
                      params:
                        - ${send_notification.output.messageId}
                        - ${user.user_id}
                        - ${input.campaignId}
                timeout: PT10S

            else:
              - id: skip_user
                name: Skip User (Preferences Disabled)
                type: task
                task:
                  executor: connector
                  config:
                    connectorId: postgres-db
                    operation: execute
                    parameters:
                      query: |
                        UPDATE notification_queue
                        SET status = 'skipped', reason = 'preferences_disabled'
                        WHERE user_id = $1 AND campaign_id = $2
                      params:
                        - ${user.user_id}
                        - ${input.campaignId}
                timeout: PT10S

    - id: retry_failures
      name: Retry Failed Notifications
      type: loop
      loop:
        type: while
        condition: ${failed_count > 0 && retry_attempts < 3}
        maxIterations: 3
        do:
          - id: fetch_failed_notifications
            name: Fetch Failed Notifications
            type: task
            task:
              executor: connector
              config:
                connectorId: postgres-db
                operation: query
                parameters:
                  query: |
                    SELECT user_id, email, retry_count
                    FROM notification_queue
                    WHERE campaign_id = $1 AND status = 'failed'
                    AND retry_count < 3
                  params:
                    - ${input.campaignId}
              outputs:
                failedUsers: $.rows
                failedCount: $.row_count
            timeout: PT5M

          - id: retry_send
            name: Retry Sending to Failed Users
            type: loop
            loop:
              type: forEach
              items: ${fetch_failed_notifications.output.failedUsers}
              itemVariable: failedUser
              do:
                - id: resend_notification
                  name: Resend Notification
                  type: task
                  task:
                    executor: connector
                    config:
                      connectorId: email-service
                      operation: sendEmail
                      parameters:
                        to: ${failedUser.email}
                        subject: Campaign Update (Retry)
                        template: ${input.campaignId}
                        data:
                          userId: ${failedUser.user_id}
                    outputs:
                      messageId: $.message_id
                      status: $.status
                  timeout: PT30S
                  retryPolicy:
                    maxAttempts: 2
                    backoff: exponential
                    initialInterval: PT10S

                - id: update_retry_status
                  name: Update Retry Status
                  type: task
                  task:
                    executor: connector
                    config:
                      connectorId: postgres-db
                      operation: execute
                      parameters:
                        query: |
                          UPDATE notification_queue
                          SET status = CASE
                            WHEN $1 = 'success' THEN 'sent'
                            ELSE 'failed'
                          END,
                          retry_count = retry_count + 1,
                          last_attempt_at = NOW()
                          WHERE user_id = $2 AND campaign_id = $3
                        params:
                          - ${resend_notification.output.status}
                          - ${failedUser.user_id}
                          - ${input.campaignId}
                  timeout: PT10S

    - id: generate_summary
      name: Generate Campaign Summary
      type: task
      task:
        executor: connector
        config:
          connectorId: postgres-db
          operation: query
          parameters:
            query: |
              SELECT
                COUNT(*) FILTER (WHERE status = 'sent') as sent_count,
                COUNT(*) FILTER (WHERE status = 'failed') as failed_count,
                COUNT(*) FILTER (WHERE status = 'skipped') as skipped_count
              FROM notification_queue
              WHERE campaign_id = $1
            params:
              - ${input.campaignId}
        outputs:
          sentCount: $.rows[0].sent_count
          failedCount: $.rows[0].failed_count
          skippedCount: $.rows[0].skipped_count
      timeout: PT2M
